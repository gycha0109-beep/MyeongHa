<!doctype html><html lang="ko" data-theme="night"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>태어난 순간의 기록 · 명하</title><link rel="stylesheet" href="styles.css" /></head>
<body data-page="birth"><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><span class="brand-seal">命河</span><span>명하</span></a><nav class="topnav"><a href="records.html">기록</a><a class="desktop-only" href="#">알림</a><a class="desktop-only" href="#">계정</a><button class="theme-toggle" data-theme-toggle type="button">☼</button></nav></div></header>
<main class="world-frame"><section class="page"><div class="shell birth-wrap"><a class="backlink" href="chat.html">← 대화로 돌아가기</a><div class="birth-intro"><div class="eyebrow">John Doe 03이 기록을 안내합니다 · UI DEMO</div><h1 class="display display-lg">태어난 순간의 기록을 엽니다.</h1><p class="lead">정확한 계산을 위해 태어난 정보를 알려주세요. 실제 서비스에서는 이전 기록을 덮어쓰지 않고 새 revision으로 남습니다.</p></div>
<form class="panel birth-panel" data-birth-form>
  <div class="form-row"><label class="form-label" for="birth-date">생년월일</label><div><input class="input" id="birth-date" type="date" required /><div class="fine">양력/음력 선택에 따라 해석 기준이 달라집니다.</div></div></div>
  <div class="form-row"><span class="form-label">태어난 시각</span><div class="field-grid"><select class="select" aria-label="시"><option>09 시</option><option>10 시</option><option>11 시</option></select><select class="select" aria-label="분"><option>00 분</option><option>30 분</option></select><label style="display:flex;align-items:center;gap:8px;color:var(--text-soft)"><input type="checkbox" /> 시각 모름</label></div></div>
  <div class="form-row"><span class="form-label">달력 기준</span><div class="choice-line"><label><input type="radio" name="calendar" checked /> 양력 (Gregorian)</label><label><input type="radio" name="calendar" /> 음력 (Lunar)</label></div></div>
  <div class="form-row"><span class="form-label">출생지</span><div class="field-grid two"><select class="select"><option>대한민국</option><option>국가 선택</option></select><select class="select"><option>서울특별시</option><option>도시 선택</option></select></div></div>
  <div class="birth-submit"><button class="button button-primary" type="submit">기록 열기 →</button></div><p class="fine" style="text-align:center">이 프로토타입은 입력값을 서버로 전송하거나 저장하지 않습니다.</p>
</form></div></section></main><script src="app.js" defer></script></body></html>
