<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>기록 · 명하</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="records">
  <header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><span class="brand-seal">命河</span><span>명하</span></a><nav class="topnav"><a href="records.html" aria-current="page">기록</a><button class="theme-toggle" data-theme-toggle type="button">☼</button></nav></div></header>
  <main class="world-frame"><section class="page"><div class="shell records-layout">
    <aside class="records-side"><div class="avatar avatar-lg" aria-hidden="true">命</div><div id="records-display-name" class="display display-md">기록 불러오는 중</div><p id="records-subject-kind" class="muted">현재 기록</p><nav aria-label="기록 메뉴"><a href="hall.html">개요</a><a href="records.html" aria-current="page">기록</a><a href="chat-hub.html">대화</a></nav></aside>
    <section class="records-main">
      <div class="eyebrow">MY RECORDS</div><h1 class="display display-lg" style="margin:6px 0 8px">기록</h1>
      <p class="lead" style="margin-top:0">태어난 순간의 기록, 사용자가 확인한 현재 삶의 사실, 대리자에게 허용한 기억을 서로 다른 authority로 조회합니다.</p>
      <p class="fine">이 화면은 현재 read-only입니다. 삭제·철회·수정 정책을 화면에서 임의로 확정하지 않습니다.</p>
      <div id="records-status" class="panel" style="padding:22px;margin-top:22px" role="status">기록을 불러오는 중입니다…</div>
      <div id="records-content" hidden>
        <div class="tabs" role="tablist" aria-label="기록 종류"><button class="tab" role="tab" aria-selected="true" aria-controls="life-records">현세록</button><button class="tab" role="tab" aria-selected="false" aria-controls="birth-records">명식록</button><button class="tab" role="tab" aria-selected="false" aria-controls="memory-records">대리자 기억</button></div>
        <section id="life-records" class="tab-panel"><div class="panel ledger" style="margin-top:20px"><div class="ledger-row ledger-head"><div>확인일</div><div>저장된 사실</div><div>상태</div></div><div id="life-records-list"></div></div></section>
        <section id="birth-records" class="tab-panel" hidden><div id="birth-records-list" class="records-grid" style="margin-top:20px"></div></section>
        <section id="memory-records" class="tab-panel" hidden><div class="panel side-card" style="margin-top:20px"><div class="eyebrow">현재 기억</div><div id="memory-records-list" class="timeline"></div><p class="fine">캐릭터별 공개 grant는 별도 authority이며 이 첫 read-only slice에서는 집계해 추측하지 않습니다.</p></div></section>
      </div>
    </section>
  </div></section></main>
  <script src="app.js" defer></script><script type="module" src="records-page.js"></script>
</body>
</html>
