<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="명하 대화 — 각 인물의 공간에서 이전 이야기와 기억을 이어갑니다." />
  <title>대화 · 명하</title>
  <link rel="stylesheet" href="product.css" />
  <link rel="stylesheet" href="chat-room.css" />
  <link rel="stylesheet" href="chat-runtime.css" />
  <link rel="stylesheet" href="conversation-v2.css" />
</head>
<body class="product-page character-room character-room-v2" data-page="chat" data-character="baekheon">
  <header class="product-header conversation-room-product-header">
    <div class="product-shell product-header-inner">
      <a class="product-brand" href="hall.html" aria-label="명하 홈">
        <span class="product-brand-name">명하</span>
        <span class="product-brand-seal" aria-hidden="true">明河</span>
        <span class="product-brand-sub">MyeongHa</span>
      </a>

      <nav class="product-nav" aria-label="주요 메뉴">
        <a class="product-nav-link" href="hall.html">홈</a>
        <a class="product-nav-link" href="reading.html">사주</a>
        <a class="product-nav-link" href="chat-hub.html" aria-current="page">대화</a>
        <a class="product-nav-link" href="records.html">기록</a>
        <a class="product-nav-link" href="my.html">마이</a>
      </nav>

      <div class="product-utilities">
        <button class="product-icon-button" type="button" aria-label="알림"></button>
        <a class="product-profile" href="my.html" aria-label="내 프로필">
          <span class="product-profile-mark" aria-hidden="true">之</span>
          <span>마이</span>
          <span aria-hidden="true">⌄</span>
        </a>
      </div>
    </div>
  </header>

  <header class="character-room-header conversation-room-header">
    <a class="character-room-back" href="chat-hub.html" aria-label="대화 허브로 돌아가기">
      <span aria-hidden="true">‹</span>
      <span>대화로 돌아가기</span>
    </a>

    <div class="character-room-identity" aria-live="polite">
      <strong data-character-name>백헌</strong>
      <span class="character-room-dot" aria-hidden="true">·</span>
      <span data-character-title>충추원의 장</span>
      <span class="character-room-seal" aria-hidden="true">明河</span>
    </div>

    <div class="character-room-actions">
      <button class="character-room-history-button" type="button" data-history-open>
        <span class="character-room-clock" aria-hidden="true"></span>
        <span>지난 대화</span>
      </button>
      <a class="conversation-record-link" href="records.html">기록 보기</a>
      <button class="character-room-menu-button" type="button" aria-label="대화 메뉴" data-menu-toggle>•••</button>
    </div>
  </header>

  <main class="character-room-stage conversation-room-stage" aria-label="캐릭터 대화 공간">
    <section class="conversation-scene-column" aria-label="캐릭터 공간">
      <div class="character-room-scene conversation-room-scene" data-character-scene role="img" aria-label="백헌의 대화 공간">
        <div class="character-room-scene-decoration" aria-hidden="true">
          <span class="scene-window"></span>
          <span class="scene-lamp"></span>
          <span class="scene-branch"></span>
          <span class="scene-character-placeholder"></span>
        </div>
      </div>

      <div class="character-room-context conversation-context" data-context-pill hidden>
        <span class="character-room-context-mark" aria-hidden="true">◇</span>
        <span>이어진 이야기 · </span>
        <strong data-context-title></strong>
      </div>

      <div class="conversation-character-card">
        <div>
          <strong data-character-name>백헌</strong>
          <span data-character-title>충추원의 장</span>
        </div>
        <p>이 사람과 나눈 말과 흐름은 다음 대화에서도 이어집니다.</p>
      </div>
    </section>

    <section class="character-dialogue-panel conversation-chat-panel" aria-label="현재 대화">
      <header class="conversation-chat-head">
        <div>
          <span class="conversation-chat-kicker">CONVERSATION</span>
          <div class="character-dialogue-name-row">
            <h1 data-dialogue-name>백헌</h1>
            <span data-character-title>충추원의 장</span>
          </div>
        </div>
        <div class="conversation-chat-head-actions">
          <button type="button" data-history-open>지난 대화</button>
          <a href="records.html">기록 보기</a>
        </div>
      </header>

      <div class="conversation-thread-bar" data-thread-bar hidden>
        <span aria-hidden="true">◇</span>
        <span>이어진 이야기</span>
        <strong data-thread-bar-title></strong>
      </div>

      <div class="conversation-message-stream" data-chat-stream aria-live="polite">
        <article class="conversation-message" data-sender="character" data-chat-intro>
          <span class="conversation-message-avatar" data-character-avatar aria-hidden="true">明</span>
          <div class="conversation-message-body">
            <strong data-character-name>백헌</strong>
            <p class="character-dialogue-line" data-dialogue-line>이야기를 시작하죠.<br />지금 가장 먼저 꺼내고 싶은 것은 무엇입니까?</p>
          </div>
        </article>
      </div>

      <form class="character-composer conversation-composer" data-composer data-runtime-busy="false">
        <label class="sr-only" for="character-message">메시지</label>
        <textarea id="character-message" rows="1" placeholder="메시지를 입력하세요…" data-message-input></textarea>
        <button class="character-send-button" type="submit" aria-label="메시지 보내기">
          <span aria-hidden="true">➤</span>
        </button>
      </form>

      <p class="character-compose-status" data-compose-status aria-live="polite"></p>
    </section>
  </main>

  <aside class="character-history-drawer" data-history-drawer aria-hidden="true" aria-label="지난 대화">
    <div class="character-history-head">
      <div>
        <span class="character-history-kicker">지난 대화</span>
        <h2 data-history-character-name>백헌과 나눈 이야기</h2>
      </div>
      <button type="button" data-history-close aria-label="지난 대화 닫기">×</button>
    </div>

    <div class="character-history-list" data-history-list></div>
    <p class="history-runtime-empty" data-history-empty>이어갈 대화를 선택하면 지난 대화가 여기에 표시됩니다.</p>
  </aside>

  <div class="character-room-scrim" data-room-scrim hidden></div>

  <div class="character-room-menu" data-room-menu hidden>
    <a href="#" aria-disabled="true">캐릭터 정보</a>
    <a href="records.html">이어진 기록 보기</a>
    <a href="#" aria-disabled="true">기억 관리</a>
    <a href="#" aria-disabled="true">대화에서 찾기</a>
  </div>

  <script src="chat-character.js" defer></script>
  <script src="chat-runtime-client.js" defer></script>
</body>
</html>
