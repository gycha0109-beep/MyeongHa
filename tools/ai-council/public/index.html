<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyeongHa AI Council</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, system-ui, sans-serif; background: #101116; color: #f1f3f5; }
    body { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #aeb4c0; }
    form { display: grid; gap: 14px; background: #191c24; border: 1px solid #2d3340; border-radius: 14px; padding: 18px; }
    textarea { min-height: 120px; resize: vertical; background: #101116; color: #f1f3f5; border: 1px solid #3a4252; border-radius: 10px; padding: 12px; font: inherit; }
    .agents { display: flex; flex-wrap: wrap; gap: 10px; }
    label { color: #d8dce5; }
    button { width: fit-content; border: 0; border-radius: 9px; padding: 10px 16px; background: #6d7cff; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 24px; color: #aeb4c0; }
    #messages { display: grid; gap: 12px; margin-top: 22px; }
    .message { background: #191c24; border: 1px solid #2d3340; border-radius: 12px; padding: 14px; white-space: pre-wrap; line-height: 1.55; }
    .message.user { border-color: #4b5568; }
    .speaker { color: #9eabff; font-weight: 800; margin-bottom: 8px; }
    .meta { margin-top: 10px; color: #7f8795; font-size: 12px; }
  </style>
</head>
<body>
  <h1>MyeongHa AI Council</h1>
  <p>공용 회의실 MVP · 선택한 Agent가 순서대로 발언하고 Integration이 마지막에 정리합니다.</p>
  <form id="meeting-form">
    <textarea id="topic" placeholder="예: Life Thread를 bounded decision episode로 설계하는 것이 타당한가?" required></textarea>
    <div class="agents">
      <label><input type="checkbox" name="agent" value="world" checked> World</label>
      <label><input type="checkbox" name="agent" value="revenue" checked> Revenue</label>
      <label><input type="checkbox" name="agent" value="engineering" checked> Engineering</label>
      <label><input type="checkbox" name="agent" value="integration" checked> Integration</label>
    </div>
    <label><input id="web-search" type="checkbox" checked> 웹 검색 허용</label>
    <label>토론 라운드
      <select id="rounds">
        <option value="1">1회 분석 + 정리</option>
        <option value="2" selected>2회 상호 검토 + 정리</option>
        <option value="3">3회 상호 검토 + 정리</option>
      </select>
    </label>
    <button id="start" type="submit">회의 시작</button>
    <div id="status"></div>
  </form>
  <section id="messages"></section>
  <script>
    const form = document.querySelector('#meeting-form');
    const topic = document.querySelector('#topic');
    const start = document.querySelector('#start');
    const status = document.querySelector('#status');
    const messages = document.querySelector('#messages');
    const webSearch = document.querySelector('#web-search');
    const rounds = document.querySelector('#rounds');

    function addMessage(message) {
      const card = document.createElement('article');
      card.className = `message ${message.agent}`;
      const speaker = document.createElement('div');
      speaker.className = 'speaker';
      speaker.textContent = message.label;
      const content = document.createElement('div');
      content.textContent = message.content;
      card.append(speaker, content);
      if (message.model) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${message.model} · ${message.latency_ms}ms`;
        card.append(meta);
      }
      messages.append(card);
      card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      messages.replaceChildren();
      status.textContent = '회의를 시작하는 중입니다.';
      start.disabled = true;
      const selected = [...document.querySelectorAll('input[name="agent"]:checked')].map((input) => input.value);
      try {
        const maxRounds = Number(rounds.value);
        const maxAgentCalls = selected.filter((agent) => agent !== 'integration').length * maxRounds + (selected.includes('integration') ? 1 : 0);
        const created = await fetch('/api/meetings', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ topic: topic.value, agents: selected, maxRounds, maxAgentCalls, webSearch: webSearch.checked }),
        });
        const meeting = await created.json();
        if (!created.ok) throw new Error(meeting.error || '회의 생성 실패');
        const stream = new EventSource(`/api/meetings/${meeting.meeting_id}/events`);
        stream.addEventListener('message', (event) => addMessage(JSON.parse(event.data)));
        stream.addEventListener('status', (event) => {
          const value = JSON.parse(event.data);
          status.textContent = `${value.agent} Agent ${value.status === 'thinking' ? '분석 중' : '발언 완료'} · 라운드 ${value.round}`;
        });
        stream.addEventListener('done', (event) => {
          const value = JSON.parse(event.data);
          status.textContent = `회의 완료 · Agent 호출 ${value.calls}회`;
          start.disabled = false;
          stream.close();
        });
        stream.addEventListener('error', (event) => {
          if (event.data) status.textContent = JSON.parse(event.data).message;
          start.disabled = false;
          stream.close();
        });
      } catch (error) {
        status.textContent = error.message;
        start.disabled = false;
      }
    });
  </script>
</body>
</html>
