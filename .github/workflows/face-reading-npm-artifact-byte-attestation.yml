name: Face Reading NPM Artifact Byte Attestation

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'scripts/face-reading-fr30-npm-artifact-byte-attestation.mjs'
      - '.github/workflows/face-reading-npm-artifact-byte-attestation.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'scripts/face-reading-fr30-npm-artifact-byte-attestation.mjs'
      - '.github/workflows/face-reading-npm-artifact-byte-attestation.yml'

permissions:
  contents: read

jobs:
  fr30-npm-artifact-byte-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime and validate FR-30 contract
        run: npm run build
      - name: Independently fetch and attest published npm artifact bytes
        run: node scripts/face-reading-fr30-npm-artifact-byte-attestation.mjs
      - name: Upload FR-30 byte attestation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr30-npm-artifact-byte-attestation
          path: artifacts/face-reading/fr30-npm-artifact-byte-attestation.json
          if-no-files-found: error
          retention-days: 14
