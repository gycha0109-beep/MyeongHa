name: Production Member Auth Rate Limit Secret Provision
run-name: "[WT:ops] Production Member Auth Rate Limit Secret — one-shot"

on:
  push:
    branches:
      - main
    paths:
      - '.github/ops/sec-02-c2a-rate-limit-secret.once'

permissions:
  contents: read

concurrency:
  group: production-member-auth-rate-limit-secret
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha

jobs:
  provision:
    name: provision-production-member-auth-rate-limit-secret
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      MYEONGHA_WATCHTOWER_TRACK: ops
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Gate exact one-shot marker
        shell: bash
        run: |
          set -euo pipefail
          marker='.github/ops/sec-02-c2a-rate-limit-secret.once'
          [[ -f "$marker" ]]
          [[ "$(tr -d '\r\n' < "$marker")" == 'SEC-02-C2A-PROVISION-AUTH-RATE-LIMIT-SECRET-V1' ]]
          [[ "$MYEONGHA_WATCHTOWER_TRACK" == 'ops' ]]
          test -n "$VERCEL_TOKEN"

      - name: Provision sensitive Production environment variable
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/vercel-env-create-response.json"
          list_file="$RUNNER_TEMP/vercel-env-list-response.json"
          payload_file="$RUNNER_TEMP/vercel-env-create-payload.json"

          secret="$(openssl rand -base64 48 | tr -d '\r\n' | tr '+/' '-_' | tr -d '=')"
          [[ "${#secret}" -ge 43 ]]
          echo "::add-mask::$secret"

          jq -n \
            --arg value "$secret" \
            '{
              key: "MYEONGHA_AUTH_RATE_LIMIT_SECRET",
              value: $value,
              type: "sensitive",
              target: ["production"],
              comment: "SEC-02 Member Auth application admission HMAC secret"
            }' > "$payload_file"

          http_code="$(curl -sS \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload_file" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID")"

          unset secret
          rm -f "$payload_file"

          if [[ "$http_code" != '200' && "$http_code" != '201' ]]; then
            error_code="$(jq -r '.error.code // .code // "unknown"' "$response_file" 2>/dev/null || printf 'unknown')"
            echo "::error title=Vercel environment variable provisioning failed::HTTP $http_code code=$error_code"
            rm -f "$response_file"
            exit 1
          fi

          jq -e '
            (
              (.created | type) == "object"
              and .created.key == "MYEONGHA_AUTH_RATE_LIMIT_SECRET"
            )
            or
            (
              (.created | type) == "array"
              and any(.created[]; .key == "MYEONGHA_AUTH_RATE_LIMIT_SECRET")
            )
          ' "$response_file" >/dev/null

          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID" \
            -o "$list_file"

          jq -e '
            [
              .envs[]?
              | select(
                  .key == "MYEONGHA_AUTH_RATE_LIMIT_SECRET"
                  and .type == "sensitive"
                  and (.target | index("production")) != null
                )
            ]
            | length == 1
          ' "$list_file" >/dev/null

          rm -f "$response_file" "$list_file"
          echo "member_auth_rate_limit_secret_provisioned=true"
          echo "member_auth_rate_limit_secret_type=sensitive"
          echo "member_auth_rate_limit_secret_target=production"
          echo "secret_value_emitted=false"
