name: DB Commerce Entitlement Projection Recompute

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  entitlement-projection-recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_commerce_projection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_commerce_projection_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_commerce_projection_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}" >/dev/null
          done
      - name: Verify entitlement projection recompute semantics
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/entitlement_projection_recompute.sql
      - name: Verify entitlement mutation surface remains internal
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/commerce_entitlement_mutation_surface.sql
      - name: Verify commerce payment source authority hardening
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/commerce_payment_source_authority.sql
      - name: Verify entitlement projection recompute concurrency
        run: bash test/db/entitlement_projection_recompute_concurrency.sh
