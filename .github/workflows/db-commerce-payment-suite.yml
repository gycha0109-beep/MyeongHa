name: DB Commerce Payment Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'scripts/ci/db-suites.json'
      - 'scripts/ci/db-pr-router.mjs'
      - 'scripts/ci/run-db-track.mjs'
      - '.github/workflows/ci-db-track.yml'
      - 'test/db/commerce_payment_attempt_authority.sh'
      - 'test/db/commerce_payment_attempt_handoff_context.sh'
      - 'test/db/commerce_payment_verification_context.sh'
      - 'test/db/commerce_provider_payment_verification_context.sh'
      - 'test/db/commerce_verified_payment_evidence_persistence.sh'
      - 'test/db/commerce_verified_payment_replay_timestamp.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - 'apps/api/src/postgres-commerce-internal-execution.ts'
      - 'apps/api/src/commerce-provider-payment-verification-context-read.ts'
      - 'apps/api/src/commerce-verified-payment-evidence-persistence.ts'
      - 'apps/api/src/verified-commerce-evidence.ts'
      - 'tests/postgres-commerce-internal-execution.test.ts'
      - 'tests/commerce-provider-payment-verification-context-read.test.ts'
      - 'tests/commerce-provider-payment-verification-context-authority.test.ts'
      - 'tests/commerce-verified-payment-evidence-persistence.test.ts'
      - 'tests/commerce-verified-payment-evidence-persistence-authority.test.ts'
      - '.github/workflows/db-commerce-payment-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-suite:
    name: DB suite · commerce-payment
    uses: ./.github/workflows/ci-db-track.yml
    with:
      suite: commerce-payment
      postgres: "15"
