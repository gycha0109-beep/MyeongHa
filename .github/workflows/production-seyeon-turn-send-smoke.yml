name: "[WT:character-memory] 세연 Production Member 실대화 1턴 검증"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_SEYEON_PRODUCTION_TURN to run the mutating Production Seyeon one-turn smoke.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/production-seyeon-turn-send-smoke.trigger'

permissions:
  contents: read

concurrency:
  group: production-seyeon-turn-send-smoke
  cancel-in-progress: false

jobs:
  verify:
    # Paid live-model hold: re-enable only after explicit approval and review.
    if: ${{ false }}
    name: verify-production-seyeon-member-turn
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      MYEONGHA_PRODUCTION_MEMBER_EMAIL: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EMAIL }}
      MYEONGHA_PRODUCTION_MEMBER_PASSWORD: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_PASSWORD }}
      MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}

    steps:
      - name: Check out exact smoke verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify governed invocation and Production Member credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            [[ "$DISPATCH_CONFIRM" == 'VERIFY_SEYEON_PRODUCTION_TURN' ]]
          else
            [[ "${{ github.ref }}" == 'refs/heads/main' ]]
            trigger_value="$(tr -d '\r\n' < .github/production-seyeon-turn-send-smoke.trigger)"
            [[ "$trigger_value" == 'fire-2026-10-07-v1' ]]
          fi
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EMAIL:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_PASSWORD:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID:-}"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Execute Production Seyeon one-turn smoke
        run: node scripts/verify-production-seyeon-turn-send.mjs
