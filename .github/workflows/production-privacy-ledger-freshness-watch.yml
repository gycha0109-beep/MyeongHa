name: Production Privacy Recovery Ledger Freshness Watch
run-name: "[WT:ops] Privacy Recovery Ledger Freshness Watch"

on:
  workflow_dispatch:
  schedule:
    # Separate from the :47 hourly snapshot; advisory provider cadence, not CDC or RPO.
    - cron: '23 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: production-privacy-ledger-freshness-watch
  cancel-in-progress: false

jobs:
  metadata-freshness:
    name: Privacy recovery ledger freshness
    if: ${{ github.repository == 'gycha0109-beep/MyeongHa' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Inspect most recent completed encrypted privacy snapshot metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/check-privacy-ledger-completion-freshness.mjs
