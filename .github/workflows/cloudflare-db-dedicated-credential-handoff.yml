name: "Cloudflare dedicated DB login encrypted handoff"
run-name: "[WT:ops] Cloudflare dedicated DB credential handoff"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Exact authorized one-time rotation confirmation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-dedicated-db-login-encrypted-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'ROTATE_MYEONGHA_CF_DB_LOGIN_20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      CONFIRM: ${{ inputs.confirm }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}
      HANDOFF_OUTPUT: /tmp/myeongha-cf-db-password-encrypted.bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Validate isolated login and rotate it with RSA-OAEP encrypted handoff
        run: node scripts/operations/rotate-cloudflare-db-login-handoff.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-db-encrypted-handoff-${{ github.run_id }}
          path: /tmp/myeongha-cf-db-password-encrypted.bin
          retention-days: 1
          if-no-files-found: error
