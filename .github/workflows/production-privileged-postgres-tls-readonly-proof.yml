name: Production Privileged PostgreSQL TLS Read-Only Proof
run-name: "[WT:security] Production Privileged PostgreSQL TLS Read-Only Proof"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VERIFY_PRIVILEGED_POSTGRES_TLS_READONLY_D1
        required: true
        type: string
      watchtower_track:
        description: Watchtower Track Key for Production security attribution
        required: true
        default: security
        type: string

permissions:
  contents: read

concurrency:
  group: production-privileged-postgres-tls-readonly-proof
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  proof:
    name: verify-production-privileged-postgres-tls-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      MYEONGHA_WATCHTOWER_TRACK: ${{ inputs.watchtower_track }}
      MYEONGHA_PRIVILEGED_POSTGRES_TLS_READONLY_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use governed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Validate exact dispatch authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$MYEONGHA_WATCHTOWER_TRACK" == 'security' ]]
          [[ "$MYEONGHA_PRIVILEGED_POSTGRES_TLS_READONLY_CONFIRM" == 'VERIFY_PRIVILEGED_POSTGRES_TLS_READONLY_D1' ]]

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run privileged PostgreSQL strict TLS read-only proof
        shell: bash
        run: bash scripts/operations/run-production-privileged-postgres-tls-readonly-proof.sh
