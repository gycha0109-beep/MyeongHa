name: FE028 Face Preview Web Assets

on:
  pull_request:
    paths:
      - 'package.json'
      - 'apps/web/vite.config.ts'
      - 'scripts/stage-face-preview-runtime-assets-fe027.mjs'
      - 'scripts/verify-face-preview-web-build-fe028.mjs'
      - 'docs/face-engine/fe028-face-preview-web-assets.md'
      - '.github/workflows/fe028-face-preview-web-assets.yml'

permissions:
  contents: read

jobs:
  verify-fe028-web-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      MYEONGHA_WEB_OUTPUT_DIR: ${{ runner.temp }}/fe028-web-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build web with verified Face Preview assets
        run: npm run build:web
      - name: Verify FE028 web output
        run: node scripts/verify-face-preview-web-build-fe028.mjs
