name: Diagnose Character Unlock

on:
  push:
    branches:
      - feat/guest-purchase-intent-v2-main
    paths:
      - .github/workflows/diagnose-character-unlock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap schema
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Capture Character Unlock diagnostic
        shell: bash
        run: |
          set +e
          bash test/db/character_unlocks_current_query.sh > /tmp/character-unlock.log 2>&1
          rc=$?
          set -e
          {
            echo "exit_code=$rc"
            echo "--- tail ---"
            tail -80 /tmp/character-unlock.log
          } > .github/character-unlock-diagnostic.txt
          cat .github/character-unlock-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/character-unlock-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): capture character unlock diagnostic"
          git push origin HEAD:feat/guest-purchase-intent-v2-main
