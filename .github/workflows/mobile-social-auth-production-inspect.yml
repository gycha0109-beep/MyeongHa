name: Mobile Social Auth Production Read-Only Inspection

run-name: "[WT:applizing] Social Auth Production Read-Only Inspection"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/mobile-social-auth-production-inspect.trigger'

permissions:
  contents: read

concurrency:
  group: mobile-social-auth-production-inspect
  cancel-in-progress: false

jobs:
  inspect:
    name: inspect-social-auth-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
      VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
      VERCEL_MOBILE_PUSH_ACTIVATION_TOKEN: ${{ secrets.VERCEL_MOBILE_PUSH_ACTIVATION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify main and explicit read-only request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push" -o "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$(tr -d '\r\n' < .github/mobile-social-auth-production-inspect.trigger)" = "INSPECT_SOCIAL_AUTH_PRODUCTION_READ_ONLY_V1"
          fi
          test -n "${VERCEL_MOBILE_PUSH_ACTIVATION_TOKEN:-}"

      - name: Inspect only approved flag and provider-support key states
        shell: bash
        run: node scripts/operations/inspect-vercel-social-auth-production.mjs
