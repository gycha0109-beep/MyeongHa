name: "[WT:character-runtime-lab] Yeoul four-model 288-call comparison"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-runtime-lab-yeoul-four-model-v1
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout main experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build approved character authoring
        run: npm run build
      - name: Run four-model 288-call experiment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YEOUL_EVAL_OUTPUT: ${{ runner.temp }}/yeoul-four-model-288-v1/report.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          node scripts/run-yeoul-four-model-288-v1.mjs
      - name: Preserve all 288 actual model responses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-four-model-288-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yeoul-four-model-288-v1/report.json
          if-no-files-found: warn
          retention-days: 30
