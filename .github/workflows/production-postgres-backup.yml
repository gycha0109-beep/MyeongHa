name: Production PostgreSQL Logical Backup
run-name: "[WT:ops] Production PostgreSQL Logical Backup"

on:
  push:
    branches:
      - main
    paths:
      - '.github/ops/postgres-backup-migration-20261029012948-20261029.once'
  workflow_dispatch:
  schedule:
    # 03:17 KST. The non-round minute reduces fleet-wide scheduler contention.
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: production-postgres-backup
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc
  SUPABASE_CLI_VERSION: '2.117.0'
  SUPABASE_POSTGRES_IMAGE: 'supabase/postgres:17.6.1.167'
  BACKUP_RETENTION_DAYS: '30'

jobs:
  backup:
    name: encrypted-logical-backup
    if: "${{ github.event_name != 'push' || startsWith(github.event.head_commit.message, 'ops(dr): one-shot backup migration 20261029012948') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}
      MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Gate one-shot deployed migration 20261029012948 backup marker
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          subject="$(git show -s --format=%s HEAD)"
          [[ "$subject" =~ ^ops\(dr\):\ one-shot\ backup\ migration\ 20261029012948(\ \(\#[0-9]+\))?$ ]]
          [[ "$(cat .github/ops/postgres-backup-migration-20261029012948-20261029.once)" == 'POSTGRES-BACKUP-MIGRATION-20261029012948-20261029-V1' ]]
          point="$(date -u -d '2026-10-29T02:50:00Z' +%s)"
          now="$(date -u +%s)"
          (( now >= point && now - point <= 86400 ))
          echo 'SCOPED_READ_ONLY_PRODUCTION_BACKUP: exact deployed migration 20261029012948; encrypted artifact only; no schema modifications'

      - name: Fail closed unless recovery credentials are provisioned
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || missing+=(SUPABASE_DB_PASSWORD)
          [[ -n "${MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE:-}" ]] || missing+=(MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE)

          [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" ]] || missing+=(SUPABASE_PRODUCTION_SESSION_POOLER_HOST)
          [[ -n "${SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM:-}" ]] || missing+=(SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM)
          if [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" && ! "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]; then
            echo '::error title=Production backup pooler host invalid::SUPABASE_PRODUCTION_SESSION_POOLER_HOST must be a bare *.pooler.supabase.com hostname.'
            exit 1
          fi

          if (( ${#missing[@]} > 0 )); then
            for secret_name in "${missing[@]}"; do
              echo "::error title=Production backup credential missing::Missing Actions secret: $secret_name"
              printf -- '- missing Actions secret: `%s`\n' "$secret_name" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi

          if [ "${#MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE}" -lt 32 ]; then
            echo '::error title=Production backup encryption secret invalid::MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE must be at least 32 characters.'
            echo '- invalid Actions secret length: `MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE` must be at least 32 characters' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE"

      - name: Verify Docker, PostgreSQL client, and pinned backup image
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker pull "$SUPABASE_POSTGRES_IMAGE" >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Bind governed production Session Pooler endpoint
        id: database
        shell: bash
        run: |
          set -euo pipefail
          admin_pool_user="postgres.$SUPABASE_PROJECT_ID"
          pool_host="$SUPABASE_PRODUCTION_SESSION_POOLER_HOST"
          pool_port='5432'
          pool_db='postgres'

          [[ "$admin_pool_user" == "postgres.$SUPABASE_PROJECT_ID" ]]
          [[ "$pool_host" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]
          [[ "$pool_port" == '5432' ]]
          [[ "$pool_db" == 'postgres' ]]

          echo "admin_pool_user=$admin_pool_user" >> "$GITHUB_OUTPUT"
          echo "pool_host=$pool_host" >> "$GITHUB_OUTPUT"
          echo "pool_port=$pool_port" >> "$GITHUB_OUTPUT"
          echo "pool_db=$pool_db" >> "$GITHUB_OUTPUT"

      - name: Export Supabase-compatible logical backup
        id: dump
        shell: bash
        env:
          ADMIN_POOL_USER: ${{ steps.database.outputs.admin_pool_user }}
          POOL_HOST: ${{ steps.database.outputs.pool_host }}
          POOL_PORT: ${{ steps.database.outputs.pool_port }}
          POOL_DB: ${{ steps.database.outputs.pool_db }}
        run: bash scripts/operations/export-production-postgres-backup.sh
      - name: Guard one-shot backup actual deployed migration frontier
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          OBSERVED_MIGRATION_FRONTIER: ${{ steps.dump.outputs.migration_frontier }}
        run: |
          set -euo pipefail
          [[ "$OBSERVED_MIGRATION_FRONTIER" == '20261029012948' ]]
          echo 'PASS_ONE_SHOT_POST_MIGRATION_BACKUP: live captured frontier is the exact reviewed remote version'

      - name: Upload encrypted off-provider backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.dump.outputs.artifact_name }}
          path: |
            ${{ steps.dump.outputs.archive }}
            ${{ steps.dump.outputs.checksum }}
            ${{ steps.dump.outputs.manifest }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record backup success evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "backup_status=success"
          echo "project_ref=$SUPABASE_PROJECT_ID"
          echo "retention_days=$BACKUP_RETENTION_DAYS"
          echo "source_sha=$GITHUB_SHA"
          echo "migration_frontier=${{ steps.dump.outputs.migration_frontier }}"
