name: "[WT:character-memory] 세연 Luna-Terra 모델 분류 비교"

on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-model-eval-v1.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seyeon-model-eval-v1
  cancel-in-progress: false

jobs:
  compare:
    name: 세연 운영 프롬프트 기반 Luna/Terra 격리 비교
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce trusted main trigger and bounded experiment
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            [ "${{ github.ref }}" = "refs/heads/main" ]
            [ "$(tr -d '\r\n' < .github/seyeon-model-eval-v1.trigger)" = "fire-2026-10-08-v1" ]
          else
            [ "${{ github.event_name }}" = "workflow_dispatch" ]
            [ "${{ github.ref }}" = "refs/heads/main" ]
          fi
          test -n "${OPENAI_API_KEY:-}"
          test -f scripts/run-seyeon-model-eval-v1.mjs

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic benchmark contract tests
        run: npx vitest run test/seyeon-model-eval-v1.test.mjs

      - name: Build evaluator
        run: npm run build

      - name: Compare Luna and Terra on synthetic governed classification
        env:
          SEYEON_EVAL_EVIDENCE_PATH: ${{ runner.temp }}/seyeon-model-eval-v1/evidence.json
        run: node scripts/run-seyeon-model-eval-v1.mjs

      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seyeon-model-eval-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-model-eval-v1/evidence.json
          if-no-files-found: warn
          retention-days: 14
