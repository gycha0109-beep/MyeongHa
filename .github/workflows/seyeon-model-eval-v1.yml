name: "[WT:character-memory] 세연 C06 8회 유료 분류 선별 (F01 HOLD)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seyeon-c06-eight-call-manual-v1
  cancel-in-progress: false

jobs:
  compare:
    # Reviewed-scope replacement: this is NOT the legacy 100/400-call runner.
    # Main-only, manual-only, dedicated KEY2, max 8 attempts, 0 retries.
    # Run #38845185681 consumed 3 paid calls; prior-run budget is not durable.
    # C06 F01 original overclassification HOLD. Never replay all 8 by pressing Re-run.
    # A separate owner-reviewed carry-forward + lifetime budget gate is required.
    if: ${{ false }}
    name: 세연 기존/압축 통합 분류 지시문 4쌍 (최대 8회)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify eight-call budget and legacy lock
        run: npx vitest run test/seyeon-cost-c06-eight-call-budget-v1.test.mjs test/seyeon-paid-eval-hold-v1.test.mjs test/seyeon-security-four-cell-eval-plan-v1.test.mjs

      - name: Build evaluated runtime
        run: npm run build

      - name: Run one bounded synthetic-only live classification screen
        env:
          OPENAI_API_KEY2: ${{ secrets.OPENAI_API_KEY2 }}
          SEYEON_C06_EVIDENCE_PATH: ${{ runner.temp }}/seyeon-c06-eight-call/attempts.jsonl
          SEYEON_C06_REPORT_PATH: ${{ runner.temp }}/seyeon-c06-eight-call/report.json
        run: |
          test -n "${OPENAI_API_KEY2:-}"
          node scripts/run-seyeon-cost-c06-eight-call-v1.mjs

      - name: Save bounded numeric outcomes, even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seyeon-c06-eight-call-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-c06-eight-call/
          if-no-files-found: warn
          retention-days: 14
