name: '[WT:character-memory] OpenRouter three-call N01 public E2E'
on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-openrouter-three-call-n01.trigger'
permissions:
  contents: read
  actions: read
concurrency:
  group: seyeon-openrouter-three-call-n01-lifetime-once
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable pinned main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify guards and build pinned code
        run: |
          npx vitest run test/seyeon-openrouter-three-call-n01-v1.test.mjs test/openrouter-seyeon-evaluation-provider-v1.test.ts
          npm run build
          node --check scripts/run-seyeon-openrouter-three-call-n01-v1.mjs
      - name: Real bounded three-call synthetic first greeting
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          node scripts/run-seyeon-openrouter-three-call-n01-v1.mjs
      - name: Upload numeric-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seyeon-openrouter-three-call-n01-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-openrouter-three-call-n01/
          if-no-files-found: warn
          retention-days: 14
