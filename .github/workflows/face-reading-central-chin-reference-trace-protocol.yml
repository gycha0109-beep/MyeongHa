name: Face Reading Central Chin Reference Trace Protocol

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr54-central-chin-reference-trace-protocol.test.ts'
      - 'docs/FACE_READING_FR54_CENTRAL_CHIN_REFERENCE_TRACE_PROTOCOL_V0.1.md'
      - 'docs/FACE_READING_FR54_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-reference-trace-protocol.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr54-central-chin-reference-trace-protocol.test.ts'
      - 'docs/FACE_READING_FR54_CENTRAL_CHIN_REFERENCE_TRACE_PROTOCOL_V0.1.md'
      - 'docs/FACE_READING_FR54_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-reference-trace-protocol.yml'

permissions:
  contents: read

jobs:
  fr54-central-chin-reference-trace-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Run FR-54 reference-trace protocol tests
        run: npx vitest run test/face-reading-fr54-central-chin-reference-trace-protocol.test.ts
      - name: Verify compiled FR-54 anti-circularity and fail-closed boundary
        run: |
          node --input-type=module <<'NODE'
          import {
            CENTRAL_CHIN_REFERENCE_TRACE_AUTHORITY_FR54,
            assessCentralChinReferenceTraceReadinessFR54,
            assertCentralChinReferenceTraceReadyForProductionFR54,
            freezeCentralChinInferiorReferenceTraceFR54,
            validateCentralChinReferenceTraceAuthorityFR54,
          } from './dist/packages/face-reading/src/index.js';

          validateCentralChinReferenceTraceAuthorityFR54();
          const authority = CENTRAL_CHIN_REFERENCE_TRACE_AUTHORITY_FR54;
          if (authority.protocol.traceRepresentation !== 'raw_ordered_polyline') process.exit(1);
          if (authority.protocol.traceOrderMeaning !== 'raw_annotator_draw_order_preserved_not_anatomical_direction') process.exit(1);
          if (authority.protocol.firstAndLastPointMeaning !== 'annotation_coverage_extent_only_not_anatomical_endpoint') process.exit(1);
          if (!authority.protocol.candidateBlindRequired || !authority.protocol.providerBlindRequired || !authority.protocol.traditionalLabelBlindRequired) process.exit(1);
          if (!authority.protocol.freezeBeforeCandidateAnnotationOrComparisonRequired) process.exit(1);
          if (authority.protocol.tracePointDensityRule !== null) process.exit(1);
          if (authority.protocol.lateralExtentSelectionRule !== null) process.exit(1);
          if (authority.protocol.endpointSelectionRule !== null) process.exit(1);
          if (authority.protocol.membershipDistanceTolerance !== null) process.exit(1);
          if (authority.protocol.minimumAnnotators !== null || authority.protocol.minimumSubjects !== null) process.exit(1);
          if (authority.protocol.consensusRule !== null) process.exit(1);
          if (!Object.values(authority.authorityBoundary).every((value) => value === false)) process.exit(1);

          const skomina = authority.evidence.find((entry) => entry.evidenceId === 'evidence.fr54.skomina_2024_independent_geometric_corroboration');
          if (!skomina) process.exit(1);
          if (!skomina.supports.independentCentralInferiorChinConstructionCorroborated) process.exit(1);
          if (skomina.supports.softTissueMentonInferiorMidlineAnchor) process.exit(1);
          if (skomina.supports.bilateralMentonSideCandidateDefinition) process.exit(1);

          const frozen = freezeCentralChinInferiorReferenceTraceFR54({
            schemaVersion: 'fr54-provider-blind-central-chin-reference-trace-v1',
            subjectId: 'workflow-subject',
            captureId: 'workflow-capture',
            annotatorId: 'workflow-annotator',
            coordinateFrame: 'normalized_image_2d',
            captureView: 'frontal_en_face',
            expression: 'neutral',
            traceOrder: 'raw_annotator_draw_order',
            tracePoints: [
              { x: 0.40, y: 0.79 },
              { x: 0.46, y: 0.83 },
              { x: 0.50, y: 0.85 },
              { x: 0.54, y: 0.83 },
              { x: 0.60, y: 0.79 },
            ],
            mentonTracePointIndex: 2,
            visibleCoverageOnBothSidesOfMentonAttested: true,
            lateralExtentState: 'annotation_coverage_extent_non_authoritative',
            providerOutputVisibleDuringTraceAnnotation: false,
            traditionalLabelVisibleDuringTraceAnnotation: false,
            mentonSideCandidateVisibleDuringTraceAnnotation: false,
            softTissueMentalTubercleCandidateVisibleDuringTraceAnnotation: false,
            traceFrozenBeforeCandidateAnnotationOrComparison: true,
            fullLowerJawlineIntentionallyTraced: false,
            gonionOrOtobasionUsedAsTraceEndpoint: false,
            traceEndpointsAssertedAsFR35Endpoints: false,
          });
          if (frozen.traceOrder !== 'raw_annotator_draw_order') process.exit(1);
          if (!frozen.visibleCoverageOnBothSidesOfMentonAttested) process.exit(1);
          if (frozen.endpointAuthority || frozen.denseContinuousCurveAuthority) process.exit(1);
          if (frozen.mentonSideMembershipScoringAuthorized || frozen.distanceToleranceAuthorized) process.exit(1);
          if (frozen.providerMappingAuthorized || frozen.traditionalDigeEquivalenceAuthorized) process.exit(1);
          if (frozen.referenceStandardAuthorized || frozen.productionGeometryAuthorized) process.exit(1);

          const readiness = assessCentralChinReferenceTraceReadinessFR54();
          if (!readiness.rawTraceResearchAcquisitionReady || !readiness.candidateSeparationReady) process.exit(1);
          if (readiness.empiricalReferenceTraceDatasetPresent || readiness.reviewedReferenceStandardReady) process.exit(1);
          if (readiness.mentonSideMembershipScoringReady || readiness.endpointSelectionReady || readiness.productionGeometryReady) process.exit(1);

          let blocked = false;
          try {
            assertCentralChinReferenceTraceReadyForProductionFR54();
          } catch {
            blocked = true;
          }
          if (!blocked) process.exit(1);
          NODE
