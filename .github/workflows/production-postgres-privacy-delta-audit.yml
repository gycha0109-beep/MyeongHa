name: Production PostgreSQL Privacy Delta Count Audit
run-name: "[WT:ops] Production PostgreSQL Privacy Delta Count Audit"

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful Production PostgreSQL Logical Backup workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-postgres-privacy-delta-count-audit
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  audit:
    name: count-only-post-backup-privacy-delta-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fail closed unless read-only audit credentials are provisioned
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || missing+=(SUPABASE_DB_PASSWORD)
          [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" ]] || missing+=(SUPABASE_PRODUCTION_SESSION_POOLER_HOST)

          if (( ${#missing[@]} > 0 )); then
            for secret_name in "${missing[@]}"; do
              echo "::error title=Production privacy delta audit credential missing::Missing Actions secret: $secret_name"
              printf -- '- missing Actions secret: `%s`\n' "$secret_name" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi

          if [[ ! "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]; then
            echo '::error title=Production privacy delta audit pooler host invalid::SUPABASE_PRODUCTION_SESSION_POOLER_HOST must be a bare *.pooler.supabase.com hostname.'
            exit 1
          fi

          echo "::add-mask::$SUPABASE_DB_PASSWORD"

      - name: Validate exact governed backup source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]

          run_json="$RUNNER_TEMP/backup-run.json"
          artifact_json="$RUNNER_TEMP/backup-artifacts.json"

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID"             -o "$run_json"

          jq -e '
            .name == "Production PostgreSQL Logical Backup"
            and .path == ".github/workflows/production-postgres-backup.yml"
            and .conclusion == "success"
            and .head_branch == "main"
            and (.event == "schedule" or .event == "workflow_dispatch")
            and .repository.full_name == env.GITHUB_REPOSITORY
          ' "$run_json" >/dev/null

          source_sha="$(jq -er '.head_sha' "$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts?per_page=100"             -o "$artifact_json"

          governed_artifacts="$(jq -c '[.artifacts[] | select((.name | test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$")) and (.expired == false))]' "$artifact_json")"
          [[ "$(jq 'length' <<<"$governed_artifacts")" == '1' ]]

          artifact_id="$(jq -er '.[0].id' <<<"$governed_artifacts")"
          artifact_name="$(jq -er '.[0].name' <<<"$governed_artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$artifact_name" =~ ^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$ ]]

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download exact governed backup artifact metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/backup-artifact

      - name: Resolve exact backup completion point
        id: cutoff
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          mapfile -t public_manifests < <(
            find "$BACKUP_ARTIFACT_DIR" -maxdepth 1 -type f -name '*.manifest.json' -print
          )
          [[ "${#public_manifests[@]}" -eq 1 ]]

          manifest="${public_manifests[0]}"
          jq -e             --arg project_ref "$SUPABASE_PROJECT_ID"             --arg source_sha "$EXPECTED_SOURCE_SHA" '
              .schema_version == "myeongha-postgres-backup-artifact-v1"
              and .project_ref == $project_ref
              and .source_sha == $source_sha
              and (.created_at_utc | type == "string")
              and (.encrypted_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              and (.archive_name | type == "string" and test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z[.]tar[.]gz[.]enc$"))
            ' "$manifest" >/dev/null

          cutoff_utc="$(jq -er '.created_at_utc' "$manifest")"
          cutoff_roundtrip="$(date -u -d "$cutoff_utc" +'%Y-%m-%dT%H:%M:%SZ')"
          [[ "$cutoff_roundtrip" == "$cutoff_utc" ]]
          [[ "$(date -u -d "$cutoff_utc" +%s)" -le "$(date -u +%s)" ]]

          echo "backup_completed_at_utc=$cutoff_utc" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Count post-backup privacy deltas read-only
        id: audit
        shell: bash
        env:
          BACKUP_COMPLETED_AT_UTC: ${{ steps.cutoff.outputs.backup_completed_at_utc }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BACKUP_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: bash scripts/operations/audit-production-postgres-privacy-delta.sh
      - name: Upload count-only audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-privacy-delta-count-audit-${{ github.run_id }}
          path: ${{ steps.audit.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
