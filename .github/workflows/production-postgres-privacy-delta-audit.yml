name: Production PostgreSQL Privacy Delta Count Audit

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful Production PostgreSQL Logical Backup workflow run ID
        required: true
        type: string
      incident_reference_utc:
        description: Incident/reference time in canonical UTC YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-postgres-privacy-delta-audit
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc
  AUDIT_RETENTION_DAYS: '30'

jobs:
  audit:
    name: count-only-primary-db-observation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate audit input and source backup authority
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          INCIDENT_REFERENCE_UTC: ${{ inputs.incident_reference_utc }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]
          incident_roundtrip="$(date -u -d "$INCIDENT_REFERENCE_UTC" +'%Y-%m-%dT%H:%M:%SZ')"
          [[ "$incident_roundtrip" == "$INCIDENT_REFERENCE_UTC" ]]

          run_json="$RUNNER_TEMP/backup-run.json"
          artifact_json="$RUNNER_TEMP/backup-artifacts.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" \
            -o "$run_json"

          jq -e '
            .name == "Production PostgreSQL Logical Backup"
            and .path == ".github/workflows/production-postgres-backup.yml"
            and .conclusion == "success"
            and .head_branch == "main"
            and (.event == "schedule" or .event == "workflow_dispatch")
            and .repository.full_name == env.GITHUB_REPOSITORY
          ' "$run_json" >/dev/null

          source_sha="$(jq -er '.head_sha' "$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts?per_page=100" \
            -o "$artifact_json"

          governed_artifacts="$(jq -c '[.artifacts[] | select((.name | test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$")) and (.expired == false))]' "$artifact_json")"
          [[ "$(jq 'length' <<<"$governed_artifacts")" == '1' ]]

          artifact_id="$(jq -er '.[0].id' <<<"$governed_artifacts")"
          artifact_name="$(jq -er '.[0].name' <<<"$governed_artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$artifact_name" =~ ^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$ ]]

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download exact governed backup artifact metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/backup-artifact

      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Validate backup manifest and audit window
        id: window
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          INCIDENT_REFERENCE_UTC: ${{ inputs.incident_reference_utc }}
        run: |
          set -euo pipefail
          mapfile -t public_manifests < <(
            find "$BACKUP_ARTIFACT_DIR" -maxdepth 1 -type f -name '*.manifest.json' -print
          )
          [[ "${#public_manifests[@]}" -eq 1 ]]
          manifest="${public_manifests[0]}"

          jq -e \
            --arg project_ref "$SUPABASE_PROJECT_ID" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            '
              .schema_version == "myeongha-postgres-backup-artifact-v1"
              and .project_ref == $project_ref
              and .source_sha == $source_sha
              and (.encrypted_sha256 | test("^[0-9a-f]{64}$"))
              and (.archive_name | test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z[.]tar[.]gz[.]enc$"))
            ' "$manifest" >/dev/null

          backup_completed_at="$(jq -er '.created_at_utc' "$manifest")"
          backup_roundtrip="$(date -u -d "$backup_completed_at" +'%Y-%m-%dT%H:%M:%SZ')"
          [[ "$backup_roundtrip" == "$backup_completed_at" ]]

          backup_epoch="$(date -u -d "$backup_completed_at" +%s)"
          incident_epoch="$(date -u -d "$INCIDENT_REFERENCE_UTC" +%s)"
          now_epoch="$(date -u +%s)"
          (( incident_epoch >= backup_epoch ))
          (( incident_epoch <= now_epoch ))
          audit_window_seconds=$((incident_epoch - backup_epoch))

          echo "backup_completed_at_utc=$backup_completed_at" >> "$GITHUB_OUTPUT"
          echo "audit_window_seconds=$audit_window_seconds" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless production read credentials are provisioned
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || missing+=(SUPABASE_DB_PASSWORD)

          if [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" ]]; then
            if [[ ! "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]; then
              echo '::error title=Production audit pooler host invalid::SUPABASE_PRODUCTION_SESSION_POOLER_HOST must be a bare *.pooler.supabase.com hostname.'
              exit 1
            fi
          else
            [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || missing+=(SUPABASE_ACCESS_TOKEN)
          fi

          if (( ${#missing[@]} > 0 )); then
            for secret_name in "${missing[@]}"; do
              echo "::error title=Production audit credential missing::Missing Actions secret: $secret_name"
            done
            exit 1
          fi

          echo "::add-mask::$SUPABASE_DB_PASSWORD"

      - name: Resolve governed production session-pooler endpoint
        id: database
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" ]]; then
            admin_pool_user="postgres.$SUPABASE_PROJECT_ID"
            pool_host="$SUPABASE_PRODUCTION_SESSION_POOLER_HOST"
            pool_port='5432'
            pool_db='postgres'
          else
            pooler_file="$RUNNER_TEMP/supabase-pooler.json"
            trap 'rm -f "$pooler_file"' EXIT
            curl -fsS \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler" \
              -o "$pooler_file"

            pooler_record="$({
              jq -ce '
                (if type == "array" then . elif (.data? | type) == "array" then .data else [.] end)
                | map(select((.database_type // "") == "PRIMARY") | . + { resolved_connection_string: (.connection_string // .connectionString // "") })
                | map(select((.resolved_connection_string | type) == "string" and (.resolved_connection_string | length) > 0 and (.resolved_connection_string | test("[.]pooler[.]supabase[.]com:5432/postgres(?:[?]|$)"))))
                | first // empty
              ' "$pooler_file"
            })"
            test -n "$pooler_record"

            connection_string="$(jq -r '.resolved_connection_string // empty' <<<"$pooler_record")"
            admin_pool_user="$(sed -E 's#^[a-zA-Z0-9+.-]+://([^:]+):.*#\1#' <<<"$connection_string")"
            pool_host="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\1#' <<<"$connection_string")"
            pool_port="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\2#' <<<"$connection_string")"
            pool_db="$(sed -E 's#^[^@]+@[^/]+/([^?]+).*$#\1#' <<<"$connection_string")"
          fi

          [[ "$admin_pool_user" == "postgres.$SUPABASE_PROJECT_ID" ]]
          [[ "$pool_host" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]
          [[ "$pool_port" == '5432' ]]
          [[ "$pool_db" == 'postgres' ]]

          echo "admin_pool_user=$admin_pool_user" >> "$GITHUB_OUTPUT"
          echo "pool_host=$pool_host" >> "$GITHUB_OUTPUT"
          echo "pool_port=$pool_port" >> "$GITHUB_OUTPUT"
          echo "pool_db=$pool_db" >> "$GITHUB_OUTPUT"

      - name: Execute count-only post-backup privacy delta audit
        shell: bash
        env:
          ADMIN_POOL_USER: ${{ steps.database.outputs.admin_pool_user }}
          POOL_HOST: ${{ steps.database.outputs.pool_host }}
          POOL_PORT: ${{ steps.database.outputs.pool_port }}
          POOL_DB: ${{ steps.database.outputs.pool_db }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BACKUP_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          BACKUP_COMPLETED_AT_UTC: ${{ steps.window.outputs.backup_completed_at_utc }}
          INCIDENT_REFERENCE_UTC: ${{ inputs.incident_reference_utc }}
          AUDIT_WINDOW_SECONDS: ${{ steps.window.outputs.audit_window_seconds }}
        run: |
          set -euo pipefail
          umask 077
          audit_dir="$RUNNER_TEMP/privacy-delta-audit"
          rm -rf "$audit_dir"
          mkdir -p "$audit_dir"

          encoded_password="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )"
          db_url="postgresql://${ADMIN_POOL_USER}:${encoded_password}@${POOL_HOST}:${POOL_PORT}/${POOL_DB}?sslmode=require"
          echo "::add-mask::$db_url"

          audit_counts="$(
            psql "$db_url" -X -qAt -v ON_ERROR_STOP=1 \
              -v cutoff="$BACKUP_COMPLETED_AT_UTC" \
              -v incident="$INCIDENT_REFERENCE_UTC" <<'SQL'
          select json_build_object(
            'account_deletion_jobs_requested', (select count(*) from public.data_deletion_jobs where requested_at > :'cutoff'::timestamptz and requested_at <= :'incident'::timestamptz),
            'share_artifacts_revoked', (select count(*) from public.share_artifacts where revoked_at > :'cutoff'::timestamptz and revoked_at <= :'incident'::timestamptz),
            'device_installations_revoked', (select count(*) from public.device_installations where revoked_at > :'cutoff'::timestamptz and revoked_at <= :'incident'::timestamptz),
            'life_facts_revoked', (select count(*) from public.life_facts where revoked_at > :'cutoff'::timestamptz and revoked_at <= :'incident'::timestamptz),
            'memory_items_revoked', (select count(*) from public.memory_items where revoked_at > :'cutoff'::timestamptz and revoked_at <= :'incident'::timestamptz),
            'record_access_grants_revoked', (select count(*) from public.record_access_grants where revoked_at > :'cutoff'::timestamptz and revoked_at <= :'incident'::timestamptz),
            'non_active_subject_transitions', (select count(*) from public.subjects where status <> 'active' and updated_at > :'cutoff'::timestamptz and updated_at <= :'incident'::timestamptz)
          )::text;
          SQL
          )"

          jq -e '
            type == "object"
            and length == 7
            and all(.[]; type == "number" and . >= 0 and floor == .)
          ' <<<"$audit_counts" >/dev/null

          total_observed_deltas="$(jq '[.[]] | add' <<<"$audit_counts")"
          [[ "$total_observed_deltas" =~ ^[0-9]+$ ]]

          jq -n \
            --arg schema_version 'myeongha-postgres-privacy-delta-count-audit-v1' \
            --arg project_ref "$SUPABASE_PROJECT_ID" \
            --argjson backup_run_id "$BACKUP_RUN_ID" \
            --arg backup_source_sha "$BACKUP_SOURCE_SHA" \
            --arg backup_artifact_name "$BACKUP_ARTIFACT_NAME" \
            --arg backup_completed_at "$BACKUP_COMPLETED_AT_UTC" \
            --arg incident_reference "$INCIDENT_REFERENCE_UTC" \
            --argjson audit_window_seconds "$AUDIT_WINDOW_SECONDS" \
            --argjson counts "$audit_counts" \
            --argjson total_observed_deltas "$total_observed_deltas" \
            '{
              schema_version: $schema_version,
              project_ref: $project_ref,
              backup_workflow_run_id: $backup_run_id,
              backup_source_sha: $backup_source_sha,
              backup_artifact_name: $backup_artifact_name,
              backup_completed_at_utc: $backup_completed_at,
              incident_reference_utc: $incident_reference,
              audit_window_seconds: $audit_window_seconds,
              source_authority: "primary-production-db-observation-only",
              durable_post_backup_source_authority: false,
              counts: $counts,
              total_observed_deltas: $total_observed_deltas,
              contains_identifiers: false,
              contains_row_payloads: false,
              privacy_reconciliation_exercised: false,
              dr_ready: false
            }' > "$audit_dir/privacy-delta-audit.json"

          jq -e '
            .source_authority == "primary-production-db-observation-only"
            and .durable_post_backup_source_authority == false
            and .contains_identifiers == false
            and .contains_row_payloads == false
            and .privacy_reconciliation_exercised == false
            and .dr_ready == false
          ' "$audit_dir/privacy-delta-audit.json" >/dev/null

          if (( total_observed_deltas > 0 )); then
            echo '::warning title=Post-backup privacy deltas observed::Count-only audit found one or more timestamp-authoritative deltas. This is observation evidence only; authoritative recovery reconciliation remains blocked.'
          fi

      - name: Upload sanitized count-only audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-privacy-delta-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-delta-audit/privacy-delta-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Record audit boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'privacy_delta_count_audit=success'
          echo 'source_authority=primary-production-db-observation-only'
          echo 'durable_post_backup_source_authority=false'
          echo 'contains_identifiers=false'
          echo 'contains_row_payloads=false'
          echo 'privacy_reconciliation_exercised=false'
          echo 'dr_ready=false'
