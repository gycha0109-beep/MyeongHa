name: Production PostgreSQL Privacy Delta Count Audit

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful Production PostgreSQL Logical Backup workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-postgres-privacy-delta-count-audit
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  audit:
    name: count-only-post-backup-privacy-delta-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fail closed unless read-only audit credentials are provisioned
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || missing+=(SUPABASE_DB_PASSWORD)
          [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" ]] || missing+=(SUPABASE_PRODUCTION_SESSION_POOLER_HOST)

          if (( ${#missing[@]} > 0 )); then
            for secret_name in "${missing[@]}"; do
              echo "::error title=Production privacy delta audit credential missing::Missing Actions secret: $secret_name"
              printf -- '- missing Actions secret: `%s`\n' "$secret_name" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi

          if [[ ! "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]; then
            echo '::error title=Production privacy delta audit pooler host invalid::SUPABASE_PRODUCTION_SESSION_POOLER_HOST must be a bare *.pooler.supabase.com hostname.'
            exit 1
          fi

          echo "::add-mask::$SUPABASE_DB_PASSWORD"

      - name: Validate exact governed backup source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]

          run_json="$RUNNER_TEMP/backup-run.json"
          artifact_json="$RUNNER_TEMP/backup-artifacts.json"

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID"             -o "$run_json"

          jq -e '
            .name == "Production PostgreSQL Logical Backup"
            and .path == ".github/workflows/production-postgres-backup.yml"
            and .conclusion == "success"
            and .head_branch == "main"
            and (.event == "schedule" or .event == "workflow_dispatch")
            and .repository.full_name == env.GITHUB_REPOSITORY
          ' "$run_json" >/dev/null

          source_sha="$(jq -er '.head_sha' "$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts?per_page=100"             -o "$artifact_json"

          governed_artifacts="$(jq -c '[.artifacts[] | select((.name | test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$")) and (.expired == false))]' "$artifact_json")"
          [[ "$(jq 'length' <<<"$governed_artifacts")" == '1' ]]

          artifact_id="$(jq -er '.[0].id' <<<"$governed_artifacts")"
          artifact_name="$(jq -er '.[0].name' <<<"$governed_artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$artifact_name" =~ ^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$ ]]

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download exact governed backup artifact metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/backup-artifact

      - name: Resolve exact backup completion point
        id: cutoff
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          mapfile -t public_manifests < <(
            find "$BACKUP_ARTIFACT_DIR" -maxdepth 1 -type f -name '*.manifest.json' -print
          )
          [[ "${#public_manifests[@]}" -eq 1 ]]

          manifest="${public_manifests[0]}"
          jq -e             --arg project_ref "$SUPABASE_PROJECT_ID"             --arg source_sha "$EXPECTED_SOURCE_SHA" '
              .schema_version == "myeongha-postgres-backup-artifact-v1"
              and .project_ref == $project_ref
              and .source_sha == $source_sha
              and (.created_at_utc | type == "string")
              and (.encrypted_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              and (.archive_name | type == "string" and test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z[.]tar[.]gz[.]enc$"))
            ' "$manifest" >/dev/null

          cutoff_utc="$(jq -er '.created_at_utc' "$manifest")"
          cutoff_roundtrip="$(date -u -d "$cutoff_utc" +'%Y-%m-%dT%H:%M:%SZ')"
          [[ "$cutoff_roundtrip" == "$cutoff_utc" ]]
          [[ "$(date -u -d "$cutoff_utc" +%s)" -le "$(date -u +%s)" ]]

          echo "backup_completed_at_utc=$cutoff_utc" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Count post-backup privacy deltas read-only
        id: audit
        shell: bash
        env:
          BACKUP_COMPLETED_AT_UTC: ${{ steps.cutoff.outputs.backup_completed_at_utc }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BACKUP_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          umask 077

          encoded_password="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )"
          admin_pool_user="postgres.$SUPABASE_PROJECT_ID"
          db_url="postgresql://${admin_pool_user}:${encoded_password}@${SUPABASE_PRODUCTION_SESSION_POOLER_HOST}:5432/postgres?sslmode=require"
          echo "::add-mask::$db_url"

          export PGOPTIONS='-c statement_timeout=30000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=30000'

          counts_path="$RUNNER_TEMP/privacy-delta-counts.json"
          evidence_dir="$RUNNER_TEMP/privacy-delta-audit-evidence"
          evidence_path="$evidence_dir/privacy-delta-count-audit.json"
          mkdir -p "$evidence_dir"

          sql="$(cat <<'SQL'
          begin transaction read only;
          select jsonb_build_object(
            'data_deletion_jobs_requested_at', (select count(*)::bigint from public.data_deletion_jobs where requested_at > :'cutoff'::timestamptz),
            'share_artifacts_revoked_at', (select count(*)::bigint from public.share_artifacts where revoked_at > :'cutoff'::timestamptz),
            'device_installations_revoked_at', (select count(*)::bigint from public.device_installations where revoked_at > :'cutoff'::timestamptz),
            'life_facts_revoked_at', (select count(*)::bigint from public.life_facts where revoked_at > :'cutoff'::timestamptz),
            'memory_items_revoked_at', (select count(*)::bigint from public.memory_items where revoked_at > :'cutoff'::timestamptz),
            'record_access_grants_revoked_at', (select count(*)::bigint from public.record_access_grants where revoked_at > :'cutoff'::timestamptz),
            'subjects_non_active_updated_at', (select count(*)::bigint from public.subjects where status <> 'active' and updated_at > :'cutoff'::timestamptz)
          )::text
          where current_setting('transaction_read_only') = 'on';
          rollback;
          SQL
          )"

          if ! psql "$db_url" -X -qAt             -v ON_ERROR_STOP=1             -v "cutoff=$BACKUP_COMPLETED_AT_UTC"             -c "$sql" > "$counts_path"; then
            echo '::error title=Production privacy delta count query failed::Explicit READ ONLY transaction could not complete.'
            exit 1
          fi

          [[ -s "$counts_path" ]]

          jq -e '
            type == "object"
            and (keys | sort) == ([
              "data_deletion_jobs_requested_at",
              "device_installations_revoked_at",
              "life_facts_revoked_at",
              "memory_items_revoked_at",
              "record_access_grants_revoked_at",
              "share_artifacts_revoked_at",
              "subjects_non_active_updated_at"
            ] | sort)
            and all(.[]; type == "number" and floor == . and . >= 0)
          ' "$counts_path" >/dev/null

          total_count="$(jq '[.[]] | add' "$counts_path")"
          observed_deltas=false
          if [[ "$total_count" -gt 0 ]]; then
            observed_deltas=true
          fi

          jq -n             --arg schema_version 'myeongha-postgres-privacy-delta-count-audit-v1'             --arg backup_run_id "$BACKUP_RUN_ID"             --arg backup_source_sha "$BACKUP_SOURCE_SHA"             --arg backup_artifact_name "$BACKUP_ARTIFACT_NAME"             --arg backup_completed_at_utc "$BACKUP_COMPLETED_AT_UTC"             --arg audit_completed_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"             --argjson counts "$(cat "$counts_path")"             --argjson total_count "$total_count"             --argjson observed_deltas "$observed_deltas" '
              {
                schema_version: $schema_version,
                backup_run_id: $backup_run_id,
                backup_source_sha: $backup_source_sha,
                backup_artifact_name: $backup_artifact_name,
                backup_completed_at_utc: $backup_completed_at_utc,
                audit_completed_at_utc: $audit_completed_at_utc,
                query_mode: "read_only_count_only",
                counts: $counts,
                observed_delta_total: $total_count,
                observed_deltas: $observed_deltas,
                authoritative_post_backup_source: false,
                authoritative_privacy_reconciliation: false,
                future_safe_privacy_reconciliation: false,
                dr_ready: false
              }
            ' > "$evidence_path"

          chmod 600 "$evidence_path"

          {
            echo '### PostgreSQL privacy delta count-only audit'
            echo
            printf -- '- backup run: `%s`\n' "$BACKUP_RUN_ID"
            printf -- '- backup completion point: `%s`\n' "$BACKUP_COMPLETED_AT_UTC"
            while IFS='=' read -r key value; do
              printf -- '- %s: `%s`\n' "$key" "$value"
            done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' "$counts_path")
            printf -- '- observed delta total: `%s`\n' "$total_count"
            echo
            echo 'This workflow reports count-only primary-database observations. It does not create a durable post-backup privacy authority, perform reconciliation, approve RPO/RTO, or make DR Ready true.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"
          echo "observed_delta_total=$total_count" >> "$GITHUB_OUTPUT"

      - name: Upload count-only audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-privacy-delta-count-audit-${{ github.run_id }}
          path: ${{ steps.audit.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
