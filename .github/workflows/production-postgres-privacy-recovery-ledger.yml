name: Production PostgreSQL Privacy Recovery Ledger Candidate

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Optional successful Production PostgreSQL Logical Backup run ID; empty selects the latest governed successful main backup
        required: false
        default: ''
        type: string
  schedule:
    # Operational snapshot cadence only. This is NOT an approved RPO.
    - cron: '47 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: production-postgres-privacy-recovery-ledger-candidate
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc
  LEDGER_ARTIFACT_RETENTION_DAYS: '30'

jobs:
  snapshot:
    name: encrypted-off-db-privacy-recovery-ledger-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fail closed unless recovery credentials are provisioned
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || missing+=(SUPABASE_DB_PASSWORD)
          [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" ]] || missing+=(SUPABASE_PRODUCTION_SESSION_POOLER_HOST)
          [[ -n "${MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE:-}" ]] || missing+=(MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE)

          if (( ${#missing[@]} > 0 )); then
            for secret_name in "${missing[@]}"; do
              echo "::error title=Privacy ledger candidate credential missing::Missing Actions secret: $secret_name"
            done
            exit 1
          fi

          if [[ ! "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]; then
            echo '::error title=Privacy ledger candidate pooler host invalid::SUPABASE_PRODUCTION_SESSION_POOLER_HOST must be a bare *.pooler.supabase.com hostname.'
            exit 1
          fi

          if [ "${#MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE}" -lt 32 ]; then
            echo '::error title=Privacy ledger candidate encryption root invalid::MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE must be at least 32 characters.'
            exit 1
          fi

          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE"

      - name: Resolve and validate governed backup source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          selected_run_id="${INPUT_BACKUP_RUN_ID:-}"
          discovery_json="$RUNNER_TEMP/backup-discovery.json"

          if [[ -z "$selected_run_id" ]]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-postgres-backup.yml/runs?branch=main&status=success&per_page=20" \
              -o "$discovery_json"
            selected_run_id="$(jq -er '
              [
                .workflow_runs[]
                | select(
                    .name == "Production PostgreSQL Logical Backup"
                    and .path == ".github/workflows/production-postgres-backup.yml"
                    and .conclusion == "success"
                    and .head_branch == "main"
                    and (.event == "schedule" or .event == "workflow_dispatch")
                  )
              ][0].id
            ' "$discovery_json")"
          fi

          [[ "$selected_run_id" =~ ^[0-9]+$ ]]

          run_json="$RUNNER_TEMP/backup-run.json"
          artifact_json="$RUNNER_TEMP/backup-artifacts.json"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$selected_run_id" \
            -o "$run_json"

          jq -e '
            .name == "Production PostgreSQL Logical Backup"
            and .path == ".github/workflows/production-postgres-backup.yml"
            and .conclusion == "success"
            and .head_branch == "main"
            and (.event == "schedule" or .event == "workflow_dispatch")
            and .repository.full_name == env.GITHUB_REPOSITORY
          ' "$run_json" >/dev/null

          source_sha="$(jq -er '.head_sha' "$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$selected_run_id/artifacts?per_page=100" \
            -o "$artifact_json"

          governed_artifacts="$(jq -c '[.artifacts[] | select((.name | test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$")) and (.expired == false))]' "$artifact_json")"
          [[ "$(jq 'length' <<<"$governed_artifacts")" == '1' ]]

          artifact_id="$(jq -er '.[0].id' <<<"$governed_artifacts")"
          artifact_name="$(jq -er '.[0].name' <<<"$governed_artifacts")"

          echo "backup_run_id=$selected_run_id" >> "$GITHUB_OUTPUT"
          echo "backup_source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "backup_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "backup_artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download governed backup artifact metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.backup_run_id }}
          artifact-ids: ${{ steps.source.outputs.backup_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/backup-artifact

      - name: Resolve exact backup completion point
        id: cutoff
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.backup_source_sha }}
        run: |
          set -euo pipefail
          mapfile -t public_manifests < <(
            find "$BACKUP_ARTIFACT_DIR" -maxdepth 1 -type f -name '*.manifest.json' -print
          )
          [[ "${#public_manifests[@]}" -eq 1 ]]

          manifest="${public_manifests[0]}"
          jq -e \
            --arg project_ref "$SUPABASE_PROJECT_ID" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" '
              .schema_version == "myeongha-postgres-backup-artifact-v1"
              and .project_ref == $project_ref
              and .source_sha == $source_sha
              and (.created_at_utc | type == "string")
              and (.encrypted_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              and (.archive_name | type == "string" and test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z[.]tar[.]gz[.]enc$"))
            ' "$manifest" >/dev/null

          cutoff_utc="$(jq -er '.created_at_utc' "$manifest")"
          cutoff_roundtrip="$(date -u -d "$cutoff_utc" +'%Y-%m-%dT%H:%M:%SZ')"
          [[ "$cutoff_roundtrip" == "$cutoff_utc" ]]
          [[ "$(date -u -d "$cutoff_utc" +%s)" -le "$(date -u +%s)" ]]

          echo "backup_completed_at_utc=$cutoff_utc" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Export replay-supported privacy events read-only
        id: export
        shell: bash
        env:
          BACKUP_RUN_ID: ${{ steps.source.outputs.backup_run_id }}
          BACKUP_COMPLETED_AT_UTC: ${{ steps.cutoff.outputs.backup_completed_at_utc }}
        run: |
          set -euo pipefail
          umask 077

          work_dir="$RUNNER_TEMP/privacy-recovery-ledger"
          rm -rf "$work_dir"
          mkdir -p "$work_dir"

          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -rf "$work_dir"
            exit "$exit_code"
          }
          trap cleanup EXIT

          captured_at_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          encoded_password="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )"
          admin_pool_user="postgres.$SUPABASE_PROJECT_ID"
          db_url="postgresql://${admin_pool_user}:${encoded_password}@${SUPABASE_PRODUCTION_SESSION_POOLER_HOST}:5432/postgres?sslmode=require"
          echo "::add-mask::$db_url"

          export PGOPTIONS='-c statement_timeout=30000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=30000'

          raw_source="$work_dir/raw-source.json"
          manifest="$work_dir/privacy-reconciliation-manifest.json"
          summary="$work_dir/privacy-recovery-ledger-summary.json"

          sql="$(cat <<'SQL'
          begin transaction read only;
          with
          account_jobs as (
            select
              dj.requested_at as occurred_at,
              dj.id as deletion_job_id,
              dj.subject_id,
              dj.request_dedupe_key,
              oe.id as outbox_event_id
            from public.data_deletion_jobs dj
            join public.outbox_events oe
              on oe.aggregate_type = 'data_deletion_job'
             and oe.aggregate_id = dj.id::text
             and oe.event_type = 'ACCOUNT_DELETION_STARTED'
             and oe.event_schema_version = 'v1'
            where dj.scope = 'account'
              and dj.requested_at > :'cutoff'::timestamptz
              and dj.requested_at <= :'captured'::timestamptz
          ),
          supported_events as (
            select
              aj.occurred_at,
              'ACCOUNT_DELETION_STARTED'::text as event_type,
              aj.deletion_job_id::text as stable_key,
              jsonb_build_object(
                'occurredAt', to_char(aj.occurred_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                'type', 'ACCOUNT_DELETION_STARTED',
                'deletionJobId', aj.deletion_job_id,
                'outboxEventId', aj.outbox_event_id,
                'requestDedupeKey', aj.request_dedupe_key,
                'subjectId', aj.subject_id
              ) as payload
            from account_jobs aj

            union all

            select
              sa.revoked_at,
              'SHARE_ARTIFACT_REVOKED',
              sa.id::text,
              jsonb_build_object(
                'occurredAt', to_char(sa.revoked_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                'type', 'SHARE_ARTIFACT_REVOKED',
                'shareArtifactId', sa.id,
                'subjectId', sa.subject_id
              )
            from public.share_artifacts sa
            where sa.status = 'revoked'
              and sa.revoked_at > :'cutoff'::timestamptz
              and sa.revoked_at <= :'captured'::timestamptz

            union all

            select
              di.revoked_at,
              'DEVICE_INSTALLATION_REVOKED',
              di.id::text,
              jsonb_build_object(
                'occurredAt', to_char(di.revoked_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                'type', 'DEVICE_INSTALLATION_REVOKED',
                'installationId', di.id,
                'subjectId', di.subject_id
              )
            from public.device_installations di
            where di.revoked_at > :'cutoff'::timestamptz
              and di.revoked_at <= :'captured'::timestamptz

            union all

            select
              mi.revoked_at,
              'MEMORY_ITEM_REVOKED',
              mi.id::text,
              jsonb_build_object(
                'occurredAt', to_char(mi.revoked_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                'type', 'MEMORY_ITEM_REVOKED',
                'memoryItemId', mi.id,
                'subjectId', mi.subject_id
              )
            from public.memory_items mi
            where mi.revoked_at > :'cutoff'::timestamptz
              and mi.revoked_at <= :'captured'::timestamptz

            union all

            select
              lf.revoked_at,
              'LIFE_FACT_REVOKED',
              lf.id::text,
              jsonb_build_object(
                'occurredAt', to_char(lf.revoked_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                'type', 'LIFE_FACT_REVOKED',
                'lifeFactId', lf.id,
                'subjectId', lf.subject_id
              )
            from public.life_facts lf
            where lf.revoked_at > :'cutoff'::timestamptz
              and lf.revoked_at <= :'captured'::timestamptz

            union all

            select
              g.revoked_at,
              case when g.memory_item_id is not null
                then 'MEMORY_CHARACTER_GRANT_REVOKED'
                else 'LIFE_FACT_CHARACTER_GRANT_REVOKED'
              end,
              g.id::text,
              case when g.memory_item_id is not null
                then jsonb_build_object(
                  'occurredAt', to_char(g.revoked_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                  'type', 'MEMORY_CHARACTER_GRANT_REVOKED',
                  'memoryItemId', g.memory_item_id,
                  'characterId', g.grantee_character_id,
                  'subjectId', g.subject_id
                )
                else jsonb_build_object(
                  'occurredAt', to_char(g.revoked_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                  'type', 'LIFE_FACT_CHARACTER_GRANT_REVOKED',
                  'lifeFactId', g.life_fact_id,
                  'characterId', g.grantee_character_id,
                  'subjectId', g.subject_id
                )
              end
            from public.record_access_grants g
            where g.revoked_at > :'cutoff'::timestamptz
              and g.revoked_at <= :'captured'::timestamptz
          ),
          unsupported as (
            select
              (
                select count(*)::bigint
                from public.data_deletion_jobs dj
                where dj.scope = 'account'
                  and dj.requested_at > :'cutoff'::timestamptz
                  and dj.requested_at <= :'captured'::timestamptz
                  and (
                    select count(*)
                    from public.outbox_events oe
                    where oe.aggregate_type = 'data_deletion_job'
                      and oe.aggregate_id = dj.id::text
                      and oe.event_type = 'ACCOUNT_DELETION_STARTED'
                      and oe.event_schema_version = 'v1'
                  ) <> 1
              ) as account_deletion_without_exact_outbox_count,
              (
                select count(*)::bigint
                from public.data_deletion_jobs dj
                where dj.scope <> 'account'
                  and dj.requested_at > :'cutoff'::timestamptz
                  and dj.requested_at <= :'captured'::timestamptz
              ) as non_account_deletion_job_count,
              (
                select count(*)::bigint
                from public.subjects s
                where s.status <> 'active'
                  and s.updated_at > :'cutoff'::timestamptz
                  and s.updated_at <= :'captured'::timestamptz
                  and not (
                    s.status = 'deletion_pending'
                    and exists (
                      select 1
                      from public.data_deletion_jobs dj
                      where dj.subject_id = s.id
                        and dj.scope = 'account'
                        and dj.requested_at > :'cutoff'::timestamptz
                        and dj.requested_at <= :'captured'::timestamptz
                    )
                  )
              ) as unsupported_subject_lifecycle_count
          )
          select jsonb_build_object(
            'events',
            coalesce(
              (
                select jsonb_agg(se.payload order by se.occurred_at, se.event_type, se.stable_key)
                from supported_events se
              ),
              '[]'::jsonb
            ),
            'unsupported',
            jsonb_build_object(
              'accountDeletionWithoutExactOutboxCount', u.account_deletion_without_exact_outbox_count,
              'nonAccountDeletionJobCount', u.non_account_deletion_job_count,
              'unsupportedSubjectLifecycleCount', u.unsupported_subject_lifecycle_count
            )
          )::text
          from unsupported u
          where current_setting('transaction_read_only') = 'on';
          rollback;
          SQL
          )"

          if ! printf '%s\n' "$sql" | psql "$db_url" -X -qAt \
            -v ON_ERROR_STOP=1 \
            -v "cutoff=$BACKUP_COMPLETED_AT_UTC" \
            -v "captured=$captured_at_utc" > "$raw_source"; then
            echo '::error title=Privacy recovery ledger source query failed::Explicit READ ONLY transaction could not complete.'
            exit 1
          fi

          [[ -s "$raw_source" ]]
          jq -e '
            type == "object"
            and (.events | type == "array")
            and (.unsupported | type == "object")
            and (.unsupported | keys | sort) == ([
              "accountDeletionWithoutExactOutboxCount",
              "nonAccountDeletionJobCount",
              "unsupportedSubjectLifecycleCount"
            ] | sort)
            and all(.unsupported[]; type == "number" and floor == . and . >= 0)
          ' "$raw_source" >/dev/null

          unsupported_total="$(jq '[.unsupported[]] | add' "$raw_source")"
          if [[ "$unsupported_total" -ne 0 ]]; then
            echo "::error title=Privacy recovery ledger candidate incomplete::Unsupported post-backup privacy/lifecycle deltas were observed; fail closed rather than exporting a partial ledger."
            jq -r '.unsupported | to_entries[] | "- \(.key): \(.value)"' "$raw_source" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          node scripts/build-postgres-privacy-recovery-ledger-manifest.mjs \
            --input "$raw_source" \
            --backup-run-id "$BACKUP_RUN_ID" \
            --backup-completed-at "$BACKUP_COMPLETED_AT_UTC" \
            --captured-at "$captured_at_utc" \
            --manifest "$manifest" \
            --summary "$summary"

          jq -e '
            .candidateSourceAuthority == true
            and .authoritativePostBackupSource == false
            and .authoritativePrivacyReconciliation == false
            and .futureSafePrivacyReconciliation == false
            and .drReady == false
          ' "$summary" >/dev/null

          manifest_sha256="$(sha256sum "$manifest" | awk '{print $1}')"
          printf '%s  %s\n' "$manifest_sha256" "$(basename "$manifest")" > "$work_dir/plaintext-sha256.txt"

          ledger_passphrase="$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          root = os.environ['MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE'].encode('utf-8')
          value = hmac.new(root, b'myeongha-postgres-privacy-recovery-ledger-v1', hashlib.sha256).digest()
          print(base64.b64encode(value).decode('ascii'))
          PY
          )"
          export MYEONGHA_PRIVACY_LEDGER_DERIVED_PASSPHRASE="$ledger_passphrase"
          echo "::add-mask::$MYEONGHA_PRIVACY_LEDGER_DERIVED_PASSPHRASE"

          ledger_stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          plaintext_archive="$work_dir/myeongha-privacy-ledger-${ledger_stamp}.tar.gz"
          encrypted_archive="$RUNNER_TEMP/myeongha-privacy-ledger-${ledger_stamp}.tar.gz.enc"
          tar -C "$work_dir" -czf "$plaintext_archive" \
            privacy-reconciliation-manifest.json plaintext-sha256.txt

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$plaintext_archive" \
            -out "$encrypted_archive" \
            -pass env:MYEONGHA_PRIVACY_LEDGER_DERIVED_PASSPHRASE
          rm -f "$plaintext_archive" "$raw_source" "$manifest"

          encrypted_sha256="$(sha256sum "$encrypted_archive" | awk '{print $1}')"
          checksum="${encrypted_archive}.sha256"
          printf '%s  %s\n' "$encrypted_sha256" "$(basename "$encrypted_archive")" > "$checksum"

          public_manifest="$RUNNER_TEMP/myeongha-privacy-ledger-${ledger_stamp}.manifest.json"
          jq \
            --arg schema_version 'myeongha-postgres-privacy-recovery-ledger-artifact-v1' \
            --arg source_sha "$GITHUB_SHA" \
            --arg backup_source_sha '${{ steps.source.outputs.backup_source_sha }}' \
            --arg backup_artifact_name '${{ steps.source.outputs.backup_artifact_name }}' \
            --arg encrypted_sha256 "$encrypted_sha256" \
            --arg archive_name "$(basename "$encrypted_archive")" \
            '. + {
              schema_version: $schema_version,
              workflow_source_sha: $source_sha,
              backup_source_sha: $backup_source_sha,
              backup_artifact_name: $backup_artifact_name,
              encrypted_sha256: $encrypted_sha256,
              archive_name: $archive_name
            }' "$summary" > "$public_manifest"

          rm -f "$summary" "$work_dir/plaintext-sha256.txt"

          echo "archive=$encrypted_archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "public_manifest=$public_manifest" >> "$GITHUB_OUTPUT"
          echo "artifact_name=myeongha-privacy-ledger-${ledger_stamp}" >> "$GITHUB_OUTPUT"
          echo "event_count=$(jq -r '.eventCount' "$public_manifest")" >> "$GITHUB_OUTPUT"
          echo "captured_at_utc=$captured_at_utc" >> "$GITHUB_OUTPUT"

          {
            echo '### PostgreSQL privacy recovery ledger candidate'
            echo
            printf -- '- backup run: `%s`\n' "$BACKUP_RUN_ID"
            printf -- '- backup cutoff: `%s`\n' "$BACKUP_COMPLETED_AT_UTC"
            printf -- '- captured at: `%s`\n' "$captured_at_utc"
            printf -- '- replay-supported event count: `%s`\n' "$(jq -r '.eventCount' "$public_manifest")"
            echo
            echo 'This encrypted artifact is a candidate recovery transport only. It is not an authoritative post-backup source, does not decide deletion/legal retention, does not approve RPO/RTO, and does not make DR Ready true.'
          } >> "$GITHUB_STEP_SUMMARY"

          trap - EXIT
          rm -rf "$work_dir"

      - name: Upload encrypted privacy recovery ledger candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: |
            ${{ steps.export.outputs.archive }}
            ${{ steps.export.outputs.checksum }}
            ${{ steps.export.outputs.public_manifest }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
