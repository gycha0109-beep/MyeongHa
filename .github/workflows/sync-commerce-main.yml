name: Sync Commerce Branch With Main

on:
  push:
    branches:
      - feat/guest-purchase-intent-v2-main
    paths:
      - .github/workflows/sync-commerce-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/sync-commerce-main.yml
          git add -A
          git commit -m "chore(ci): remove commerce main sync workflow"
          git push origin HEAD:feat/guest-purchase-intent-v2-main
