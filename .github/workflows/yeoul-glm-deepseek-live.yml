name: "[WT:character-runtime-lab] Yeoul GLM DeepSeek single comparison"
on:
  workflow_dispatch:
    inputs:
      paid_approval:
        description: "Owner approves up to 18 paid GLM and DeepSeek calls, no Luna"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: yeoul-glm-deepseek-live
  cancel-in-progress: false
jobs:
  generate:
    if: ${{ github.actor == 'gycha0109-beep' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.paid_approval == true }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Check two-model-only plan
        run: |
          node --check scripts/character-optimization/yeoul-glm-deepseek-live.mjs
          node scripts/character-optimization/yeoul-glm-deepseek-live.mjs --plan-only
      - name: Generate GLM DeepSeek only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YEOUL_PAID_APPROVAL: ${{ inputs.paid_approval && 'true' || 'false' }}
        run: node scripts/character-optimization/yeoul-glm-deepseek-live.mjs
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yeoul-glm-deepseek-${{ github.run_id }}
          path: |
            yeoul-glm-deepseek-results.json
            yeoul-glm-deepseek-results.html
          retention-days: 7
          if-no-files-found: ignore
