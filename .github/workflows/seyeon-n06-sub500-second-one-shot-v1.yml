name: '[WT:character-memory] N06 corrected Luna1 Terra2 versus GLM3 second one-shot KRW485'
on:
  push:
    branches: [main]
    paths:
      - '.github/seyeon-n06-sub500-second-one-shot-v1.trigger'
permissions:
  contents: read
  actions: read
concurrency:
  group: seyeon-n06-sub500-second-one-shot-owner-authorized-once
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout immutable main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify corrected bound, precedent admission and no-dispatch quality contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx vitest run test/seyeon-n06-second-trial-all-six-stage-offline-v1.test.mjs test/seyeon-n06-sub500-second-one-shot-admission-v1.test.mjs test/seyeon-n06-terra-predispatch-offline-investigation-v1.test.mjs test/seyeon-terra-glm-quality-cap500-admission-v1.test.mjs test/seyeon-terra-glm-quality-trio-v1.test.mjs test/seyeon-live-dialogue-owner-key-first-pair-v1.test.mjs test/seyeon-openrouter-glm53flash-paid-preflight-v1.test.mjs test/openrouter-seyeon-evaluation-provider-v1.test.ts
          npm run build
          node --check scripts/run-seyeon-n06-sub500-second-one-shot-v1.mjs
      - name: Execute approved single N06 pair - Luna1 Terra2 GLM3 strict less than KRW500
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$OPENAI_API_KEY"
          test -n "$OPENROUTER_API_KEY"
          node scripts/run-seyeon-n06-sub500-second-one-shot-v1.mjs
      - name: Upload numeric-only accounting; never private prompts or intermediate drafts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: seyeon-n06-second-trial-cap485-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-n06-sub500-second-one-shot/
          if-no-files-found: warn
          retention-days: 14
