name: "[WT:character-runtime-lab] Yeoul Haiku Gemini Grok bounded three-model once"

on:
  pull_request:
    paths:
      - '.github/workflows/yeoul-three-model-comparison-once-v1.yml'
      - 'scripts/character-optimization/yeoul-three-model-comparison-once-v1.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yeoul-three-model-comparison-once-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: yeoul-three-model-benchmark-20261119-lifetime-once
  cancel-in-progress: false

jobs:
  plan-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate benchmark plan without API calls
        run: |
          node --check scripts/character-optimization/yeoul-three-model-comparison-once-v1.mjs
          node scripts/character-optimization/yeoul-three-model-comparison-once-v1.mjs --plan-only

  three-model-synthetic:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify 117-response plan without inference
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/character-optimization/yeoul-three-model-comparison-once-v1.mjs
          node scripts/character-optimization/yeoul-three-model-comparison-once-v1.mjs --plan-only

      - name: Compare three models using existing OpenRouter key within bound
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
          YEOUL_RESULT_PATH: ${{ runner.temp }}/yeoul-three-model-synthetic.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          node scripts/character-optimization/yeoul-three-model-comparison-once-v1.mjs

      - name: Save synthetic-only responses for owner comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-three-model-once-${{ github.run_id }}
          path: ${{ runner.temp }}/yeoul-three-model-synthetic.json
          if-no-files-found: ignore
          retention-days: 1
