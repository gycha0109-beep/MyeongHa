name: DB PostgreSQL 17 Authority Suite

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/birth_profile_create_runtime_authority.sh'
      - 'test/db/content_release_lifecycle_authority.sh'
      - 'test/db/member_character_thread_open_concurrency.sh'
      - 'docs/CHARACTER_GATE_B_PUBLICATION_BLOCKER_EVIDENCE.md'
      - '.github/workflows/db-postgres17-authority-suite.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/birth_profile_create_runtime_authority.sh'
      - 'test/db/content_release_lifecycle_authority.sh'
      - 'test/db/member_character_thread_open_concurrency.sh'
      - 'docs/CHARACTER_GATE_B_PUBLICATION_BLOCKER_EVIDENCE.md'
      - '.github/workflows/db-postgres17-authority-suite.yml'

permissions:
  contents: read

jobs:
  db-case:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - birth-profile-create-runtime-authority
          - content-release-lifecycle
          - member-character-thread-open
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run DB regression case
        run: bash test/db/run_ci_case.sh "${{ matrix.case }}"
