name: DB PostgreSQL 17 Authority Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'scripts/ci/db-suites.json'
      - 'scripts/ci/db-pr-router.mjs'
      - 'scripts/ci/run-db-track.mjs'
      - '.github/workflows/ci-db-track.yml'
      - 'test/db/birth_profile_create_runtime_authority.sh'
      - 'test/db/content_release_lifecycle_authority.sh'
      - 'test/db/member_character_thread_open_concurrency.sh'
      - 'docs/CHARACTER_GATE_B_PUBLICATION_BLOCKER_EVIDENCE.md'
      - '.github/workflows/db-postgres17-authority-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-suite:
    name: DB suite · postgres17
    uses: ./.github/workflows/ci-db-track.yml
    with:
      suite: postgres17
      postgres: "17.6"
