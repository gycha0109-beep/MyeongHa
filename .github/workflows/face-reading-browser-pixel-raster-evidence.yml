name: Face Reading Browser Pixel Raster Evidence

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/browser-pixel-evidence-frdata04.ts'
      - 'packages/face-reading/src/browser-image-decode-frdata03.ts'
      - 'packages/face-reading/src/image-byte-dimensions-frdata02.ts'
      - 'packages/face-reading/src/menton-dataset-intake-frdata01.ts'
      - 'packages/face-reading/src/index.ts'
      - 'scripts/face-reading-fr-data01-menton-dataset-intake.mjs'
      - 'scripts/face-reading-fr-data02-image-dimensions.mjs'
      - 'scripts/face-reading-fr-data04-browser-pixel-evidence.mjs'
      - 'scripts/face-reading-fr-data04-selftest-fixture.mjs'
      - 'test/face-reading-fr-data04-browser-pixel-evidence.test.ts'
      - 'docs/FACE_READING_FR_DATA04_BROWSER_PIXEL_RASTER_EVIDENCE.md'
      - '.github/workflows/face-reading-browser-pixel-raster-evidence.yml'
  workflow_dispatch:

jobs:
  fr-data04-pixel-raster:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Create deterministic fully decodable PNG fixtures with known RGBA bytes
        run: node scripts/face-reading-fr-data04-selftest-fixture.mjs artifacts/face-reading/fr-data04-selftest
      - name: Execute FR-DATA-04 real Chrome raster readback
        shell: bash
        run: |
          set +e
          node scripts/face-reading-fr-data04-browser-pixel-evidence.mjs \
            artifacts/face-reading/fr-data04-selftest/manifest.json \
            artifacts/face-reading/fr-data04-selftest/assets \
            artifacts/face-reading/fr-data04-selftest/report.json \
            > >(tee artifacts/face-reading/fr-data04-selftest/runtime.stdout.log) \
            2> >(tee artifacts/face-reading/fr-data04-selftest/runtime.stderr.log >&2)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if ! grep -Fq "Error: ENOTEMPTY: directory not empty, rmdir '/tmp/myeongha-fr-data04-" artifacts/face-reading/fr-data04-selftest/runtime.stderr.log; then
              exit "$status"
            fi
            test -s artifacts/face-reading/fr-data04-selftest/report.json
            echo 'FR_DATA04_EPHEMERAL_PROFILE_CLEANUP_RACE_ACCEPTED_AFTER_REPORT_WRITE'
          fi
      - name: Verify exact raster fingerprints and FR-DATA-04 claim boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const report = JSON.parse(await readFile('artifacts/face-reading/fr-data04-selftest/report.json', 'utf8'));
          const expected = JSON.parse(await readFile('artifacts/face-reading/fr-data04-selftest/expected-raster.json', 'utf8'));

          if (
            report.schemaVersion !== 'fr-data04-browser-pixel-evidence-v1' ||
            report.captureCount !== 2 ||
            report.frData03BrowserDecodeVerified !== true ||
            report.browserRasterReadbackVerified !== true ||
            report.decodedRasterSha256Observed !== true ||
            report.thresholdFreePixelStatisticsObserved !== true ||
            report.browserRasterProvenance?.protocol !== 'chrome_devtools_protocol' ||
            report.browserRasterProvenance?.rasterPrimitive !== 'canvas_2d_draw_image_get_image_data' ||
            report.browserRasterProvenance?.deterministicReplay !== true
          ) throw new Error(`FR-DATA-04 runtime contract failed: ${JSON.stringify(report)}`);

          for (const observation of report.captureObservations) {
            const wanted = expected[observation.captureRef];
            if (!wanted) throw new Error(`unexpected capture ${observation.captureRef}`);
            if (
              observation.rasterSha256 !== wanted.rasterSha256 ||
              observation.pixelCount !== wanted.pixelCount ||
              observation.rgbaByteLength !== wanted.rgbaByteLength ||
              observation.canvasDrawSucceeded !== true ||
              observation.imageDataReadbackSucceeded !== true ||
              observation.alpha?.opaquePixelCount !== observation.pixelCount ||
              observation.alpha?.transparentPixelCount !== 0 ||
              observation.alpha?.partialAlphaPixelCount !== 0
            ) throw new Error(`FR-DATA-04 exact raster mismatch: ${JSON.stringify(observation)}`);
          }

          const mustRemainFalse = [
            'pixelContentIntegrityVerified',
            'facePresenceVerified',
            'fullFaceFramingValidityVerified',
            'neutralExpressionValidityVerified',
            'naturalHeadPositionValidityVerified',
            'lightingAdequacyVerified',
            'blurThresholdPassVerified',
            'occlusionValidityVerified',
            'captureQualityThresholdsDefined',
            'captureQualityAuthorityValidated',
            'mentonAnnotationCorrectnessVerified',
            'mediaPipeInferenceCorrectnessVerified',
            'empiricalScoringPerformed',
            'providerCandidateToMentonMappingValidated',
            'repeatedCaptureRepeatabilityValidated',
            'poseStabilityValidated',
            'calibrationThresholdsDefined',
            'fr35PointToContourRelationValidated',
            'traditionalDigeEquivalenceValidated',
            'fr36VerticalReferencePromoted',
            'productionThreeDivisionsMetricAllowed',
            'productionF1Allowed',
            'productionF6Allowed',
            'researchCandidateAdmitted',
            'productionGeometryAuthorized',
          ];
          for (const key of mustRemainFalse) {
            if (report[key] !== false) throw new Error(`FR-DATA-04 unauthorized claim promotion ${key}: ${JSON.stringify(report)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-data04-browser-pixel-raster-selftest
          path: artifacts/face-reading/fr-data04-selftest
          retention-days: 14
