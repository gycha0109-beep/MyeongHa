name: Face Reading Browser Pixel Raster Evidence

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/browser-pixel-evidence-frdata04.ts'
      - 'packages/face-reading/src/browser-image-decode-frdata03.ts'
      - 'packages/face-reading/src/image-byte-dimensions-frdata02.ts'
      - 'packages/face-reading/src/menton-dataset-intake-frdata01.ts'
      - 'packages/face-reading/src/index.ts'
      - 'scripts/face-reading-fr-data01-menton-dataset-intake.mjs'
      - 'scripts/face-reading-fr-data02-image-dimensions.mjs'
      - 'scripts/face-reading-fr-data04-browser-pixel-evidence.mjs'
      - 'test/face-reading-fr-data04-browser-pixel-evidence.test.ts'
      - 'docs/FACE_READING_FR_DATA04_BROWSER_PIXEL_RASTER_EVIDENCE.md'
      - '.github/workflows/face-reading-browser-pixel-raster-evidence.yml'
  workflow_dispatch:

jobs:
  fr-data04-pixel-raster:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Create deterministic fully decodable PNG fixtures with known RGBA bytes
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { deflateSync } from 'node:zlib';
          import { mkdir, writeFile } from 'node:fs/promises';

          function crc32(bytes) {
            let crc = 0xffffffff;
            for (const byte of bytes) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
            }
            return (crc ^ 0xffffffff) >>> 0;
          }

          function chunk(type, data) {
            const typeBytes = Buffer.from(type, 'ascii');
            const out = Buffer.alloc(12 + data.length);
            out.writeUInt32BE(data.length, 0);
            typeBytes.copy(out, 4);
            data.copy(out, 8);
            out.writeUInt32BE(crc32(Buffer.concat([typeBytes, data])), 8 + data.length);
            return out;
          }

          function png(width, height, seed) {
            const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(width, 0);
            ihdr.writeUInt32BE(height, 4);
            ihdr[8] = 8;
            ihdr[9] = 6;

            const rgba = Buffer.alloc(width * height * 4);
            for (let y = 0; y < height; y += 1) {
              for (let x = 0; x < width; x += 1) {
                const offset = (y * width + x) * 4;
                rgba[offset] = (seed + x * 17) & 0xff;
                rgba[offset + 1] = (seed + y * 29) & 0xff;
                rgba[offset + 2] = (seed + x + y) & 0xff;
                rgba[offset + 3] = 255;
              }
            }

            const rows = [];
            for (let y = 0; y < height; y += 1) {
              const row = Buffer.alloc(1 + width * 4);
              row[0] = 0;
              rgba.copy(row, 1, y * width * 4, (y + 1) * width * 4);
              rows.push(row);
            }
            const bytes = Buffer.concat([
              signature,
              chunk('IHDR', ihdr),
              chunk('IDAT', deflateSync(Buffer.concat(rows))),
              chunk('IEND', Buffer.alloc(0)),
            ]);
            return { bytes, rgba };
          }

          const digest = (bytes) => `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          const root = 'artifacts/face-reading/fr-data04-selftest';
          const assetRoot = `${root}/assets/subject-calibration`;
          await mkdir(assetRoot, { recursive: true });

          const first = png(2, 2, 11);
          const second = png(3, 2, 97);
          await writeFile(`${assetRoot}/baseline.png`, first.bytes);
          await writeFile(`${assetRoot}/repeat.png`, second.bytes);

          const captures = [
            ['capture-baseline', 'neutral_frontal_baseline', 'baseline.png', first, 2, 2, 'physical-baseline'],
            ['capture-repeat', 'repeat_neutral_capture', 'repeat.png', second, 3, 2, 'physical-repeat'],
          ];

          const manifest = {
            schemaVersion: 'fr-data01-intake-v1',
            dataset: {
              schemaVersion: 'fr47-dataset-v1',
              datasetRef: 'dataset.fr-data04.workflow-selftest',
              subjects: [{ subjectRef: 'subject-calibration', independentSubject: true, partition: 'calibration' }],
              captures: captures.map(([captureRef, stratum, , image, width, height, physicalCaptureInstanceRef], index) => ({
                captureRef,
                subjectRef: 'subject-calibration',
                stratum,
                canonicalAssetDigest: digest(image.bytes),
                capturedAt: `2026-08-30T01:0${index}:00Z`,
                imageWidth: width,
                imageHeight: height,
                deviceRef: 'workflow-selftest-device',
                physicalCaptureInstanceRef,
                neutralExpressionApplied: true,
                headPositionInstructionApplied: true,
                poseAxis: null,
                poseDegrees: null,
                groundTruthLockedBeforeProviderRun: true,
                providerRunRef: null,
                providerRunExecutedAfterGroundTruthLock: false,
              })),
              annotations: captures.map(([captureRef], index) => ({
                captureRef,
                annotatorRef: `workflow-selftest-annotator-${index}`,
                targetName: 'soft_tissue_menton',
                x: 0.5,
                y: 0.75,
                providerOutputVisibleDuringAnnotation: false,
                annotationFrozenBeforeProviderScoring: true,
              })),
              groundTruthFrozen: false,
              providerRunsExecutedAfterFreeze: false,
            },
            assets: captures.map(([captureRef, , file]) => ({
              captureRef,
              relativeAssetPath: `subject-calibration/${file}`,
            })),
          };
          await writeFile(`${root}/manifest.json`, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');

          const expected = Object.fromEntries(captures.map(([captureRef, , , image, width, height]) => [
            captureRef,
            {
              rasterSha256: digest(image.rgba),
              pixelCount: width * height,
              rgbaByteLength: width * height * 4,
            },
          ]));
          await writeFile(`${root}/expected-raster.json`, `${JSON.stringify(expected, null, 2)}\n`, 'utf8');
          NODE
      - name: Execute FR-DATA-04 real Chrome raster readback
        run: >-
          node scripts/face-reading-fr-data04-browser-pixel-evidence.mjs
          artifacts/face-reading/fr-data04-selftest/manifest.json
          artifacts/face-reading/fr-data04-selftest/assets
          artifacts/face-reading/fr-data04-selftest/report.json
      - name: Verify exact raster fingerprints and FR-DATA-04 claim boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const report = JSON.parse(await readFile('artifacts/face-reading/fr-data04-selftest/report.json', 'utf8'));
          const expected = JSON.parse(await readFile('artifacts/face-reading/fr-data04-selftest/expected-raster.json', 'utf8'));

          if (
            report.schemaVersion !== 'fr-data04-browser-pixel-evidence-v1' ||
            report.captureCount !== 2 ||
            report.frData03BrowserDecodeVerified !== true ||
            report.browserRasterReadbackVerified !== true ||
            report.decodedRasterSha256Observed !== true ||
            report.thresholdFreePixelStatisticsObserved !== true ||
            report.browserRasterProvenance?.protocol !== 'chrome_devtools_protocol' ||
            report.browserRasterProvenance?.rasterPrimitive !== 'canvas_2d_draw_image_get_image_data' ||
            report.browserRasterProvenance?.deterministicReplay !== true
          ) {
            throw new Error(`FR-DATA-04 runtime contract failed: ${JSON.stringify(report)}`);
          }

          for (const observation of report.captureObservations) {
            const expectedObservation = expected[observation.captureRef];
            if (!expectedObservation) throw new Error(`unexpected capture ${observation.captureRef}`);
            if (
              observation.rasterSha256 !== expectedObservation.rasterSha256 ||
              observation.pixelCount !== expectedObservation.pixelCount ||
              observation.rgbaByteLength !== expectedObservation.rgbaByteLength ||
              observation.canvasDrawSucceeded !== true ||
              observation.imageDataReadbackSucceeded !== true ||
              observation.alpha?.opaquePixelCount !== observation.pixelCount ||
              observation.alpha?.transparentPixelCount !== 0 ||
              observation.alpha?.partialAlphaPixelCount !== 0
            ) {
              throw new Error(`FR-DATA-04 exact raster mismatch: ${JSON.stringify(observation)}`);
            }
          }

          const mustRemainFalse = [
            'pixelContentIntegrityVerified',
            'facePresenceVerified',
            'fullFaceFramingValidityVerified',
            'neutralExpressionValidityVerified',
            'naturalHeadPositionValidityVerified',
            'lightingAdequacyVerified',
            'blurThresholdPassVerified',
            'occlusionValidityVerified',
            'captureQualityThresholdsDefined',
            'captureQualityAuthorityValidated',
            'mentonAnnotationCorrectnessVerified',
            'mediaPipeInferenceCorrectnessVerified',
            'empiricalScoringPerformed',
            'providerCandidateToMentonMappingValidated',
            'repeatedCaptureRepeatabilityValidated',
            'poseStabilityValidated',
            'calibrationThresholdsDefined',
            'fr35PointToContourRelationValidated',
            'traditionalDigeEquivalenceValidated',
            'fr36VerticalReferencePromoted',
            'productionThreeDivisionsMetricAllowed',
            'productionF1Allowed',
            'productionF6Allowed',
            'researchCandidateAdmitted',
            'productionGeometryAuthorized',
          ];
          for (const key of mustRemainFalse) {
            if (report[key] !== false) throw new Error(`FR-DATA-04 unauthorized claim promotion ${key}: ${JSON.stringify(report)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fr-data04-browser-pixel-raster-selftest
          path: artifacts/face-reading/fr-data04-selftest
          retention-days: 14
