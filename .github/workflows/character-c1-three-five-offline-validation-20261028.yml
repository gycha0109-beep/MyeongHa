name: '[WT:character-memory] C1 three-five offline code verification (2026-10-28)'
on:
  push:
    branches:
      - feat/character-memory/c08-local-one-call-shadow-v1
    paths:
      - '.github/character-c1-three-five-20261028-validate.trigger'
permissions:
  contents: read
jobs:
  compile-and-dry-run:
    if: ${{ github.ref == 'refs/heads/feat/character-memory/c08-local-one-call-shadow-v1' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify shared TypeScript and tested model boundary
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -p tsconfig.json --noEmit
          npx vitest run test/character-dialogue-live-model-shadow-v1.test.ts test/character-dialogue-multiturn-offline-shadow-v1.test.ts test/character-c1-three-five-public-profile-adapter-v1.test.ts
          node --check scripts/character-c1-three-five-paid-eval-20261028.mjs
      - name: Bundle public C1 persona without secrets
        run: |
          set -euo pipefail
          npx rolldown scripts/character-c1-three-five-public-profile-adapter-v1.ts --platform node --format esm --file "$RUNNER_TEMP/c1-three-five-profiles.mjs"
          test -s "$RUNNER_TEMP/c1-three-five-profiles.mjs"
      - name: Check 3 exact characters x 5 identical turns without paid dispatch
        env:
          MYEONGHA_C1_EVAL_PROFILES_MODULE: ${{ runner.temp }}/c1-three-five-profiles.mjs
          MYEONGHA_C1_EVAL_OUTPUT_DIR: ${{ runner.temp }}/character-c1-three-five-20261028
        run: node scripts/character-c1-three-five-paid-eval-20261028.mjs --dry-run
