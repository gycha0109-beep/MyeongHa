name: DB Purchase Intent Create

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'test/db/**'
      - '.github/workflows/db-purchase-intent-create.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/**'
      - '.github/workflows/db-purchase-intent-create.yml'

permissions:
  contents: read

jobs:
  purchase-intent-create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
      - name: Apply clean migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Run historical Purchase Intent v1 persistence/concurrency tests
        run: bash test/db/purchase_intent_create_concurrency.sh
      - name: Run Guest Purchase Intent v2 charge-authority/concurrency tests
        run: bash test/db/purchase_intent_create_v2_concurrency.sh
      - name: Run Purchase Intent charge amount safe-integer tests
        run: bash test/db/purchase_intent_charge_amount_safe_integer.sh
      - name: Verify deterministic schema catalog snapshot
        run: bash test/db/catalog_snapshot.sh
