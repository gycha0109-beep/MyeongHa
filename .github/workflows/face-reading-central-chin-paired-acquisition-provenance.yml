name: Face Reading Central Chin Paired Acquisition Provenance

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr58-central-chin-paired-acquisition-provenance.test.ts'
      - 'docs/FACE_READING_FR58_CENTRAL_CHIN_PAIRED_ACQUISITION_PROVENANCE_V0.1.md'
      - 'docs/FACE_READING_FR58_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-paired-acquisition-provenance.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr58-central-chin-paired-acquisition-provenance.test.ts'
      - 'docs/FACE_READING_FR58_CENTRAL_CHIN_PAIRED_ACQUISITION_PROVENANCE_V0.1.md'
      - 'docs/FACE_READING_FR58_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-paired-acquisition-provenance.yml'

permissions:
  contents: read

jobs:
  fr58-central-chin-paired-acquisition-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Run FR-58 acquisition provenance tests
        run: npx vitest run test/face-reading-fr58-central-chin-paired-acquisition-provenance.test.ts
      - name: Verify compiled FR-58 provenance guards and fail-closed boundary
        run: |
          node --input-type=module <<'NODE'
          import {
            CENTRAL_CHIN_PAIRED_ACQUISITION_PROVENANCE_AUTHORITY_FR58,
            assertCentralChinPairedAcquisitionProvenanceReadyForProductionFR58,
            validateCentralChinPairedAcquisitionProvenanceAuthorityFR58,
          } from './dist/packages/face-reading/src/index.js';

          const authority = validateCentralChinPairedAcquisitionProvenanceAuthorityFR58();
          if (authority !== CENTRAL_CHIN_PAIRED_ACQUISITION_PROVENANCE_AUTHORITY_FR58) process.exit(1);
          if (!authority.protocol.exactFrozenFR57LedgerVerificationRequired) process.exit(1);
          if (!authority.protocol.oneAcquisitionEventPerFR57PairRequired) process.exit(1);
          if (!authority.protocol.exactPairIdentityBindingRequired) process.exit(1);
          if (!authority.protocol.partitionAssignmentFrozenBeforeFR55OutcomeInspectionAttestationRequired) process.exit(1);
          if (!authority.protocol.datasetMembershipFrozenBeforeFR55OutcomeInspectionAttestationRequired) process.exit(1);
          if (authority.protocol.fr55OutcomeVisibleBeforePartitionAndMembershipFreezeRequired) process.exit(1);
          if (authority.protocol.provenanceDigestIncludesFR55Outcome) process.exit(1);
          for (const value of [
            authority.protocol.partitionAllocationRule,
            authority.protocol.calibrationFraction,
            authority.protocol.minimumPairs,
            authority.protocol.minimumSubjects,
            authority.protocol.membershipThreshold,
            authority.protocol.anchorAgreementTolerance,
            authority.protocol.endpointSelectionRule,
            authority.protocol.empiricalAcceptanceCriterion,
          ]) {
            if (value !== null) process.exit(1);
          }
          if (!Object.values(authority.authorityBoundary).every((value) => value === false)) process.exit(1);

          let productionBlocked = false;
          try {
            assertCentralChinPairedAcquisitionProvenanceReadyForProductionFR58();
          } catch {
            productionBlocked = true;
          }
          if (!productionBlocked) process.exit(1);
          NODE
