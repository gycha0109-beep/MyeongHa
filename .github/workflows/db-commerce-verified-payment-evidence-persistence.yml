name: DB Commerce Verified Payment Evidence Persistence

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'apps/api/src/commerce-verified-payment-evidence-persistence.ts'
      - 'apps/api/src/verified-commerce-evidence.ts'
      - 'apps/api/src/postgres-commerce-internal-execution.ts'
      - 'tests/commerce-verified-payment-evidence-persistence.test.ts'
      - 'tests/commerce-verified-payment-evidence-persistence-authority.test.ts'
      - 'test/db/commerce_verified_payment_evidence_persistence.sh'
      - 'test/db/commerce_verified_payment_replay_timestamp.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-commerce-verified-payment-evidence-persistence.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'apps/api/src/commerce-verified-payment-evidence-persistence.ts'
      - 'apps/api/src/verified-commerce-evidence.ts'
      - 'apps/api/src/postgres-commerce-internal-execution.ts'
      - 'tests/commerce-verified-payment-evidence-persistence.test.ts'
      - 'tests/commerce-verified-payment-evidence-persistence-authority.test.ts'
      - 'test/db/commerce_verified_payment_evidence_persistence.sh'
      - 'test/db/commerce_verified_payment_replay_timestamp.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-commerce-verified-payment-evidence-persistence.yml'

permissions:
  contents: read

jobs:
  verified-payment-evidence-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: myeongha_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
      - name: Apply clean migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Run Commerce verified payment evidence persistence tests
        run: bash test/db/commerce_verified_payment_evidence_persistence.sh
      - name: Run fresh verification timestamp replay tests
        run: bash test/db/commerce_verified_payment_replay_timestamp.sh
      - name: Verify deterministic schema catalog snapshot
        run: bash test/db/catalog_snapshot.sh
