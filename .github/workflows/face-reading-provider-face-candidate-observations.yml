name: Face Reading Provider Face Candidate Observations

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/provider-face-candidate-observations-frdata06.ts'
      - 'packages/face-reading/src/capture-quality-raw-observations-frdata05.ts'
      - 'packages/face-reading/src/browser-pixel-evidence-frdata04.ts'
      - 'packages/face-reading/src/browser-image-decode-frdata03.ts'
      - 'packages/face-reading/src/image-byte-dimensions-frdata02.ts'
      - 'packages/face-reading/src/menton-dataset-intake-frdata01.ts'
      - 'packages/face-reading/src/mediapipe-face-landmarker-runtime-fr26.ts'
      - 'packages/face-reading/src/mediapipe-real-runtime-evidence-fr27.ts'
      - 'packages/face-reading/src/mediapipe-eye-landmark-adapter-fr25.ts'
      - 'packages/face-reading/src/index.ts'
      - 'scripts/face-reading-fr-data01-menton-dataset-intake.mjs'
      - 'scripts/face-reading-fr-data02-image-dimensions.mjs'
      - 'scripts/face-reading-fr-data04-browser-pixel-evidence.mjs'
      - 'scripts/face-reading-fr-data04-selftest-fixture.mjs'
      - 'scripts/face-reading-fr-data05-capture-quality-raw-observations.mjs'
      - 'scripts/face-reading-fr-data06-provider-face-candidates.mjs'
      - 'scripts/face-reading-fr27-real-runtime-e2e.mjs'
      - 'test/face-reading-fr-data06-provider-face-candidates.test.ts'
      - 'docs/FACE_READING_FR_DATA06_PROVIDER_FACE_CANDIDATE_OBSERVATIONS.md'
      - '.github/workflows/face-reading-provider-face-candidate-observations.yml'
  workflow_dispatch:

jobs:
  fr-data06-provider-face-candidates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts

      - name: Build MyeongHa runtime
        run: npm run build

      - name: Prove positive provider runtime control
        run: node scripts/face-reading-fr27-real-runtime-e2e.mjs

      - name: Create deterministic non-face raster fixtures
        run: node scripts/face-reading-fr-data04-selftest-fixture.mjs artifacts/face-reading/fr-data06-selftest

      - name: Establish FR-DATA-04 exact browser raster prerequisite
        shell: bash
        run: |
          set +e
          node scripts/face-reading-fr-data04-browser-pixel-evidence.mjs \
            artifacts/face-reading/fr-data06-selftest/manifest.json \
            artifacts/face-reading/fr-data06-selftest/assets \
            artifacts/face-reading/fr-data06-selftest/fr-data04-report.json \
            > >(tee artifacts/face-reading/fr-data06-selftest/fr-data04.stdout.log) \
            2> >(tee artifacts/face-reading/fr-data06-selftest/fr-data04.stderr.log >&2)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if ! grep -Fq "Error: ENOTEMPTY: directory not empty, rmdir '/tmp/myeongha-fr-data04-" artifacts/face-reading/fr-data06-selftest/fr-data04.stderr.log; then
              exit "$status"
            fi
            test -s artifacts/face-reading/fr-data06-selftest/fr-data04-report.json
            echo 'FR_DATA04_EPHEMERAL_PROFILE_CLEANUP_RACE_ACCEPTED_AFTER_REPORT_WRITE'
          fi

      - name: Establish FR-DATA-05 raw capture-quality prerequisite
        run: |
          node scripts/face-reading-fr-data05-capture-quality-raw-observations.mjs \
            artifacts/face-reading/fr-data06-selftest/manifest.json \
            artifacts/face-reading/fr-data06-selftest/assets \
            artifacts/face-reading/fr-data06-selftest/fr-data04-report.json \
            artifacts/face-reading/fr-data06-selftest/fr-data05-report.json

      - name: Execute FR-DATA-06 real MediaPipe provider observation pass
        run: |
          node scripts/face-reading-fr-data06-provider-face-candidates.mjs \
            artifacts/face-reading/fr-data06-selftest/manifest.json \
            artifacts/face-reading/fr-data06-selftest/assets \
            artifacts/face-reading/fr-data06-selftest/fr-data04-report.json \
            artifacts/face-reading/fr-data06-selftest/fr-data05-report.json \
            artifacts/face-reading/fr-data06-selftest/report.json

      - name: Verify provider summaries and authority boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import {
            FR26_MEDIAPIPE_FACE_LANDMARKER_MODEL,
            MEDIAPIPE_REAL_RUNTIME_VERIFICATION_EVIDENCE_FR27,
          } from './dist/packages/face-reading/src/index.js';

          const report = JSON.parse(await readFile('artifacts/face-reading/fr-data06-selftest/report.json', 'utf8'));
          const verified = MEDIAPIPE_REAL_RUNTIME_VERIFICATION_EVIDENCE_FR27;

          if (
            report.schemaVersion !== 'fr-data06-provider-face-candidate-observation-v1' ||
            report.captureCount !== 2 ||
            report.frData05CaptureQualityRawObservationVerified !== true ||
            report.rasterIdentityReconfirmedBeforeProviderRun !== true ||
            report.mediaPipeRuntimeExecuted !== true ||
            report.providerResultShapeObserved !== true ||
            report.providerFaceCandidateCountObserved !== true ||
            report.providerLandmarkPayloadSummaryObserved !== true
          ) {
            throw new Error(`FR-DATA-06 report claims missing: ${JSON.stringify(report)}`);
          }

          const provenance = report.providerProvenance;
          if (
            provenance?.protocol !== 'chrome_devtools_protocol' ||
            provenance?.providerRuntime !== 'mediapipe_tasks_vision_face_landmarker' ||
            provenance?.runtimePackageName !== verified.runtimePackageName ||
            provenance?.runtimePackageVersion !== verified.runtimePackageVersion ||
            provenance?.packageBundleDigest !== verified.installedPackageAssets.packageBundleDigest ||
            provenance?.modelAssetRef !== FR26_MEDIAPIPE_FACE_LANDMARKER_MODEL ||
            provenance?.modelDigest !== verified.model.independentByteDigest ||
            provenance?.modelByteLength !== verified.model.byteLength ||
            provenance?.runningMode !== 'IMAGE' ||
            provenance?.numFaces !== 1 ||
            provenance?.outputFaceBlendshapes !== false ||
            provenance?.outputFacialTransformationMatrixes !== false ||
            provenance?.deterministicSummaryReplay !== true ||
            provenance?.rawProviderResponsePersisted !== false ||
            provenance?.rawProviderCoordinatesPersisted !== false
          ) {
            throw new Error(`FR-DATA-06 provider provenance mismatch: ${JSON.stringify(provenance)}`);
          }

          const expectedWasm = [...verified.installedPackageAssets.wasmFiles]
            .sort((left, right) => left.file.localeCompare(right.file));
          const actualWasm = [...provenance.wasmFiles]
            .sort((left, right) => left.file.localeCompare(right.file));
          if (JSON.stringify(actualWasm) !== JSON.stringify(expectedWasm)) {
            throw new Error(`FR-DATA-06 WASM digest mismatch: ${JSON.stringify(actualWasm)}`);
          }

          for (const observation of report.captureObservations) {
            if (
              observation.faceCandidateCount < 0 ||
              observation.faceCandidateCount > 1 ||
              observation.candidateSummaries.length !== observation.faceCandidateCount ||
              observation.faceBlendshapeCount !== 0 ||
              observation.facialTransformationMatrixCount !== 0
            ) {
              throw new Error(`FR-DATA-06 provider summary shape mismatch: ${JSON.stringify(observation)}`);
            }
            for (const [index, candidate] of observation.candidateSummaries.entries()) {
              if (
                candidate.providerCandidateOrdinal !== index ||
                !Number.isSafeInteger(candidate.landmarkCount) ||
                candidate.landmarkCount <= 0 ||
                JSON.stringify(candidate.landmarkFieldSet) !== JSON.stringify(['visibility', 'x', 'y', 'z']) ||
                candidate.allXFiniteNormalized !== true ||
                candidate.allYFiniteNormalized !== true ||
                candidate.allZFinite !== true ||
                candidate.allVisibilityFiniteWhenPresent !== true
              ) {
                throw new Error(`FR-DATA-06 candidate summary mismatch: ${JSON.stringify(candidate)}`);
              }
            }
          }

          const mustRemainFalse = [
            'rawProviderResponsePersisted',
            'rawProviderCoordinatesPersisted',
            'pixelContentIntegrityVerified',
            'providerDetectionConstructValidityValidated',
            'providerFaceCandidateHumanIdentityValidated',
            'singleHumanFaceVerified',
            'facePresenceVerified',
            'fullFaceFramingValidityVerified',
            'neutralExpressionValidityVerified',
            'naturalHeadPositionValidityVerified',
            'sharpnessMetricValidated',
            'exposureMetricValidated',
            'lightingMetricValidated',
            'exposureAdequacyVerified',
            'lightingAdequacyVerified',
            'blurThresholdPassVerified',
            'occlusionValidityVerified',
            'captureQualityMetricConstructValidityValidated',
            'captureQualityThresholdsDefined',
            'captureQualityAuthorityValidated',
            'mentonAnnotationCorrectnessVerified',
            'mediaPipeInferenceCorrectnessVerified',
            'providerConformanceVerified',
            'empiricalScoringPerformed',
            'providerCandidateToMentonMappingValidated',
            'repeatedCaptureRepeatabilityValidated',
            'poseStabilityValidated',
            'calibrationThresholdsDefined',
            'fr35PointToContourRelationValidated',
            'traditionalDigeEquivalenceValidated',
            'fr36VerticalReferencePromoted',
            'productionThreeDivisionsMetricAllowed',
            'productionF1Allowed',
            'productionF6Allowed',
            'researchCandidateAdmitted',
            'productionGeometryAuthorized',
          ];
          for (const key of mustRemainFalse) {
            if (report[key] !== false) {
              throw new Error(`FR-DATA-06 unauthorized claim promotion ${key}: ${JSON.stringify(report)}`);
            }
          }
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-data06-provider-face-candidate-selftest
          path: |
            artifacts/face-reading/fr-data06-selftest
            artifacts/face-reading/fr27-real-runtime-e2e.json
          retention-days: 14
