name: "[WT:character-memory] 세연 배포 전 첫 만남 실대화 Main Bridge"

on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-first-meeting-predeploy-quality-main.trigger'

permissions:
  contents: read

concurrency:
  group: seyeon-first-meeting-predeploy-quality-main
  cancel-in-progress: false

env:
  PREDEPLOY_SOURCE_SHA: 73c177f95518517af3c0abf644fef514d3c772ea

jobs:
  quality:
    name: 세연-배포전-10턴-실대화
    runs-on: ubuntu-24.04
    environment: production
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MYEONGHA_SEYEON_OPENAI_MODEL: ${{ vars.MYEONGHA_SEYEON_OPENAI_MODEL || secrets.MYEONGHA_SEYEON_OPENAI_MODEL }}
      MYEONGHA_SEYEON_OPENAI_TIMEOUT_MS: ${{ vars.MYEONGHA_SEYEON_OPENAI_TIMEOUT_MS }}

    steps:
      - name: Main 호출 커밋 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 보호된 호출 조건 확인
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event_name }}" == 'push' ]]
          [[ "${{ github.ref }}" == 'refs/heads/main' ]]
          trigger_value="$(tr -d '\r' < .github/seyeon-first-meeting-predeploy-quality-main.trigger)"
          [[ "$trigger_value" =~ ^fire-[0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]+$ ]]
          [[ "$PREDEPLOY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "${OPENAI_API_KEY:-}"
          test -n "${MYEONGHA_SEYEON_OPENAI_MODEL:-}"

      - name: 고정된 세연 시험 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PREDEPLOY_SOURCE_SHA }}
          fetch-depth: 1

      - name: 시험 소스 고정 확인
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PREDEPLOY_SOURCE_SHA" ]]
          test -f scripts/run-seyeon-first-meeting-predeploy-quality.mjs

      - name: Node 24 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 세연 대화 엔진 빌드
        run: npm run build

      - name: 실제 AI 연결 확인
        run: node dist/apps/api/src/seyeon-live-provider-readiness-cli-v1.js

      - name: 첫 만남 10턴 실제 대화 실행
        run: node scripts/run-seyeon-first-meeting-predeploy-quality.mjs

      - name: 시험 결과 보관
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seyeon-first-meeting-predeploy-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-first-meeting-predeploy-quality/evidence.json
          if-no-files-found: warn
          retention-days: 7
