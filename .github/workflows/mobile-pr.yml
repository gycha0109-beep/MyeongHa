name: Mobile PR Bundle

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - 'scripts/verify-mobile-release-readiness.mjs'
      - 'scripts/verify-mobile-push-activation-readiness.mjs'
      - 'scripts/verify-mobile-android-physical-smoke-readiness.mjs'
      - '.github/workflows/mobile-android-physical-smoke-build.yml'
      - '.github/mobile-android-physical-smoke-build.trigger'
      - '.github/workflows/mobile-pr.yml'

permissions:
  contents: read

jobs:
  mobile-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify mobile release-readiness contract
        run: npm run verify:mobile-release-readiness-contract
      - name: Verify Mobile Push activation contract
        run: npm run verify:mobile-push-activation-readiness-contract
      - name: Verify Android physical-smoke build contract
        run: npm run verify:mobile-android-physical-smoke-readiness
      - name: Export Android and iOS bundles
        run: npm run export:ci -w @myeongha/mobile
      - name: Verify Android and iOS export artifacts
        run: npm run verify:mobile-export-artifacts
