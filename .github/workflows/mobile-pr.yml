name: Mobile PR Bundle

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - '.github/workflows/mobile-pr.yml'

permissions:
  contents: read

jobs:
  mobile-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify mobile release-readiness contract
        run: npm run verify:mobile-release-readiness-contract
      - name: Export Android and iOS bundles
        run: npm run export:ci -w @myeongha/mobile
