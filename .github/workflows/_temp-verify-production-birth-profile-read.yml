name: One-time Production Birth Profile Read Verification

on:
  push:
    branches:
      - ops/verify-birth-profile-read-20260905
    paths:
      - '.github/workflows/_temp-verify-production-birth-profile-read.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: production
    env:
      MEMBER_BEARER: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_BEARER }}
      EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}
    steps:
      - name: Verify configured production Member credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MEMBER_BEARER:-}"
          [[ "${EXPECTED_SUBJECT_ID:-}" =~ ^[0-9a-fA-F-]{36}$ ]]

      - name: Verify /api/me and /api/me/birth-profile read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = 'https://myeongha.vercel.app';
          const bearer = process.env.MEMBER_BEARER;
          const expected = process.env.EXPECTED_SUBJECT_ID;
          const headers = { Authorization: `Bearer ${bearer}`, Accept: 'application/json' };

          async function request(path) {
            const response = await fetch(`${origin}${path}`, {
              method: 'GET', headers, redirect: 'error', cache: 'no-store',
              signal: AbortSignal.timeout(15000),
            });
            let body;
            try { body = await response.json(); }
            catch { throw new Error(`${path} returned non-JSON HTTP ${response.status}`); }
            return { response, body };
          }

          const me = await request('/api/me');
          if (me.response.status !== 200 || me.body?.ok !== true || me.body?.data?.subjectId !== expected || me.body?.data?.subjectKind !== 'member') {
            throw new Error(`/api/me verification failed: HTTP ${me.response.status}`);
          }

          const birth = await request('/api/me/birth-profile');
          if (birth.response.status !== 200 || birth.body?.ok !== true || !birth.body?.data || !Object.prototype.hasOwnProperty.call(birth.body.data, 'birthProfile')) {
            throw new Error(`/api/me/birth-profile verification failed: HTTP ${birth.response.status}`);
          }
          if (birth.body.data.birthProfile !== null) {
            throw new Error('/api/me/birth-profile expected no current Birth Profile for this subject during recovery verification.');
          }

          console.log('PRODUCTION_BIRTH_PROFILE_READ_PASS me=200 birth-profile=200 birthProfile=null expectedSubjectMatch=true');
          NODE
