name: Face Reading Browser Image Decode Verification

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/browser-image-decode-frdata03.ts'
      - 'packages/face-reading/src/image-byte-dimensions-frdata02.ts'
      - 'packages/face-reading/src/menton-dataset-intake-frdata01.ts'
      - 'packages/face-reading/src/index.ts'
      - 'scripts/face-reading-fr-data01-menton-dataset-intake.mjs'
      - 'scripts/face-reading-fr-data02-image-dimensions.mjs'
      - 'scripts/face-reading-fr-data03-browser-image-decode.mjs'
      - 'test/face-reading-fr-data03-browser-image-decode.test.ts'
      - 'docs/FACE_READING_FR_DATA03_BROWSER_IMAGE_DECODE_VERIFICATION.md'
      - '.github/workflows/face-reading-browser-image-decode-verification.yml'
  workflow_dispatch:

jobs:
  fr-data03-browser-decode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Create deterministic fully decodable PNG fixtures and truncated negative control
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { deflateSync } from 'node:zlib';
          import { mkdir, writeFile } from 'node:fs/promises';

          function crc32(bytes) {
            let crc = 0xffffffff;
            for (const byte of bytes) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
            }
            return (crc ^ 0xffffffff) >>> 0;
          }
          function chunk(type, data) {
            const typeBytes = Buffer.from(type, 'ascii');
            const out = Buffer.alloc(12 + data.length);
            out.writeUInt32BE(data.length, 0);
            typeBytes.copy(out, 4);
            data.copy(out, 8);
            out.writeUInt32BE(crc32(Buffer.concat([typeBytes, data])), 8 + data.length);
            return out;
          }
          function png(width, height, seed) {
            const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(width, 0);
            ihdr.writeUInt32BE(height, 4);
            ihdr[8] = 8;
            ihdr[9] = 6;
            const rows = [];
            for (let y = 0; y < height; y += 1) {
              const row = Buffer.alloc(1 + width * 4);
              row[0] = 0;
              for (let x = 0; x < width; x += 1) {
                const p = 1 + x * 4;
                row[p] = (seed + x * 17) & 0xff;
                row[p + 1] = (seed + y * 29) & 0xff;
                row[p + 2] = (seed + x + y) & 0xff;
                row[p + 3] = 255;
              }
              rows.push(row);
            }
            return Buffer.concat([signature, chunk('IHDR', ihdr), chunk('IDAT', deflateSync(Buffer.concat(rows))), chunk('IEND', Buffer.alloc(0))]);
          }
          const digest = (bytes) => `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          const root = 'artifacts/face-reading/fr-data03-selftest';
          const assetRoot = `${root}/assets/subject-calibration`;
          await mkdir(assetRoot, { recursive: true });
          const first = png(2, 2, 11);
          const second = png(3, 2, 97);
          await writeFile(`${assetRoot}/baseline.png`, first);
          await writeFile(`${assetRoot}/repeat.png`, second);

          const captures = [
            ['capture-baseline', 'neutral_frontal_baseline', 'baseline.png', first, 2, 2, 'physical-baseline'],
            ['capture-repeat', 'repeat_neutral_capture', 'repeat.png', second, 3, 2, 'physical-repeat'],
          ];
          const manifest = {
            schemaVersion: 'fr-data01-intake-v1',
            dataset: {
              schemaVersion: 'fr47-dataset-v1', datasetRef: 'dataset.fr-data03.workflow-selftest',
              subjects: [{ subjectRef: 'subject-calibration', independentSubject: true, partition: 'calibration' }],
              captures: captures.map(([captureRef, stratum, , bytes, width, height, physicalCaptureInstanceRef], index) => ({
                captureRef, subjectRef: 'subject-calibration', stratum,
                canonicalAssetDigest: digest(bytes), capturedAt: `2026-08-30T00:0${index}:00Z`, imageWidth: width, imageHeight: height,
                deviceRef: 'workflow-selftest-device', physicalCaptureInstanceRef,
                neutralExpressionApplied: true, headPositionInstructionApplied: true, poseAxis: null, poseDegrees: null,
                groundTruthLockedBeforeProviderRun: true, providerRunRef: null, providerRunExecutedAfterGroundTruthLock: false
              })),
              annotations: captures.map(([captureRef], index) => ({
                captureRef, annotatorRef: `workflow-selftest-annotator-${index}`, targetName: 'soft_tissue_menton',
                x: 0.5, y: 0.75, providerOutputVisibleDuringAnnotation: false, annotationFrozenBeforeProviderScoring: true
              })),
              groundTruthFrozen: false, providerRunsExecutedAfterFreeze: false
            },
            assets: captures.map(([captureRef, , file]) => ({ captureRef, relativeAssetPath: `subject-calibration/${file}` }))
          };
          await writeFile(`${root}/manifest.json`, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');

          const negativeRoot = 'artifacts/face-reading/fr-data03-negative';
          const negativeAssetRoot = `${negativeRoot}/assets/subject-negative`;
          await mkdir(negativeAssetRoot, { recursive: true });
          const fullNegative = png(2, 2, 151);
          const truncated = fullNegative.subarray(0, 24);
          await writeFile(`${negativeAssetRoot}/header-only.png`, truncated);
          const negativeManifest = {
            schemaVersion: 'fr-data01-intake-v1',
            dataset: {
              schemaVersion: 'fr47-dataset-v1', datasetRef: 'dataset.fr-data03.negative-header-only',
              subjects: [{ subjectRef: 'subject-negative', independentSubject: true, partition: 'calibration' }],
              captures: [{
                captureRef: 'capture-header-only', subjectRef: 'subject-negative', stratum: 'neutral_frontal_baseline',
                canonicalAssetDigest: digest(truncated), capturedAt: '2026-08-30T00:10:00Z', imageWidth: 2, imageHeight: 2,
                deviceRef: 'workflow-selftest-device', physicalCaptureInstanceRef: 'physical-header-only',
                neutralExpressionApplied: true, headPositionInstructionApplied: true, poseAxis: null, poseDegrees: null,
                groundTruthLockedBeforeProviderRun: true, providerRunRef: null, providerRunExecutedAfterGroundTruthLock: false
              }],
              annotations: [{
                captureRef: 'capture-header-only', annotatorRef: 'workflow-negative-annotator', targetName: 'soft_tissue_menton',
                x: 0.5, y: 0.75, providerOutputVisibleDuringAnnotation: false, annotationFrozenBeforeProviderScoring: true
              }],
              groundTruthFrozen: false, providerRunsExecutedAfterFreeze: false
            },
            assets: [{ captureRef: 'capture-header-only', relativeAssetPath: 'subject-negative/header-only.png' }]
          };
          await writeFile(`${negativeRoot}/manifest.json`, `${JSON.stringify(negativeManifest, null, 2)}\n`, 'utf8');
          NODE
      - name: Execute FR-DATA-03 real Chrome decode verification
        run: >-
          node scripts/face-reading-fr-data03-browser-image-decode.mjs
          artifacts/face-reading/fr-data03-selftest/manifest.json
          artifacts/face-reading/fr-data03-selftest/assets
          artifacts/face-reading/fr-data03-selftest/report.json
      - name: Verify exact FR-DATA-03 claim boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('artifacts/face-reading/fr-data03-selftest/report.json', 'utf8'));
          if (report.imageDecodabilityVerified !== true || report.browserNativeDecodeVerified !== true ||
              report.imageDimensionsVerifiedAgainstBytes !== true || report.captureCount !== 2 ||
              report.captureVerifications.some((entry) => entry.decodedDimensionsMatchEncodedDimensions !== true || entry.loadEventObserved !== true || entry.decodePromiseResolved !== true) ||
              report.browserDecoderProvenance?.protocol !== 'chrome_devtools_protocol' ||
              report.browserDecoderProvenance?.decodePrimitive !== 'html_image_element_load_plus_decode' ||
              report.browserDecoderProvenance?.deterministicReplay !== true ||
              typeof report.browserDecoderProvenance?.browserVersion !== 'string' || report.browserDecoderProvenance.browserVersion.length === 0) {
            throw new Error(`FR-DATA-03 browser decode verification failed: ${JSON.stringify(report)}`);
          }
          const mustRemainFalse = [
            'pixelContentIntegrityVerified','facePresenceVerified','fullFaceFramingValidityVerified','neutralExpressionValidityVerified',
            'naturalHeadPositionValidityVerified','lightingAdequacyVerified','blurThresholdPassVerified','occlusionValidityVerified',
            'captureQualityAuthorityValidated','mentonAnnotationCorrectnessVerified','mediaPipeInferenceCorrectnessVerified',
            'empiricalScoringPerformed','providerCandidateToMentonMappingValidated','repeatedCaptureRepeatabilityValidated',
            'poseStabilityValidated','calibrationThresholdsDefined','fr35PointToContourRelationValidated','traditionalDigeEquivalenceValidated',
            'fr36VerticalReferencePromoted','productionThreeDivisionsMetricAllowed','productionF1Allowed','productionF6Allowed',
            'researchCandidateAdmitted','productionGeometryAuthorized'
          ];
          for (const key of mustRemainFalse) if (report[key] !== false) throw new Error(`FR-DATA-03 unauthorized claim promotion ${key}: ${JSON.stringify(report)}`);
          NODE
      - name: Prove FR-DATA-02 accepts header dimensions that FR-DATA-03 Chrome rejects
        run: |
          node scripts/face-reading-fr-data02-image-dimensions.mjs \
            artifacts/face-reading/fr-data03-negative/manifest.json \
            artifacts/face-reading/fr-data03-negative/assets \
            artifacts/face-reading/fr-data03-negative/fr-data02-report.json
          if node scripts/face-reading-fr-data03-browser-image-decode.mjs \
            artifacts/face-reading/fr-data03-negative/manifest.json \
            artifacts/face-reading/fr-data03-negative/assets \
            artifacts/face-reading/fr-data03-negative/fr-data03-report.json; then
            echo 'FR-DATA-03 negative control unexpectedly decoded a header-only PNG.' >&2
            exit 1
          fi
          test ! -f artifacts/face-reading/fr-data03-negative/fr-data03-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-data03-browser-image-decode-selftest
          path: |
            artifacts/face-reading/fr-data03-selftest
            artifacts/face-reading/fr-data03-negative
          retention-days: 14
