name: Face Reading Central Chin External Provenance Verification

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr59-central-chin-external-provenance-verification.test.ts'
      - 'docs/FACE_READING_FR59_CENTRAL_CHIN_EXTERNAL_PROVENANCE_VERIFICATION_V0.1.md'
      - 'docs/FACE_READING_FR59_CENTRAL_CHIN_EXTERNAL_PROVENANCE_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-external-provenance-verification.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr59-central-chin-external-provenance-verification.test.ts'
      - 'docs/FACE_READING_FR59_CENTRAL_CHIN_EXTERNAL_PROVENANCE_VERIFICATION_V0.1.md'
      - 'docs/FACE_READING_FR59_CENTRAL_CHIN_EXTERNAL_PROVENANCE_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-external-provenance-verification.yml'

permissions:
  contents: read

jobs:
  fr59-central-chin-external-provenance-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Run FR-59 external provenance verification tests
        run: npx vitest run test/face-reading-fr59-central-chin-external-provenance-verification.test.ts
      - name: Verify compiled FR-59 trust boundary and production fail-closed gate
        run: |
          node --input-type=module <<'NODE'
          import {
            CENTRAL_CHIN_EXTERNAL_PROVENANCE_VERIFICATION_AUTHORITY_FR59,
            assertCentralChinExternalProvenanceReadyForProductionFR59,
            validateCentralChinExternalProvenanceVerificationAuthorityFR59,
          } from './dist/packages/face-reading/src/index.js';

          const authority = validateCentralChinExternalProvenanceVerificationAuthorityFR59();
          if (authority !== CENTRAL_CHIN_EXTERNAL_PROVENANCE_VERIFICATION_AUTHORITY_FR59) process.exit(1);
          if (!authority.protocol.exactFrozenFR58ProvenanceVerificationRequired) process.exit(1);
          if (!authority.protocol.exactPairAcquisitionEvidenceArtifactCoverageRequired) process.exit(1);
          if (!authority.protocol.pairAcquisitionEvidenceByteDigestVerificationRequired) process.exit(1);
          if (!authority.protocol.recordedArtifactByteDigestVerificationRequired) process.exit(1);
          if (!authority.protocol.detachedSignatureArtifactByteDigestVerificationRequired) process.exit(1);
          if (authority.protocol.researchSignatureVerificationPrimitive !== 'ed25519_node_crypto_v1') process.exit(1);
          if (authority.protocol.productionSignatureAlgorithm !== null) process.exit(1);
          if (!authority.protocol.signaturePayloadExcludesDetachedSignatureArtifactDigest) process.exit(1);
          if (!authority.protocol.signaturePayloadExcludesFR58ProvenanceDigest) process.exit(1);
          if (authority.protocol.signaturePayloadIncludesFR55Outcome) process.exit(1);
          for (const value of [
            authority.protocol.partitionAllocationRule,
            authority.protocol.calibrationFraction,
            authority.protocol.minimumPairs,
            authority.protocol.minimumSubjects,
            authority.protocol.membershipThreshold,
            authority.protocol.anchorAgreementTolerance,
            authority.protocol.endpointSelectionRule,
            authority.protocol.empiricalAcceptanceCriterion,
          ]) {
            if (value !== null) process.exit(1);
          }
          if (!Object.values(authority.authorityBoundary).every((value) => value === false)) process.exit(1);

          let productionBlocked = false;
          try {
            assertCentralChinExternalProvenanceReadyForProductionFR59();
          } catch {
            productionBlocked = true;
          }
          if (!productionBlocked) process.exit(1);
          NODE
