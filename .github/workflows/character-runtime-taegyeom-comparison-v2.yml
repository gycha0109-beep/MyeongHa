name: "[WT:character-runtime-lab] 태겸 GLM 3조건 12문항 비교"

on:
  push:
    branches:
      - main
    paths:
      - ".github/character-runtime-taegyeom-comparison-v2.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-runtime-lab-taegyeom-comparison-v2
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout isolated experiment inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build approved character definition
        run: npm run build

      - name: Run 3-condition synthetic dialogue comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAEGYEOM_EVAL_OUTPUT: ${{ runner.temp }}/taegyeom-runtime-comparison-v2/report.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          node scripts/run-taegyeom-runtime-comparison-v2.mjs

      - name: Archive owner-reviewable comparison results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taegyeom-runtime-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taegyeom-runtime-comparison-v2/report.json
          if-no-files-found: warn
          retention-days: 14
