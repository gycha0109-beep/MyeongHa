name: Face Reading Central Chin Paired Dataset Ledger

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr57-central-chin-paired-dataset-ledger.test.ts'
      - 'docs/FACE_READING_FR57_CENTRAL_CHIN_PAIRED_DATASET_LEDGER_V0.1.md'
      - 'docs/FACE_READING_FR57_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-paired-dataset-ledger.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr57-central-chin-paired-dataset-ledger.test.ts'
      - 'docs/FACE_READING_FR57_CENTRAL_CHIN_PAIRED_DATASET_LEDGER_V0.1.md'
      - 'docs/FACE_READING_FR57_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-central-chin-paired-dataset-ledger.yml'

permissions:
  contents: read

jobs:
  fr57-central-chin-paired-dataset-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Run FR-57 paired dataset ledger tests
        run: npx vitest run test/face-reading-fr57-central-chin-paired-dataset-ledger.test.ts
      - name: Verify compiled FR-57 leakage guards and fail-closed boundary
        run: |
          node --input-type=module <<'NODE'
          import {
            CENTRAL_CHIN_PAIRED_DATASET_AUTHORITY_FR57,
            assertCentralChinPairedDatasetReadyForProductionFR57,
            computeCentralChinPairedDatasetDigestFR57,
            freezeCentralChinPairedDatasetLedgerFR57,
            validateCentralChinPairedDatasetAuthorityFR57,
            verifyFrozenCentralChinPairedDatasetLedgerFR57,
          } from './dist/packages/face-reading/src/index.js';

          const authority = validateCentralChinPairedDatasetAuthorityFR57();
          if (authority !== CENTRAL_CHIN_PAIRED_DATASET_AUTHORITY_FR57) process.exit(1);
          if (!authority.protocol.subjectLevelPartitionIsolationRequired) process.exit(1);
          if (!authority.protocol.canonicalAssetPartitionIsolationRequired) process.exit(1);
          if (!authority.protocol.canonicalAssetMayRepeatWithinSamePartition) process.exit(1);
          if (!authority.protocol.partitionAssignmentFrozenBeforeFR55OutcomeInspectionAttestationRequired) process.exit(1);
          if (!authority.protocol.datasetFrozenAfterAllPairRecordsAttestationRequired) process.exit(1);
          if (authority.protocol.fr55OutcomeVisibleDuringPartitionAssignmentRequired) process.exit(1);
          if (authority.protocol.datasetDigestIncludesFR55Outcome) process.exit(1);
          for (const value of [
            authority.protocol.partitionAllocationRule,
            authority.protocol.calibrationFraction,
            authority.protocol.minimumPairs,
            authority.protocol.minimumSubjects,
            authority.protocol.membershipThreshold,
            authority.protocol.anchorAgreementTolerance,
            authority.protocol.endpointSelectionRule,
            authority.protocol.empiricalAcceptanceCriterion,
          ]) {
            if (value !== null) process.exit(1);
          }
          if (!Object.values(authority.authorityBoundary).every((value) => value === false)) process.exit(1);

          const manifest = {
            schemaVersion: 'fr57-central-chin-paired-dataset-manifest-v1',
            datasetRef: 'workflow-fr57-empty-contract-fixture',
            entries: [],
            datasetFrozenAt: '2026-08-31T02:00:00.000Z',
            partitionAssignmentFrozenBeforeFR55OutcomeInspectionAttested: true,
            fr55OutcomeVisibleDuringPartitionAssignment: false,
            datasetFrozenAfterAllPairRecordsAttested: true,
          };
          const digest = computeCentralChinPairedDatasetDigestFR57(manifest);
          if (!/^sha256:[0-9a-f]{64}$/u.test(digest)) process.exit(1);
          const ledger = freezeCentralChinPairedDatasetLedgerFR57(manifest);
          verifyFrozenCentralChinPairedDatasetLedgerFR57(ledger);
          if (ledger.pairCount !== 0 || ledger.subjectCount !== 0 || ledger.canonicalAssetCount !== 0) process.exit(1);
          if (ledger.datasetDigestIncludesFR55Outcome) process.exit(1);
          if (ledger.realDatasetEstablished || ledger.empiricalValidationAuthorized || ledger.productionGeometryAuthorized) process.exit(1);

          let productionBlocked = false;
          try {
            assertCentralChinPairedDatasetReadyForProductionFR57();
          } catch {
            productionBlocked = true;
          }
          if (!productionBlocked) process.exit(1);
          NODE
