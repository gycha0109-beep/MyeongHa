name: "[WT:ops] Production Password Compromise Guard Evidence"
run-name: "[WT:ops] Production Password Compromise Guard Evidence"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type VERIFY_PASSWORD_COMPROMISE_GUARD to run the Production compromised-password rejection canary.'
        required: true
        type: string
      watchtower_track:
        description: 'Watchtower Track Key for CI attribution.'
        required: true
        default: ops
        type: string

permissions:
  contents: read

concurrency:
  group: production-password-compromise-guard-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: verify-production-password-compromise-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      MYEONGHA_PASSWORD_COMPROMISE_CANARY_CONFIRM: ${{ inputs.confirmation }}
      MYEONGHA_WATCHTOWER_TRACK: ${{ inputs.watchtower_track }}

    steps:
      - name: Require exact canary authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MYEONGHA_PASSWORD_COMPROMISE_CANARY_CONFIRM" == 'VERIFY_PASSWORD_COMPROMISE_GUARD' ]]
          [[ "$MYEONGHA_WATCHTOWER_TRACK" == 'ops' ]]
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]

      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify live Production compromised-password rejection
        run: node scripts/operations/verify-production-password-compromise-guard-live.mjs
