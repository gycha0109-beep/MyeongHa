name: One-shot Commerce Catalog Sentinel Sync

on:
  push:
    branches:
      - feat/guest-purchase-intent-v2-main
    paths:
      - '.github/workflows/sync-commerce-catalog-sentinels.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guest-purchase-intent-v2-main
          fetch-depth: 0

      - name: Sync stale public BASE TABLE sentinels only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('test/db')
          changed = []
          replacement_count = 0
          marker_re = re.compile(r'BASE TABLE|table_count|public table catalog', re.IGNORECASE)
          value_re = re.compile(r'(?<!\d)59(?!\d)')

          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              out = []
              local_count = 0
              for line in original.splitlines(keepends=True):
                  updated = line
                  if marker_re.search(line):
                      updated, n = value_re.subn('60', line)
                      local_count += n
                  out.append(updated)

              revised = ''.join(out)
              if revised != original:
                  path.write_text(revised, encoding='utf-8')
                  changed.append(str(path))
                  replacement_count += local_count

          residual = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(lines, 1):
                  if marker_re.search(line) and value_re.search(line):
                      residual.append(f'{path}:{lineno}:{line}')

          print(f'replacements={replacement_count}')
          print('changed_files=')
          for path in changed:
              print(path)

          if residual:
              print('Residual stale catalog sentinel lines remain:', file=sys.stderr)
              print('\n'.join(residual), file=sys.stderr)
              raise SystemExit(2)
          PY

          git diff --check
          git diff -- test/db

          if git diff --quiet -- test/db; then
            echo 'No stale catalog sentinels remain.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/db
          git commit -m 'test(db): sync remaining catalog sentinels to 60'
          git push origin HEAD:feat/guest-purchase-intent-v2-main
