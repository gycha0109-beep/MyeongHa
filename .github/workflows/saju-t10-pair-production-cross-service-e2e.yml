name: Saju T10 Pair Production Cross-Service E2E

on:
  pull_request:
    paths:
      - 'apps/api/src/*approved-saju*'
      - 'apps/api/src/saju-t10-*'
      - 'apps/api/src/official-reading-record-*'
      - 'apps/api/src/reading-history-*'
      - 'apps/api/src/postgres-subject-execution.ts'
      - 'apps/web/src/commerce/ApprovedSajuCheckoutPanel.tsx'
      - 'packages/contracts/src/approved-saju-catalog.ts'
      - 'docs/operations/candidates/commerce_approved_saju_*.sql'
      - 'scripts/local/*saju14*'
      - 'test/db/approved_saju_purchase_fixtures.sql'
      - 'test/saju-t10-pair-production-cross-service.e2e.test.ts'
      - '.github/workflows/saju-t10-pair-production-cross-service-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/src/*approved-saju*'
      - 'apps/api/src/saju-t10-*'
      - 'apps/api/src/official-reading-record-*'
      - 'apps/api/src/reading-history-*'
      - 'apps/api/src/postgres-subject-execution.ts'
      - 'apps/web/src/commerce/ApprovedSajuCheckoutPanel.tsx'
      - 'packages/contracts/src/approved-saju-catalog.ts'
      - 'docs/operations/candidates/commerce_approved_saju_*.sql'
      - 'scripts/local/*saju14*'
      - 'test/db/approved_saju_purchase_fixtures.sql'
      - 'test/saju-t10-pair-production-cross-service.e2e.test.ts'
      - '.github/workflows/saju-t10-pair-production-cross-service-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-pair:
    name: Pinned Saju process → PostgreSQL 17 → MyeongHa Reader
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout MyeongHa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned approved T10 Saju authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gycha0109-beep/Saju
          ref: b5a40ffb24785764ba5b65df0cf0aba059b671bf
          path: .cross-service/saju

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install MyeongHa pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build pinned Saju issuer
        working-directory: .cross-service/saju
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
          npm run build

      - name: Verify three signed purchases through isolated PostgreSQL and Reader
        run: node scripts/local/run-approved-saju14-local-stack.mjs --check-t10
