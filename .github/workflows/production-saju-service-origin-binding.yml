name: Production Saju Service Origin Binding

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BIND_SAJU_ORIGIN to bind the authoritative Saju production origin and redeploy production.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-saju-service-origin-binding
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha
  CANONICAL_PRODUCTION_HOST: myeongha.vercel.app
  SAJU_SERVICE_ORIGIN_ENV_KEY: MYEONGHA_SAJU_SERVICE_ORIGIN
  SAJU_SERVICE_ORIGIN: https://saju-production-anh2svf5aa-as.a.run.app

jobs:
  bind-redeploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bind Saju origin and redeploy exact main production revision
        run: bash scripts/operations/run-production-saju-service-origin-binding.sh
