name: Fix Restore Fixture
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-entitlement-restore-v1
      - name: Remove impossible recursive merge fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/db/entitlement_restore_v1.sql')
          s = p.read_text()
          replacements = {
              "  ('96400000-0000-0000-0000-000000000003', 'guest', null, 'merged', '96400000-0000-0000-0000-000000000002', transaction_timestamp(), transaction_timestamp()),\n": "",
              "  ('96410000-0000-0000-0000-000000000005', '96400000-0000-0000-0000-000000000002', 'premium.direct-only', null, 'system:direct-only', 'system', 'active', transaction_timestamp() - interval '1 day', transaction_timestamp() + interval '60 days', 0, transaction_timestamp(), transaction_timestamp()),\n  ('96410000-0000-0000-0000-000000000006', '96400000-0000-0000-0000-000000000003', 'premium.recursive-only', null, 'system:recursive-only', 'system', 'active', transaction_timestamp() - interval '1 day', null, 0, transaction_timestamp(), transaction_timestamp());\n": "  ('96410000-0000-0000-0000-000000000005', '96400000-0000-0000-0000-000000000002', 'premium.direct-only', null, 'system:direct-only', 'system', 'active', transaction_timestamp() - interval '1 day', transaction_timestamp() + interval '60 days', 0, transaction_timestamp(), transaction_timestamp());\n",
              "  v_recursive_count integer;\n": "",
              "  select count(*)::integer into v_recursive_count\n  from public.entitlements e\n  where e.subject_id = '96400000-0000-0000-0000-000000000003';\n\n  if v_recursive_count <> 0 then\n    raise exception 'FAIL recursive merged Guest was recomputed: count=%', v_recursive_count;\n  end if;\n\n": "",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one fixture fragment, found {s.count(old)} for {old[:60]!r}')
              s = s.replace(old, new)
          s = s.replace(
              '-- streams plus two direct-Guest streams. The recursive Guest stream is out of scope.',
              '-- streams plus two direct-Guest streams. Recursive merge ancestry is schema-invalid and is not inferred.'
          )
          s = s.replace(
              "raise notice 'PASS restore preserves direct Guest ownership, excludes recursion/expiry, and yields effective union';",
              "raise notice 'PASS restore preserves direct Guest ownership, excludes expiry, and yields effective union';"
          )
          p.write_text(s)
          PY
          rm .github/workflows/fix-restore-fixture.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/db/entitlement_restore_v1.sql .github/workflows/fix-restore-fixture.yml
          git commit -m 'test(commerce): use valid restore lineage fixture'
          git push origin HEAD:feat/commerce-entitlement-restore-v1
