name: DB Content Reading Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'scripts/ci/db-suites.json'
      - 'scripts/ci/db-pr-router.mjs'
      - 'scripts/ci/run-db-track.mjs'
      - '.github/workflows/ci-db-track.yml'
      - 'test/db/active_default_content_release_query.sh'
      - 'test/db/character_saju_runtime_components_query.sh'
      - 'test/db/chat_thread_runtime_binding_query.sh'
      - 'test/db/episode_progress_bundle_query.sh'
      - 'test/db/outbox_success_completion_concurrency.sh'
      - 'test/db/reading_history_authority_query.sql'
      - 'test/db/standard_reading_artifact_reread.sql'
      - 'test/db/standard_reading_artifact_reread.sh'
      - 'test/db/official_standard_reading_reader_interpretation.sql'
      - 'test/db/official_standard_reading_reader_interpretation.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-content-reading-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-suite:
    name: DB suite · content
    uses: ./.github/workflows/ci-db-track.yml
    with:
      suite: content
      postgres: "15"
