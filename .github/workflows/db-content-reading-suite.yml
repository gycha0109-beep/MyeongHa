name: DB Content Reading Suite

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/active_default_content_release_query.sh'
      - 'test/db/character_saju_runtime_components_query.sh'
      - 'test/db/chat_thread_runtime_binding_query.sh'
      - 'test/db/episode_progress_bundle_query.sh'
      - 'test/db/outbox_success_completion_concurrency.sh'
      - 'test/db/reading_history_authority_query.sql'
      - 'test/db/standard_reading_artifact_reread.sql'
      - 'test/db/standard_reading_artifact_reread.sh'
      - 'test/db/official_standard_reading_reader_interpretation.sql'
      - 'test/db/official_standard_reading_reader_interpretation.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-content-reading-suite.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/active_default_content_release_query.sh'
      - 'test/db/character_saju_runtime_components_query.sh'
      - 'test/db/chat_thread_runtime_binding_query.sh'
      - 'test/db/episode_progress_bundle_query.sh'
      - 'test/db/outbox_success_completion_concurrency.sh'
      - 'test/db/reading_history_authority_query.sql'
      - 'test/db/standard_reading_artifact_reread.sql'
      - 'test/db/standard_reading_artifact_reread.sh'
      - 'test/db/official_standard_reading_reader_interpretation.sql'
      - 'test/db/official_standard_reading_reader_interpretation.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-content-reading-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-case:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - active-default-content-release
          - character-saju-runtime-components
          - chat-thread-runtime-binding
          - episode-progress-bundle
          - outbox-success-completion
          - reading-history
          - standard-reading-artifact-reread
          - official-standard-reading-reader-interpretation
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Run DB regression case
        run: bash test/db/run_ci_case.sh "${{ matrix.case }}"
