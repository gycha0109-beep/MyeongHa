name: Production Platform Integrity Read Audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type READ_ONLY_CATALOG to snapshot production PostgreSQL metadata without mutations.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-platform-integrity-read-audit
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  audit:
    name: read-only-production-catalog
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verify explicit read-only dispatch and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRM" == 'READ_ONLY_CATALOG' ]]
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          [[ "$SUPABASE_PROJECT_ID" == 'cnsfpcdiyofqvhpcegfc' ]]

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve governed production session-pooler endpoint
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          pooler_file="$RUNNER_TEMP/myeongha-pi-pooler.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$pooler_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler" \
            -o "$pooler_file"

          pooler_record="$({
            jq -ce '
              (if type == "array" then . elif (.data? | type) == "array" then .data else [.] end)
              | map(
                  select((.database_type // "") == "PRIMARY")
                  | . + {
                      resolved_connection_string:
                        (.connection_string // .connectionString // "")
                    }
                )
              | map(
                  select(
                    (.resolved_connection_string | type) == "string"
                    and (.resolved_connection_string | length) > 0
                    and (.resolved_connection_string
                      | test("\\.pooler\\.supabase\\.com:(5432|6543)/postgres(?:\\?|$)"))
                  )
                )
              | sort_by(
                  if (.resolved_connection_string | test(":5432/postgres(?:\\?|$)"))
                  then 0
                  else 1
                  end
                )
              | first // empty
            ' "$pooler_file"
          })"
          test -n "$pooler_record"

          connection_string="$(jq -r '.resolved_connection_string // empty' <<<"$pooler_record")"
          test -n "$connection_string"

          admin_pool_user="$(sed -E 's#^[a-zA-Z0-9+.-]+://([^:]+):.*#\1#' <<<"$connection_string")"
          pool_host="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\1#' <<<"$connection_string")"
          pool_port="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\2#' <<<"$connection_string")"
          pool_db="$(sed -E 's#^[^@]+@[^/]+/([^?]+).*$#\1#' <<<"$connection_string")"

          [[ "$admin_pool_user" == "postgres.$SUPABASE_PROJECT_ID" ]]
          [[ "$pool_host" == *.pooler.supabase.com ]]
          [[ "$pool_port" == '5432' || "$pool_port" == '6543' ]]
          [[ "$pool_db" == 'postgres' ]]

          echo "pool_host=$pool_host" >> "$GITHUB_OUTPUT"
          echo "pool_port=$pool_port" >> "$GITHUB_OUTPUT"
          echo "pool_db=$pool_db" >> "$GITHUB_OUTPUT"
          echo "admin_pool_user=$admin_pool_user" >> "$GITHUB_OUTPUT"

      - name: Snapshot production catalog in enforced read-only mode
        id: snapshot
        shell: bash
        env:
          POOL_HOST: ${{ steps.endpoint.outputs.pool_host }}
          POOL_PORT: ${{ steps.endpoint.outputs.pool_port }}
          POOL_DB: ${{ steps.endpoint.outputs.pool_db }}
          ADMIN_POOL_USER: ${{ steps.endpoint.outputs.admin_pool_user }}
        run: |
          set -euo pipefail
          umask 077

          snapshot_dir="$RUNNER_TEMP/myeongha-platform-integrity-catalog"
          mkdir -p "$snapshot_dir"

          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require
          export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=30000 -c lock_timeout=5000 -c application_name=myeongha_pi_catalog_audit'

          psql_base=(
            psql -X -v ON_ERROR_STOP=1
            -h "$POOL_HOST"
            -p "$POOL_PORT"
            -U "$ADMIN_POOL_USER"
            -d "$POOL_DB"
          )

          default_read_only="$(${psql_base[@]} -A -t -c "select current_setting('default_transaction_read_only');")"
          [[ "$default_read_only" == 'on' ]]

          transaction_read_only="$(${psql_base[@]} -A -t <<'SQL'
          begin read only;
          select current_setting('transaction_read_only');
          rollback;
          SQL
          )"
          [[ "$transaction_read_only" == *'on'* ]]

          csv_query() {
            local output_file="$1"
            local query="$2"
            "${psql_base[@]}" --csv -c "$query" > "$snapshot_dir/$output_file"
          }

          csv_query migration_history.csv "
            select version, name
            from supabase_migrations.schema_migrations
            order by version;
          "

          csv_query public_objects.csv "
            select
              n.nspname as schema_name,
              c.relname as object_name,
              c.relkind,
              c.relrowsecurity,
              c.relforcerowsecurity,
              pg_catalog.pg_get_userbyid(c.relowner) as owner_name,
              coalesce(
                c.relacl,
                pg_catalog.acldefault(
                  case when c.relkind = 'S' then 'S'::\"char\" else 'r'::\"char\" end,
                  c.relowner
                )
              )::text as effective_acl
            from pg_catalog.pg_class c
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relkind in ('r','p','v','m','S')
            order by c.relkind, c.relname;
          "

          csv_query columns.csv "
            select
              n.nspname as schema_name,
              c.relname as table_name,
              a.attnum as ordinal_position,
              a.attname as column_name,
              pg_catalog.format_type(a.atttypid, a.atttypmod) as data_type,
              a.attnotnull as not_null,
              coalesce(pg_catalog.pg_get_expr(ad.adbin, ad.adrelid), '') as default_expression
            from pg_catalog.pg_attribute a
            join pg_catalog.pg_class c on c.oid = a.attrelid
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            left join pg_catalog.pg_attrdef ad
              on ad.adrelid = a.attrelid
             and ad.adnum = a.attnum
            where n.nspname = 'public'
              and c.relkind in ('r','p','v','m')
              and a.attnum > 0
              and not a.attisdropped
            order by c.relname, a.attnum;
          "

          csv_query constraints.csv "
            select
              n.nspname as schema_name,
              c.relname as table_name,
              con.conname as constraint_name,
              con.contype as constraint_type,
              con.condeferrable as deferrable,
              con.condeferred as initially_deferred,
              con.convalidated as validated,
              pg_catalog.pg_get_constraintdef(con.oid, true) as definition
            from pg_catalog.pg_constraint con
            join pg_catalog.pg_class c on c.oid = con.conrelid
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
            order by c.relname, con.conname;
          "

          csv_query indexes.csv "
            select
              n.nspname as schema_name,
              c.relname as table_name,
              ic.relname as index_name,
              i.indisunique as is_unique,
              i.indisprimary as is_primary,
              i.indisvalid as is_valid,
              i.indisready as is_ready,
              pg_catalog.pg_get_indexdef(i.indexrelid) as definition
            from pg_catalog.pg_index i
            join pg_catalog.pg_class c on c.oid = i.indrelid
            join pg_catalog.pg_class ic on ic.oid = i.indexrelid
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
            order by c.relname, ic.relname;
          "

          csv_query triggers.csv "
            select
              n.nspname as schema_name,
              c.relname as table_name,
              t.tgname as trigger_name,
              t.tgenabled as enabled_state,
              pg_catalog.pg_get_triggerdef(t.oid, true) as definition
            from pg_catalog.pg_trigger t
            join pg_catalog.pg_class c on c.oid = t.tgrelid
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and not t.tgisinternal
            order by c.relname, t.tgname;
          "

          csv_query policies.csv "
            select
              schemaname as schema_name,
              tablename as table_name,
              policyname as policy_name,
              permissive,
              roles::text as roles,
              cmd,
              coalesce(qual, '') as using_expression,
              coalesce(with_check, '') as with_check_expression
            from pg_catalog.pg_policies
            where schemaname = 'public'
            order by tablename, policyname;
          "

          csv_query functions.csv "
            select
              n.nspname as schema_name,
              p.proname as function_name,
              pg_catalog.pg_get_function_identity_arguments(p.oid) as identity_arguments,
              pg_catalog.pg_get_function_result(p.oid) as result_type,
              p.prokind,
              p.prosecdef as security_definer,
              p.proleakproof as leakproof,
              p.provolatile,
              p.proparallel,
              pg_catalog.pg_get_userbyid(p.proowner) as owner_name,
              coalesce(p.proconfig::text, '') as function_config,
              coalesce(p.proacl, pg_catalog.acldefault('f', p.proowner))::text as effective_acl,
              pg_catalog.pg_get_functiondef(p.oid) as definition
            from pg_catalog.pg_proc p
            join pg_catalog.pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.prokind in ('f','p','w')
            order by p.proname, pg_catalog.pg_get_function_identity_arguments(p.oid);
          "

          csv_query views.csv "
            select
              n.nspname as schema_name,
              c.relname as view_name,
              c.relkind,
              pg_catalog.pg_get_viewdef(c.oid, true) as definition
            from pg_catalog.pg_class c
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relkind in ('v','m')
            order by c.relname;
          "

          csv_query role_state.csv "
            select
              rolname,
              rolcanlogin,
              rolsuper,
              rolcreatedb,
              rolcreaterole,
              rolinherit,
              rolreplication,
              rolbypassrls,
              rolconnlimit
            from pg_catalog.pg_roles
            where rolname like 'myeongha\\_%' escape '\\'
               or rolname in ('postgres','anon','authenticated','service_role')
            order by rolname;
          "

          csv_query role_memberships.csv "
            select
              role.rolname as role_name,
              member.rolname as member_name,
              grantor.rolname as grantor_name,
              membership.admin_option
            from pg_catalog.pg_auth_members membership
            join pg_catalog.pg_roles role on role.oid = membership.roleid
            join pg_catalog.pg_roles member on member.oid = membership.member
            join pg_catalog.pg_roles grantor on grantor.oid = membership.grantor
            where role.rolname like 'myeongha\\_%' escape '\\'
               or member.rolname like 'myeongha\\_%' escape '\\'
            order by role.rolname, member.rolname;
          "

          csv_query table_privileges.csv "
            select
              table_schema,
              table_name,
              grantor,
              grantee,
              privilege_type,
              is_grantable,
              with_hierarchy
            from information_schema.table_privileges
            where table_schema = 'public'
              and (
                grantee like 'myeongha\\_%' escape '\\'
                or grantee in ('PUBLIC','anon','authenticated','service_role','postgres')
              )
            order by table_name, grantee, privilege_type;
          "

          csv_query routine_privileges.csv "
            select
              routine_schema,
              routine_name,
              specific_name,
              grantor,
              grantee,
              privilege_type,
              is_grantable
            from information_schema.routine_privileges
            where routine_schema = 'public'
              and (
                grantee like 'myeongha\\_%' escape '\\'
                or grantee in ('PUBLIC','anon','authenticated','service_role','postgres')
              )
            order by routine_name, specific_name, grantee, privilege_type;
          "

          csv_query summary.csv "
            select 'migration_max_version' as metric,
                   coalesce((select max(version) from supabase_migrations.schema_migrations), '')::text as value
            union all
            select 'public_table_count', count(*)::text
              from pg_catalog.pg_class c
              join pg_catalog.pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind in ('r','p')
            union all
            select 'public_rls_enabled_table_count', count(*)::text
              from pg_catalog.pg_class c
              join pg_catalog.pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind in ('r','p') and c.relrowsecurity
            union all
            select 'public_force_rls_table_count', count(*)::text
              from pg_catalog.pg_class c
              join pg_catalog.pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind in ('r','p') and c.relforcerowsecurity
            union all
            select 'public_policy_count', count(*)::text
              from pg_catalog.pg_policies
             where schemaname = 'public'
            union all
            select 'public_function_count', count(*)::text
              from pg_catalog.pg_proc p
              join pg_catalog.pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and p.prokind in ('f','p','w');
          "

          {
            echo "project_ref=$SUPABASE_PROJECT_ID"
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "audit_mode=read_only_catalog_metadata"
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$snapshot_dir/audit_metadata.txt"

          (
            cd "$snapshot_dir"
            sha256sum *.csv audit_metadata.txt > SHA256SUMS
          )

          echo "snapshot_dir=$snapshot_dir" >> "$GITHUB_OUTPUT"

      - name: Upload immutable catalog snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-platform-integrity-catalog-${{ github.run_id }}
          path: ${{ steps.snapshot.outputs.snapshot_dir }}
          if-no-files-found: error
          retention-days: 14
