name: Production Records Current-Subject Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_RECORDS_CURRENT_SUBJECT to run the production Records current-subject smoke.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-records-current-subject-smoke.yml'
      - 'scripts/verify-production-reading-history-current-subject.mjs'
      - 'scripts/wait-production-records-sample-boundary.mjs'
      - 'scripts/verify-production-records-browser.mjs'
      - 'apps/web/records-page.js'

permissions:
  contents: read

concurrency:
  group: production-records-current-subject-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: verify-production-records-current-subject
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ github.event_name == 'push' && 'VERIFY_RECORDS_CURRENT_SUBJECT' || inputs.confirm }}
      MYEONGHA_PRODUCTION_MEMBER_EMAIL: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EMAIL }}
      MYEONGHA_PRODUCTION_MEMBER_PASSWORD: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_PASSWORD }}
      MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}
    steps:
      - name: Verify explicit dispatch and governed fresh-session credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRM" == 'VERIFY_RECORDS_CURRENT_SUBJECT' ]]
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EMAIL:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_PASSWORD:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID:-}"

      - name: Check out exact repository verifier
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify production Records current-subject continuity
        run: node scripts/verify-production-records-current-subject.mjs

      - name: Verify production Reading History current-subject continuity
        run: node scripts/verify-production-reading-history-current-subject.mjs

      - name: Wait for Production Records sample-boundary deployment
        run: node scripts/wait-production-records-sample-boundary.mjs

      - name: Set up Chrome for Production Records browser smoke
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify production Records browser empty-state boundary
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-production-records-browser.mjs
