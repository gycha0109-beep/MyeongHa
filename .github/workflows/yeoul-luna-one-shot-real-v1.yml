name: "[WT:character-runtime-lab] Yeoul GPT-6 Luna one-shot encrypted actual A/B/C"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeoul-gpt6-luna-20261117-paid-once
  cancel-in-progress: false

jobs:
  actual-synthetic-evaluation:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'gycha0109-beep' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted one-shot runner from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned reviewed Yeoul research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: '386ff0d7b7727258fa1afcd1ff860f1ff39096a8'
          path: yeoul-research-pinned

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Verify pinned source and offline three-arm cost envelope
        shell: bash
        env:
          YEOUL_PINNED_SOURCE_ROOT: ${{ github.workspace }}/yeoul-research-pinned
        run: |
          set -euo pipefail
          test "$(git -C "$YEOUL_PINNED_SOURCE_ROOT" rev-parse HEAD)" = "386ff0d7b7727258fa1afcd1ff860f1ff39096a8"
          node scripts/character-optimization/yeoul-luna-one-shot-real-v1.mjs --plan-only

      - name: Single owner-authorized GPT-6 Luna call group, reserve cap first
        shell: bash
        env:
          OPENAI_EVAL_API_KEY: ${{ secrets.OPENAI_EVAL_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
          YEOUL_PINNED_SOURCE_ROOT: ${{ github.workspace }}/yeoul-research-pinned
          YEOUL_ENCRYPTED_ARTIFACT_PATH: ${{ runner.temp }}/yeoul-luna-one-shot.enc.json
        run: |
          set -euo pipefail
          node scripts/character-optimization/yeoul-luna-one-shot-real-v1.mjs

      - name: Export encrypted replies only (never plaintext)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-luna-one-shot-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/yeoul-luna-one-shot.enc.json
          if-no-files-found: ignore
          retention-days: 1
