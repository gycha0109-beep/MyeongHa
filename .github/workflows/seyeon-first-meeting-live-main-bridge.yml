name: "[WT:character-memory] Se-yeon First Meeting Live Main Bridge"

on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-first-meeting-live-main.trigger'

permissions:
  contents: read

concurrency:
  group: seyeon-first-meeting-live-main-bridge
  cancel-in-progress: false

env:
  DOGFOOD_SOURCE_SHA: 92173206c4a500556915dfb75d3a2492619234a6
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc
  MYEONGHA_SUPABASE_URL: https://cnsfpcdiyofqvhpcegfc.supabase.co
  API_EXECUTION_ROLE: myeongha_api_executor
  EPHEMERAL_ROLE_MARKER_PREFIX: myeongha:seyeon-live-dogfood-ephemeral:v1
  MYEONGHA_SEYEON_OPENAI_MODEL: ${{ vars.MYEONGHA_SEYEON_OPENAI_MODEL || secrets.MYEONGHA_SEYEON_OPENAI_MODEL || 'gpt-5.6-terra' }}
  MYEONGHA_SEYEON_OPENAI_TIMEOUT_MS: ${{ vars.MYEONGHA_SEYEON_OPENAI_TIMEOUT_MS }}

jobs:
  live:
    name: run-seyeon-first-meeting-live-main-bridge
    runs-on: ubuntu-24.04
    environment: production
    env:
      MYEONGHA_PRODUCTION_MEMBER_EMAIL: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EMAIL }}
      MYEONGHA_PRODUCTION_MEMBER_PASSWORD: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_PASSWORD }}
      MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out bridge invocation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify governed main invocation and non-mutating prerequisites
        shell: bash
        run: |
          set -euo pipefail

          [[ "${{ github.event_name }}" == 'push' ]]
          [[ "${{ github.ref }}" == 'refs/heads/main' ]]
          trigger_value="$(tr -d '\r\n' < .github/seyeon-first-meeting-live-main.trigger)"
          [[ "$trigger_value" == 'fire-2026-10-04-v1' ]]

          test -n "${MYEONGHA_PRODUCTION_MEMBER_EMAIL:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_PASSWORD:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID:-}"

          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}"
          [[ "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]

          test -n "${OPENAI_API_KEY:-}"
          test -n "${MYEONGHA_SEYEON_OPENAI_MODEL:-}"

      - name: Check out pinned PHASE S dogfood source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DOGFOOD_SOURCE_SHA }}
          clean: true

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$DOGFOOD_SOURCE_SHA" ]]
          test -f scripts/run-seyeon-first-meeting-live-dogfood.mjs
          test -f apps/api/src/seyeon-live-provider-readiness-v1.ts

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build internal dogfood runtime
        run: npm run build

      - name: Verify OpenAI structured-provider readiness
        run: node dist/apps/api/src/seyeon-live-provider-readiness-cli-v1.js

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create ephemeral least-privilege dogfood DB login
        id: db_runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          role_name="myeongha_dogfood_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          role_marker="$EPHEMERAL_ROLE_MARKER_PREFIX:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          runtime_password="$(openssl rand -hex 32)"
          guest_fingerprint_secret="$(openssl rand -hex 32)"
          admin_pool_user="postgres.$SUPABASE_PROJECT_ID"
          runtime_pool_user="$role_name.$SUPABASE_PROJECT_ID"
          pool_host="$SUPABASE_PRODUCTION_SESSION_POOLER_HOST"
          pool_port='5432'
          pool_db='postgres'
          api_keys_file="$RUNNER_TEMP/seyeon-live-supabase-api-keys.json"

          cleanup_local() {
            exit_code=$?
            trap - EXIT
            rm -f "$api_keys_file"
            exit "$exit_code"
          }
          trap cleanup_local EXIT

          [[ "$role_name" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]
          [[ "$runtime_password" =~ ^[0-9a-f]{64}$ ]]
          [[ "$guest_fingerprint_secret" =~ ^[0-9a-f]{64}$ ]]

          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" \
            -o "$api_keys_file"

          supabase_publishable_key="$(jq -er '
            [ .[] | select(.type == "publishable" and (.disabled != true)) ]
            | sort_by(if .name == "default" then 0 else 1 end)
            | .[0].api_key
          ' "$api_keys_file")"
          [[ "$supabase_publishable_key" == sb_publishable_* ]]

          echo "::add-mask::$runtime_password"
          echo "::add-mask::$guest_fingerprint_secret"
          echo "::add-mask::$supabase_publishable_key"

          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require

          preexisting="$(psql \
            -X -A -t -v ON_ERROR_STOP=1 \
            -h "$pool_host" \
            -p "$pool_port" \
            -U "$admin_pool_user" \
            -d "$pool_db" \
            -v role_name="$role_name" \
            -c "select count(*) from pg_catalog.pg_roles where rolname = :'role_name';")"
          [[ "$preexisting" == '0' ]]

          psql \
            -X -q -v ON_ERROR_STOP=1 \
            -h "$pool_host" \
            -p "$pool_port" \
            -U "$admin_pool_user" \
            -d "$pool_db" \
            -v role_name="$role_name" \
            -v role_password="$runtime_password" \
            -v role_marker="$role_marker" \
            -c "create role :\"role_name\" login nosuperuser nocreatedb nocreaterole noinherit noreplication nobypassrls password :'role_password';" \
            -c "comment on role :\"role_name\" is :'role_marker';" \
            -c "grant $API_EXECUTION_ROLE to :\"role_name\";"

          runtime_state="$(PGPASSWORD="$runtime_password" PGSSLMODE=require psql \
            -X -A -t -v ON_ERROR_STOP=1 \
            -h "$pool_host" \
            -p "$pool_port" \
            -U "$runtime_pool_user" \
            -d "$pool_db" \
            -v role_name="$role_name" \
            -v execution_role="$API_EXECUTION_ROLE" \
            -c "
              select case when
                current_user = :'role_name'
                and pg_catalog.pg_has_role(current_user, :'execution_role', 'MEMBER')
                and exists (
                  select 1
                  from pg_catalog.pg_roles
                  where rolname = current_user
                    and rolcanlogin
                    and not rolsuper
                    and not rolcreatedb
                    and not rolcreaterole
                    and not rolinherit
                    and not rolreplication
                    and not rolbypassrls
                )
              then 'READY' else 'BLOCKED' end;
            ")"
          [[ "$runtime_state" == 'READY' ]]

          database_url="postgresql://$runtime_pool_user:$runtime_password@$pool_host:$pool_port/$pool_db?sslmode=require"
          echo "::add-mask::$database_url"

          printf '%s=%s\n' MYEONGHA_DATABASE_URL "$database_url" >> "$GITHUB_ENV"
          printf '%s=%s\n' MYEONGHA_DATABASE_PRINCIPAL "$role_name" >> "$GITHUB_ENV"
          printf '%s=%s\n' MYEONGHA_SUPABASE_API_KEY "$supabase_publishable_key" >> "$GITHUB_ENV"
          printf '%s=%s\n' MYEONGHA_GUEST_FINGERPRINT_SECRET "$guest_fingerprint_secret" >> "$GITHUB_ENV"

          echo "role_name=$role_name" >> "$GITHUB_OUTPUT"
          echo "role_marker=$role_marker" >> "$GITHUB_OUTPUT"

      - name: Execute first-meeting live dogfood
        id: live
        env:
          SEYEON_LIVE_RUN_ID: gha-main-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/run-seyeon-first-meeting-live-dogfood.mjs

      - name: Upload redacted live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seyeon-first-meeting-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-first-meeting-live-dogfood/evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce technical live verdict
        if: always()
        shell: bash
        env:
          CAMPAIGN_STATUS: ${{ steps.live.outputs.campaign_status }}
          TECHNICAL_VERDICT: ${{ steps.live.outputs.technical_verdict }}
        run: |
          set -euo pipefail
          [[ "$CAMPAIGN_STATUS" == 'READY_CREATED' || "$CAMPAIGN_STATUS" == 'READY_REUSED_EMPTY' ]]
          [[ "$TECHNICAL_VERDICT" == 'PASS' ]]

      - name: Drop ephemeral dogfood DB login
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          ROLE_NAME="myeongha_dogfood_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          ROLE_MARKER="$EPHEMERAL_ROLE_MARKER_PREFIX:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          admin_pool_user="postgres.$SUPABASE_PROJECT_ID"
          pool_host="$SUPABASE_PRODUCTION_SESSION_POOLER_HOST"
          pool_port='5432'
          pool_db='postgres'

          [[ "$ROLE_NAME" =~ ^myeongha_dogfood_[0-9]+_[0-9]+$ ]]

          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require

          marker="$(psql \
            -X -A -t -v ON_ERROR_STOP=1 \
            -h "$pool_host" \
            -p "$pool_port" \
            -U "$admin_pool_user" \
            -d "$pool_db" \
            -v role_name="$ROLE_NAME" \
            -c "
              select coalesce(
                pg_catalog.shobj_description(oid, 'pg_authid'),
                ''
              )
              from pg_catalog.pg_roles
              where rolname = :'role_name';
            ")"

          if [[ -z "$marker" ]]; then
            echo 'Ephemeral dogfood DB login is already absent.'
            exit 0
          fi
          [[ "$marker" == "$ROLE_MARKER" ]]

          psql \
            -X -q -v ON_ERROR_STOP=1 \
            -h "$pool_host" \
            -p "$pool_port" \
            -U "$admin_pool_user" \
            -d "$pool_db" \
            -v role_name="$ROLE_NAME" \
            -c "
              select pg_catalog.pg_terminate_backend(pid)
              from pg_catalog.pg_stat_activity
              where usename = :'role_name'
                and pid <> pg_catalog.pg_backend_pid();
            " \
            -c "revoke $API_EXECUTION_ROLE from :\"role_name\";" \
            -c "drop role :\"role_name\";"

          remaining="$(psql \
            -X -A -t -v ON_ERROR_STOP=1 \
            -h "$pool_host" \
            -p "$pool_port" \
            -U "$admin_pool_user" \
            -d "$pool_db" \
            -v role_name="$ROLE_NAME" \
            -c "select count(*) from pg_catalog.pg_roles where rolname = :'role_name';")"
          [[ "$remaining" == '0' ]]
