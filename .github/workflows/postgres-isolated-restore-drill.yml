name: PostgreSQL Isolated Restore Drill
run-name: "[WT:ops] PostgreSQL Isolated Restore Drill"

on:
  # Explicit, one-shot guarded source: this workflow file is changed only
  # through an exact-head reviewed main merge. No Production SQL is written.
  push:
    branches:
      - main
    paths:
      - '.github/ops/postgres-restore-seyeon-20261008090417.once'
      - '.github/ops/postgres-restore-backup-39067271230-20261018.once'
      - '.github/ops/postgres-restore-backup-40232489516-20261026.once'
      - '.github/ops/postgres-restore-backup-40780751650-20261029.once'
      - '.github/ops/postgres-restore-provider-rows-40780751650-20261029.once'
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful Production PostgreSQL Logical Backup workflow run ID
        required: true
        type: string
      incident_reference_utc:
        description: Recovery incident/reference time in canonical UTC YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
      privacy_ledger_run_id:
        description: Optional authoritative Production PostgreSQL Privacy Recovery Ledger run ID
        required: false
        default: ''
        type: string
      production_privacy_canary_run_id:
        description: Required with privacy_ledger_run_id; successful Production Privacy Recovery Canary evidence run ID
        required: false
        default: ''
        type: string
      watchtower_track:
        description: Watchtower Track Key for CI attribution
        required: true
        type: string
      seyeon_security_s0_rehearsal:
        description: Rehearse the closed S0 SQL and synthetic receipt races on a disposable clone of this restored backup
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: postgres-isolated-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: isolated-supabase-postgres-17-restore
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'ops(dr): one-shot restore backup 38088591661') || startsWith(github.event.head_commit.message, 'ops(dr): one-shot restore backup 39067271230') || startsWith(github.event.head_commit.message, 'ops(dr): one-shot restore backup 40232489516') || startsWith(github.event.head_commit.message, 'ops(dr): one-shot restore backup 40780751650') || startsWith(github.event.head_commit.message, 'ops(dr): one-shot provider row inventory 40780751650'))) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    services:
      postgres:
        image: ghcr.io/supabase/postgres@sha256:b3bfedb107413abb3b8cb0d0874b0414a1dceb3d55bc0c778de6ad22d1f7dc86 # release 17.6.1.166
        env:
          POSTGRES_PASSWORD: restore-drill
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    env:
      MYEONGHA_WATCHTOWER_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.watchtower_track || 'ops' }}
      EXPECTED_PROJECT_REF: cnsfpcdiyofqvhpcegfc
      MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Require operations Watchtower attribution
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MYEONGHA_WATCHTOWER_TRACK" == 'ops' ]]

      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Gate one-shot Se-yeon current-frontier restore marker
        if: ${{ github.event_name == 'push' }}
        id: one_shot
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          subject="$(git show -s --format=%s HEAD)"
          if [[ "$subject" =~ ^ops\(dr\):\ one-shot\ provider\ row\ inventory\ 40780751650(\ \(\#[0-9]+\))?$ ]]; then
            # Reviewed, source-pinned second isolated replay only after
            # provider source-row counting landed on main. No Production write.
            [[ "$(cat .github/ops/postgres-restore-provider-rows-40780751650-20261029.once)" == 'POSTGRES-RESTORE-PROVIDER-ROWS-40780751650-20261029-V1' ]]
            point="$(date -u -d '2026-10-29T02:18:00Z' +%s)"
            now="$(date -u +%s)"
            (( now >= point && now - point <= 86400 ))
            echo 'backup_run_id=40780751650' >> "$GITHUB_OUTPUT"
            echo 'incident_reference_utc=2026-10-29T02:18:00Z' >> "$GITHUB_OUTPUT"
            echo 'SCOPED_RESTORE_ROW_INVENTORY_ONLY: exact governed backup 40780751650; per-provider-row counts without payloads; synthetic privacy; no Production writes or Hosted service'
          elif [[ "$subject" =~ ^ops\(dr\):\ one-shot\ restore\ backup\ 40780751650(\ \(\#[0-9]+\))?$ ]]; then
            # One-shot read-only source restore on disposable PG17 only.
            # Exact backed-up Production migration was read-only confirmed
            # equal to observed Production ledger 20261028011357.
            [[ "$(cat .github/ops/postgres-restore-backup-40780751650-20261029.once)" == 'POSTGRES-RESTORE-BACKUP-40780751650-20261029-V1' ]]
            point="$(date -u -d '2026-10-28T22:37:00Z' +%s)"
            now="$(date -u +%s)"
            (( now >= point && now - point <= 86400 ))
            echo 'backup_run_id=40780751650' >> "$GITHUB_OUTPUT"
            echo 'incident_reference_utc=2026-10-28T22:37:00Z' >> "$GITHUB_OUTPUT"
            echo 'SCOPED_RESTORE_PROOF_ONLY: backup 40780751650; synthetic privacy, no Production writes, no Hosted restore'
          elif [[ "$subject" == 'ops(dr): one-shot restore backup 40232489516' ]]; then
            # Explicit owner-approved, disposable loopback restore of the
            # matching governed backup. This path writes no Production DB state.
            [[ "$(cat .github/ops/postgres-restore-backup-40232489516-20261026.once)" == 'POSTGRES-RESTORE-BACKUP-40232489516-20261026-V1' ]]
            point="$(date -u -d '2026-10-26T00:00:00Z' +%s)"
            now="$(date -u +%s)"
            (( now >= point && now - point <= 86400 ))
            echo 'backup_run_id=40232489516' >> "$GITHUB_OUTPUT"
            echo 'incident_reference_utc=2026-10-26T00:00:00Z' >> "$GITHUB_OUTPUT"
            echo 'SCOPED_RESTORE_PROOF_ONLY: backup 40232489516; no Production SQL or privacy canary'
          elif [[ "$subject" == 'ops(dr): one-shot restore backup 39067271230' ]]; then
            # Owner-approved read-only recovery drill; only the exact reviewed main
            # squash commit and marker are admitted, and permission self-expires.
            [[ "$(cat .github/ops/postgres-restore-backup-39067271230-20261018.once)" == 'POSTGRES-RESTORE-BACKUP-39067271230-20261018-V1' ]]
            point="$(date -u -d '2026-10-18T08:00:00Z' +%s)"
            now="$(date -u +%s)"
            (( now >= point && now - point <= 14400 ))
            echo 'backup_run_id=39067271230' >> "$GITHUB_OUTPUT"
            echo 'incident_reference_utc=2026-10-18T08:00:00Z' >> "$GITHUB_OUTPUT"
            echo 'SCOPED_RESTORE_PROOF_ONLY: backup 39067271230; no Production SQL or privacy canary'
          else
            # Historical one-shot path, retained only for evidence; expired.
            [[ "$subject" == 'ops(dr): one-shot restore backup 38088591661 (#1947)' ]]
            [[ "$(cat .github/ops/postgres-restore-seyeon-20261008090417.once)" == 'POSTGRES-RESTORE-SEYEON-20261008090417-V1' ]]
            point="$(date -u -d '2026-10-10T21:44:36Z' +%s)"
            now="$(date -u +%s)"
            (( now >= point && now - point <= 14400 ))
            echo 'backup_run_id=38088591661' >> "$GITHUB_OUTPUT"
            echo 'incident_reference_utc=2026-10-10T21:44:36Z' >> "$GITHUB_OUTPUT"
            echo 'SCOPED_RESTORE_PROOF_ONLY: backup 38088591661; never Production SQL'
          fi

      - name: Validate drill input and source backup authority
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_run_id || steps.one_shot.outputs.backup_run_id }}
          INCIDENT_REFERENCE_UTC: ${{ github.event_name == 'workflow_dispatch' && inputs.incident_reference_utc || steps.one_shot.outputs.incident_reference_utc }}
        run: bash scripts/operations/resolve-postgres-restore-source.sh
      - name: Download exact governed backup artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_run_id || steps.one_shot.outputs.backup_run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/backup-artifact

      - name: Resolve authoritative Production privacy replay provenance
        id: privacy-source
        if: inputs.privacy_ledger_run_id != '' || inputs.production_privacy_canary_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_run_id || steps.one_shot.outputs.backup_run_id }}
          PRIVACY_LEDGER_RUN_ID: ${{ inputs.privacy_ledger_run_id }}
          PRODUCTION_PRIVACY_CANARY_RUN_ID: ${{ inputs.production_privacy_canary_run_id }}
        run: bash scripts/operations/resolve-postgres-authoritative-privacy-replay-source.sh

      - name: Download authoritative privacy ledger artifact
        if: inputs.privacy_ledger_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.privacy_ledger_run_id }}
          artifact-ids: ${{ steps.privacy-source.outputs.ledger_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/privacy-ledger-artifact

      - name: Download Production privacy canary public evidence
        if: inputs.production_privacy_canary_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.production_privacy_canary_run_id }}
          artifact-ids: ${{ steps.privacy-source.outputs.canary_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/privacy-canary-evidence

      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Restore encrypted backup into isolated PostgreSQL
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/restore-evidence.json
        run: bash scripts/run-postgres-isolated-restore-drill.sh

      - name: Exercise synthetic privacy reconciliation and finalization on restored database
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          PRIVACY_RECONCILIATION_BACKUP_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_run_id || steps.one_shot.outputs.backup_run_id }}
          PRIVACY_RECONCILIATION_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/privacy-reconciliation-evidence.json
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: restore-drill
          PGDATABASE: postgres
        run: bash scripts/operations/run-restored-postgres-privacy-drill.sh
      - name: Replay authoritative Production privacy ledger on restored database
        if: inputs.privacy_ledger_run_id != ''
        shell: bash
        env:
          LEDGER_ARTIFACT_DIR: ${{ runner.temp }}/privacy-ledger-artifact
          CANARY_EVIDENCE_DIR: ${{ runner.temp }}/privacy-canary-evidence
          PRIVACY_RECONCILIATION_BACKUP_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_run_id || steps.one_shot.outputs.backup_run_id }}
          PRIVACY_RECONCILIATION_LEDGER_RUN_ID: ${{ inputs.privacy_ledger_run_id }}
          PRODUCTION_PRIVACY_CANARY_RUN_ID: ${{ inputs.production_privacy_canary_run_id }}
          PRIVACY_RECONCILIATION_INCIDENT_REFERENCE_UTC: ${{ github.event_name == 'workflow_dispatch' && inputs.incident_reference_utc || steps.one_shot.outputs.incident_reference_utc }}
          PRIVACY_RECONCILIATION_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/authoritative-privacy-reconciliation-evidence.json
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: restore-drill
          PGDATABASE: postgres
        run: bash scripts/operations/run-restored-postgres-authoritative-privacy-replay.sh

      - name: Build self-contained restore evidence envelope
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/restore-evidence.json
          BACKUP_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_run_id || steps.one_shot.outputs.backup_run_id }}
          INCIDENT_REFERENCE_UTC: ${{ github.event_name == 'workflow_dispatch' && inputs.incident_reference_utc || steps.one_shot.outputs.incident_reference_utc }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_EXPIRES_AT: ${{ steps.source.outputs.artifact_expires_at }}
        run: bash scripts/operations/build-postgres-restore-evidence.sh

      - name: Record fail-closed recovered service admission
        shell: bash
        env:
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/restore-evidence.json
          AUTHORITATIVE_PRIVACY_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/authoritative-privacy-reconciliation-evidence.json
          SERVING_ADMISSION_REPORT_PATH: ${{ runner.temp }}/restore-evidence/recovered-serving-admission.json
        run: |
          set -euo pipefail
          args=(
            --restore-evidence "$RESTORE_EVIDENCE_PATH"
            --output "$SERVING_ADMISSION_REPORT_PATH"
          )
          if [[ -f "$AUTHORITATIVE_PRIVACY_EVIDENCE_PATH" ]]; then
            args+=(--privacy-evidence "$AUTHORITATIVE_PRIVACY_EVIDENCE_PATH")
          fi
          node scripts/build-postgres-recovered-serving-admission.mjs "${args[@]}"
          jq -e '
            .gate == "BLOCKED"
            and .serviceResumptionAllowed == false
            and .providerManagedDataFullRestore == false
            and .futureSafePrivacyReconciliation == false
            and .drReady == false
            and .outputContainsIdentifiers == false
          ' "$SERVING_ADMISSION_REPORT_PATH" >/dev/null

      - name: Record current-frontier restore evidence
        shell: bash
        env:
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/restore-evidence.json
        run: |
          set -euo pipefail
          jq -er '"backup_migration_frontier=\(.backup_migration_frontier)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"seyeon_early_history_restore_proof=\(.seyeon_early_history_restore_proof)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"seyeon_early_functions_restore_proof=\(.seyeon_early_functions_restore_proof)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"member_auth_rate_limit_schema_restore=\(.member_auth_rate_limit_schema_restore)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"member_auth_rate_limit_unlogged=\(.member_auth_rate_limit_unlogged)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"member_auth_rate_limit_ephemeral_data_restore=\(.member_auth_rate_limit_ephemeral_data_restore)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"member_auth_rate_limit_owner_restore=\(.member_auth_rate_limit_owner_restore)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"member_auth_rate_limit_acl_restore=\(.member_auth_rate_limit_acl_restore)"' "$RESTORE_EVIDENCE_PATH"
          jq -er '"member_auth_rate_limit_synthetic_admission=\(.member_auth_rate_limit_synthetic_admission)"' "$RESTORE_EVIDENCE_PATH"

      - name: Set up Node for optional S0 restored-backup rehearsal
        if: inputs.seyeon_security_s0_rehearsal
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned optional S0 rehearsal dependencies
        if: inputs.seyeon_security_s0_rehearsal
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rehearse S0 installation and receipt races on an isolated restored clone
        if: inputs.seyeon_security_s0_rehearsal
        env:
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/restore-evidence.json
          SEYEON_S0_REHEARSAL_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/seyeon-security-s0-rehearsal.json
        run: node scripts/operations/rehearse-seyeon-security-s0-restored.mjs

      - name: Upload restore drill evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-isolated-restore-drill-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-evidence/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record restore drill boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'restore_target=github-actions-loopback-supabase-postgres'
          echo 'isolated_restore=success'
          echo 'synthetic_privacy_reconciliation_mechanics=replay_and_finalization_exercised_on_restored_db'
          echo 'privacy_reconciliation=synthetic_captured_window_authority_mechanics_only'
          echo 'hosted_auth_provider_ack=synthetic_only_real_provider_proven_separately'
          if [[ -n "${{ inputs.privacy_ledger_run_id }}" ]]; then
            echo 'authoritative_privacy_reconciliation=production_nonzero_captured_window_replay_proven'
            echo 'future_safe_privacy_reconciliation=false'
          else
            echo 'authoritative_privacy_reconciliation=not_exercised_without_production_ledger'
          fi
          echo 'dr_ready=false'
