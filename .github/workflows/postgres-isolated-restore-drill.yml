name: PostgreSQL Isolated Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful Production PostgreSQL Logical Backup workflow run ID
        required: true
        type: string
      incident_reference_utc:
        description: Synthetic incident/reference time in canonical UTC YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: postgres-isolated-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: isolated-supabase-postgres-17-restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    services:
      postgres:
        image: ghcr.io/supabase/postgres:17.6.1.166
        env:
          POSTGRES_PASSWORD: restore-drill
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    env:
      EXPECTED_PROJECT_REF: cnsfpcdiyofqvhpcegfc
      MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.MYEONGHA_BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate drill input and source backup authority
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          INCIDENT_REFERENCE_UTC: ${{ inputs.incident_reference_utc }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]
          incident_roundtrip="$(date -u -d "$INCIDENT_REFERENCE_UTC" +'%Y-%m-%dT%H:%M:%SZ')"
          [[ "$incident_roundtrip" == "$INCIDENT_REFERENCE_UTC" ]]

          run_json="$RUNNER_TEMP/backup-run.json"
          artifact_json="$RUNNER_TEMP/backup-artifacts.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" \
            -o "$run_json"

          jq -e '
            .name == "Production PostgreSQL Logical Backup"
            and .path == ".github/workflows/production-postgres-backup.yml"
            and .conclusion == "success"
            and .head_branch == "main"
            and (.event == "schedule" or .event == "workflow_dispatch")
            and .repository.full_name == env.GITHUB_REPOSITORY
          ' "$run_json" >/dev/null

          source_sha="$(jq -er '.head_sha' "$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts?per_page=100" \
            -o "$artifact_json"

          governed_artifacts="$(jq -c '[.artifacts[] | select((.name | test("^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$")) and (.expired == false))]' "$artifact_json")"
          [[ "$(jq 'length' <<<"$governed_artifacts")" == '1' ]]

          artifact_id="$(jq -er '.[0].id' <<<"$governed_artifacts")"
          artifact_name="$(jq -er '.[0].name' <<<"$governed_artifacts")"
          artifact_expires_at="$(jq -er '.[0].expires_at' <<<"$governed_artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$artifact_name" =~ ^myeongha-postgres-[0-9]{8}T[0-9]{6}Z$ ]]

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_expires_at=$artifact_expires_at" >> "$GITHUB_OUTPUT"

      - name: Download exact governed backup artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/backup-artifact

      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Restore encrypted backup into isolated PostgreSQL
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/restore-evidence.json
        run: |
          set -euo pipefail
          bash scripts/run-postgres-isolated-restore-drill.sh

      - name: Build self-contained restore evidence envelope
        shell: bash
        env:
          BACKUP_ARTIFACT_DIR: ${{ runner.temp }}/backup-artifact
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/restore-evidence/restore-evidence.json
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          INCIDENT_REFERENCE_UTC: ${{ inputs.incident_reference_utc }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_EXPIRES_AT: ${{ steps.source.outputs.artifact_expires_at }}
        run: |
          set -euo pipefail
          mapfile -t public_manifests < <(
            find "$BACKUP_ARTIFACT_DIR" -maxdepth 1 -type f -name '*.manifest.json' -print
          )
          [[ "${#public_manifests[@]}" -eq 1 ]]

          node scripts/build-postgres-restore-evidence-envelope.mjs \
            --restore-evidence "$RESTORE_EVIDENCE_PATH" \
            --backup-manifest "${public_manifests[0]}" \
            --output "$RESTORE_EVIDENCE_PATH.enveloped" \
            --backup-run-id "$BACKUP_RUN_ID" \
            --incident-reference-utc "$INCIDENT_REFERENCE_UTC" \
            --source-artifact-name "$SOURCE_ARTIFACT_NAME" \
            --source-artifact-expires-at "$SOURCE_ARTIFACT_EXPIRES_AT"

          mv "$RESTORE_EVIDENCE_PATH.enveloped" "$RESTORE_EVIDENCE_PATH"
          chmod 600 "$RESTORE_EVIDENCE_PATH"

      - name: Upload restore drill evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-isolated-restore-drill-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-evidence/restore-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record restore drill boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'restore_target=github-actions-loopback-supabase-postgres'
          echo 'isolated_restore=success'
          echo 'privacy_reconciliation=not_exercised_by_this_workflow'
          echo 'dr_ready=false'
