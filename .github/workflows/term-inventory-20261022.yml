name: One-time vocabulary inventory (read-only)
on:
  push:
    branches:
      - refactor/global-daerija-to-yeongyeolja-v2-20261022
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refactor/global-daerija-to-yeongyeolja-v2-20261022
          persist-credentials: false
      - name: List old terminology in tracked content
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          old = "\uB300\uB9AC\uC790".encode("utf-8")
          files = [os.fsdecode(p) for p in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0") if p]
          print("TERM_TREE|" + subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(), flush=True)
          matches = 0
          occurrences = 0
          for name in files:
              p = pathlib.Path(name)
              if not p.is_file() or p.is_symlink():
                  continue
              data = p.read_bytes()
              count = data.count(old)
              if count:
                  matches += 1
                  occurrences += count
                  status = "BINARY" if b"\0" in data else "TEXT"
                  print("TERM_MATCH|" + json.dumps(name, ensure_ascii=True) + "|" + str(count) + "|" + status, flush=True)
          print(f"TERM_SUMMARY|files={len(files)}|matched={matches}|occurrences={occurrences}", flush=True)
          PY
