name: Face Reading FR-DATA-224 Batch A Acquisition

on:
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/independent-face-source-asset-storage-frdata07b.ts'
      - 'scripts/face-reading/acquire-frdata224-batch-a.mjs'
      - '.github/workflows/face-reading-frdata224-batch-a-acquisition.yml'

permissions:
  contents: write

jobs:
  acquire-frdata224-batch-a:
    if: github.repository == 'gycha0109-beep/MyeongHa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Check acquisition script syntax
        run: node --check scripts/face-reading/acquire-frdata224-batch-a.mjs
      - name: Acquire pinned source bytes and freeze intake/storage evidence
        run: node scripts/face-reading/acquire-frdata224-batch-a.mjs acquire
      - name: Verify local content-addressed storage readback
        run: node scripts/face-reading/acquire-frdata224-batch-a.mjs verify-existing
      - name: Push evidence-only review branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="evidence/frdata224-batch-a-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add research-evidence/face-reading/frdata224/batch-a
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No evidence files were produced" >&2
            exit 1
          fi
          git commit -m "FR-DATA-224: acquire batch A source bytes"
          git push origin "HEAD:refs/heads/$branch"
          echo "EVIDENCE_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Report evidence branch
        run: echo "Created ${EVIDENCE_BRANCH} from main ${GITHUB_SHA}"
