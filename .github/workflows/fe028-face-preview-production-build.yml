name: FE028 Face Preview Production Build

on:
  pull_request:
    paths:
      - 'package.json'
      - 'config/face-preview-runtime-assets-fe027.json'
      - 'scripts/stage-face-preview-runtime-assets-fe027.mjs'
      - 'scripts/verify-face-preview-runtime-assets-fe027.mjs'
      - 'scripts/verify-face-preview-production-build-fe028.mjs'
      - 'apps/web/src/face-preview/runtime-config-fe028.ts'
      - 'apps/web/src/face-preview/runtime-config-fe028.test.ts'
      - 'apps/web/vite.config.ts'
      - 'docs/face-engine/fe028-face-preview-production-build.md'
      - '.github/workflows/fe028-face-preview-production-build.yml'

permissions:
  contents: read

jobs:
  verify-fe028-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify FE028 runtime bridge
        run: npx vitest run apps/web/src/face-preview/runtime-config-fe028.test.ts
      - name: Build production web with verified Face Preview assets
        run: npm run build:web
      - name: Verify production Face Preview asset deployment
        run: node scripts/verify-face-preview-production-build-fe028.mjs
