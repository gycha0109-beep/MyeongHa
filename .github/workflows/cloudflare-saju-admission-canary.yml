name: Cloudflare Saju Admission Canary
run-name: '[WT:security] Cloudflare Saju Admission ${{ inputs.phase }}'
on:
  workflow_dispatch:
    inputs:
      worker_version:
        description: Actual myeongha Worker version independently read from Cloudflare deployment API
        required: true
        type: string
      phase:
        required: true
        type: choice
        options: [boundary, quota, production]
      confirmation:
        required: true
        type: string
      watchtower_track:
        required: true
        default: security
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-saju-admission-canary
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'VERIFY_CLOUDFLARE_SAJU_ADMISSION' && inputs.watchtower_track == 'security'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify primary Worker before obtaining Member credentials or creating a Guest fixture
        env:
          CLOUDFLARE_EXPECTED_WORKER_VERSION: ${{ inputs.worker_version }}
          SAJU_ADMISSION_CANARY_PHASE: ${{ inputs.phase }}
          SAJU_ADMISSION_CANARY_EVIDENCE_PATH: ${{ runner.temp }}/cloudflare-saju-admission-evidence.json
          MYEONGHA_PRODUCTION_MEMBER_EMAIL: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EMAIL }}
          MYEONGHA_PRODUCTION_MEMBER_PASSWORD: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_PASSWORD }}
          MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}
        run: node scripts/verify-cloudflare-saju-admission-canary.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloudflare-saju-admission-${{ inputs.phase }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-saju-admission-evidence.json
          if-no-files-found: error
