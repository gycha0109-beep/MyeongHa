name: One-time Production Saju Smoke Dispatcher

on:
  push:
    branches:
      - ops/dispatch-saju-smoke-20260905-0703
    paths:
      - .github/workflows/_temp-dispatch-saju-smoke-20260905-0703.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch governed production Saju smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/production-saju-current-subject-smoke.yml/dispatches \
            -f ref=main \
            -f inputs[confirm]=VERIFY_SAJU_CURRENT_SUBJECT
