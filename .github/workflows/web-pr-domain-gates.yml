name: Web PR Domain Gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web PR Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Resolve changed web surfaces
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/myeongha-pr-changed-files.txt"
          node scripts/ci/verification-plan.mjs < "$RUNNER_TEMP/myeongha-pr-changed-files.txt" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.route.outputs.browser == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static web once
        if: steps.route.outputs.browser == 'true'
        run: npm run build:web
      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: true
        if: steps.route.outputs.browser == 'true'
      - name: Run every selected browser check
        if: steps.route.outputs.browser == 'true'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/ci/run-web-pr-checks.mjs "$RUNNER_TEMP/myeongha-pr-changed-files.txt"
      - name: Upload selected browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-pr-diagnostics
          path: artifacts/web-*
          if-no-files-found: ignore
