name: Production Birth Profile Create Boundary Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_BIRTH_CREATE_BOUNDARY to run the non-mutating production Birth create boundary smoke.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-birth-profile-create-boundary-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: verify-production-birth-profile-create-boundary
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Verify explicit dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRM" == 'VERIFY_BIRTH_CREATE_BOUNDARY' ]]

      - name: Check out exact repository verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify production Birth create boundary
        run: node scripts/verify-production-birth-profile-create-boundary.mjs
