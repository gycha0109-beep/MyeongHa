name: DB Commerce Provider Payment Verification Context

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'apps/api/src/postgres-commerce-internal-execution.ts'
      - 'apps/api/src/commerce-provider-payment-verification-context-read.ts'
      - 'tests/postgres-commerce-internal-execution.test.ts'
      - 'tests/commerce-provider-payment-verification-context-read.test.ts'
      - 'tests/commerce-provider-payment-verification-context-authority.test.ts'
      - 'test/db/commerce_provider_payment_verification_context.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-commerce-provider-payment-verification-context.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'apps/api/src/postgres-commerce-internal-execution.ts'
      - 'apps/api/src/commerce-provider-payment-verification-context-read.ts'
      - 'tests/postgres-commerce-internal-execution.test.ts'
      - 'tests/commerce-provider-payment-verification-context-read.test.ts'
      - 'tests/commerce-provider-payment-verification-context-authority.test.ts'
      - 'test/db/commerce_provider_payment_verification_context.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-commerce-provider-payment-verification-context.yml'

permissions:
  contents: read

jobs:
  provider-payment-verification-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: myeongha_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
      - name: Apply clean migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Run Commerce provider payment verification context tests
        run: bash test/db/commerce_provider_payment_verification_context.sh
      - name: Verify deterministic schema catalog snapshot
        run: bash test/db/catalog_snapshot.sh
