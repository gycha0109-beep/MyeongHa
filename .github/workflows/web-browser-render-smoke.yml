name: Web Browser Smoke

on:
  pull_request:
    paths:
      - 'apps/web/src/face-reading/**'
      - 'apps/web/src/face-preview/**'
      - 'packages/face-reading/**'
      - 'scripts/stage-face-preview-runtime-assets-fe027.mjs'
      - 'scripts/verify-face-preview-runtime-canary-fe034.mjs'
      - 'scripts/verify-face-observation-repeatability-fe037.mjs'
      - 'docs/face-engine/fe034-face-preview-runtime-canary.md'
      - 'docs/face-engine/fe037-neutral-observation-repeatability.md'
      - '.github/workflows/web-browser-render-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - '!scripts/verify-production-*.mjs'
      - '!scripts/run-production-*.sh'
      - '!scripts/verify-postgres-*.mjs'
      - '!scripts/run-postgres-*.sh'
      - '!scripts/build-postgres-*.mjs'
      - '!scripts/operations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vercel.json'
      - '.github/workflows/web-browser-render-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static web
        run: npm run build:web
      - name: Fetch pinned Face Reading browser fixture
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/scikit-image/scikit-image/9311ab50b2e3392bb5272253b43cb4dd1ce04e31/src/_skimage2/data/astronaut.png" \
            --output "$RUNNER_TEMP/face-reading-astronaut.png"
          echo "88431cd9653ccd539741b555fb0a46b61558b301d4110412b5bc28b5e3ea6cb5  $RUNNER_TEMP/face-reading-astronaut.png" | sha256sum --check --strict
      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify real FaceLandmarker browser canary
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          FE034_CANARY_IMAGE: ${{ runner.temp }}/face-reading-astronaut.png
        run: node scripts/verify-face-preview-runtime-canary-fe034.mjs
      - name: Record neutral observation repeatability evidence
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          FE037_CANARY_IMAGE: ${{ runner.temp }}/face-reading-astronaut.png
        run: node scripts/verify-face-observation-repeatability-fe037.mjs
      - name: Verify Hall to Saju browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-browser-render.mjs
      - name: Verify shared Home Saju header browser contract
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-golden-master-header-browser.mjs
      - name: Verify authentication browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-browser-smoke.mjs
      - name: Verify Saju active bearer authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-saju-auth-browser.mjs
      - name: Verify Records active bearer binding
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-records-auth-browser.mjs
      - name: Verify Chat active bearer rejection
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-chat-auth-browser-smoke.mjs
      - name: Verify authentication confirmation handoff
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-confirmation-browser-smoke.mjs
      - name: Verify My browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-my-browser.mjs
      - name: Verify My Birth Profile browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-my-birth-browser.mjs
      - name: Verify Birth session and duplicate-create guard
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/run-web-birth-session-browser-smoke-v2.mjs
          node scripts/verify-web-birth-member-replacement-browser.mjs
      - name: Verify conversation browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-conversation-browser-smoke.mjs
      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-browser-smoke
          path: |
            artifacts/web-reading-browser-smoke*
            artifacts/web-golden-master-header-browser-smoke*
            artifacts/web-auth-browser-smoke*
            artifacts/web-auth-confirmation-browser-smoke*
            artifacts/web-saju-auth-browser-smoke*
            artifacts/web-records-auth-browser-smoke*
            artifacts/web-chat-auth-browser-smoke*
            artifacts/web-my-browser-smoke*
            artifacts/web-my-birth-browser-smoke*
            artifacts/web-birth-session-browser-smoke*
            artifacts/web-conversation-browser-smoke*
            artifacts/face-observation-repeatability-fe037.json
          if-no-files-found: ignore