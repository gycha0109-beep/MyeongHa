name: Web Browser Render Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build static web
        run: npm run build:web
      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify Hall to Saju browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-browser-render.mjs
      - name: Verify authentication browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-browser-smoke.mjs
      - name: Verify authentication confirmation handoff
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-confirmation-browser-smoke.mjs
      - name: Verify My browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-my-browser.mjs
      - name: Verify My Birth Profile browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-my-birth-browser.mjs
      - name: Verify Birth session and duplicate-create guard
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-birth-session-browser-smoke-v2.mjs
      - name: Verify conversation browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-conversation-browser-smoke.mjs
      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-reading-browser-smoke
          path: |
            artifacts/web-reading-browser-smoke*
            artifacts/web-auth-browser-smoke*
            artifacts/web-my-browser-smoke*
            artifacts/web-my-birth-browser-smoke*
            artifacts/web-birth-session-browser-smoke*
            artifacts/web-conversation-browser-smoke*
          if-no-files-found: ignore

  dispatch-saju-redeploy-recovery:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[saju-redeploy-dispatch-v1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch governed Saju production redeploy recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          payload_file="$RUNNER_TEMP/saju-redeploy-dispatch.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$payload_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          test -n "${GH_TOKEN:-}"
          jq -n '{ref: "main", inputs: {confirm: "REDEPLOY_SAJU_PRODUCTION"}}' > "$payload_file"

          http_code="$(curl -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@$payload_file" \
            -o /dev/null \
            -w '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-saju-redeploy-recovery.yml/dispatches")"

          if [[ "$http_code" != '204' ]]; then
            echo "Governed Saju recovery dispatch failed: HTTP $http_code" >&2
            exit 1
          fi

          echo 'Governed Saju production redeploy recovery dispatch accepted.'
