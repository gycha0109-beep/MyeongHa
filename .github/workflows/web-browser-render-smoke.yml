name: Web Browser Render Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build static web
        run: npm run build:web
      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify Hall to Saju browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-browser-render.mjs
      - name: Verify shared Home Saju header browser contract
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-golden-master-header-browser.mjs
      - name: Verify authentication browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-browser-smoke.mjs
      - name: Verify malformed stored Member reconciliation
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-malformed-stored-member-browser.mjs
      - name: Verify malformed Member cleanup failure authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-malformed-member-cleanup-failure-browser.mjs
      - name: Verify signup Guest bootstrap auth authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-signup-guest-bootstrap-browser-smoke.mjs
      - name: Verify Guest bootstrap single-flight
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-guest-bootstrap-singleflight-browser-smoke.mjs
      - name: Verify Guest bootstrap persistence failure
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-guest-persistence-failure-browser.mjs
      - name: Verify Member compatibility staging failure
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-member-compat-staging-failure-browser.mjs
      - name: Verify authentication re-login continuity
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-continuity-browser.mjs
      - name: Verify failed sign-in Guest retention
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-failed-login-guest-browser.mjs
      - name: Verify Guest promotion failure retention
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/verify-web-auth-promotion-failure-browser.mjs
          node scripts/verify-web-auth-promotion-member-generation-browser.mjs
      - name: Verify Guest removal failure authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-guest-removal-failure-browser.mjs
      - name: Verify signup confirmation Guest handoff continuity
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-confirmation-handoff-browser-smoke.mjs
      - name: Verify Guest bearer canonicalization
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-guest-bearer-canonicalization-browser-smoke.mjs
      - name: Verify malformed Guest cleanup failure authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-malformed-guest-cleanup-failure-browser.mjs
      - name: Verify auth storage read failure authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-storage-read-failure-browser.mjs
      - name: Verify confirmation Guest handoff sign-out re-login lineage
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-confirmation-relogin-browser-smoke.mjs
      - name: Verify multiple signup confirmation Guest handoffs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-multi-confirmation-handoff-browser-smoke.mjs
      - name: Verify cross-tab authentication convergence
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-cross-tab-browser-smoke.mjs
      - name: Verify cross-tab failed sign-out convergence
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-cross-tab-signout-failure-browser.mjs
      - name: Verify Member removal failure authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-member-removal-failure-browser.mjs
      - name: Verify Member discard compatibility failure authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-member-compat-discard-failure-browser.mjs
      - name: Verify cross-tab authoritative session expiry
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-cross-tab-session-expired-browser-smoke.mjs
      - name: Verify canonical authentication rejection invalidation
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-rejection-browser.mjs
      - name: Verify exact rejected bearer race
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-exact-rejection-race-browser.mjs
      - name: Verify transient refresh Member retention
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/verify-web-auth-refresh-browser.mjs
          node scripts/verify-web-auth-refresh-commit-lock-browser.mjs
      - name: Verify cross-tab transient refresh Member retention
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-cross-tab-transient-refresh-browser.mjs
      - name: Verify refresh transport failure Member retention
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-refresh-network-browser.mjs
      - name: Verify malformed refresh Member retention
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-auth-refresh-malformed-browser.mjs
      - name: Verify Saju active bearer authority
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-saju-auth-browser.mjs
      - name: Verify Records active bearer binding
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-records-auth-browser.mjs
      - name: Verify Chat active bearer rejection
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-chat-auth-browser-smoke.mjs
      - name: Verify authentication confirmation handoff
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-auth-confirmation-browser-smoke.mjs
      - name: Verify My browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-my-browser.mjs
      - name: Verify My Birth Profile browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-web-my-birth-browser.mjs
      - name: Verify Birth session and duplicate-create guard
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/run-web-birth-session-browser-smoke-v2.mjs
          node scripts/verify-web-birth-member-replacement-browser.mjs
      - name: Verify conversation browser render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-web-conversation-browser-smoke.mjs
      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-reading-browser-smoke
          path: |
            artifacts/web-reading-browser-smoke*
            artifacts/web-golden-master-header-browser-smoke*
            artifacts/web-auth-browser-smoke*
            artifacts/web-auth-malformed-stored-member-browser-smoke*
            artifacts/web-auth-malformed-member-cleanup-failure-browser-smoke*
            artifacts/web-auth-signup-guest-bootstrap-browser-smoke*
            artifacts/web-auth-guest-bootstrap-singleflight-browser-smoke*
            artifacts/web-auth-guest-persistence-failure-browser-smoke*
            artifacts/web-auth-member-compat-staging-failure-browser-smoke*
            artifacts/web-auth-continuity-browser-smoke*
            artifacts/web-auth-failed-login-guest-browser-smoke*
            artifacts/web-auth-promotion-failure-browser-smoke*
            artifacts/web-auth-promotion-member-generation-browser-smoke*
            artifacts/web-auth-guest-removal-failure-browser-smoke*
            artifacts/web-auth-confirmation-handoff-browser-smoke*
            artifacts/web-auth-guest-bearer-canonicalization-browser-smoke*
            artifacts/web-auth-malformed-guest-cleanup-failure-browser-smoke*
            artifacts/web-auth-storage-read-failure-browser-smoke*
            artifacts/web-auth-confirmation-relogin-browser-smoke*
            artifacts/web-auth-multi-confirmation-handoff-browser-smoke*
            artifacts/web-auth-cross-tab-browser-smoke*
            artifacts/web-auth-cross-tab-signout-failure-browser-smoke*
            artifacts/web-auth-member-removal-failure-browser-smoke*
            artifacts/web-auth-member-compat-discard-failure-browser-smoke*
            artifacts/web-auth-cross-tab-session-expired-browser-smoke*
            artifacts/web-auth-rejection-browser-smoke*
            artifacts/web-auth-exact-rejection-race-browser-smoke*
            artifacts/web-auth-refresh-browser-smoke*
            artifacts/web-auth-refresh-commit-lock-browser-smoke*
            artifacts/web-auth-cross-tab-transient-refresh-browser-smoke*
            artifacts/web-auth-refresh-network-browser-smoke*
            artifacts/web-auth-refresh-malformed-browser-smoke*
            artifacts/web-saju-auth-browser-smoke*
            artifacts/web-records-auth-browser-smoke*
            artifacts/web-chat-auth-browser-smoke*
            artifacts/web-my-browser-smoke*
            artifacts/web-my-birth-browser-smoke*
            artifacts/web-birth-session-browser-smoke*
            artifacts/web-conversation-browser-smoke*
          if-no-files-found: ignore
