name: Account Deletion Hosted Auth Canary
run-name: "[WT:ops] Account Deletion Hosted Auth Canary"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE_SYNTHETIC_AUTH_USER_ONLY to run the disposable hosted Auth canary.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: account-deletion-hosted-auth-canary
  cancel-in-progress: false

jobs:
  hosted-auth-canary:
    name: hosted-auth-delete-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      MYEONGHA_SUPABASE_URL: https://cnsfpcdiyofqvhpcegfc.supabase.co
      MYEONGHA_HOSTED_AUTH_CANARY_CONFIRM: ${{ inputs.confirmation }}

    steps:
      - name: Require exact destructive-canary confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${MYEONGHA_HOSTED_AUTH_CANARY_CONFIRM}" != "DELETE_SYNTHETIC_AUTH_USER_ONLY" ]]; then
            echo "Hosted Auth canary confirmation token mismatch." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build server runtime
        run: npm run build

      - name: Run disposable hosted Auth delete canary
        env:
          MYEONGHA_SUPABASE_AUTH_ADMIN_SECRET: ${{ secrets.MYEONGHA_SUPABASE_AUTH_ADMIN_SECRET }}
        run: node scripts/run-account-deletion-hosted-auth-canary.mjs
