name: Face Reading Source Reproducible-Build Probe

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/face-reading-source-reproducible-build-probe.yml"
      - "scripts/face-reading-fr32-mediapipe-source-build-non-equivalence.mjs"
      - "packages/face-reading/src/mediapipe-source-build-non-equivalence-fr32.ts"
      - "test/face-reading-fr32-mediapipe-source-build-non-equivalence.test.ts"

permissions:
  contents: read

concurrency:
  group: face-reading-source-reproducible-build-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible-build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      USE_BAZEL_VERSION: "7.4.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pin Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install exact Bazel 7.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64
          chmod +x /tmp/bazel
          echo "/tmp" >> "$GITHUB_PATH"
          /tmp/bazel version | tee /tmp/bazel-version.txt
          grep -F "Build label: 7.4.1" /tmp/bazel-version.txt

      - name: Checkout exact MediaPipe source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.10.35 \
            https://github.com/google-ai-edge/mediapipe.git \
            /tmp/mediapipe
          cd /tmp/mediapipe
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "f8ef212d5c962c0e853db7e59d217056b187084b"

      - name: Preseed exact zlib 1.2.13 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bazel-distdir
          curl --fail --location --retry 3 --silent --show-error \
            --output /tmp/bazel-distdir/zlib-1.2.13.tar.gz \
            https://storage.googleapis.com/mirror.tensorflow.org/zlib.net/zlib-1.2.13.tar.gz
          echo "b3a24de97a8fdbc835b9833169501030b8977031bcb54b3b3ac13740f846ab30  /tmp/bazel-distdir/zlib-1.2.13.tar.gz" \
            | sha256sum --check --strict

      - name: Build public Tasks Vision npm tarball target
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mediapipe
          bazel \
            --host_jvm_args=-Djdk.tls.client.protocols=TLSv1.3,TLSv1.2 \
            build \
            --distdir=/tmp/bazel-distdir \
            --repo_env=HERMETIC_PYTHON_VERSION=3.12 \
            //mediapipe/tasks/web/vision:vision_pkg.tar

      - name: Measure source-built package against published npm artifact
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts/face-reading
          resolver_log="artifacts/face-reading/fr32-mediapipe-source-build-non-equivalence.log"
          : > "$resolver_log"

          cd /tmp/mediapipe
          mapfile -t archive_execpaths < <(
            bazel \
              --host_jvm_args=-Djdk.tls.client.protocols=TLSv1.3,TLSv1.2 \
              cquery \
              --distdir=/tmp/bazel-distdir \
              --repo_env=HERMETIC_PYTHON_VERSION=3.12 \
              --output=starlark \
              --starlark:expr='"\n".join([f.path for f in target.files.to_list()])' \
              //mediapipe/tasks/web/vision:vision_pkg.tar \
              | grep -E '(^|/)vision_pkg\.tgz$' \
              | sort -u
          )

          {
            printf 'FR-32 cquery archive execpaths:\n'
            if [ "${#archive_execpaths[@]}" -eq 0 ]; then
              printf '  <none>\n'
            else
              printf '  %s\n' "${archive_execpaths[@]}"
            fi
          } | tee -a "$GITHUB_WORKSPACE/$resolver_log"

          if [ "${#archive_execpaths[@]}" -ne 1 ]; then
            echo "FR-32 expected exactly one cquery vision_pkg.tgz output; found ${#archive_execpaths[@]}" \
              | tee -a "$GITHUB_WORKSPACE/$resolver_log" >&2
            exit 1
          fi

          execution_root="$(
            bazel \
              --host_jvm_args=-Djdk.tls.client.protocols=TLSv1.3,TLSv1.2 \
              info \
              --distdir=/tmp/bazel-distdir \
              --repo_env=HERMETIC_PYTHON_VERSION=3.12 \
              execution_root
          )"
          archive_execpath="${archive_execpaths[0]}"
          if [[ "$archive_execpath" = /* ]]; then
            source_archive="$archive_execpath"
          else
            source_archive="$execution_root/$archive_execpath"
          fi
          source_archive="$(realpath -e "$source_archive")"
          printf 'FR-32 selected source archive: %s\n' "$source_archive" \
            | tee -a "$GITHUB_WORKSPACE/$resolver_log"

          cd "$GITHUB_WORKSPACE"
          set +e
          node scripts/face-reading-fr32-mediapipe-source-build-non-equivalence.mjs \
            "$source_archive" \
            >> "$resolver_log" 2>&1
          status=$?
          set -e
          cat "$resolver_log"
          if [ -f artifacts/face-reading/fr32-mediapipe-source-build-non-equivalence.json ]; then
            cat artifacts/face-reading/fr32-mediapipe-source-build-non-equivalence.json
          fi
          exit "$status"

      - name: Upload FR-32 measurement diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr32-mediapipe-source-build-non-equivalence
          path: |
            artifacts/face-reading/fr32-mediapipe-source-build-non-equivalence.json
            artifacts/face-reading/fr32-mediapipe-source-build-non-equivalence.log
          if-no-files-found: error
          retention-days: 30
