name: "[WT:character-memory] 세연 최초 Production 게시"

on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-production-publication-v1.trigger'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH_SEYEON_PRODUCTION_V1 to run the one-time Production bootstrap.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seyeon-production-publication-v1
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  publish:
    name: publish-seyeon-production-v1
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact publication revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify governed one-time invocation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            [[ "$DISPATCH_CONFIRM" == 'PUBLISH_SEYEON_PRODUCTION_V1' ]]
          else
            [[ "${{ github.ref }}" == 'refs/heads/main' ]]
            trigger_value="$(tr -d '\r\n' < .github/seyeon-production-publication-v1.trigger)"
            [[ "$trigger_value" == 'fire-2026-10-07-v1' ]]
          fi
          test -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Publish approved Seyeon bundle and initial release
        shell: bash
        env:
          POOL_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
          POOL_PORT: '5432'
          POOL_DB: 'postgres'
          ADMIN_POOL_USER: postgres.cnsfpcdiyofqvhpcegfc
        run: bash scripts/operations/publish-seyeon-production-v1.sh
