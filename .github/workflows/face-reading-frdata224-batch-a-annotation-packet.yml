name: Face Reading FR-DATA-224 Batch A Annotation Packet

on:
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/independent-face-annotation-packet-frdata07c.ts'
      - 'packages/face-reading/src/index.ts'
      - 'scripts/face-reading/prepare-frdata224-batch-a-annotation-packet.mjs'
      - '.github/workflows/face-reading-frdata224-batch-a-annotation-packet.yml'

permissions:
  contents: write

jobs:
  prepare-frdata224-batch-a-annotation-packet:
    if: github.repository == 'gycha0109-beep/MyeongHa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Check packet generator syntax
        run: node --check scripts/face-reading/prepare-frdata224-batch-a-annotation-packet.mjs
      - name: Re-verify frozen Batch-A source evidence
        run: node scripts/face-reading/acquire-frdata224-batch-a.mjs verify-existing
      - name: Prepare provider-blind exact-byte annotation packet
        run: node scripts/face-reading/prepare-frdata224-batch-a-annotation-packet.mjs prepare
      - name: Re-verify generated packet and blindness wrapper
        run: node scripts/face-reading/prepare-frdata224-batch-a-annotation-packet.mjs verify-existing
      - name: Push packet-evidence review branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="evidence/frdata224-annotation-packet-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add research-evidence/face-reading/frdata224/batch-a/annotation-packet-v1
          git add research-evidence/face-reading/frdata224/batch-a/annotation-packet-v1-binding.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No annotation-packet evidence delta was produced"
            echo "EVIDENCE_BRANCH=" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "FR-DATA-224: prepare blinded Batch A annotation packet"
          git push origin "HEAD:refs/heads/$branch"
          echo "EVIDENCE_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Report packet evidence branch
        run: |
          if [ -n "${EVIDENCE_BRANCH:-}" ]; then
            echo "Created ${EVIDENCE_BRANCH} from main ${GITHUB_SHA}"
          else
            echo "Packet already matched governed output on main ${GITHUB_SHA}"
          fi
