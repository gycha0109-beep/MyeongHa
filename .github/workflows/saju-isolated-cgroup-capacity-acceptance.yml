name: Isolated Saju Engine CPU Memory Constraint Proof
run-name: "[WT:ops] Phase 11 actual Saju engine 0.5 CPU / 256 MiB constrained observation"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-operations-isolated-saju-cgroup-proof
  cancel-in-progress: false

jobs:
  isolated-saju-cgroup-proof:
    if: ${{ github.repository == 'gycha0109-beep/MyeongHa' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact MyeongHa main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout only public approved Saju engine revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gycha0109-beep/Saju
          ref: 9807ce89c08afc61b587560d515a475efd819032
          path: _isolated_saju
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build only isolated Saju calculation engine
        working-directory: _isolated_saju
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Measure actual Saju engine inside kernel CPU and memory limits
        shell: bash
        run: bash scripts/operations/run-isolated-saju-cgroup-phase11-ci.sh

      - name: Upload identifier-free constrained resource observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: isolated-saju-cgroup-phase11-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-ops-isolated-saju-cgroup-phase11-proof.json
          if-no-files-found: ignore
          retention-days: 14
