name: Production Character Roster Read Audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type READ_CHARACTER_ROSTER to read only the active Production character identifiers.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/production-character-roster-read.trigger'

permissions:
  contents: read

concurrency:
  group: production-character-roster-read-audit
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  audit:
    name: read-only-production-character-roster
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify governed read-only invocation and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            [[ "$DISPATCH_CONFIRM" == 'READ_CHARACTER_ROSTER' ]]
          else
            [[ "${{ github.ref }}" == 'refs/heads/main' ]]
            trigger_value="$(tr -d '\r' < .github/production-character-roster-read.trigger)"
            [[ "$trigger_value" =~ ^fire-[0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]+$ ]]
          fi
          test -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}"
          [[ "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]
          test -n "${SUPABASE_DB_PASSWORD:-}"
          [[ "$SUPABASE_PROJECT_ID" == 'cnsfpcdiyofqvhpcegfc' ]]

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bind governed production Session Pooler endpoint
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          admin_pool_user="postgres.$SUPABASE_PROJECT_ID"
          pool_host="$SUPABASE_PRODUCTION_SESSION_POOLER_HOST"
          pool_port='5432'
          pool_db='postgres'

          [[ "$admin_pool_user" == "postgres.$SUPABASE_PROJECT_ID" ]]
          [[ "$pool_host" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]
          [[ "$pool_port" == '5432' ]]
          [[ "$pool_db" == 'postgres' ]]

          echo "pool_host=$pool_host" >> "$GITHUB_OUTPUT"
          echo "pool_port=$pool_port" >> "$GITHUB_OUTPUT"
          echo "pool_db=$pool_db" >> "$GITHUB_OUTPUT"
          echo "admin_pool_user=$admin_pool_user" >> "$GITHUB_OUTPUT"

      - name: Read active Production canonical character roster
        shell: bash
        env:
          POOL_HOST: ${{ steps.endpoint.outputs.pool_host }}
          POOL_PORT: ${{ steps.endpoint.outputs.pool_port }}
          POOL_DB: ${{ steps.endpoint.outputs.pool_db }}
          ADMIN_POOL_USER: ${{ steps.endpoint.outputs.admin_pool_user }}
        run: bash scripts/run-production-character-roster-read-audit.sh
