name: Web Auth Browser Regression

on:
  pull_request:
    paths:
      - 'api/auth/**'
      - 'api/session/**'
      - 'apps/api/src/supabase-auth-*.ts'
      - 'apps/api/src/supabase-member-identity-verifier*.ts'
      - 'apps/api/src/guest-*.ts'
      - 'apps/api/src/production-guest-*.ts'
      - 'apps/web/auth*'
      - 'apps/web/product-auth*.js'
      - 'apps/web/src/auth/**'
      - 'packages/**'
      - 'scripts/*web-auth*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-browser-auth-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'api/auth/**'
      - 'api/session/**'
      - 'apps/api/src/supabase-auth-*.ts'
      - 'apps/api/src/supabase-member-identity-verifier*.ts'
      - 'apps/api/src/guest-*.ts'
      - 'apps/api/src/production-guest-*.ts'
      - 'apps/web/auth*'
      - 'apps/web/product-auth*.js'
      - 'apps/web/src/auth/**'
      - 'packages/**'
      - 'scripts/*web-auth*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-browser-auth-regression.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-browser-shard:
    name: auth-browser-regression (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            command: |
              set -euo pipefail
              node scripts/verify-web-auth-malformed-stored-member-browser.mjs
              node scripts/verify-web-auth-malformed-member-cleanup-failure-browser.mjs
              node scripts/run-web-auth-signup-guest-bootstrap-browser-smoke.mjs
              node scripts/run-web-auth-guest-bootstrap-singleflight-browser-smoke.mjs
              node scripts/verify-web-auth-guest-persistence-failure-browser.mjs
              node scripts/verify-web-auth-member-compat-staging-failure-browser.mjs
              node scripts/verify-web-auth-continuity-browser.mjs
              node scripts/verify-web-auth-failed-login-guest-browser.mjs
              node scripts/verify-web-auth-promotion-failure-browser.mjs
              node scripts/verify-web-auth-promotion-member-generation-browser.mjs
              node scripts/verify-web-auth-guest-removal-failure-browser.mjs
              node scripts/run-web-auth-confirmation-handoff-browser-smoke.mjs
              node scripts/run-web-auth-guest-bearer-canonicalization-browser-smoke.mjs
              node scripts/verify-web-auth-malformed-guest-cleanup-failure-browser.mjs
              node scripts/verify-web-auth-storage-read-failure-browser.mjs
          - shard: 2
            command: |
              set -euo pipefail
              node scripts/run-web-auth-confirmation-relogin-browser-smoke.mjs
              node scripts/run-web-auth-multi-confirmation-handoff-browser-smoke.mjs
              node scripts/run-web-auth-cross-tab-browser-smoke.mjs
              node scripts/verify-web-auth-cross-tab-signout-failure-browser.mjs
              node scripts/verify-web-auth-member-removal-failure-browser.mjs
              node scripts/verify-web-auth-member-compat-discard-failure-browser.mjs
              node scripts/run-web-auth-cross-tab-session-expired-browser-smoke.mjs
              node scripts/verify-web-auth-rejection-browser.mjs
              node scripts/verify-web-auth-exact-rejection-race-browser.mjs
              node scripts/verify-web-auth-refresh-browser.mjs
              node scripts/verify-web-auth-refresh-commit-lock-browser.mjs
              node scripts/verify-web-auth-cross-tab-transient-refresh-browser.mjs
              node scripts/verify-web-auth-refresh-network-browser.mjs
              node scripts/verify-web-auth-refresh-malformed-browser.mjs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static web
        run: npm run build:web
      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Run auth browser regression shard
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ${{ matrix.command }}
      - name: Upload auth regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-auth-browser-regression-${{ matrix.shard }}
          path: |
            artifacts/web-auth-*
          if-no-files-found: ignore

  auth-browser-regression:
    name: auth-browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - auth-browser-shard
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Require every auth browser shard
        env:
          SHARD_RESULT: ${{ needs.auth-browser-shard.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SHARD_RESULT" = "success"
