name: Yeoul Luna OpenRouter read-only one-time run audit

on:
  pull_request:
    paths:
      - '.github/workflows/yeoul-luna-run-audit-pr-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  read-one-shot:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read prior Luna one-shot run metadata and synthetic reply log markers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          WF="yeoul-luna-openrouter-live-once-v1.yml"
          printf '%s\n' '--- OpenRouter Luna one-shot execution list (public metadata only) ---'
          gh api "repos/$REPO/actions/workflows/$WF/runs?per_page=10" \
            --jq '[.workflow_runs[] | {id,status,conclusion,event,head_sha,html_url}]'
          ID="$(gh api "repos/$REPO/actions/workflows/$WF/runs?per_page=10" --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$ID" ]]; then
            echo "LUNA_RUN_AUDIT:NO_RUN_FOUND"
            exit 0
          fi
          printf '%s\n' "--- One-shot $ID exact job names and states ---"
          gh api "repos/$REPO/actions/runs/$ID/jobs?per_page=100" \
            --jq '[.jobs[] | {id,name,status,conclusion,steps:[.steps[]? | {name,status,conclusion}]}]'
          printf '%s\n' "--- Read-only log filter: no secrets, only synthetic reply or status markers ---"
          gh run view "$ID" -R "$REPO" --log 2>/dev/null | \
            grep -E 'YEOUL_SYNTHETIC_REPLY|LUNA_PAID_ONE_SHOT|LUNA_ONE_SHOT_HOLD|SYNTHETIC_PLAN_READY' || true
          printf '%s\n' "--- Encrypted artifacts metadata only ---"
          gh api "repos/$REPO/actions/runs/$ID/artifacts?per_page=100" \
            --jq '{total_count,artifacts:[.artifacts[] | {id,name,size_in_bytes,expired}]}'
