name: "[WT:character-runtime-lab] Yeoul distinctive voice GPT-6 Luna A/B"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yeoul-distinctive-voice-ab-20261119
  cancel-in-progress: false
jobs:
  compare:
    if: ${{ github.actor == 'gycha0109-beep' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify A/B context identical
        run: |
          node --check scripts/character-optimization/yeoul-voice-system-v2.mjs
          node --check scripts/character-optimization/yeoul-voice-ab-live-v1.mjs
          node scripts/character-optimization/yeoul-voice-ab-live-v1.mjs --plan-only
      - name: Compare eight voice pairs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/character-optimization/yeoul-voice-ab-live-v1.mjs
      - name: Upload response pairs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-voice-ab-${{ github.run_id }}
          path: yeoul-voice-ab-live-results.json
          retention-days: 7
          if-no-files-found: ignore
