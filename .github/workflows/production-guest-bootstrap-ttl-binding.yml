name: Production Guest Bootstrap TTL Binding

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BIND_GUEST_TTL to bind the decided Guest authentication TTL without deploying routes.'
        required: true
        type: string
      ttl_seconds:
        description: 'Enter the decided P0-PR-01A Guest authentication TTL in seconds: 604800.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-guest-bootstrap-ttl-binding
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha
  DECIDED_GUEST_SESSION_TTL_SECONDS: '604800'

jobs:
  bind:
    name: bind-production-guest-bootstrap-ttl
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      GUEST_SESSION_TTL_SECONDS: ${{ inputs.ttl_seconds }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify explicit dispatch and decided TTL input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRM" == 'BIND_GUEST_TTL' ]]
          [[ "$GUEST_SESSION_TTL_SECONDS" =~ ^[1-9][0-9]*$ ]]
          [[ "$GUEST_SESSION_TTL_SECONDS" == "$DECIDED_GUEST_SESSION_TTL_SECONDS" ]]
          test -n "${VERCEL_TOKEN:-}"

      - name: Verify governed Vercel production project
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          project_file="$RUNNER_TEMP/vercel-project.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$project_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            -o "$project_file"

          jq -e \
            --arg id "$VERCEL_PROJECT_ID" \
            --arg name "$VERCEL_PROJECT_NAME" \
            '.id == $id and .name == $name' \
            "$project_file" >/dev/null

      - name: Bind and verify Guest session TTL in Vercel production
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          payload_file="$RUNNER_TEMP/vercel-guest-bootstrap-ttl.json"
          response_file="$RUNNER_TEMP/vercel-guest-bootstrap-ttl-response.json"
          readback_file="$RUNNER_TEMP/vercel-guest-bootstrap-ttl-readback.json"

          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$payload_file" "$response_file" "$readback_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          jq -n \
            --arg ttl "$GUEST_SESSION_TTL_SECONDS" \
            '[
              {
                key: "MYEONGHA_GUEST_SESSION_TTL_SECONDS",
                value: $ttl,
                type: "encrypted",
                target: ["production"],
                comment: "MyeongHa P0-PR-01A Guest authentication TTL binding v1"
              }
            ]' > "$payload_file"

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload_file" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            -o "$response_file"

          jq -e '((.failed // []) | length) == 0' "$response_file" >/dev/null

          env_id="$(jq -er '
            if (.created | type) == "array" then
              ([.created[] | select(.key == "MYEONGHA_GUEST_SESSION_TTL_SECONDS") | .id][0] // empty)
            elif (.created | type) == "object" and .created.key == "MYEONGHA_GUEST_SESSION_TTL_SECONDS" then
              (.created.id // empty)
            else
              empty
            end
          ' "$response_file")"
          test -n "$env_id"

          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/env/$env_id?teamId=$VERCEL_TEAM_ID" \
            -o "$readback_file"

          jq -e \
            --arg ttl "$DECIDED_GUEST_SESSION_TTL_SECONDS" \
            '.key == "MYEONGHA_GUEST_SESSION_TTL_SECONDS"
              and .type == "encrypted"
              and (.target | type) == "array"
              and (.target | index("production")) != null
              and .value == $ttl' \
            "$readback_file" >/dev/null

          echo 'Decided Guest authentication TTL 604800 was bound and verified in Vercel production. No deployment or route activation was performed.'
