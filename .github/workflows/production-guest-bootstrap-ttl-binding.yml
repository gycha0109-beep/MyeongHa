name: Production Guest Bootstrap TTL Binding

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BIND_GUEST_TTL to bind an already-approved Guest session TTL without deploying routes.'
        required: true
        type: string
      ttl_seconds:
        description: 'Approved Guest session TTL in seconds. No repository default is provided.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-guest-bootstrap-ttl-binding
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha

jobs:
  bind:
    name: bind-production-guest-bootstrap-ttl
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      GUEST_SESSION_TTL_SECONDS: ${{ inputs.ttl_seconds }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify explicit dispatch and approved TTL input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRM" == 'BIND_GUEST_TTL' ]]
          [[ "$GUEST_SESSION_TTL_SECONDS" =~ ^[1-9][0-9]*$ ]]
          test -n "${VERCEL_TOKEN:-}"

      - name: Verify governed Vercel production project
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          project_file="$RUNNER_TEMP/vercel-project.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$project_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            -o "$project_file"

          jq -e \
            --arg id "$VERCEL_PROJECT_ID" \
            --arg name "$VERCEL_PROJECT_NAME" \
            '.id == $id and .name == $name' \
            "$project_file" >/dev/null

      - name: Bind Guest session TTL to Vercel production
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          payload_file="$RUNNER_TEMP/vercel-guest-bootstrap-ttl.json"
          response_file="$RUNNER_TEMP/vercel-guest-bootstrap-ttl-response.json"

          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$payload_file" "$response_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          jq -n \
            --arg ttl "$GUEST_SESSION_TTL_SECONDS" \
            '[
              {
                key: "MYEONGHA_GUEST_SESSION_TTL_SECONDS",
                value: $ttl,
                type: "encrypted",
                target: ["production"],
                comment: "MyeongHa approved production Guest session TTL binding v1"
              }
            ]' > "$payload_file"

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload_file" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            -o "$response_file"

          jq -e '((.failed // []) | length) == 0' "$response_file" >/dev/null

          echo 'Approved Guest session TTL was bound to Vercel production. No deployment or route activation was performed.'
