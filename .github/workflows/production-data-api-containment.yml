name: Production Data API Surface Containment
run-name: "[WT:ops] Production Data API Surface Containment"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Contain removes product schemas; rollback restores the baseline; verify-least-privilege proves the scoped Management PAT boundary without changing logical state.'
        required: true
        type: choice
        default: contain
        options:
          - contain
          - rollback
          - verify-least-privilege
      confirm:
        description: 'contain: DISABLE_PRODUCT_DATA_API / rollback: RESTORE_PRODUCT_DATA_API / verify-least-privilege: VERIFY_SUPABASE_MANAGEMENT_TOKEN_LEAST_PRIVILEGE'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-data-api-surface-containment
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  containment:
    if: ${{ inputs.mode == 'contain' || inputs.mode == 'rollback' }}
    name: guarded-postgrest-schema-containment
    runs-on: ubuntu-24.04
    environment: production
    env:
      CONTAINMENT_MODE: ${{ inputs.mode }}
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify explicit production action
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" == 'cnsfpcdiyofqvhpcegfc' ]]
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          case "$CONTAINMENT_MODE" in
            contain)
              [[ "$DISPATCH_CONFIRM" == 'DISABLE_PRODUCT_DATA_API' ]]
              ;;
            rollback)
              [[ "$DISPATCH_CONFIRM" == 'RESTORE_PRODUCT_DATA_API' ]]
              ;;
            *)
              echo 'Unsupported containment mode.' >&2
              exit 1
              ;;
          esac

      - name: Set up Node 24 for governed runtime smoke
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Bootstrap and preflight governed Guest canonical-subject path
        env:
          CONTAINMENT_RUNTIME_SMOKE_MODE: bootstrap
          RUNTIME_SMOKE_STATE_PATH: ${{ runner.temp }}/myeongha-data-api-containment-runtime-smoke.json
        run: node scripts/verify-production-data-api-containment-guest-runtime.mjs

      - name: Apply guarded Data API surface transition
        shell: bash
        run: bash scripts/run-production-data-api-containment.sh

      - name: Verify governed application health remains available
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/myeongha-health.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$response_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          http_status="$(curl -sS \
            -o "$response_file" \
            -w '%{http_code}' \
            --connect-timeout 5 \
            --max-time 15 \
            -H 'Accept: application/json' \
            'https://myeongha.vercel.app/api/health')"

          [[ "$http_status" == '200' ]]
          jq -e 'type == "object" and .status == "ok" and length == 1' "$response_file" >/dev/null

      - name: Verify governed Guest canonical-subject path after transition
        env:
          CONTAINMENT_RUNTIME_SMOKE_MODE: verify
          RUNTIME_SMOKE_STATE_PATH: ${{ runner.temp }}/myeongha-data-api-containment-runtime-smoke.json
        run: node scripts/verify-production-data-api-containment-guest-runtime.mjs

      - name: Remove runtime smoke credential material
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/myeongha-data-api-containment-runtime-smoke.json"

      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-data-api-containment-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-data-api-containment
          if-no-files-found: warn
          retention-days: 14

  least-privilege-evidence:
    if: ${{ inputs.mode == 'verify-least-privilege' }}
    name: verify-supabase-management-token-least-privilege
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify explicit least-privilege evidence authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" == 'cnsfpcdiyofqvhpcegfc' ]]
          [[ "$DISPATCH_CONFIRM" == 'VERIFY_SUPABASE_MANAGEMENT_TOKEN_LEAST_PRIVILEGE' ]]
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Verify scoped Management PAT least privilege
        shell: bash
        run: bash scripts/operations/verify-production-supabase-management-token-least-privilege.sh

      - name: Upload least-privilege evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-supabase-management-token-least-privilege-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-supabase-management-token-least-privilege
          if-no-files-found: warn
          retention-days: 14
