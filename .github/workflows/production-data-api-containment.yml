name: Production Data API Surface Containment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Contain removes product schemas from the Data API; rollback restores the captured baseline schema list.'
        required: true
        type: choice
        default: contain
        options:
          - contain
          - rollback
      confirm:
        description: 'contain: DISABLE_PRODUCT_DATA_API / rollback: RESTORE_PRODUCT_DATA_API'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-data-api-surface-containment
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc
  RUNTIME_DB_PRINCIPAL: myeongha_runtime
  API_EXECUTION_ROLE: myeongha_api_executor

jobs:
  containment:
    name: guarded-postgrest-schema-containment
    runs-on: ubuntu-24.04
    environment: production
    env:
      CONTAINMENT_MODE: ${{ inputs.mode }}
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify explicit production action
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" == 'cnsfpcdiyofqvhpcegfc' ]]
          [[ "$RUNTIME_DB_PRINCIPAL" == 'myeongha_runtime' ]]
          [[ "$API_EXECUTION_ROLE" == 'myeongha_api_executor' ]]
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          case "$CONTAINMENT_MODE" in
            contain)
              [[ "$DISPATCH_CONFIRM" == 'DISABLE_PRODUCT_DATA_API' ]]
              ;;
            rollback)
              [[ "$DISPATCH_CONFIRM" == 'RESTORE_PRODUCT_DATA_API' ]]
              ;;
            *)
              echo 'Unsupported containment mode.' >&2
              exit 1
              ;;
          esac

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve governed production pooler endpoint
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          pooler_file="$RUNNER_TEMP/myeongha-data-api-containment-pooler.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$pooler_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler" \
            -o "$pooler_file"

          pooler_record="$({
            jq -ce '
              (if type == "array" then . elif (.data? | type) == "array" then .data else [.] end)
              | map(
                  select((.database_type // "") == "PRIMARY")
                  | . + {
                      resolved_connection_string:
                        (.connection_string // .connectionString // "")
                    }
                )
              | map(
                  select(
                    (.resolved_connection_string | type) == "string"
                    and (.resolved_connection_string | length) > 0
                    and (.resolved_connection_string
                      | test("\\.pooler\\.supabase\\.com:(5432|6543)/postgres(?:\\?|$)"))
                  )
                )
              | sort_by(
                  if (.resolved_connection_string | test(":5432/postgres(?:\\?|$)"))
                  then 0
                  else 1
                  end
                )
              | first // empty
            ' "$pooler_file"
          })"
          test -n "$pooler_record"

          connection_string="$(jq -r '.resolved_connection_string // empty' <<<"$pooler_record")"
          test -n "$connection_string"

          admin_pool_user="$(sed -E 's#^[a-zA-Z0-9+.-]+://([^:]+):.*#\1#' <<<"$connection_string")"
          pool_host="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\1#' <<<"$connection_string")"
          pool_port="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\2#' <<<"$connection_string")"
          pool_db="$(sed -E 's#^[^@]+@[^/]+/([^?]+).*$#\1#' <<<"$connection_string")"

          [[ "$admin_pool_user" == "postgres.$SUPABASE_PROJECT_ID" ]]
          [[ "$pool_host" == *.pooler.supabase.com ]]
          [[ "$pool_port" == '5432' || "$pool_port" == '6543' ]]
          [[ "$pool_db" == 'postgres' ]]

          echo "pool_host=$pool_host" >> "$GITHUB_OUTPUT"
          echo "pool_port=$pool_port" >> "$GITHUB_OUTPUT"
          echo "pool_db=$pool_db" >> "$GITHUB_OUTPUT"
          echo "admin_pool_user=$admin_pool_user" >> "$GITHUB_OUTPUT"

      - name: Preflight direct PostgreSQL execution authority
        shell: bash
        env:
          POOL_HOST: ${{ steps.endpoint.outputs.pool_host }}
          POOL_PORT: ${{ steps.endpoint.outputs.pool_port }}
          POOL_DB: ${{ steps.endpoint.outputs.pool_db }}
          ADMIN_POOL_USER: ${{ steps.endpoint.outputs.admin_pool_user }}
        run: bash scripts/verify-production-data-api-containment-direct-db.sh

      - name: Apply guarded Data API surface transition
        shell: bash
        run: bash scripts/run-production-data-api-containment.sh

      - name: Verify governed application health remains available
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/myeongha-health.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$response_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          http_status="$(curl -sS \
            -o "$response_file" \
            -w '%{http_code}' \
            --connect-timeout 5 \
            --max-time 15 \
            -H 'Accept: application/json' \
            'https://myeongha.vercel.app/api/health')"

          [[ "$http_status" == '200' ]]
          jq -e 'type == "object" and .status == "ok" and length == 1' "$response_file" >/dev/null

      - name: Verify direct PostgreSQL execution authority after transition
        shell: bash
        env:
          POOL_HOST: ${{ steps.endpoint.outputs.pool_host }}
          POOL_PORT: ${{ steps.endpoint.outputs.pool_port }}
          POOL_DB: ${{ steps.endpoint.outputs.pool_db }}
          ADMIN_POOL_USER: ${{ steps.endpoint.outputs.admin_pool_user }}
        run: bash scripts/verify-production-data-api-containment-direct-db.sh

      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-data-api-containment-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-data-api-containment
          if-no-files-found: warn
          retention-days: 14
