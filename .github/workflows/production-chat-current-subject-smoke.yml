name: Production Chat Current-Subject Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_CHAT_CURRENT_SUBJECT to run the production Chat current-subject smoke.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/production-chat-current-subject-smoke.trigger'

permissions:
  contents: read

concurrency:
  group: production-chat-current-subject-smoke
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  verify:
    name: verify-production-chat-current-subject
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MYEONGHA_PRODUCTION_MEMBER_EMAIL: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EMAIL }}
      MYEONGHA_PRODUCTION_MEMBER_PASSWORD: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_PASSWORD }}
      MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}
    steps:
      - name: Verify governed invocation and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            [[ "$DISPATCH_CONFIRM" == 'VERIFY_CHAT_CURRENT_SUBJECT' ]]
          else
            [[ "${{ github.ref }}" == 'refs/heads/main' ]]
            trigger_value="$(tr -d '\r' < .github/production-chat-current-subject-smoke.trigger)"
            [[ "$trigger_value" =~ ^fire-[0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]+$ ]]
          fi
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EMAIL:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_PASSWORD:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID:-}"
          [[ "$SUPABASE_PROJECT_ID" == 'cnsfpcdiyofqvhpcegfc' ]]

      - name: Check out exact repository verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve governed production pooler endpoint
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pooler_file="$RUNNER_TEMP/myeongha-chat-smoke-pooler.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$pooler_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler" \
            -o "$pooler_file"

          pooler_record="$({
            jq -ce '
              (if type == "array" then . elif (.data? | type) == "array" then .data else [.] end)
              | map(select((.database_type // "") == "PRIMARY") | . + {resolved_connection_string: (.connection_string // .connectionString // "")})
              | map(select((.resolved_connection_string | type) == "string" and (.resolved_connection_string | length) > 0 and (.resolved_connection_string | test("\\.pooler\\.supabase\\.com:(5432|6543)/postgres(?:\\?|$)"))))
              | sort_by(if (.resolved_connection_string | test(":5432/postgres(?:\\?|$)")) then 0 else 1 end)
              | first // empty
            ' "$pooler_file"
          })"
          test -n "$pooler_record"

          connection_string="$(jq -r '.resolved_connection_string // empty' <<<"$pooler_record")"
          test -n "$connection_string"
          admin_pool_user="$(sed -E 's#^[a-zA-Z0-9+.-]+://([^:]+):.*#\1#' <<<"$connection_string")"
          pool_host="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\1#' <<<"$connection_string")"
          pool_port="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\2#' <<<"$connection_string")"
          pool_db="$(sed -E 's#^[^@]+@[^/]+/([^?]+).*$#\1#' <<<"$connection_string")"

          [[ "$admin_pool_user" == "postgres.$SUPABASE_PROJECT_ID" ]]
          [[ "$pool_host" == *.pooler.supabase.com ]]
          [[ "$pool_port" == '5432' || "$pool_port" == '6543' ]]
          [[ "$pool_db" == 'postgres' ]]

          echo "pool_host=$pool_host" >> "$GITHUB_OUTPUT"
          echo "pool_port=$pool_port" >> "$GITHUB_OUTPUT"
          echo "pool_db=$pool_db" >> "$GITHUB_OUTPUT"
          echo "admin_pool_user=$admin_pool_user" >> "$GITHUB_OUTPUT"

      - name: Verify production Member Chat current-subject continuity
        shell: bash
        env:
          POOL_HOST: ${{ steps.endpoint.outputs.pool_host }}
          POOL_PORT: ${{ steps.endpoint.outputs.pool_port }}
          POOL_DB: ${{ steps.endpoint.outputs.pool_db }}
          ADMIN_POOL_USER: ${{ steps.endpoint.outputs.admin_pool_user }}
        run: bash scripts/run-production-member-chat-read-smoke.sh
