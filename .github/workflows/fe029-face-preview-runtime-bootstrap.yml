name: FE029 Face Preview Runtime Bootstrap

on:
  pull_request:
    paths:
      - 'apps/web/src/face-preview/runtime-bootstrap.ts'
      - 'apps/web/src/face-preview/runtime-bootstrap.test.ts'
      - 'docs/face-engine/fe029-face-preview-runtime-bootstrap.md'
      - '.github/workflows/fe029-face-preview-runtime-bootstrap.yml'

permissions:
  contents: read

jobs:
  verify-fe029-runtime-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify FE029 bootstrap
        run: npx vitest run apps/web/src/face-preview/runtime-bootstrap.test.ts apps/web/src/face-preview/consumer-adapter.test.ts
