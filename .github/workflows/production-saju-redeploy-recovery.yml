name: Production Saju Redeploy Recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REDEPLOY_SAJU_PRODUCTION to redeploy the exact main production revision.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-saju-redeploy-recovery.yml

permissions:
  contents: read

concurrency:
  group: production-saju-redeploy-recovery
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_TEAM_SLUG: johnny-self
  VERCEL_PROJECT_NAME: myeongha
  VERCEL_CLI_VERSION: 59.11.7
  CANONICAL_PRODUCTION_HOST: myeongha.vercel.app

jobs:
  redeploy:
    name: redeploy-exact-main-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify governed trigger and credential
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$DISPATCH_CONFIRM" == 'REDEPLOY_SAJU_PRODUCTION' ]]
              ;;
            push)
              [[ "$GITHUB_REF" == 'refs/heads/main' ]]
              ;;
            *)
              echo "Unsupported trigger: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          test -n "${VERCEL_TOKEN:-}"

      - name: Verify governed Vercel project
        shell: bash
        run: |
          set -euo pipefail
          project_file="$RUNNER_TEMP/vercel-project.json"
          trap 'rm -f "$project_file"' EXIT
          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            -o "$project_file"
          jq -e \
            --arg project_id "$VERCEL_PROJECT_ID" \
            --arg project_name "$VERCEL_PROJECT_NAME" '
              (.id // "") == $project_id and (.name // "") == $project_name
            ' "$project_file" >/dev/null
          echo 'Governed Vercel project verified.'

      - name: Wait for this exact main revision production deployment
        id: source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          deployments_file="$RUNNER_TEMP/vercel-deployments.json"
          candidate_file="$RUNNER_TEMP/vercel-source-deployment.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$deployments_file" "$candidate_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=20&teamId=$VERCEL_TEAM_ID" \
              -o "$deployments_file"

            jq -ce \
              --arg sha "$GITHUB_SHA" '
                [.deployments[]
                  | select(
                      (.meta.githubCommitSha // "") == $sha
                      and (.target // "") == "production"
                    )]
                | sort_by(.created // 0)
                | last // empty
              ' "$deployments_file" > "$candidate_file" || true

            if [[ -s "$candidate_file" ]]; then
              source_state="$(jq -r '.state // .readyState // empty' "$candidate_file")"
              source_id="$(jq -r '.uid // .id // empty' "$candidate_file")"
              test -n "$source_id"
              case "$source_state" in
                READY)
                  echo "deployment_id=$source_id" >> "$GITHUB_OUTPUT"
                  echo 'Exact main revision production deployment is READY.'
                  exit 0
                  ;;
                ERROR|CANCELED)
                  echo 'Exact main revision production deployment entered a terminal state.' >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          echo 'Timed out waiting for the exact main revision production deployment.' >&2
          exit 1

      - name: Redeploy exact main revision with pinned Vercel CLI
        id: redeploy
        shell: bash
        env:
          SOURCE_DEPLOYMENT_ID: ${{ steps.source.outputs.deployment_id }}
        run: |
          set -euo pipefail
          umask 077
          stdout_file="$RUNNER_TEMP/vercel-redeploy-stdout.txt"
          stderr_file="$RUNNER_TEMP/vercel-redeploy-stderr.txt"
          deployments_file="$RUNNER_TEMP/vercel-redeployments.json"
          candidate_file="$RUNNER_TEMP/vercel-redeployment-candidate.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$stdout_file" "$stderr_file" "$deployments_file" "$candidate_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          test -n "$SOURCE_DEPLOYMENT_ID"
          test -n "$VERCEL_TEAM_SLUG"

          if ! npx --yes "vercel@$VERCEL_CLI_VERSION" redeploy "$SOURCE_DEPLOYMENT_ID" \
            --target=production \
            --scope "$VERCEL_TEAM_SLUG" \
            --no-wait \
            --no-color \
            >"$stdout_file" 2>"$stderr_file"; then
            echo 'Pinned Vercel CLI redeploy failed.' >&2
            exit 1
          fi

          redeploy_url="$(tail -n 1 "$stdout_file" | tr -d '\r' | xargs)"
          REDEPLOY_URL="$redeploy_url" node --input-type=module - <<'NODE'
          const value = process.env.REDEPLOY_URL ?? '';
          let parsed;
          try {
            parsed = new URL(value);
          } catch {
            console.error('Vercel CLI redeploy stdout was not an HTTPS deployment URL.');
            process.exit(1);
          }
          if (parsed.protocol !== 'https:' || parsed.username || parsed.password || parsed.port || parsed.pathname !== '/' || parsed.search || parsed.hash) {
            console.error('Vercel CLI redeploy stdout was not an exact HTTPS origin.');
            process.exit(1);
          }
          NODE

          redeploy_host="${redeploy_url#https://}"
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=20&teamId=$VERCEL_TEAM_ID" \
              -o "$deployments_file"

            jq -ce \
              --arg host "$redeploy_host" \
              --arg sha "$GITHUB_SHA" '
                [.deployments[]
                  | select(
                      (.url // "") == $host
                      and (.meta.githubCommitSha // "") == $sha
                      and (.target // "") == "production"
                    )]
                | sort_by(.created // 0)
                | last // empty
              ' "$deployments_file" > "$candidate_file" || true

            if [[ -s "$candidate_file" ]]; then
              redeploy_id="$(jq -r '.uid // .id // empty' "$candidate_file")"
              test -n "$redeploy_id"
              echo "deployment_id=$redeploy_id" >> "$GITHUB_OUTPUT"
              echo 'Pinned Vercel CLI redeploy was created for the exact main revision.'
              exit 0
            fi
            sleep 5
          done

          echo 'Timed out resolving the pinned-CLI redeploy to the exact main revision.' >&2
          exit 1

      - name: Verify redeploy READY and exact revision
        shell: bash
        env:
          REDEPLOYMENT_ID: ${{ steps.redeploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          umask 077
          deployment_file="$RUNNER_TEMP/vercel-redeployment.json"
          trap 'rm -f "$deployment_file"' EXIT
          test -n "$REDEPLOYMENT_ID"

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$REDEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID" \
              -o "$deployment_file"
            state="$(jq -r '.readyState // .state // .status // empty' "$deployment_file")"
            case "$state" in
              READY)
                jq -e \
                  --arg project_id "$VERCEL_PROJECT_ID" \
                  --arg sha "$GITHUB_SHA" '
                    (.projectId // "") == $project_id
                    and (.target // "") == "production"
                    and (.meta.githubCommitSha // "") == $sha
                  ' "$deployment_file" >/dev/null
                echo 'Redeployed production is READY on the exact main revision.'
                exit 0
                ;;
              ERROR|CANCELED)
                echo 'Production redeploy entered a terminal state.' >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for production redeploy readiness.' >&2
          exit 1

      - name: Verify canonical alias and Saju readiness
        shell: bash
        env:
          REDEPLOYMENT_ID: ${{ steps.redeploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          umask 077
          aliases_file="$RUNNER_TEMP/vercel-redeployment-aliases.json"
          readiness_file="$RUNNER_TEMP/myeongha-readiness.json"
          cleanup() {
            exit_code=$?
            trap - EXIT
            rm -f "$aliases_file" "$readiness_file"
            exit "$exit_code"
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/deployments/$REDEPLOYMENT_ID/aliases?teamId=$VERCEL_TEAM_ID" \
              -o "$aliases_file"
            if jq -e \
              --arg alias "$CANONICAL_PRODUCTION_HOST" \
              '(.aliases | type) == "array" and any(.aliases[]; .alias == $alias)' \
              "$aliases_file" >/dev/null; then
              break
            fi
            sleep 5
          done

          jq -e \
            --arg alias "$CANONICAL_PRODUCTION_HOST" \
            '(.aliases | type) == "array" and any(.aliases[]; .alias == $alias)' \
            "$aliases_file" >/dev/null

          curl -fsS \
            -H 'Cache-Control: no-cache' \
            "https://$CANONICAL_PRODUCTION_HOST/api/readiness" \
            -o "$readiness_file"
          jq -e '
            .status == "ready"
            and .capabilities.userData == "ready"
            and .capabilities.sajuCalculation == "ready"
          ' "$readiness_file" >/dev/null
          echo 'Canonical production alias is attached and Saju runtime configuration is ready.'
