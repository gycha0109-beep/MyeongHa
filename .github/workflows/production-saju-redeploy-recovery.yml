name: Production Saju Redeploy Recovery
run-name: "[WT:ops] Production Saju Redeploy Recovery"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REDEPLOY_SAJU_PRODUCTION to redeploy the exact main production revision.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/production-saju-redeploy.trigger

permissions:
  contents: read

concurrency:
  group: production-saju-redeploy-recovery
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha
  CANONICAL_PRODUCTION_HOST: myeongha.vercel.app

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Redeploy exact main production revision
        run: bash scripts/operations/run-production-saju-redeploy-recovery.sh
