name: Dispatch Production Privacy Canary Resume 35643425819

on:
  push:
    branches:
      - ops/dispatch-production-privacy-canary-resume-35643425819-20260922

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: dispatch-production-privacy-recovery-canary-resume
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact-main resume canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 12ba80350423a74196cfc41099a13859c983e987
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error title=Production privacy canary dispatch blocked::main moved from expected SHA."
            exit 1
          }

          gh workflow run production-privacy-recovery-canary.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation=RUN_SYNTHETIC_PRODUCTION_PRIVACY_CANARY \
            -f watchtower_track=ops \
            -f operation=resume \
            -f resume_canary_run_id=35643425819 \
            -f resume_backup_run_id=35643472159 \
            -f worker_credential_action=sync_from_secret \
            -f worker_credential_confirmation=SYNC_PRODUCTION_WORKER_PASSWORD
