name: Face Reading Image Dimension Verification

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/image-byte-dimensions-frdata02.ts'
      - 'packages/face-reading/src/menton-dataset-intake-frdata01.ts'
      - 'packages/face-reading/src/index.ts'
      - 'scripts/face-reading-fr-data01-menton-dataset-intake.mjs'
      - 'scripts/face-reading-fr-data02-image-dimensions.mjs'
      - 'test/face-reading-fr-data02-image-dimensions.test.ts'
      - 'docs/FACE_READING_FR_DATA02_IMAGE_DIMENSION_VERIFICATION.md'
      - '.github/workflows/face-reading-image-dimension-verification.yml'
  workflow_dispatch:

jobs:
  fr-data02-dimensions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Create deterministic PNG-header intake fixture
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdir, writeFile } from 'node:fs/promises';
          const root = 'artifacts/face-reading/fr-data02-selftest';
          const assetRoot = `${root}/assets`;
          await mkdir(`${assetRoot}/subject-calibration`, { recursive: true });
          const bytes = Buffer.alloc(24);
          Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]).copy(bytes, 0);
          bytes.writeUInt32BE(13, 8);
          bytes.write('IHDR', 12, 'ascii');
          bytes.writeUInt32BE(1080, 16);
          bytes.writeUInt32BE(1440, 20);
          const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          await writeFile(`${assetRoot}/subject-calibration/baseline.png`, bytes);
          const manifest = {
            schemaVersion: 'fr-data01-intake-v1',
            dataset: {
              schemaVersion: 'fr47-dataset-v1',
              datasetRef: 'dataset.fr-data02.workflow-selftest',
              subjects: [{ subjectRef: 'subject-calibration', independentSubject: true, partition: 'calibration' }],
              captures: [{
                captureRef: 'capture-baseline', subjectRef: 'subject-calibration', stratum: 'neutral_frontal_baseline',
                canonicalAssetDigest: digest, capturedAt: '2026-08-29T12:00:00Z', imageWidth: 1080, imageHeight: 1440,
                deviceRef: 'workflow-selftest-device', physicalCaptureInstanceRef: 'physical-baseline',
                neutralExpressionApplied: true, headPositionInstructionApplied: true, poseAxis: null, poseDegrees: null,
                groundTruthLockedBeforeProviderRun: true, providerRunRef: null, providerRunExecutedAfterGroundTruthLock: false
              }],
              annotations: [{
                captureRef: 'capture-baseline', annotatorRef: 'workflow-selftest-annotator', targetName: 'soft_tissue_menton',
                x: 0.5, y: 0.75, providerOutputVisibleDuringAnnotation: false, annotationFrozenBeforeProviderScoring: true
              }],
              groundTruthFrozen: false,
              providerRunsExecutedAfterFreeze: false
            },
            assets: [{ captureRef: 'capture-baseline', relativeAssetPath: 'subject-calibration/baseline.png' }]
          };
          await writeFile(`${root}/manifest.json`, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          NODE
      - name: Execute FR-DATA-02 dimension verification
        run: >-
          node scripts/face-reading-fr-data02-image-dimensions.mjs
          artifacts/face-reading/fr-data02-selftest/manifest.json
          artifacts/face-reading/fr-data02-selftest/assets
          artifacts/face-reading/fr-data02-selftest/report.json
      - name: Verify exact claim boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('artifacts/face-reading/fr-data02-selftest/report.json', 'utf8'));
          if (report.imageByteHeaderStructureVerified !== true || report.imageDimensionsVerifiedAgainstBytes !== true ||
              report.captureVerifications?.[0]?.encodedWidth !== 1080 || report.captureVerifications?.[0]?.encodedHeight !== 1440 ||
              report.captureVerifications?.[0]?.dimensionsMatch !== true) {
            throw new Error(`FR-DATA-02 dimension verification failed: ${JSON.stringify(report)}`);
          }
          if (report.imageDecodabilityVerified !== false || report.pixelContentIntegrityVerified !== false ||
              report.empiricalScoringPerformed !== false || report.providerCandidateToMentonMappingValidated !== false ||
              report.productionGeometryAuthorized !== false) {
            throw new Error(`FR-DATA-02 claim boundary was promoted: ${JSON.stringify(report)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fr-data02-image-dimension-selftest
          path: artifacts/face-reading/fr-data02-selftest
          retention-days: 14
