name: Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production.yml'
      - 'scripts/run-production-platform-integrity-postdeploy-verify.sh'
      - 'scripts/run-production-platform-integrity-read-audit.sh'
      - 'scripts/run-production-platform-integrity-data-api-surface-audit.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  deploy:
    name: deploy-migrations
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD is not configured'; exit 1; }
          test "$SUPABASE_PROJECT_ID" = 'cnsfpcdiyofqvhpcegfc'

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Detect known migration history repairs
        id: migration-history
        shell: bash
        run: |
          set +e
          supabase migration list 2>&1 | tee /tmp/myeongha-migration-state.txt
          list_status=${PIPESTATUS[0]}
          set -e

          legacy_repair=false
          duplicate_0830_repair=false

          if grep -q '20260830072444' /tmp/myeongha-migration-state.txt; then
            legacy_repair=true
          fi
          if grep -q '20260902193252' /tmp/myeongha-migration-state.txt; then
            duplicate_0830_repair=true
          fi

          echo "legacy_repair=$legacy_repair" >> "$GITHUB_OUTPUT"
          echo "duplicate_0830_repair=$duplicate_0830_repair" >> "$GITHUB_OUTPUT"

          if [ "$list_status" -ne 0 ] \
             && [ "$legacy_repair" != 'true' ] \
             && [ "$duplicate_0830_repair" != 'true' ]; then
            echo 'Migration list failed without a known repair marker.'
            exit "$list_status"
          fi

      - name: Repair legacy 0010 migration history
        if: ${{ steps.migration-history.outputs.legacy_repair == 'true' }}
        shell: bash
        run: |
          supabase migration repair 20260830072444 --status reverted
          supabase migration repair 0010 --status applied

      - name: Repair duplicate 0830 connector migration history
        if: ${{ steps.migration-history.outputs.duplicate_0830_repair == 'true' }}
        shell: bash
        run: supabase migration repair 20260902193252 --status reverted

      - name: Verify repaired migration history
        run: supabase migration list

      - name: Preview pending production migrations
        run: supabase db push --dry-run

      - name: Apply pending production migrations
        run: supabase db push

      - name: Verify production migration state
        run: supabase migration list

      - name: Install PostgreSQL client for read-only post-deploy verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify production platform integrity after deploy
        shell: bash
        run: bash scripts/run-production-platform-integrity-postdeploy-verify.sh

      - name: Run one-time sanitized production Auth config audit
        if: ${{ contains(github.event.head_commit.message, '[auth-config-audit-once]') }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" == 'cnsfpcdiyofqvhpcegfc' ]]
          raw_config="$(mktemp)"
          sanitized="$RUNNER_TEMP/myeongha-auth-config-sanitized.json"
          trap 'rm -f "$raw_config"' EXIT

          status="$(curl --silent --show-error \
            --output "$raw_config" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth")"
          [[ "$status" == '200' ]]
          jq -e 'type == "object"' "$raw_config" >/dev/null
          jq '{
            external_email_enabled: (.external_email_enabled // null),
            signup_disabled: (.disable_signup // null),
            mailer_autoconfirm: (.mailer_autoconfirm // null),
            site_url: (.site_url // null),
            uri_allow_list: (.uri_allow_list // null),
            password_min_length: (.password_min_length // null),
            password_required_characters: (.password_required_characters // null),
            security_manual_linking_enabled: (.security_manual_linking_enabled // null),
            mailer_otp_exp: (.mailer_otp_exp // null),
            mailer_otp_length: (.mailer_otp_length // null),
            custom_smtp_configured: (((.smtp_host // "") | length) > 0),
            smtp_sender_configured: (((.smtp_admin_email // "") | length) > 0),
            external_google_enabled: (.external_google_enabled // null)
          }' "$raw_config" > "$sanitized"
          chmod 600 "$sanitized"
          echo 'MyeongHa production Auth sanitized config:'
          cat "$sanitized"

      - name: Upload one-time sanitized Auth config evidence
        if: ${{ contains(github.event.head_commit.message, '[auth-config-audit-once]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-auth-config-sanitized-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-auth-config-sanitized.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload post-deploy platform integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-postdeploy-platform-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-platform-integrity-catalog
          if-no-files-found: warn
          retention-days: 14
