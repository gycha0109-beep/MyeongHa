name: Supabase Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  change-gate:
    name: detect-production-db-relevance
    runs-on: ubuntu-24.04
    outputs:
      requires_deploy: ${{ steps.relevance.outputs.requires_deploy }}
    steps:
      - name: Checkout deployment surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine governed Production DB relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          requires_deploy=false
          reason='no governed Production DB deployment-surface change detected'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            requires_deploy=true
            reason='workflow_dispatch forces governed Production verification'
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            requires_deploy=true
            reason='push before SHA is unavailable; fail closed'
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            requires_deploy=true
            reason='push before SHA is not present in checkout; fail closed'
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            printf '%s\n' "$changed_files"

            if grep -Eq '^(supabase/migrations/|[.]github/workflows/supabase-production[.]yml$|scripts/run-production-platform-integrity-postdeploy-verify[.]sh$|scripts/run-production-platform-integrity-read-audit[.]sh$|scripts/run-production-platform-integrity-data-api-surface-audit[.]sh$)' <<<"$changed_files"; then
              requires_deploy=true
              reason='governed Production DB deployment-surface change detected'
            fi
          fi

          echo "requires_deploy=$requires_deploy" >> "$GITHUB_OUTPUT"
          {
            echo '### Supabase Production change gate'
            echo
            echo "- event: $EVENT_NAME"
            echo "- current_sha: $CURRENT_SHA"
            echo "- before_sha: ${BEFORE_SHA:-absent}"
            echo "- requires_deploy: $requires_deploy"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy-migrations
    needs: change-gate
    if: ${{ needs.change-gate.outputs.requires_deploy == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD is not configured'; exit 1; }
          test "$SUPABASE_PROJECT_ID" = 'cnsfpcdiyofqvhpcegfc'

          if [[ -n "${SUPABASE_PRODUCTION_SESSION_POOLER_HOST:-}" ]]; then
            if [[ ! "$SUPABASE_PRODUCTION_SESSION_POOLER_HOST" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]; then
              echo 'SUPABASE_PRODUCTION_SESSION_POOLER_HOST must be a bare *.pooler.supabase.com hostname.'
              exit 1
            fi
          else
            test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured and no explicit Session Pooler host is available'; exit 1; }
          fi

      - name: Prepare explicit Session Pooler DB URL
        if: ${{ env.SUPABASE_PRODUCTION_SESSION_POOLER_HOST != '' }}
        shell: bash
        run: |
          set -euo pipefail
          host="$SUPABASE_PRODUCTION_SESSION_POOLER_HOST"
          [[ "$host" =~ ^[a-z0-9-]+([.][a-z0-9-]+)*[.]pooler[.]supabase[.]com$ ]]

          encoded_password="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_ID}:${encoded_password}@${host}:5432/postgres?sslmode=require"
          echo "::add-mask::$db_url"
          printf 'SUPABASE_PRODUCTION_DB_URL=%s\n' "$db_url" >> "$GITHUB_ENV"

      - name: Link production project
        if: ${{ env.SUPABASE_PRODUCTION_SESSION_POOLER_HOST == '' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Detect known migration history repairs
        id: migration-history
        shell: bash
        run: |
          set -euo pipefail
          db_args=()
          if [[ -n "${SUPABASE_PRODUCTION_DB_URL:-}" ]]; then
            db_args+=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          fi

          set +e
          supabase migration list "${db_args[@]}" 2>&1 | tee /tmp/myeongha-migration-state.txt
          list_status=${PIPESTATUS[0]}
          set -e

          legacy_repair=false
          duplicate_0830_repair=false

          if grep -q '20260830072444' /tmp/myeongha-migration-state.txt; then
            legacy_repair=true
          fi
          if grep -q '20260902193252' /tmp/myeongha-migration-state.txt; then
            duplicate_0830_repair=true
          fi

          echo "legacy_repair=$legacy_repair" >> "$GITHUB_OUTPUT"
          echo "duplicate_0830_repair=$duplicate_0830_repair" >> "$GITHUB_OUTPUT"

          if [ "$list_status" -ne 0 ] \
             && [ "$legacy_repair" != 'true' ] \
             && [ "$duplicate_0830_repair" != 'true' ]; then
            echo 'Migration list failed without a known repair marker.'
            exit "$list_status"
          fi

      - name: Repair legacy 0010 migration history
        if: ${{ steps.migration-history.outputs.legacy_repair == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          db_args=()
          if [[ -n "${SUPABASE_PRODUCTION_DB_URL:-}" ]]; then
            db_args+=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          fi
          supabase migration repair 20260830072444 --status reverted "${db_args[@]}"
          supabase migration repair 0010 --status applied "${db_args[@]}"

      - name: Repair duplicate 0830 connector migration history
        if: ${{ steps.migration-history.outputs.duplicate_0830_repair == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          db_args=()
          if [[ -n "${SUPABASE_PRODUCTION_DB_URL:-}" ]]; then
            db_args+=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          fi
          supabase migration repair 20260902193252 --status reverted "${db_args[@]}"

      - name: Verify repaired migration history
        shell: bash
        run: |
          set -euo pipefail
          db_args=()
          if [[ -n "${SUPABASE_PRODUCTION_DB_URL:-}" ]]; then
            db_args+=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          fi
          supabase migration list "${db_args[@]}"

      # Parallel additive tracks can merge a lower-numbered migration after a higher
      # version has already reached Production. --include-all applies only local
      # migrations absent from remote history; the post-push migration list remains the
      # authoritative reconciliation gate.
      - name: Preview pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          db_args=()
          if [[ -n "${SUPABASE_PRODUCTION_DB_URL:-}" ]]; then
            db_args+=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          fi
          supabase db push --include-all --dry-run "${db_args[@]}"

      - name: Apply pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          db_args=()
          if [[ -n "${SUPABASE_PRODUCTION_DB_URL:-}" ]]; then
            db_args+=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          fi
          supabase db push --include-all "${db_args[@]}"

      - name: Verify production migration state
        shell: bash
        run: |
          set -euo pipefail
          db_args=()
          if [[ -n "${SUPABASE_PRODUCTION_DB_URL:-}" ]]; then
            db_args+=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          fi
          supabase migration list "${db_args[@]}"

      - name: Install PostgreSQL client for read-only post-deploy verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify production platform integrity after deploy
        shell: bash
        run: bash scripts/run-production-platform-integrity-postdeploy-verify.sh

      - name: Upload post-deploy platform integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-postdeploy-platform-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-platform-integrity-catalog
          if-no-files-found: warn
          retention-days: 14
