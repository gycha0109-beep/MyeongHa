name: Supabase Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      relationship_backfill_1400_1450:
        description: 'Only 1400-1450, with matching fresh backup and restored artifact proof'
        required: false
        type: boolean
        default: false
      backup_run_id:
        description: 'Successful governed Production backup workflow run ID'
        required: false
        type: string
      restore_run_id:
        description: 'Successful isolated restore of that same backup workflow run ID'
        required: false
        type: string
      scoped_confirmation:
        description: 'Must be APPLY_RELATIONSHIP_1400_1450_ONLY'
        required: false
        type: string
      reader_s4_scoped_apply:
        description: 'Exact Reader 1740..2300 manual-only forward migration'
        required: false
        type: boolean
        default: false
      reader_s4_backup_run_id:
        description: 'Fresh Production backup run ID for current main SHA'
        required: false
        type: string
      reader_s4_restore_run_id:
        description: 'Paired successful isolated restore run ID'
        required: false
        type: string
      reader_s4_confirmation:
        description: 'APPLY_OFFICIAL_READER_1740_2300_ONLY'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  change-gate:
    name: detect-production-db-relevance
    runs-on: ubuntu-24.04
    outputs:
      requires_deploy: ${{ steps.relevance.outputs.requires_deploy }}
      promotion_repair_only: ${{ steps.relevance.outputs.promotion_repair_only }}
      seyeon_manifest_repair_only: ${{ steps.relevance.outputs.seyeon_manifest_repair_only }}
    steps:
      - name: Checkout deployment surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine governed Production DB relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          SCOPED_BACKFILL: ${{ inputs.relationship_backfill_1400_1450 }}
          READER_S4_SCOPED: ${{ inputs.reader_s4_scoped_apply }}
        run: |
          set -euo pipefail

          requires_deploy=false
          changed_files=''
          reason='no governed Production DB deployment-surface change detected'
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "${SCOPED_BACKFILL:-}" == 'true' && "${READER_S4_SCOPED:-}" == 'true' ]]; then
            echo 'HOLD_CONFLICTING_SCOPED_PRODUCTION_ACTIONS' >&2
            exit 1
          fi

          # Exact one-shot staging, not a Production DB deployment. The new
          # locked Reveal function is unmounted; invoking unrestricted db push
          # for this single security PR could unexpectedly replay historical SQL.
          # Only this exact squash subject, six-path change set and pinned SQL
          # may skip the dangerous ordinary deployment path.
          if [[ "$EVENT_NAME" == 'push' && "$(git show -s --format=%s "$CURRENT_SHA")" == 'feat(security): stage first-zero Seyeon locked Reveal without Production activation' ]]; then
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" || {
              echo 'HOLD_FIRST_ZERO_REVEAL_STAGING_PREDECESSOR_MISSING' >&2
              exit 1
            }
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            expected_staging_files="$(printf '%s\n' \
              '.github/workflows/supabase-production.yml' \
              'apps/api/src/seyeon-locked-first-zero-node-reveal-v1.ts' \
              'supabase/migrations/20261018190000_seyeon_locked_first_zero_source_reveal_v1.sql' \
              'test/db/catalog.expected.sha256' \
              'test/db/run_ci_case.sh' \
              'test/seyeon-locked-first-zero-node-reveal-v1.test.ts')"
            [[ "$changed_files" == "$expected_staging_files" ]] || {
              echo 'HOLD_FIRST_ZERO_REVEAL_STAGING_CHANGE_SCOPE_DRIFT' >&2
              exit 1
            }
            [[ "$(git hash-object supabase/migrations/20261018190000_seyeon_locked_first_zero_source_reveal_v1.sql)" == '002da74911ee6c9f2d0d31b56ca69391b0c3d5c6' ]] || {
              echo 'HOLD_FIRST_ZERO_REVEAL_STAGING_SQL_DRIFT' >&2
              exit 1
            }
            requires_deploy=false
            reason='locked first-zero Reveal code staged only; no automatic historical migration replay or public route activation'
          elif [[ "$EVENT_NAME" == 'push' && "$(git show -s --format=%s "$CURRENT_SHA")" == 'ops(seyeon): apply one-shot 1400-1450 38088591661 38090483306' ]]; then
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" ||
              { echo 'HOLD_ONE_SHOT_BACKFILL: missing reviewed predecessor'; exit 1; }
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            grep -Fxq '.github/ops/seyeon-relationship-1400-1450-restore-38090483306.once' <<<"$changed_files" ||
              { echo 'HOLD_ONE_SHOT_BACKFILL: one-shot marker not in reviewed merge'; exit 1; }
            if grep -Eq '^supabase/migrations/' <<<"$changed_files"; then
              echo 'HOLD_ONE_SHOT_BACKFILL: migration SQL modified with one-shot'
              exit 1
            fi
            [[ "$(cat '.github/ops/seyeon-relationship-1400-1450-restore-38090483306.once')" == 'SEYEON-SCOPED-BACKFILL-1400-1450-38088591661-38090483306-V1' ]] ||
              { echo 'HOLD_ONE_SHOT_BACKFILL: unexpected marker'; exit 1; }
            requires_deploy=false
            reason='protected exact-head one-shot backfill must never invoke ordinary db push'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "${SCOPED_BACKFILL:-}" == 'true' ]]; then
            requires_deploy=false
            reason='manual scoped Se-yeon backfill must never invoke ordinary db push'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "${READER_S4_SCOPED:-}" == 'true' ]]; then
            requires_deploy=false
            reason='manual Reader 1740..2300 must never invoke ordinary db push'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            requires_deploy=true
            reason='workflow_dispatch forces governed Production verification'
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            requires_deploy=true
            reason='push before SHA is unavailable; fail closed'
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            requires_deploy=true
            reason='push before SHA is not present in checkout; fail closed'
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            printf '%s\n' "$changed_files"

            # The dedicated Reader S4 tool is manual-only, even if its
            # workflow and unrelated TS/tests are bundled in a squash merge.
            # Any actual migration SQL/ordinary Production script change
            # still follows the existing governed Production deploy gate.
            if grep -Fxq 'scripts/operations/apply-official-reader-s4-scoped-production-migrations.sh' <<<"$changed_files" &&
               ! grep -Eq '^(supabase/migrations/|scripts/operations/run-supabase-production-migrations[.]sh$|scripts/run-production-platform-integrity-postdeploy-verify[.]sh$|scripts/run-production-platform-integrity-read-audit[.]sh$|scripts/run-production-platform-integrity-data-api-surface-audit[.]sh$)' <<<"$changed_files"; then
              requires_deploy=false
              reason='Reader scoped deployment tooling changed; no automatic db push'
            elif grep -Eq '^(supabase/migrations/|[.]github/workflows/supabase-production[.]yml$|scripts/run-production-platform-integrity-postdeploy-verify[.]sh$|scripts/run-production-platform-integrity-read-audit[.]sh$|scripts/run-production-platform-integrity-data-api-surface-audit[.]sh$|scripts/operations/run-supabase-production-migrations[.]sh$)' <<<"$changed_files"; then
              requires_deploy=true
              reason='governed Production DB deployment-surface change detected'
            fi
          fi

          # Reader 1740..2300 is staged-only. A main merge of Reader SQL
          # must never route to the unrestricted Production db push --include-all.
          # Only the separate backup+restore-verified manual scoped job may apply.
          if [[ "$EVENT_NAME" == 'push' && "$requires_deploy" == 'true' ]]; then
            reader_pending_changes="$(printf '%s\n' "$changed_files" | grep -E '^supabase/migrations/(17[4-9]0|1[89][0-9]0|2[0-2][0-9]0)_official_reader_.*[.]sql$' || true)"
            if [[ -n "$reader_pending_changes" ]]; then
              non_reader_deploy_changes="$(printf '%s\n' "$changed_files" |
                grep -E '^(supabase/migrations/|[.]github/workflows/supabase-production[.]yml$|scripts/run-production-platform-integrity-postdeploy-verify[.]sh$|scripts/run-production-platform-integrity-read-audit[.]sh$|scripts/run-production-platform-integrity-data-api-surface-audit[.]sh$|scripts/operations/run-supabase-production-migrations[.]sh$)' |
                grep -Ev '^(supabase/migrations/(17[4-9]0|1[89][0-9]0|2[0-2][0-9]0)_official_reader_.*[.]sql|[.]github/workflows/supabase-production[.]yml|scripts/operations/run-supabase-production-migrations[.]sh)$' || true)"
              if [[ -n "$non_reader_deploy_changes" ]]; then
                echo 'HOLD_READER_MIXED_PRODUCTION_DEPLOY: Reader and unrelated migrations require separate review' >&2
                exit 1
              fi
              requires_deploy=false
              reason='staged Reader 1740..2300 SQL is HOLD; unrestricted Production db push forbidden'
            fi
          fi

          promotion_repair_only=false
          if [[ "$EVENT_NAME" == 'push' && "$requires_deploy" == 'true' ]]; then
            migration_changes="$(printf '%s\n' "${changed_files:-}" | grep '^supabase/migrations/' || true)"
            if [[ "$migration_changes" == 'supabase/migrations/20261007150457_guest_promotion_auth_fk_validation.sql' ]]; then
              promotion_repair_only=true
            fi
          fi
          seyeon_manifest_repair_only=false
          if [[ "$EVENT_NAME" == 'push' && "$requires_deploy" == 'true' ]]; then
            migration_changes="$(printf '%s\n' "${changed_files:-}" | grep '^supabase/migrations/' || true)"
            if [[ "$migration_changes" == 'supabase/migrations/20261008043000_seyeon_manifest_acl_restore.sql' ]]; then
              seyeon_manifest_repair_only=true
            fi
          fi
          echo "requires_deploy=$requires_deploy" >> "$GITHUB_OUTPUT"
          echo "promotion_repair_only=$promotion_repair_only" >> "$GITHUB_OUTPUT"
          echo "seyeon_manifest_repair_only=$seyeon_manifest_repair_only" >> "$GITHUB_OUTPUT"
          {
            echo '### Supabase Production change gate'
            echo
            echo "- event: $EVENT_NAME"
            echo "- current_sha: $CURRENT_SHA"
            echo "- before_sha: ${BEFORE_SHA:-absent}"
            echo "- requires_deploy: $requires_deploy"
            echo "- promotion_repair_only: $promotion_repair_only"
            echo "- seyeon_manifest_repair_only: $seyeon_manifest_repair_only"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy-migrations
    needs: change-gate
    if: ${{ needs.change-gate.outputs.requires_deploy == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PROMOTION_REPAIR_ONLY: ${{ needs.change-gate.outputs.promotion_repair_only }}
      SUPABASE_SEYEON_MANIFEST_ACL_REPAIR_ONLY: ${{ needs.change-gate.outputs.seyeon_manifest_repair_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Install PostgreSQL client for read-only post-deploy verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Deploy governed production migrations
        shell: bash
        run: bash scripts/operations/run-supabase-production-migrations.sh

      - name: Verify production platform integrity after deploy
        shell: bash
        run: bash scripts/run-production-platform-integrity-postdeploy-verify.sh

      - name: Upload post-deploy platform integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-postdeploy-platform-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-platform-integrity-catalog
          if-no-files-found: warn
          retention-days: 14


  relationship-backfill-1400-1450:
    name: governed-seyeon-relationship-backfill-1400-1450
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.relationship_backfill_1400_1450 == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops(seyeon): apply one-shot 1400-1450 38088591661 38090483306')) }}"
    needs: change-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}
      SEYEON_BACKUP_RUN_ID: ${{ github.event_name == 'push' && '38088591661' || inputs.backup_run_id }}
      SEYEON_RESTORE_RUN_ID: ${{ github.event_name == 'push' && '38090483306' || inputs.restore_run_id }}
      SEYEON_SCOPE_CONFIRMATION: ${{ github.event_name == 'push' && 'APPLY_RELATIONSHIP_1400_1450_ONLY' || inputs.scoped_confirmation }}
    steps:
      - name: Checkout immutable main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed one-shot Production backfill authorization
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%s HEAD)" == 'ops(seyeon): apply one-shot 1400-1450 38088591661 38090483306' ]]
          [[ "$(cat '.github/ops/seyeon-relationship-1400-1450-restore-38090483306.once')" == 'SEYEON-SCOPED-BACKFILL-1400-1450-38088591661-38090483306-V1' ]]
          echo 'SCOPED_ONE_SHOT_ADMISSION_PASS: review, fixed backup and restore; no unrestricted db push'
      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq >/dev/null
      - name: Require fresh backup and matching restore before scoped atomic SQL
        shell: bash
        run: bash scripts/operations/seyeon-production-relationship-backfill-guarded.sh

  official-reader-scoped-1740-2300:
    name: Manual Official Reader 1740..2300 (guarded)
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.reader_s4_scoped_apply == true && inputs.relationship_backfill_1400_1450 != true }}"
    needs: change-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}
      GH_TOKEN: ${{ github.token }}
      READER_S4_BACKUP_RUN_ID: ${{ inputs.reader_s4_backup_run_id }}
      READER_S4_RESTORE_RUN_ID: ${{ inputs.reader_s4_restore_run_id }}
      READER_S4_SCOPE_CONFIRMATION: ${{ inputs.reader_s4_confirmation }}
    steps:
      - name: Checkout immutable main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq >/dev/null
      - name: Apply exact Reader migrations after current backup and restore
        shell: bash
        run: bash scripts/operations/apply-official-reader-s4-scoped-production-migrations.sh
