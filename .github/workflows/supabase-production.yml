name: Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  deploy:
    name: deploy-migrations
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD is not configured'; exit 1; }
          test "$SUPABASE_PROJECT_ID" = 'cnsfpcdiyofqvhpcegfc'

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Detect legacy 0010 migration history
        id: legacy-history
        shell: bash
        run: |
          set +e
          supabase migration list 2>&1 | tee /tmp/myeongha-migration-state.txt
          list_status=${PIPESTATUS[0]}
          set -e

          if grep -q '20260830072444' /tmp/myeongha-migration-state.txt; then
            echo 'repair_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'repair_required=false' >> "$GITHUB_OUTPUT"
            if [ "$list_status" -ne 0 ]; then
              echo 'Migration list failed without the known legacy 0010 history marker.'
              exit "$list_status"
            fi
          fi

      - name: Repair legacy 0010 migration history
        if: ${{ steps.legacy-history.outputs.repair_required == 'true' }}
        shell: bash
        run: |
          supabase migration repair 20260830072444 --status reverted
          supabase migration repair 0010 --status applied
          supabase migration list

      - name: Preview pending production migrations
        run: supabase db push --dry-run

      - name: Apply pending production migrations
        run: supabase db push

      - name: Verify production migration state
        run: supabase migration list
