name: Supabase Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      relationship_backfill_1400_1450:
        description: 'Only 1400-1450, with matching fresh backup and restored artifact proof'
        required: false
        type: boolean
        default: false
      backup_run_id:
        description: 'Successful governed Production backup workflow run ID'
        required: false
        type: string
      restore_run_id:
        description: 'Successful isolated restore of that same backup workflow run ID'
        required: false
        type: string
      scoped_confirmation:
        description: 'Must be APPLY_RELATIONSHIP_1400_1450_ONLY'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  change-gate:
    name: detect-production-db-relevance
    runs-on: ubuntu-24.04
    outputs:
      requires_deploy: ${{ steps.relevance.outputs.requires_deploy }}
      promotion_repair_only: ${{ steps.relevance.outputs.promotion_repair_only }}
      seyeon_manifest_repair_only: ${{ steps.relevance.outputs.seyeon_manifest_repair_only }}
      saju_admission_reconcile_only: ${{ steps.relevance.outputs.saju_admission_reconcile_only }}
      chat_credit_signup_scope_only: ${{ steps.relevance.outputs.chat_credit_signup_scope_only }}
    steps:
      - name: Checkout deployment surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine governed Production DB relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          SCOPED_BACKFILL: ${{ inputs.relationship_backfill_1400_1450 }}
        run: |
          set -euo pipefail

          requires_deploy=false
          reason='no governed Production DB deployment-surface change detected'

          # Exact one-shot staging, not a Production DB deployment. The new
          # locked Reveal function is unmounted; invoking unrestricted db push
          # for this single security PR could unexpectedly replay historical SQL.
          # Only this exact squash subject, six-path change set and pinned SQL
          # may skip the dangerous ordinary deployment path.
          if [[ "$EVENT_NAME" == 'push' && "$(git show -s --format=%s "$CURRENT_SHA")" == 'ops(db): retry scoped Se-yeon helper owner revoke' ]]; then
            # Scoped manual Production retry is the sole permitted SQL
            # executor. Never use ordinary db push on the historical frontier.
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" || {
              echo 'HOLD_SEYEON_HELPER_OWNER_RETRY_BASE_MISSING' >&2
              exit 1
            }
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            expected_retry="$(printf '%s\n' \
              '.github/workflows/production-seyeon-helper-acl-one-shot.yml' \
              '.github/workflows/supabase-production.yml' \
              'docs/ci/workflow-responsibility-map.json' \
              'scripts/ci/db-pr-router.mjs' \
              'scripts/operations/apply-seyeon-helper-acl-prod-once.sh' \
              'supabase/migrations/20261026025332_seyeon_chat_helper_service_role_least_privilege.sql' \
              'test/db/run_ci_case.sh' \
              'test/db/seyeon_r2_helper_owner_restricted_pg17.sh' \
              'test/db/seyeon_r2_helper_service_role_least_privilege.sh')"
            [[ "$changed_files" == "$expected_retry" ]] || {
              echo 'HOLD_SEYEON_HELPER_OWNER_RETRY_PATH_DRIFT' >&2
              exit 1
            }
            [[ "$(git hash-object supabase/migrations/20261026025332_seyeon_chat_helper_service_role_least_privilege.sql)" == 'c051a1dde2b3a260cdde5efafdcf1583c79d608d' ]] || {
              echo 'HOLD_SEYEON_HELPER_OWNER_RETRY_SQL_DRIFT' >&2
              exit 1
            }
            requires_deploy=false
            reason='owner-grantor helper ACL manual retry only; ordinary historical db push suppressed'
          elif [[ "$EVENT_NAME" == 'push' && (
            "$(git show -s --format=%s "$CURRENT_SHA")" == 'feat(ops): stage private checkout notice provenance and prepayment acknowledgment' ||
            "$(git show -s --format=%s "$CURRENT_SHA")" == 'feat(ops): stage private checkout notice provenance and prepayment acknowledgment (#2654)'
          ) ]]; then
            # Private notice evidence is not approved as a Production migration.
            # Its staged SQL must never activate the historical db-push backlog.
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" || {
              echo 'HOLD_PRIVATE_CHECKOUT_STAGING_BASE_MISSING' >&2; exit 1
            }
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            expected_private_checkout="$(printf '%s\n' \
              '.github/workflows/supabase-production.yml' \
              'apps/api/src/digital-reading-checkout-notice-evidence-v1.ts' \
              'apps/api/src/postgres-digital-reading-checkout-notice-evidence-v1.ts' \
              'docs/COMMERCE_DIGITAL_READING_CHECKOUT_NOTICE_EVIDENCE_PRIVATE_V1.md' \
              'supabase/migrations/20261027054525_digital_reading_checkout_notice_evidence_v1.sql' \
              'test/db/run_ci_case.sh' \
              'test/db/staged_commerce_migration_policy.sh' \
              'test/digital-reading-checkout-notice-evidence-v1.test.ts' \
              'test/postgres-digital-reading-checkout-notice-evidence-v1.test.ts')"
            [[ "$changed_files" == "$expected_private_checkout" ]] || {
              echo 'HOLD_PRIVATE_CHECKOUT_STAGING_PATH_DRIFT' >&2; exit 1
            }
            [[ "$(git hash-object supabase/migrations/20261027054525_digital_reading_checkout_notice_evidence_v1.sql)" == '550e2ff3dd86d16d30334220c223650387b71ca7' ]] || {
              echo 'HOLD_PRIVATE_CHECKOUT_STAGING_SQL_DRIFT' >&2; exit 1
            }
            [[ "$(tr -d '[:space:]' < test/db/catalog.expected.sha256)" == '1a4106370848c27564fd4b0d64cf84c8d30dc02b205f331fe17c46e4dc061c53' ]] || {
              echo 'HOLD_PRIVATE_CHECKOUT_STAGING_CATALOG_DRIFT' >&2; exit 1
            }
            requires_deploy=false
            reason='private checkout notice evidence staged only; ordinary Production DB push suppressed'
          elif [[ "$EVENT_NAME" == 'push' && "$(git show -s --format=%s "$CURRENT_SHA")" == 'ops(db): one-shot Se-yeon helper ACL 40232489516 40266252936' ]]; then
            # An exact-scope helper ACL reduction is executed ONLY by the
            # separately protected one-shot workflow, NEVER the legacy
            # unrestricted migration/remote-only history repair path.
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" || {
              echo 'HOLD_SEYEON_HELPER_ACL_ONE_SHOT_BASE_MISSING' >&2
              exit 1
            }
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            expected_once="$(printf '%s\n' \
              '.github/ops/seyeon-helper-acl-prod-20261026.once' \
              '.github/workflows/production-seyeon-helper-acl-one-shot.yml' \
              '.github/workflows/supabase-production.yml' \
              'docs/ci/workflow-responsibility-map.json' \
              'scripts/ci/db-pr-router.mjs' \
              'scripts/ci/db-suites.json' \
              'scripts/operations/apply-seyeon-helper-acl-prod-once.sh' \
              'supabase/migrations/20261026025332_seyeon_chat_helper_service_role_least_privilege.sql' \
              'test/db/run_ci_case.sh' \
              'test/db/seyeon_r2_helper_service_role_least_privilege.sh')"
            [[ "$changed_files" == "$expected_once" ]] || {
              echo 'HOLD_SEYEON_HELPER_ACL_ONE_SHOT_PATH_DRIFT' >&2
              exit 1
            }
            [[ "$(cat '.github/ops/seyeon-helper-acl-prod-20261026.once')" == 'SEYEON-HELPER-ACL-PROD-20261026-40232489516-40266252936-V1' ]] || {
              echo 'HOLD_SEYEON_HELPER_ACL_ONE_SHOT_MARKER_DRIFT' >&2
              exit 1
            }
            [[ "$(git hash-object supabase/migrations/20261026025332_seyeon_chat_helper_service_role_least_privilege.sql)" == '462cf970f362550fbcfc4f6168ee6b1e0b5cf078' ]] || {
              echo 'HOLD_SEYEON_HELPER_ACL_ONE_SHOT_SQL_DRIFT' >&2
              exit 1
            }
            requires_deploy=false
            reason='one-shot guarded helper ACL only; ordinary historical db push suppressed'
          elif [[ "$EVENT_NAME" == 'push' && "$(git show -s --format=%s "$CURRENT_SHA")" == 'feat(security): stage first-zero Seyeon locked Reveal without Production activation' ]]; then
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" || {
              echo 'HOLD_FIRST_ZERO_REVEAL_STAGING_PREDECESSOR_MISSING' >&2
              exit 1
            }
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            expected_staging_files="$(printf '%s\n' \
              '.github/workflows/supabase-production.yml' \
              'apps/api/src/seyeon-locked-first-zero-node-reveal-v1.ts' \
              'supabase/migrations/20261018190000_seyeon_locked_first_zero_source_reveal_v1.sql' \
              'test/db/catalog.expected.sha256' \
              'test/db/run_ci_case.sh' \
              'test/seyeon-locked-first-zero-node-reveal-v1.test.ts')"
            [[ "$changed_files" == "$expected_staging_files" ]] || {
              echo 'HOLD_FIRST_ZERO_REVEAL_STAGING_CHANGE_SCOPE_DRIFT' >&2
              exit 1
            }
            [[ "$(git hash-object supabase/migrations/20261018190000_seyeon_locked_first_zero_source_reveal_v1.sql)" == '002da74911ee6c9f2d0d31b56ca69391b0c3d5c6' ]] || {
              echo 'HOLD_FIRST_ZERO_REVEAL_STAGING_SQL_DRIFT' >&2
              exit 1
            }
            requires_deploy=false
            reason='locked first-zero Reveal code staged only; no automatic historical migration replay or public route activation'
          elif [[ "$EVENT_NAME" == 'push' && "$(git show -s --format=%s "$CURRENT_SHA")" == 'ops(seyeon): apply one-shot 1400-1450 38088591661 38090483306' ]]; then
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" ||
              { echo 'HOLD_ONE_SHOT_BACKFILL: missing reviewed predecessor'; exit 1; }
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            grep -Fxq '.github/ops/seyeon-relationship-1400-1450-restore-38090483306.once' <<<"$changed_files" ||
              { echo 'HOLD_ONE_SHOT_BACKFILL: one-shot marker not in reviewed merge'; exit 1; }
            if grep -Eq '^supabase/migrations/' <<<"$changed_files"; then
              echo 'HOLD_ONE_SHOT_BACKFILL: migration SQL modified with one-shot'
              exit 1
            fi
            [[ "$(cat '.github/ops/seyeon-relationship-1400-1450-restore-38090483306.once')" == 'SEYEON-SCOPED-BACKFILL-1400-1450-38088591661-38090483306-V1' ]] ||
              { echo 'HOLD_ONE_SHOT_BACKFILL: unexpected marker'; exit 1; }
            requires_deploy=false
            reason='protected exact-head one-shot backfill must never invoke ordinary db push'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "${SCOPED_BACKFILL:-}" == 'true' ]]; then
            requires_deploy=false
            reason='manual scoped Se-yeon backfill must never invoke ordinary db push'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            requires_deploy=true
            reason='workflow_dispatch forces governed Production verification'
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            requires_deploy=true
            reason='push before SHA is unavailable; fail closed'
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            requires_deploy=true
            reason='push before SHA is not present in checkout; fail closed'
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            printf '%s\n' "$changed_files"

            if grep -Eq '^(supabase/migrations/|[.]github/workflows/supabase-production[.]yml$|scripts/run-production-platform-integrity-postdeploy-verify[.]sh$|scripts/run-production-platform-integrity-read-audit[.]sh$|scripts/run-production-platform-integrity-data-api-surface-audit[.]sh$|scripts/operations/run-supabase-production-migrations[.]sh$)' <<<"$changed_files"; then
              requires_deploy=true
              reason='governed Production DB deployment-surface change detected'
            fi
          fi

          promotion_repair_only=false
          if [[ "$EVENT_NAME" == 'push' && "$requires_deploy" == 'true' ]]; then
            migration_changes="$(printf '%s\n' "${changed_files:-}" | grep '^supabase/migrations/' || true)"
            if [[ "$migration_changes" == 'supabase/migrations/20261007150457_guest_promotion_auth_fk_validation.sql' ]]; then
              promotion_repair_only=true
            fi
          fi
          seyeon_manifest_repair_only=false
          if [[ "$EVENT_NAME" == 'push' && "$requires_deploy" == 'true' ]]; then
            migration_changes="$(printf '%s\n' "${changed_files:-}" | grep '^supabase/migrations/' || true)"
            if [[ "$migration_changes" == 'supabase/migrations/20261008043000_seyeon_manifest_acl_restore.sql' ]]; then
              seyeon_manifest_repair_only=true
            fi
          fi
          chat_credit_signup_scope_only=false
          if [[ "$EVENT_NAME" == push && "$requires_deploy" == true ]]; then
            migration_changes="$(printf '%s\n' "${changed_files:-}" | grep '^supabase/migrations/' || true)"
            if [[ "$migration_changes" == 'supabase/migrations/1725_chat_credit_signup_wallet_runtime_v1.sql' ]]; then
              chat_credit_signup_scope_only=true
            fi
          fi
          echo "chat_credit_signup_scope_only=$chat_credit_signup_scope_only" >> "$GITHUB_OUTPUT"

          saju_admission_reconcile_only=false
          if [[ "$EVENT_NAME" == push && "$requires_deploy" == true ]]; then
            migration_changes="$(printf '%s\n' "${changed_files:-}" | grep '^supabase/migrations/' || true)"
            expected_saju_migrations="$(printf '%s\n' \
              'supabase/migrations/20261024134543_saju_abuse_admission_runtime_authority.sql' \
              'supabase/migrations/20261024134610_saju_abuse_admission_production_policy_v1.sql' \
              'supabase/migrations/20261024135504_saju_abuse_admission_cleanup_worker_authority.sql' \
              'supabase/migrations/20261024141330_saju_abuse_admission_policy_approval_clock_v2.sql')"
            if [[ "$migration_changes" == "$expected_saju_migrations" ]]; then
              saju_admission_reconcile_only=true
            fi
          fi
          echo "saju_admission_reconcile_only=$saju_admission_reconcile_only" >> "$GITHUB_OUTPUT"
          echo "requires_deploy=$requires_deploy" >> "$GITHUB_OUTPUT"
          echo "promotion_repair_only=$promotion_repair_only" >> "$GITHUB_OUTPUT"
          echo "seyeon_manifest_repair_only=$seyeon_manifest_repair_only" >> "$GITHUB_OUTPUT"
          {
            echo '### Supabase Production change gate'
            echo
            echo "- event: $EVENT_NAME"
            echo "- current_sha: $CURRENT_SHA"
            echo "- before_sha: ${BEFORE_SHA:-absent}"
            echo "- requires_deploy: $requires_deploy"
            echo "- promotion_repair_only: $promotion_repair_only"
            echo "- seyeon_manifest_repair_only: $seyeon_manifest_repair_only"
            echo "- chat_credit_signup_scope_only: $chat_credit_signup_scope_only"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy-migrations
    needs: change-gate
    if: ${{ needs.change-gate.outputs.requires_deploy == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PROMOTION_REPAIR_ONLY: ${{ needs.change-gate.outputs.promotion_repair_only }}
      SUPABASE_SEYEON_MANIFEST_ACL_REPAIR_ONLY: ${{ needs.change-gate.outputs.seyeon_manifest_repair_only }}
      SUPABASE_SAJU_ADMISSION_RECONCILE_ONLY: ${{ needs.change-gate.outputs.saju_admission_reconcile_only }}
      SUPABASE_CHAT_CREDIT_SIGNUP_SCOPE_ONLY: ${{ needs.change-gate.outputs.chat_credit_signup_scope_only }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Install PostgreSQL client for read-only post-deploy verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Deploy governed production migrations
        shell: bash
        run: bash scripts/operations/run-supabase-production-migrations.sh

      - name: Verify production platform integrity after deploy
        shell: bash
        run: bash scripts/run-production-platform-integrity-postdeploy-verify.sh

      - name: Upload post-deploy platform integrity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myeongha-production-postdeploy-platform-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-platform-integrity-catalog
          if-no-files-found: warn
          retention-days: 14


  relationship-backfill-1400-1450:
    name: governed-seyeon-relationship-backfill-1400-1450
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.relationship_backfill_1400_1450 == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops(seyeon): apply one-shot 1400-1450 38088591661 38090483306')) }}"
    needs: change-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}
      SEYEON_BACKUP_RUN_ID: ${{ github.event_name == 'push' && '38088591661' || inputs.backup_run_id }}
      SEYEON_RESTORE_RUN_ID: ${{ github.event_name == 'push' && '38090483306' || inputs.restore_run_id }}
      SEYEON_SCOPE_CONFIRMATION: ${{ github.event_name == 'push' && 'APPLY_RELATIONSHIP_1400_1450_ONLY' || inputs.scoped_confirmation }}
    steps:
      - name: Checkout immutable main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed one-shot Production backfill authorization
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%s HEAD)" == 'ops(seyeon): apply one-shot 1400-1450 38088591661 38090483306' ]]
          [[ "$(cat '.github/ops/seyeon-relationship-1400-1450-restore-38090483306.once')" == 'SEYEON-SCOPED-BACKFILL-1400-1450-38088591661-38090483306-V1' ]]
          echo 'SCOPED_ONE_SHOT_ADMISSION_PASS: review, fixed backup and restore; no unrestricted db push'
      - name: Install PostgreSQL client and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq >/dev/null
      - name: Require fresh backup and matching restore before scoped atomic SQL
        shell: bash
        run: bash scripts/operations/seyeon-production-relationship-backfill-guarded.sh
