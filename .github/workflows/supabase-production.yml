name: Supabase Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  change-gate:
    name: detect-production-db-relevance
    runs-on: ubuntu-24.04
    outputs:
      requires_deploy: ${{ steps.relevance.outputs.requires_deploy }}
    steps:
      - name: Checkout deployment surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine governed Production DB relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          requires_deploy=false
          reason='no governed Production DB deployment-surface change detected'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            requires_deploy=true
            reason='workflow_dispatch forces governed Production verification'
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            requires_deploy=true
            reason='push before SHA is unavailable; fail closed'
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            requires_deploy=true
            reason='push before SHA is not present in checkout; fail closed'
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            printf '%s\n' "$changed_files"

            if grep -Eq '^(supabase/migrations/|[.]github/workflows/supabase-production[.]yml$|scripts/run-production-platform-integrity-postdeploy-verify[.]sh$|scripts/run-production-platform-integrity-read-audit[.]sh$|scripts/run-production-platform-integrity-data-api-surface-audit[.]sh$|scripts/operations/run-supabase-production-migrations[.]sh$)' <<<"$changed_files"; then
              requires_deploy=true
              reason='governed Production DB deployment-surface change detected'
            fi
          fi

          echo "requires_deploy=$requires_deploy" >> "$GITHUB_OUTPUT"
          {
            echo '### Supabase Production change gate'
            echo
            echo "- event: $EVENT_NAME"
            echo "- current_sha: $CURRENT_SHA"
            echo "- before_sha: ${BEFORE_SHA:-absent}"
            echo "- requires_deploy: $requires_deploy"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy-migrations
    needs: change-gate
    if: ${{ needs.change-gate.outputs.requires_deploy == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Deploy governed production migrations
        shell: bash
        run: bash scripts/operations/run-supabase-production-migrations.sh

      - name: Install PostgreSQL client for read-only post-deploy verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify production platform integrity after deploy
        shell: bash
        run: bash scripts/run-production-platform-integrity-postdeploy-verify.sh

      - name: Upload post-deploy platform integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myeongha-production-postdeploy-platform-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/myeongha-platform-integrity-catalog
          if-no-files-found: warn
          retention-days: 14
