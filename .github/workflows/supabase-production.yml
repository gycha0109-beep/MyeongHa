name: Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc

jobs:
  deploy:
    name: deploy-migrations
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD is not configured'; exit 1; }
          test "$SUPABASE_PROJECT_ID" = 'cnsfpcdiyofqvhpcegfc'

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Detect known migration history repairs
        id: migration-history
        shell: bash
        run: |
          set +e
          supabase migration list 2>&1 | tee /tmp/myeongha-migration-state.txt
          list_status=${PIPESTATUS[0]}
          set -e

          legacy_repair=false
          duplicate_0830_repair=false

          if grep -q '20260830072444' /tmp/myeongha-migration-state.txt; then
            legacy_repair=true
          fi
          if grep -q '20260902193252' /tmp/myeongha-migration-state.txt; then
            duplicate_0830_repair=true
          fi

          echo "legacy_repair=$legacy_repair" >> "$GITHUB_OUTPUT"
          echo "duplicate_0830_repair=$duplicate_0830_repair" >> "$GITHUB_OUTPUT"

          if [ "$list_status" -ne 0 ] \
             && [ "$legacy_repair" != 'true' ] \
             && [ "$duplicate_0830_repair" != 'true' ]; then
            echo 'Migration list failed without a known repair marker.'
            exit "$list_status"
          fi

      - name: Repair legacy 0010 migration history
        if: ${{ steps.migration-history.outputs.legacy_repair == 'true' }}
        shell: bash
        run: |
          supabase migration repair 20260830072444 --status reverted
          supabase migration repair 0010 --status applied

      - name: Repair duplicate 0830 connector migration history
        if: ${{ steps.migration-history.outputs.duplicate_0830_repair == 'true' }}
        shell: bash
        run: supabase migration repair 20260902193252 --status reverted

      - name: Verify repaired migration history
        run: supabase migration list

      - name: Preview pending production migrations
        run: supabase db push --dry-run

      - name: Apply pending production migrations
        run: supabase db push

      - name: Verify production migration state
        run: supabase migration list
