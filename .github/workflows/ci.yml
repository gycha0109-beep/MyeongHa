name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check
        run: npm run check

  db-authority-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
      - name: Apply DDL draft migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run authority core negative tests
        run: psql -v ON_ERROR_STOP=1 -f test/db/authority_core_negative.sql
      - name: Run record and relationship negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/record_world_negative.sql
      - name: Run reading and operations negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/reading_ops_negative.sql
      - name: Run story and share negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/story_share_negative.sql
      - name: Run notification and deletion negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/notification_deletion_negative.sql
      - name: Run commerce negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/commerce_negative.sql
      - name: Verify deterministic schema catalog snapshot
        run: bash test/db/catalog_snapshot.sh
