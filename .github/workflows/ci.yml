name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: route-ci-scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      db: ${{ steps.scope.outputs.db }}
      db_pg15_enabled: ${{ steps.scope.outputs.db_pg15_enabled }}
      db_pg17_enabled: ${{ steps.scope.outputs.db_pg17_enabled }}
      db_pg15_cases: ${{ steps.scope.outputs.db_pg15_cases }}
      db_pg17_cases: ${{ steps.scope.outputs.db_pg17_cases }}
      db_suites: ${{ steps.scope.outputs.db_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            {
              echo "db=true"
              echo "db_pg15_enabled=false"
              echo "db_pg17_enabled=false"
              echo 'db_pg15_cases=["__none__"]'
              echo 'db_pg17_cases=["__none__"]'
              echo 'db_suites=[]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/myeongha-ci-changed-files.txt"

          node scripts/ci/pr-gate-router.mjs             < "$RUNNER_TEMP/myeongha-ci-changed-files.txt"             > "$RUNNER_TEMP/myeongha-ci-gates.txt"
          grep '^db=' "$RUNNER_TEMP/myeongha-ci-gates.txt" >> "$GITHUB_OUTPUT"

          node scripts/ci/db-pr-router.mjs             < "$RUNNER_TEMP/myeongha-ci-changed-files.txt"             | tee "$RUNNER_TEMP/myeongha-db-pr-routing.txt"             >> "$GITHUB_OUTPUT"

  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check
        run: npm run check

  db-authority-core:
    needs: scope
    if: needs.scope.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Bootstrap Supabase auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}" >/dev/null
          done
      - name: Run authority core
        run: bash test/db/run_authority_core.sh
      - name: Run account deletion worker PostgreSQL synthetic E2E
        env:
          MYEONGHA_RUN_ACCOUNT_DELETION_DB_E2E: '1'
        run: npx vitest run test/account-deletion-worker-runtime-postgres.e2e.test.ts

  db-pr-pg15:
    name: DB PR PG15 · ${{ matrix.case }}
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.db_pg15_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: ${{ fromJSON(needs.scope.outputs.db_pg15_cases) }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Run routed DB regression case
        run: bash test/db/run_ci_case.sh "${{ matrix.case }}"

  db-pr-pg17:
    name: DB PR PG17 · ${{ matrix.case }}
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.db_pg17_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(needs.scope.outputs.db_pg17_cases) }}
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Run routed PostgreSQL 17 regression case
        run: bash test/db/run_ci_case.sh "${{ matrix.case }}"

  verify:
    name: CI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() && !cancelled() }}
    needs:
      - scope
      - foundation
      - db-authority-core
      - db-pr-pg15
      - db-pr-pg17
    steps:
      - name: Require selected CI gates
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          DB_RESULT: ${{ needs.db-authority-core.result }}
          DB_PG15_RESULT: ${{ needs.db-pr-pg15.result }}
          DB_PG17_RESULT: ${{ needs.db-pr-pg17.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          test "$FOUNDATION_RESULT" = "success"
          test "$DB_RESULT" = "success" || test "$DB_RESULT" = "skipped"
          test "$DB_PG15_RESULT" = "success" || test "$DB_PG15_RESULT" = "skipped"
          test "$DB_PG17_RESULT" = "success" || test "$DB_PG17_RESULT" = "skipped"
