name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check
        run: npm run check

  db-authority-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
      - name: Apply DDL draft migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run authority core negative tests
        run: psql -v ON_ERROR_STOP=1 -f test/db/authority_core_negative.sql
      - name: Run record and relationship negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/record_world_negative.sql
      - name: Run reading and operations negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/reading_ops_negative.sql
      - name: Run story and share negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/story_share_negative.sql
      - name: Run notification and deletion negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/notification_deletion_negative.sql
      - name: Run commerce negative tests
        run: psql -1 -v ON_ERROR_STOP=1 -f test/db/commerce_negative.sql
      - name: Run chat receive persistence/concurrency tests
        run: bash test/db/chat_receive_concurrency.sh
      - name: Run chat attempt/commit persistence/concurrency tests
        run: bash test/db/chat_attempt_commit_concurrency.sh
      - name: Run chat retry/abandon persistence/concurrency tests
        run: bash test/db/chat_retry_abandon_concurrency.sh
      - name: Run birth revision append persistence/concurrency tests
        run: bash test/db/birth_revision_append_concurrency.sh
      - name: Run reading session create persistence/concurrency tests
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "delete from public.saju_domain_runtime where saju_domain in ('general','compatibility','career')"
          bash test/db/reading_session_create_concurrency.sh
      - name: Run reading transport prepare/finalize persistence/concurrency tests
        run: bash test/db/reading_transport_finalize_concurrency.sh
      - name: Run reading clarification append persistence/concurrency tests
        run: bash test/db/reading_clarification_concurrency.sh
      - name: Run notification delivery attempt persistence/concurrency tests
        run: bash test/db/notification_delivery_attempt_concurrency.sh
      - name: Run account deletion start persistence/concurrency tests
        run: bash test/db/account_deletion_start_concurrency.sh
      - name: Run guest promotion persistence/concurrency tests
        run: bash test/db/guest_promotion_concurrency.sh
      - name: Run user resource revocation persistence/concurrency tests
        run: bash test/db/user_resource_revocation_concurrency.sh
      - name: Run character forget grant revocation persistence/concurrency tests
        run: bash test/db/character_forget_concurrency.sh
      - name: Run individual Memory grant revoke persistence/concurrency tests
        run: bash test/db/memory_grant_revoke_concurrency.sh
      - name: Run guest bootstrap persistence/concurrency tests
        run: bash test/db/guest_bootstrap_concurrency.sh
      - name: Run Life Fact revoke persistence/concurrency tests
        run: bash test/db/life_fact_revoke_concurrency.sh
      - name: Run Memory Item revoke persistence/concurrency tests
        run: bash test/db/memory_item_revoke_concurrency.sh
      - name: Run character record context filtering tests
        run: bash test/db/character_record_context_query.sh
      - name: Run notification read persistence/concurrency tests
        run: bash test/db/notification_read_concurrency.sh
      - name: Run current relationship projection read tests
        run: bash test/db/relationship_current_query.sh
      - name: Run current entitlement projection read tests
        run: bash test/db/entitlements_current_query.sh
      - name: Run data deletion job status read tests
        run: bash test/db/data_deletion_job_query.sh
      - name: Run notification preference projection read tests
        run: bash test/db/notification_preferences_query.sh
      - name: Verify deterministic schema catalog snapshot
        run: bash test/db/catalog_snapshot.sh
