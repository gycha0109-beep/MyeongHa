name: FE033 Lockfile Materializer

on:
  push:
    branches:
      - feat/fe033-face-preview-engine-delivery
    paths:
      - '.github/workflows/fe033-lockfile-materializer.yml'
      - 'apps/web/package.json'
      - 'packages/face-reading/package.json'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/fe033-face-preview-engine-delivery
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "build(face-engine): lock isolated FE033 runtime"
          git fetch origin feat/fe033-face-preview-engine-delivery
          git rebase origin/feat/fe033-face-preview-engine-delivery
          git push origin HEAD:feat/fe033-face-preview-engine-delivery
