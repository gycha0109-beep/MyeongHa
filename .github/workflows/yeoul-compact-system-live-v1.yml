name: "[WT:character-runtime-lab] Yeoul GPT-6 Luna concise system identity pilot"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yeoul-compact-system-20261119-single-dispatch
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ github.actor == 'gycha0109-beep' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Check concise system and selected context
        run: |
          node --check scripts/character-optimization/yeoul-compact-system-v1.mjs
          node --check scripts/character-optimization/yeoul-compact-system-live-v1.mjs
          node scripts/character-optimization/yeoul-compact-system-live-v1.mjs --plan-only
      - name: Generate eight synthetic replies on GPT-6 Luna
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/character-optimization/yeoul-compact-system-live-v1.mjs
      - name: Store real responses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-compact-system-${{ github.run_id }}
          path: yeoul-compact-system-live-results.json
          retention-days: 7
          if-no-files-found: ignore
