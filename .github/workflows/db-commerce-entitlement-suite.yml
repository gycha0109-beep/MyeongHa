name: DB Commerce Entitlement Suite

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/entitlement_projection_recompute.sql'
      - 'test/db/entitlement_effect_apply_v1.sql'
      - 'test/db/verified_receipt_capability_fulfillment_batch_v1.sql'
      - 'test/db/verified_receipt_capability_fulfillment_batch_hardening.sql'
      - 'test/db/commerce_entitlement_mutation_surface.sql'
      - 'test/db/commerce_payment_source_authority.sql'
      - 'test/db/commerce_trigger_security_hardening.sql'
      - 'test/db/entitlement_projection_recompute_concurrency.sh'
      - 'test/db/effective_entitlements_v2_query.sh'
      - 'test/db/entitlement_lifecycle_history_v1_query.sh'
      - 'test/db/entitlement_restore_v1.sql'
      - 'test/db/commerce_product_capability_authority.sql'
      - 'test/db/paid_general_natal_product_candidate.sql'
      - 'test/db/standard_love_relationship_reader_authority.sql'
      - 'test/db/purchase_intent_create_concurrency.sh'
      - 'test/db/purchase_intent_create_v2_concurrency.sh'
      - 'test/db/purchase_intent_capability_pin_v3.sh'
      - 'test/db/purchase_intent_runtime_snapshot_v3.sh'
      - 'test/db/purchase_intent_charge_amount_safe_integer.sh'
      - 'test/db/purchase_intent_history_v2_query.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-commerce-entitlement-suite.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/entitlement_projection_recompute.sql'
      - 'test/db/entitlement_effect_apply_v1.sql'
      - 'test/db/verified_receipt_capability_fulfillment_batch_v1.sql'
      - 'test/db/verified_receipt_capability_fulfillment_batch_hardening.sql'
      - 'test/db/commerce_entitlement_mutation_surface.sql'
      - 'test/db/commerce_payment_source_authority.sql'
      - 'test/db/commerce_trigger_security_hardening.sql'
      - 'test/db/entitlement_projection_recompute_concurrency.sh'
      - 'test/db/effective_entitlements_v2_query.sh'
      - 'test/db/entitlement_lifecycle_history_v1_query.sh'
      - 'test/db/entitlement_restore_v1.sql'
      - 'test/db/commerce_product_capability_authority.sql'
      - 'test/db/paid_general_natal_product_candidate.sql'
      - 'test/db/standard_love_relationship_reader_authority.sql'
      - 'test/db/purchase_intent_create_concurrency.sh'
      - 'test/db/purchase_intent_create_v2_concurrency.sh'
      - 'test/db/purchase_intent_capability_pin_v3.sh'
      - 'test/db/purchase_intent_runtime_snapshot_v3.sh'
      - 'test/db/purchase_intent_charge_amount_safe_integer.sh'
      - 'test/db/purchase_intent_history_v2_query.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - '.github/workflows/db-commerce-entitlement-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-case:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - commerce-entitlement-projection-recompute
          - effective-entitlements-v2
          - entitlement-lifecycle-history-v1
          - entitlement-restore-v1
          - purchase-intent-create
          - purchase-intent-history-v2
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run DB regression case
        run: bash test/db/run_ci_case.sh "${{ matrix.case }}"
