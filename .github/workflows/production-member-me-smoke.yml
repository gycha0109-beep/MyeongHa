name: Production Member API Me Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'VERIFY_MEMBER_ME or VERIFY_SEYEON_G3_HISTORY_HOLD (existing owned Se-yeon history Thread, read-only).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-member-me-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: verify-production-member-me
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      MYEONGHA_PRODUCTION_MEMBER_EMAIL: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EMAIL }}
      MYEONGHA_PRODUCTION_MEMBER_PASSWORD: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_PASSWORD }}
      MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}
      MYEONGHA_PRODUCTION_G3_HISTORY_THREAD_ID: ${{ secrets.MYEONGHA_PRODUCTION_G3_HISTORY_THREAD_ID }}
    steps:
      - name: Verify explicit dispatch and governed fresh-session credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRM" == 'VERIFY_MEMBER_ME' || "$DISPATCH_CONFIRM" == 'VERIFY_SEYEON_G3_HISTORY_HOLD' ]]
          if [[ "$DISPATCH_CONFIRM" == 'VERIFY_SEYEON_G3_HISTORY_HOLD' ]]; then
            [[ "${MYEONGHA_PRODUCTION_G3_HISTORY_THREAD_ID:-}" =~ ^[0-9a-fA-F-]{36}$ ]]
          fi
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EMAIL:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_PASSWORD:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID:-}"

      - name: Check out exact repository verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify production Member current-subject boundary
        if: ${{ env.DISPATCH_CONFIRM == 'VERIFY_MEMBER_ME' }}
        run: node scripts/verify-production-member-me.mjs

      - name: Verify authenticated Se-yeon historical Chat GET holds before replay
        if: ${{ env.DISPATCH_CONFIRM == 'VERIFY_SEYEON_G3_HISTORY_HOLD' }}
        run: node scripts/verify-production-seyeon-g3-history-http.mjs
