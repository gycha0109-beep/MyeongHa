name: Production Member Auth Abuse Policy
run-name: "[WT:ops] Production Member Auth Abuse Policy — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'one-shot-probe-preview-capability' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify live HOLD state or run the reversible Preview WAF capability probe.
        required: true
        type: choice
        options:
          - verify-live
          - probe-preview-capability
      confirm:
        description: Type VERIFY_MEMBER_AUTH_ABUSE_POLICY_V1 or PROBE_MEMBER_AUTH_PREVIEW_WAF_CAPABILITY_V1
        required: true
        type: string
      watchtower_track:
        description: Watchtower Track Key for Production operations attribution
        required: true
        default: ops
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/ops/sec-02-b1a-preview-waf-capability.once'

permissions:
  contents: read

concurrency:
  group: production-vercel-firewall-config
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha

jobs:
  verify-or-probe:
    name: verify-or-probe-production-member-auth-abuse-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      MYEONGHA_WATCHTOWER_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.watchtower_track || 'ops' }}
      MEMBER_AUTH_ABUSE_POLICY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'probe-preview-capability' }}
      DISPATCH_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || 'PROBE_MEMBER_AUTH_PREVIEW_WAF_CAPABILITY_V1' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Gate one-shot push probe marker
        id: one_shot
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          marker='.github/ops/sec-02-b1a-preview-waf-capability.once'
          if [[ ! -f "$marker" ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$(tr -d '\r\n' < "$marker")" == "SEC-02-B1A-PREVIEW-WAF-CAPABILITY-PROBE-V1" ]]
          echo "execute=true" >> "$GITHUB_OUTPUT"

      - name: Verify HOLD state or run reversible Preview capability probe
        if: ${{ github.event_name == 'workflow_dispatch' || steps.one_shot.outputs.execute == 'true' }}
        shell: bash
        run: bash scripts/operations/run-production-member-auth-abuse-policy.sh
