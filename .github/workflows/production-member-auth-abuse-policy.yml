name: Production Member Auth Abuse Policy
run-name: "[WT:ops] Production Member Auth Abuse Policy — ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify live HOLD state or run the reversible Preview WAF capability probe.
        required: true
        type: choice
        options:
          - verify-live
          - probe-preview-capability
      confirm:
        description: Type VERIFY_MEMBER_AUTH_ABUSE_POLICY_V1 or PROBE_MEMBER_AUTH_PREVIEW_WAF_CAPABILITY_V1
        required: true
        type: string
      watchtower_track:
        description: Watchtower Track Key for Production operations attribution
        required: true
        default: ops
        type: string

permissions:
  contents: read

concurrency:
  group: production-vercel-firewall-config
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha

jobs:
  verify-or-probe:
    name: verify-or-probe-production-member-auth-abuse-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      MYEONGHA_WATCHTOWER_TRACK: ${{ inputs.watchtower_track }}
      MEMBER_AUTH_ABUSE_POLICY_MODE: ${{ inputs.mode }}
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify HOLD state or run reversible Preview capability probe
        shell: bash
        run: bash scripts/operations/run-production-member-auth-abuse-policy.sh
