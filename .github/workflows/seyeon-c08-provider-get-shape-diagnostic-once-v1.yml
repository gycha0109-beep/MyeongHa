name: '[WT:character-memory] C08 Provider GET-shape diagnostic once'
on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-c08-provider-get-shape-diagnostic-once.trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: seyeon-c08-provider-get-shape-diagnostic-once
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Validate offline diagnostic before GET
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx vitest run test/seyeon-c08-provider-get-shape-diagnostic-once-v1.test.mjs
      - name: Get only endpoint metadata shapes
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +x
          test -n "$OPENROUTER_API_KEY"
          node scripts/seyeon-c08-provider-get-shape-diagnostic-once-v1.mjs
      - name: Save public aggregate evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: seyeon-c08-get-shape-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c08-provider-get-shape-diagnostic-once/
          if-no-files-found: warn
          retention-days: 14
