name: Production Saju Current Subject Smoke
run-name: "[WT:ops] Production Saju Current Subject Smoke"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_SAJU_CURRENT_SUBJECT to run the production Member calculation and Preview Reading smoke (Guest scope is explicitly opt-in).'
        required: true
        type: string
      scope:
        description: 'member_only checks test Member Calculation + Preview; member_and_guest additionally writes a synthetic Production Guest and Birth and needs guest_write_confirm.'
        required: true
        type: choice
        default: member_only
        options:
          - member_only
          - member_and_guest
      guest_write_confirm:
        description: 'Only for member_and_guest: type VERIFY_SAJU_GUEST_WRITE to authorize synthetic Guest bootstrap and Birth creation in Production.'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/production-saju-current-subject-smoke.trigger'

permissions:
  contents: read

concurrency:
  group: production-saju-current-subject-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: verify-production-saju-current-subject
    runs-on: ubuntu-24.04
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ github.event_name == 'push' && 'VERIFY_SAJU_CURRENT_SUBJECT' || inputs.confirm }}
      MYEONGHA_SAJU_SMOKE_SCOPE: ${{ github.event_name == 'push' && 'member_only' || inputs.scope }}
      MYEONGHA_SAJU_GUEST_WRITE_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_write_confirm || '' }}
      MYEONGHA_PRODUCTION_MEMBER_EMAIL: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EMAIL }}
      MYEONGHA_PRODUCTION_MEMBER_PASSWORD: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_PASSWORD }}
      MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID: ${{ secrets.MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID }}
    steps:
      - name: Verify explicit dispatch and governed fresh-session credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRM" == 'VERIFY_SAJU_CURRENT_SUBJECT' ]]
          [[ "$MYEONGHA_SAJU_SMOKE_SCOPE" == 'member_only' || "$MYEONGHA_SAJU_SMOKE_SCOPE" == 'member_and_guest' ]]
          if [[ "$MYEONGHA_SAJU_SMOKE_SCOPE" == 'member_and_guest' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
            # A failed/cancelled first attempt may already have written the Guest fixture.
            # Re-running the same workflow/job must never write another fixture.
            [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
            [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$MYEONGHA_SAJU_GUEST_WRITE_CONFIRM" == 'VERIFY_SAJU_GUEST_WRITE' ]]
          fi
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EMAIL:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_PASSWORD:-}"
          test -n "${MYEONGHA_PRODUCTION_MEMBER_EXPECTED_SUBJECT_ID:-}"

      - name: Check out exact repository verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify governed Production Saju calculation and Preview Reading scope
        run: node scripts/verify-production-saju-current-subject.mjs
