name: One-time Production Member Subject Repair

on:
  push:
    branches:
      - ops/repair-member-subject-20260905
    paths:
      - '.github/workflows/_temp-repair-member-subject.yml'

permissions:
  contents: read

concurrency:
  group: one-time-production-member-subject-repair
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: cnsfpcdiyofqvhpcegfc
  TARGET_AUTH_USER_ID: e03aed6f-ff5e-41b0-8de4-33c6127fc0e3
  TARGET_GUEST_SUBJECT_ID: 1ab74118-b6fb-474d-ad9d-fede590056f3
  TARGET_GUEST_SESSION_ID: f6b8ca19-0858-44af-a47c-ff47dc5e6b0e

jobs:
  repair:
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7.0.1

      - name: Verify guarded repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_ID" = 'cnsfpcdiyofqvhpcegfc'
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$TARGET_AUTH_USER_ID" = 'e03aed6f-ff5e-41b0-8de4-33c6127fc0e3'
          test "$TARGET_GUEST_SUBJECT_ID" = '1ab74118-b6fb-474d-ad9d-fede590056f3'
          test "$TARGET_GUEST_SESSION_ID" = 'f6b8ca19-0858-44af-a47c-ff47dc5e6b0e'

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Resolve governed production pooler
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pooler_file="$RUNNER_TEMP/myeongha-member-repair-pooler.json"
          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler" \
            -o "$pooler_file"

          connection_string="$(jq -r '
            (if type == "array" then . elif (.data? | type) == "array" then .data else [.] end)
            | map(select((.database_type // "") == "PRIMARY"))
            | map(.connection_string // .connectionString // "")
            | map(select(type == "string" and length > 0 and test("\\.pooler\\.supabase\\.com:(5432|6543)/postgres(?:\\?|$)")))
            | sort_by(if test(":5432/postgres(?:\\?|$)") then 0 else 1 end)
            | first // empty
          ' "$pooler_file")"
          test -n "$connection_string"

          admin_pool_user="$(sed -E 's#^[a-zA-Z0-9+.-]+://([^:]+):.*#\1#' <<<"$connection_string")"
          pool_host="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\1#' <<<"$connection_string")"
          pool_port="$(sed -E 's#^[^@]+@([^:/]+):([0-9]+)/.*#\2#' <<<"$connection_string")"
          pool_db="$(sed -E 's#^[^@]+@[^/]+/([^?]+).*$#\1#' <<<"$connection_string")"

          test "$admin_pool_user" = "postgres.$SUPABASE_PROJECT_ID"
          [[ "$pool_host" == *.pooler.supabase.com ]]
          [[ "$pool_port" == '5432' || "$pool_port" == '6543' ]]
          test "$pool_db" = 'postgres'

          {
            echo "ADMIN_POOL_USER=$admin_pool_user"
            echo "POOL_HOST=$pool_host"
            echo "POOL_PORT=$pool_port"
            echo "POOL_DB=$pool_db"
          } >> "$GITHUB_ENV"
          rm -f "$pooler_file"

      - name: Execute guarded canonical promotion
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql "host=$POOL_HOST port=$POOL_PORT dbname=$POOL_DB user=$ADMIN_POOL_USER sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -v auth_user_id="$TARGET_AUTH_USER_ID" \
            -v guest_subject_id="$TARGET_GUEST_SUBJECT_ID" \
            -v guest_session_id="$TARGET_GUEST_SESSION_ID" <<'SQL'
          do $$
          declare
            v_auth_user_id uuid := :'auth_user_id'::uuid;
            v_guest_subject_id uuid := :'guest_subject_id'::uuid;
            v_guest_session_id uuid := :'guest_session_id'::uuid;
            v_user_created timestamptz;
            v_guest_created timestamptz;
            v_nearby_count integer;
            v_row record;
          begin
            if exists (
              select 1 from public.subjects s
              where s.auth_user_id = v_auth_user_id
                and s.kind = 'member'
                and s.status in ('active','deletion_pending')
                and s.merged_into_subject_id is null
            ) then
              raise exception 'repair refused: member subject already exists';
            end if;

            select u.created_at into strict v_user_created
            from auth.users u
            where u.id = v_auth_user_id;

            select gs.created_at into strict v_guest_created
            from public.guest_sessions gs
            join public.subjects s on s.id = gs.subject_id
            where gs.id = v_guest_session_id
              and gs.subject_id = v_guest_subject_id
              and s.kind = 'guest'
              and s.status = 'active'
              and s.auth_user_id is null
              and s.merged_into_subject_id is null
              and gs.consumed_at is null
              and gs.claimed_by_subject_id is null
              and gs.expires_at > clock_timestamp();

            if abs(extract(epoch from (v_user_created - v_guest_created))) > 30 then
              raise exception 'repair refused: signup/guest correlation outside 30 seconds';
            end if;

            select count(*) into v_nearby_count
            from public.guest_sessions gs
            where gs.created_at between v_user_created - interval '30 seconds' and v_user_created + interval '30 seconds';

            if v_nearby_count <> 1 then
              raise exception 'repair refused: guest correlation is not unique';
            end if;

            select * into strict v_row
            from public.cmd_promote_guest_v1(v_guest_subject_id, v_guest_session_id, v_auth_user_id);

            if v_row.subject_id <> v_guest_subject_id
               or v_row.subject_kind <> 'member'
               or v_row.subject_status <> 'active'
               or v_row.replayed is not false then
              raise exception 'repair refused: canonical promotion returned unexpected state';
            end if;
          end
          $$;

          select
            s.kind,
            s.status,
            (s.auth_user_id = :'auth_user_id'::uuid) as auth_bound,
            (gs.consumed_at is not null) as guest_session_consumed,
            (gs.claimed_by_subject_id = s.id) as guest_session_claimed
          from public.subjects s
          join public.guest_sessions gs on gs.subject_id = s.id
          where s.id = :'guest_subject_id'::uuid
            and gs.id = :'guest_session_id'::uuid;
          SQL
