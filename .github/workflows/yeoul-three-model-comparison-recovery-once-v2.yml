name: "[WT:character-runtime-lab] Yeoul three-model Grok token recovery bounded once"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yeoul-three-model-comparison-recovery-once-v2.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: yeoul-three-model-recovery-20261119-lifetime-once
  cancel-in-progress: false

jobs:
  bounded-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate 117 response plan and conservative cumulative cap
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/character-optimization/yeoul-three-model-comparison-recovery-once-v2.mjs
          node scripts/character-optimization/yeoul-three-model-comparison-recovery-once-v2.mjs --plan-only
      - name: Resume synthetic three-model comparison with actual usage receipts
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
          YEOUL_RESULT_PATH: ${{ runner.temp }}/yeoul-three-model-recovery.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          node scripts/character-optimization/yeoul-three-model-comparison-recovery-once-v2.mjs
      - name: Save synthetic responses one day for owner evaluation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-three-model-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/yeoul-three-model-recovery.json
          if-no-files-found: ignore
          retention-days: 1
