name: '[WT:character-memory] OpenRouter read-only actual key spend audit'
on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-openrouter-billing-readonly.trigger'
permissions:
  contents: read
  actions: read
concurrency:
  group: seyeon-openrouter-billing-readonly-lifetime-once
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test read-only billing projection
        run: npx vitest run test/seyeon-openrouter-readonly-billing-v1.test.mjs
      - name: Read key usage, no inference requests
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$OPENROUTER_API_KEY"
          node scripts/seyeon-openrouter-readonly-billing-v1.mjs
      - name: Upload numeric-only billing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seyeon-openrouter-billing-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-openrouter-billing-readonly/
          if-no-files-found: warn
          retention-days: 14
