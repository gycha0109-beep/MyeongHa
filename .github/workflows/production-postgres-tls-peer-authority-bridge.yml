name: Production PostgreSQL TLS Authority Bridge
run-name: "[WT:security] Production PostgreSQL TLS Authority Bridge"

on:
  push:
    branches:
      - main
    paths:
      - config/operations/run-once/production-postgres-tls-peer-authority-b2a.marker

permissions:
  contents: read

concurrency:
  group: production-postgres-tls-authority-bridge
  cancel-in-progress: false

jobs:
  route-exact-marker:
    name: validate-exact-one-shot-marker
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.route.outputs.authorized }}
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: route
        name: Require exact main push marker
        shell: bash
        run: |
          set -euo pipefail
          marker='config/operations/run-once/production-postgres-tls-peer-authority-b2a.marker'
          expected='VERIFY_POSTGRES_TLS_PEER_B2A_AUTHORITY_ONCE'
          [[ "$GITHUB_EVENT_NAME" == 'push' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ -f "$marker" ]]
          [[ "$(cat "$marker")" == "$expected" ]]
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  authority-preflight:
    name: verify-production-postgres-root-authority
    needs:
      - route-exact-marker
    if: needs.route-exact-marker.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      MYEONGHA_WATCHTOWER_TRACK: security
      MYEONGHA_POSTGRES_TLS_PEER_AUTHORITY_BRIDGE_MARKER_PATH: config/operations/run-once/production-postgres-tls-peer-authority-b2a.marker
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}
      SUPABASE_PRODUCTION_SESSION_POOLER_HOST: ${{ secrets.SUPABASE_PRODUCTION_SESSION_POOLER_HOST }}
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use governed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Run exact one-shot TLS authority bridge
        run: node scripts/operations/run-production-postgres-tls-peer-authority-bridge.mjs
