name: Face Reading Chin Contour Endpoint Candidate Admission

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr52-chin-contour-endpoint-candidate-admission.test.ts'
      - 'docs/FACE_READING_FR52_CHIN_CONTOUR_ENDPOINT_CANDIDATE_ADMISSION_V0.1.md'
      - 'docs/FACE_READING_FR52_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-chin-contour-endpoint-candidate-admission.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr52-chin-contour-endpoint-candidate-admission.test.ts'
      - 'docs/FACE_READING_FR52_CHIN_CONTOUR_ENDPOINT_CANDIDATE_ADMISSION_V0.1.md'
      - 'docs/FACE_READING_FR52_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-chin-contour-endpoint-candidate-admission.yml'

permissions:
  contents: read

jobs:
  fr52-chin-contour-endpoint-candidate-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Run FR-52 endpoint candidate tests
        run: npx vitest run test/face-reading-fr52-chin-contour-endpoint-candidate-admission.test.ts
      - name: Verify compiled FR-52 prioritizes research acquisition without endpoint promotion
        run: |
          node --input-type=module <<'NODE'
          import {
            CHIN_CONTOUR_ENDPOINT_CANDIDATE_AUTHORITY_FR52,
            assessChinContourEndpointCandidateReadinessFR52,
            assertChinContourEndpointsReadyForProductionFR52,
            deriveMentonSideEndpointCandidatePairFR52,
            validateChinContourEndpointCandidateAuthorityFR52,
          } from './dist/packages/face-reading/src/index.js';

          validateChinContourEndpointCandidateAuthorityFR52();
          const authority = CHIN_CONTOUR_ENDPOINT_CANDIDATE_AUTHORITY_FR52;
          const readiness = assessChinContourEndpointCandidateReadinessFR52();
          if (authority.researchAcquisitionPriority !== 'bilateral_menton_side') process.exit(1);
          if (authority.finalEndpointSelection !== null) process.exit(1);
          if (authority.endpointSelectionRule !== null) process.exit(1);
          if (authority.endpointEquivalenceTolerance !== null) process.exit(1);
          if (authority.mentalTubercleSurfaceDefinitionRule !== null) process.exit(1);
          if (!readiness.mentonSideOperationalResearchCandidateReady) process.exit(1);
          if (!readiness.softTissueMentalTubercleChinRegionCandidateReady) process.exit(1);
          if (readiness.finalEndpointSelectionReady || readiness.exactEndpointRuleReady) process.exit(1);
          if (readiness.providerMappingReady || readiness.productionGeometryReady) process.exit(1);
          if (!Object.values(authority.authorityBoundary).every((value) => value === false)) process.exit(1);

          const candidate = deriveMentonSideEndpointCandidatePairFR52({
            schemaVersion: 'fr50-independent-central-chin-scaffold-v1',
            subjectId: 'workflow-subject',
            captureId: 'workflow-capture',
            annotatorId: 'workflow-annotator',
            coordinateFrame: 'normalized_image_2d',
            leftCheilion: { x: 0.34, y: 0.61 },
            leftMentonSide: { x: 0.34, y: 0.82 },
            softTissueMenton: { x: 0.5, y: 0.85 },
            rightMentonSide: { x: 0.66, y: 0.82 },
            rightCheilion: { x: 0.66, y: 0.61 },
            providerOutputVisibleDuringAnnotation: false,
            annotationFrozenBeforeProviderScoring: true,
            traditionalLabelVisibleDuringAnnotation: false,
          });
          if (candidate.exactFR35EndpointPairAuthorized) process.exit(1);
          if (candidate.denseCurveAuthorized) process.exit(1);
          if (candidate.providerMappingAuthorized) process.exit(1);
          if (candidate.traditionalDigeEdgeAuthorized) process.exit(1);
          if (candidate.productionGeometryAuthorized) process.exit(1);

          let blocked = false;
          try {
            assertChinContourEndpointsReadyForProductionFR52();
          } catch {
            blocked = true;
          }
          if (!blocked) process.exit(1);
          NODE
