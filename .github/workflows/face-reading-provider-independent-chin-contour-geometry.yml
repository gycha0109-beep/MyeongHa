name: Face Reading Provider Independent Chin Contour Geometry

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr50-provider-independent-chin-contour-geometry.test.ts'
      - 'docs/FACE_READING_FR50_PROVIDER_INDEPENDENT_CHIN_CONTOUR_GEOMETRY_V0.1.md'
      - 'docs/FACE_READING_FR50_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-provider-independent-chin-contour-geometry.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-fr50-provider-independent-chin-contour-geometry.test.ts'
      - 'docs/FACE_READING_FR50_PROVIDER_INDEPENDENT_CHIN_CONTOUR_GEOMETRY_V0.1.md'
      - 'docs/FACE_READING_FR50_AUTHORITY_DECISION_V0.1.md'
      - '.github/workflows/face-reading-provider-independent-chin-contour-geometry.yml'

permissions:
  contents: read

jobs:
  fr50-provider-independent-chin-contour-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Run FR-50 contour geometry tests
        run: npx vitest run test/face-reading-fr50-provider-independent-chin-contour-geometry.test.ts
      - name: Verify compiled FR-50 stays research-only and fail-closed
        run: |
          node --input-type=module <<'NODE'
          import {
            PROVIDER_INDEPENDENT_CHIN_CONTOUR_GEOMETRY_AUTHORITY_FR50,
            assessProviderIndependentChinContourGeometryReadinessFR50,
            assertProviderIndependentChinContourGeometryReadyForProductionFR50,
            deriveCentralChinInferiorSparseScaffoldFR50,
            validateProviderIndependentChinContourGeometryAuthorityFR50,
          } from './dist/packages/face-reading/src/index.js';

          validateProviderIndependentChinContourGeometryAuthorityFR50();
          const authority = PROVIDER_INDEPENDENT_CHIN_CONTOUR_GEOMETRY_AUTHORITY_FR50;
          const readiness = assessProviderIndependentChinContourGeometryReadinessFR50();
          if (!authority.relation.providerIndependentContourOperationalizationEvidenceAvailable) process.exit(1);
          if (!authority.relation.lowerJawlineSurfaceCurveRepresentationSupported) process.exit(1);
          if (!authority.relation.centralChinBilateralScaffoldSupported) process.exit(1);
          if (authority.relation.fr35ExactChinInferiorContourScopeEstablished) process.exit(1);
          if (authority.relation.fr35ExactContourGeometryEstablished) process.exit(1);
          if (authority.relation.canonicalImage2DProjectionRuleEstablished) process.exit(1);
          if (readiness.providerMappingReady || readiness.productionGeometryReady) process.exit(1);
          if (!Object.values(authority.authorityBoundary).every((value) => value === false)) process.exit(1);
          if (authority.researchScaffoldProtocol.minimumSubjectCount !== null) process.exit(1);
          if (authority.researchScaffoldProtocol.pointAlignmentTolerance !== null) process.exit(1);
          if (authority.researchScaffoldProtocol.interpolationMethod !== null) process.exit(1);
          if (authority.researchScaffoldProtocol.smoothingMethod !== null) process.exit(1);

          const candidate = deriveCentralChinInferiorSparseScaffoldFR50({
            schemaVersion: 'fr50-independent-central-chin-scaffold-v1',
            subjectId: 'workflow-subject',
            captureId: 'workflow-capture',
            annotatorId: 'workflow-annotator',
            coordinateFrame: 'normalized_image_2d',
            leftCheilion: { x: 0.35, y: 0.61 },
            leftMentonSide: { x: 0.35, y: 0.81 },
            softTissueMenton: { x: 0.5, y: 0.84 },
            rightMentonSide: { x: 0.65, y: 0.81 },
            rightCheilion: { x: 0.65, y: 0.61 },
            providerOutputVisibleDuringAnnotation: false,
            annotationFrozenBeforeProviderScoring: true,
            traditionalLabelVisibleDuringAnnotation: false,
          });
          if (candidate.geometry.points.length !== 3) process.exit(1);
          if (candidate.fullFR35ContourBindingAuthorized) process.exit(1);
          if (candidate.providerMappingAuthorized) process.exit(1);
          if (candidate.productionGeometryAuthorized) process.exit(1);

          let blocked = false;
          try {
            assertProviderIndependentChinContourGeometryReadyForProductionFR50();
          } catch {
            blocked = true;
          }
          if (!blocked) process.exit(1);
          NODE
