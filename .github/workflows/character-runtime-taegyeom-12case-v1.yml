name: "[WT:character-runtime-lab] 태겸 12문항 GLM 런타임 실험"

on:
  push:
    branches:
      - experiment/character-runtime-lab-taegyeom-v1
    paths:
      - ".github/character-runtime-taegyeom-12case-v1.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-runtime-lab-taegyeom-12case-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.ref == 'refs/heads/experiment/character-runtime-lab-taegyeom-v1' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build approved character runtime authoring
        run: npm run build

      - name: Run isolated 12-case GLM dialogue experiment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
          TAEGYEOM_EVAL_OUTPUT: ${{ runner.temp }}/taegyeom-runtime-12case-v1/report.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          node scripts/run-taegyeom-runtime-12case-v1.mjs

      - name: Retain full owner-review dialogue evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taegyeom-runtime-12case-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taegyeom-runtime-12case-v1/report.json
          if-no-files-found: warn
          retention-days: 14
