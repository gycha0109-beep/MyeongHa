name: TEMP PR611 Commerce Negative Count Align

on:
  push:
    branches:
      - feat/commerce-capability-authority-20260909
    paths:
      - '.github/workflows/tmp-pr611-commerce-negative-count-align.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-capability-authority-20260909
          fetch-depth: 0
      - name: Align remaining Commerce catalog count guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/db/commerce_negative.sql')
          text = path.read_text()
          replacements = {
              "if table_count <> 60 then": "if table_count <> 62 then",
              "raise exception 'FAIL schema catalog table count: expected 60, got %', table_count;": "raise exception 'FAIL schema catalog table count: expected 62, got %', table_count;",
              "raise notice 'PASS executable public schema catalog = 60 tables';": "raise notice 'PASS executable public schema catalog = 62 tables';",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          if 'expected 60, got %' in text or 'public schema catalog = 60 tables' in text or 'table_count <> 60' in text:
              raise SystemExit('legacy Commerce 60-table guard remains')
          path.write_text(text)
          PY
          git diff --check
          git diff -- test/db/commerce_negative.sql
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-pr611-commerce-negative-count-align.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/db/commerce_negative.sql
          git diff --cached --check
          git commit -m "test(db): align Commerce negative catalog count"
          git push origin HEAD:feat/commerce-capability-authority-20260909
