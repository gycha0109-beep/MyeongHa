name: Wealth Luna Real Saju Research One-Shot
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Fixed anonymized Saju calculation scenario
        required: true
        type: choice
        options:
          - case-a
          - case-b
permissions:
  contents: read
concurrency:
  group: wealth-luna-real-saju-one-shot
  cancel-in-progress: false
jobs:
  real-source-one-shot:
    if: github.actor == 'gycha0109-beep' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile pinned MyeongHa source
        run: npm run build
      - name: Admit both actual Saju evidence fixtures without any model calls
        env:
          WEALTH_LUNA_SOURCE_VALIDATE_ONLY: 'true'
        shell: bash
        run: |
          node scripts/saju/wealth-luna-real-source-one-shot.mjs case-a
          node scripts/saju/wealth-luna-real-source-one-shot.mjs case-b
      - name: Generate six evidence-bound chapters with actual GPT-6 Luna once
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMPLE: ${{ inputs.sample }}
        shell: bash
        run: node scripts/saju/wealth-luna-real-source-one-shot.mjs "$SAMPLE"
      - name: Store private research HTML and exact model usage for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealth-luna-real-saju-research
          path: |
            wealth-luna-real-*.html
            wealth-luna-real-*.json
          if-no-files-found: ignore
          retention-days: 3
