name: TEMP Supabase Custom Owner DB Push 610

on:
  push:
    branches:
      - ops/supabase-custom-owner-db-push-610
    paths:
      - '.github/workflows/tmp-ops-supabase-custom-owner-db-push-610.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/supabase-custom-owner-db-push-610
          fetch-depth: 0
      - name: Patch pending migration and regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/0980_content_release_lifecycle_authority.sql')
          text = migration.read_text()
          old = """END
          $$;

          grant usage on schema public to myeongha_content_publication_owner;
          """
          new = """END
          $$;

          -- Supabase CLI applies migrations as postgres. When functions are reassigned to a
          -- custom NOLOGIN owner role, postgres must be a member so ALTER ... OWNER can SET ROLE.
          grant myeongha_content_publication_owner to postgres;

          grant usage on schema public to myeongha_content_publication_owner;
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one migration insertion anchor, found {count}')
          migration.write_text(text.replace(old, new, 1))

          test = Path('test/db/content_release_lifecycle_authority.sh')
          text = test.read_text()
          old = """[[ \"$role_shape\" == '0|0|0|0' ]] || fail \"content operator role shape mismatch: $role_shape\"

          for fn in \\
          """
          new = """[[ \"$role_shape\" == '0|0|0|0' ]] || fail \"content operator role shape mismatch: $role_shape\"

          postgres_owner_membership=\"$(query \"select pg_has_role('postgres','myeongha_content_publication_owner','MEMBER')::int;\")\"
          [[ \"$postgres_owner_membership\" == '1' ]] || fail \"postgres cannot assume content publication owner during migration deployment\"
          pass \"postgres deployment principal can assume content publication owner\"

          for fn in \\
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one test insertion anchor, found {count}')
          test.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- supabase/migrations/0980_content_release_lifecycle_authority.sql test/db/content_release_lifecycle_authority.sh
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-ops-supabase-custom-owner-db-push-610.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/0980_content_release_lifecycle_authority.sql test/db/content_release_lifecycle_authority.sh
          git diff --cached --check
          git commit -m "fix(db): allow postgres to assume content publication owner"
          git push origin HEAD:ops/supabase-custom-owner-db-push-610
