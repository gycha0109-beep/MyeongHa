name: Face Reading Capture Quality Raw Observations

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/capture-quality-raw-observations-frdata05.ts'
      - 'packages/face-reading/src/browser-pixel-evidence-frdata04.ts'
      - 'packages/face-reading/src/browser-image-decode-frdata03.ts'
      - 'packages/face-reading/src/image-byte-dimensions-frdata02.ts'
      - 'packages/face-reading/src/menton-dataset-intake-frdata01.ts'
      - 'packages/face-reading/src/index.ts'
      - 'scripts/face-reading-fr-data01-menton-dataset-intake.mjs'
      - 'scripts/face-reading-fr-data02-image-dimensions.mjs'
      - 'scripts/face-reading-fr-data04-browser-pixel-evidence.mjs'
      - 'scripts/face-reading-fr-data04-selftest-fixture.mjs'
      - 'scripts/face-reading-fr-data05-capture-quality-raw-observations.mjs'
      - 'test/face-reading-fr-data05-capture-quality-raw-observations.test.ts'
      - 'docs/FACE_READING_FR_DATA05_CAPTURE_QUALITY_RAW_OBSERVATIONS.md'
      - '.github/workflows/face-reading-capture-quality-raw-observations.yml'
  workflow_dispatch:

jobs:
  fr-data05-capture-quality-raw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Create deterministic PNG fixtures with known RGBA formula
        run: node scripts/face-reading-fr-data04-selftest-fixture.mjs artifacts/face-reading/fr-data05-selftest
      - name: Establish FR-DATA-04 exact browser raster prerequisite
        shell: bash
        run: |
          set +e
          node scripts/face-reading-fr-data04-browser-pixel-evidence.mjs \
            artifacts/face-reading/fr-data05-selftest/manifest.json \
            artifacts/face-reading/fr-data05-selftest/assets \
            artifacts/face-reading/fr-data05-selftest/fr-data04-report.json \
            > >(tee artifacts/face-reading/fr-data05-selftest/fr-data04.stdout.log) \
            2> >(tee artifacts/face-reading/fr-data05-selftest/fr-data04.stderr.log >&2)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if ! grep -Fq "Error: ENOTEMPTY: directory not empty, rmdir '/tmp/myeongha-fr-data04-" artifacts/face-reading/fr-data05-selftest/fr-data04.stderr.log; then
              exit "$status"
            fi
            test -s artifacts/face-reading/fr-data05-selftest/fr-data04-report.json
            echo 'FR_DATA04_EPHEMERAL_PROFILE_CLEANUP_RACE_ACCEPTED_AFTER_REPORT_WRITE'
          fi
      - name: Compute independent expected raw aggregates from fixture formula
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const rasterExpected = JSON.parse(await readFile('artifacts/face-reading/fr-data05-selftest/expected-raster.json', 'utf8'));
          const fixtures = [
            ['capture-baseline', 2, 2, 11],
            ['capture-repeat', 3, 2, 97],
          ];

          function expected(width, height, seed) {
            const values = [];
            const pixels = [];
            for (let y = 0; y < height; y += 1) {
              const row = [];
              for (let x = 0; x < width; x += 1) {
                const r = (seed + x * 17) & 0xff;
                const g = (seed + y * 29) & 0xff;
                const b = (seed + x + y) & 0xff;
                pixels.push([r, g, b]);
                row.push(r + g + b);
              }
              values.push(row);
            }
            const flat = values.flat();
            let horizontalAbsoluteDifferenceSum = 0;
            let horizontalSquaredDifferenceSum = 0;
            for (let y = 0; y < height; y += 1) {
              for (let x = 0; x + 1 < width; x += 1) {
                const difference = Math.abs(values[y][x + 1] - values[y][x]);
                horizontalAbsoluteDifferenceSum += difference;
                horizontalSquaredDifferenceSum += difference * difference;
              }
            }
            let verticalAbsoluteDifferenceSum = 0;
            let verticalSquaredDifferenceSum = 0;
            for (let y = 0; y + 1 < height; y += 1) {
              for (let x = 0; x < width; x += 1) {
                const difference = Math.abs(values[y + 1][x] - values[y][x]);
                verticalAbsoluteDifferenceSum += difference;
                verticalSquaredDifferenceSum += difference * difference;
              }
            }
            let xIndexWeightedSum = 0;
            let yIndexWeightedSum = 0;
            for (let y = 0; y < height; y += 1) {
              for (let x = 0; x < width; x += 1) {
                xIndexWeightedSum += values[y][x] * x;
                yIndexWeightedSum += values[y][x] * y;
              }
            }
            return {
              rgbIntensity: {
                min: Math.min(...flat),
                max: Math.max(...flat),
                sum: flat.reduce((total, value) => total + value, 0),
                sumSquares: flat.reduce((total, value) => total + value * value, 0),
                exactBlackPixelCount: flat.filter((value) => value === 0).length,
                exactWhitePixelCount: flat.filter((value) => value === 765).length,
                anyChannelZeroPixelCount: pixels.filter(([r, g, b]) => r === 0 || g === 0 || b === 0).length,
                anyChannelFullScalePixelCount: pixels.filter(([r, g, b]) => r === 255 || g === 255 || b === 255).length,
              },
              adjacentIntensityDifferences: {
                horizontal: {
                  pairCount: height * Math.max(0, width - 1),
                  absoluteDifferenceSum: horizontalAbsoluteDifferenceSum,
                  squaredDifferenceSum: horizontalSquaredDifferenceSum,
                },
                vertical: {
                  pairCount: width * Math.max(0, height - 1),
                  absoluteDifferenceSum: verticalAbsoluteDifferenceSum,
                  squaredDifferenceSum: verticalSquaredDifferenceSum,
                },
              },
              spatialIntensityMoments: { xIndexWeightedSum, yIndexWeightedSum },
            };
          }

          const output = Object.fromEntries(fixtures.map(([captureRef, width, height, seed]) => [captureRef, {
            rasterSha256: rasterExpected[captureRef].rasterSha256,
            ...expected(width, height, seed),
          }]));
          await writeFile('artifacts/face-reading/fr-data05-selftest/expected-quality.json', `${JSON.stringify(output, null, 2)}\n`, 'utf8');
          NODE
      - name: Execute FR-DATA-05 real Chrome raw observation pass
        run: |
          node scripts/face-reading-fr-data05-capture-quality-raw-observations.mjs \
            artifacts/face-reading/fr-data05-selftest/manifest.json \
            artifacts/face-reading/fr-data05-selftest/assets \
            artifacts/face-reading/fr-data05-selftest/fr-data04-report.json \
            artifacts/face-reading/fr-data05-selftest/report.json
      - name: Verify exact raw aggregates and authority boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const report = JSON.parse(await readFile('artifacts/face-reading/fr-data05-selftest/report.json', 'utf8'));
          const expected = JSON.parse(await readFile('artifacts/face-reading/fr-data05-selftest/expected-quality.json', 'utf8'));
          if (
            report.schemaVersion !== 'fr-data05-capture-quality-raw-observation-v1' ||
            report.captureCount !== 2 ||
            report.frData04PixelRasterEvidenceVerified !== true ||
            report.rasterIdentityReconfirmed !== true ||
            report.thresholdFreeCaptureQualityInputsObserved !== true ||
            report.rgbIntensityRawEvidenceObserved !== true ||
            report.adjacentIntensityDifferenceRawEvidenceObserved !== true ||
            report.spatialIntensityMomentRawEvidenceObserved !== true ||
            report.measurementProvenance?.protocol !== 'chrome_devtools_protocol' ||
            report.measurementProvenance?.measurementPrimitive !== 'canvas_rgba_integer_rgb_sum_neighbors_spatial_moments' ||
            report.measurementProvenance?.deterministicReplay !== true ||
            report.measurementProvenance?.rasterIdentityReconfirmedBySha256 !== true
          ) throw new Error(`FR-DATA-05 runtime contract failed: ${JSON.stringify(report)}`);

          for (const observation of report.captureObservations) {
            const wanted = expected[observation.captureRef];
            if (!wanted) throw new Error(`unexpected capture ${observation.captureRef}`);
            if (
              observation.rasterSha256 !== wanted.rasterSha256 ||
              JSON.stringify(observation.rgbIntensity) !== JSON.stringify(wanted.rgbIntensity) ||
              JSON.stringify(observation.adjacentIntensityDifferences) !== JSON.stringify(wanted.adjacentIntensityDifferences) ||
              JSON.stringify(observation.spatialIntensityMoments) !== JSON.stringify(wanted.spatialIntensityMoments) ||
              observation.alphaAllOpaque !== true
            ) throw new Error(`FR-DATA-05 exact raw aggregate mismatch: ${JSON.stringify(observation)}`);
          }

          const mustRemainFalse = [
            'pixelContentIntegrityVerified',
            'facePresenceVerified',
            'fullFaceFramingValidityVerified',
            'neutralExpressionValidityVerified',
            'naturalHeadPositionValidityVerified',
            'sharpnessMetricValidated',
            'exposureMetricValidated',
            'lightingMetricValidated',
            'exposureAdequacyVerified',
            'lightingAdequacyVerified',
            'blurThresholdPassVerified',
            'occlusionValidityVerified',
            'captureQualityMetricConstructValidityValidated',
            'captureQualityThresholdsDefined',
            'captureQualityAuthorityValidated',
            'mentonAnnotationCorrectnessVerified',
            'mediaPipeInferenceCorrectnessVerified',
            'empiricalScoringPerformed',
            'providerCandidateToMentonMappingValidated',
            'repeatedCaptureRepeatabilityValidated',
            'poseStabilityValidated',
            'calibrationThresholdsDefined',
            'fr35PointToContourRelationValidated',
            'traditionalDigeEquivalenceValidated',
            'fr36VerticalReferencePromoted',
            'productionThreeDivisionsMetricAllowed',
            'productionF1Allowed',
            'productionF6Allowed',
            'researchCandidateAdmitted',
            'productionGeometryAuthorized',
          ];
          for (const key of mustRemainFalse) {
            if (report[key] !== false) throw new Error(`FR-DATA-05 unauthorized claim promotion ${key}: ${JSON.stringify(report)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-data05-capture-quality-raw-selftest
          path: artifacts/face-reading/fr-data05-selftest
          retention-days: 14
