name: Production PostgreSQL TLS B3 Activation
run-name: "[WT:security] Production PostgreSQL TLS B3 Activation"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ACTIVATE_POSTGRES_TLS_VERIFY_FULL_B3 to activate governed verify-full TLS in Production.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-postgres-tls-b3-activation
  cancel-in-progress: false

env:
  MYEONGHA_WATCHTOWER_TRACK: security
  VERCEL_PROJECT_ID: prj_nXF0b5uv27Lyucz2SEBxzdCRXVsP
  VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
  VERCEL_PROJECT_NAME: myeongha

jobs:
  activate:
    name: activate-production-postgres-verify-full
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM: ${{ secrets.SUPABASE_PRODUCTION_SERVER_ROOT_CERT_PEM }}
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use governed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Activate verify-full with staged ordinary-pool canary and rollback
        run: node scripts/operations/run-production-postgres-tls-b3-activation.mjs
