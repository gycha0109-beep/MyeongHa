name: Face Reading FR-DATA-224 Wikimedia Access Smoke

on:
  pull_request:
    paths:
      - 'scripts/face-reading/acquire-frdata224-batch-a.mjs'
      - '.github/workflows/face-reading-frdata224-wikimedia-access-smoke.yml'
      - '.github/workflows/face-reading-frdata224-batch-a-acquisition.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/face-reading/acquire-frdata224-batch-a.mjs'
      - '.github/workflows/face-reading-frdata224-wikimedia-access-smoke.yml'
      - '.github/workflows/face-reading-frdata224-batch-a-acquisition.yml'

permissions:
  contents: read

jobs:
  frdata224-wikimedia-access-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check acquisition script syntax
        run: node --check scripts/face-reading/acquire-frdata224-batch-a.mjs
      - name: Probe pinned Wikimedia source access
        run: node scripts/face-reading/acquire-frdata224-batch-a.mjs probe-access
