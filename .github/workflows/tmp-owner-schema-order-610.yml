name: Temporary Owner Schema Order Regression

on:
  push:
    branches:
      - ops/supabase-owner-schema-create-610
    paths:
      - .github/workflows/tmp-owner-schema-order-610.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/supabase-owner-schema-create-610
      - name: Add deployment-order regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/db/content_release_lifecycle_authority.sh')
          text = path.read_text()
          anchor = """[[ \"$owner_schema_create\" == '0' ]] || fail \"content publication owner retained public schema CREATE after deployment\"\npass \"content publication owner does not retain public schema CREATE\"\n\n"""
          replacement = anchor + """migration_file=\"supabase/migrations/0980_content_release_lifecycle_authority.sql\"\ngrant_create_line=\"$(grep -nF 'grant create on schema public to myeongha_content_publication_owner;' \"$migration_file\" | cut -d: -f1)\"\nrevoke_create_line=\"$(grep -nF 'revoke create on schema public from myeongha_content_publication_owner;' \"$migration_file\" | cut -d: -f1)\"\nmapfile -t owner_lines < <(grep -nF 'owner to myeongha_content_publication_owner;' \"$migration_file\" | cut -d: -f1)\n[[ -n \"$grant_create_line\" && -n \"$revoke_create_line\" ]] || fail \"deployment-scoped schema CREATE grant/revoke is missing\"\n[[ \"${#owner_lines[@]}\" == '5' ]] || fail \"expected five content publication owner reassignments, got ${#owner_lines[@]}\"\n[[ \"$grant_create_line\" -lt \"${owner_lines[0]}\" && \"${owner_lines[4]}\" -lt \"$revoke_create_line\" ]] || fail \"schema CREATE grant/revoke does not bracket all owner reassignments\"\npass \"schema CREATE authority is scoped strictly around owner reassignment\"\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit('ordering regression anchor mismatch')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Commit regression and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-owner-schema-order-610.yml
          git add test/db/content_release_lifecycle_authority.sh
          git commit -m "test(db): lock owner schema grant ordering"
          git push origin HEAD:ops/supabase-owner-schema-create-610
