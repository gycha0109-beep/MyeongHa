name: Yeoul GPT-6 Luna decision A/B one-shot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.actor == 'gycha0109-beep' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Run 6 A/B pairs with GPT-6 Luna decision and dialogue
        env:
          OPENAI_EVAL_API_KEY: ${{ secrets.OPENAI_EVAL_API_KEY }}
        run: node scripts/character-optimization/yeoul-gpt6-luna-ab-live-once-v1.mjs
      - name: Store private unreviewed results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yeoul-gpt6-luna-ab-results
          path: yeoul-gpt6-luna-ab-results.json
          retention-days: 7
          if-no-files-found: ignore
