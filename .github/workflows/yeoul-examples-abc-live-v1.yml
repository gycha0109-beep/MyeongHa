name: "[WT:character-runtime-lab] Yeoul voice development GPT-6 Luna controlled comparison"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yeoul-lively-v4-v1
  cancel-in-progress: false
jobs:
  compare:
    if: ${{ github.actor == 'gycha0109-beep' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Validate three prompt variants
        run: |
          node --check scripts/character-optimization/yeoul-lively-voice-v4.mjs
          node --check scripts/character-optimization/yeoul-lively-v4-live-v1.mjs
          node scripts/character-optimization/yeoul-lively-v4-live-v1.mjs --plan-only
      - name: Compare eight situations v3 vs v4
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/character-optimization/yeoul-lively-v4-live-v1.mjs
      - name: Upload answers and HTML comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-lively-v4-${{ github.run_id }}
          path: |
            yeoul-lively-v4-results.json
            yeoul-lively-v4-comparison.html
          retention-days: 7
          if-no-files-found: ignore
