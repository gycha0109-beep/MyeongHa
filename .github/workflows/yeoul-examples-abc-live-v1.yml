name: "[WT:character-runtime-lab] Yeoul GPT-6 Luna manual candidate comparison"
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: "v5 legacy daily or v6 unseen-pair comparison"
        type: choice
        required: true
        default: v6
        options:
          - v5
          - v6
      paid_approval:
        description: "Owner separately confirms this paid Luna comparison (v6: up to 18 calls)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: yeoul-luna-manual-v1
  cancel-in-progress: false
jobs:
  compare:
    if: ${{ github.actor == 'gycha0109-beep' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.paid_approval == true }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Validate preserved v5 and research-only v6
        run: |
          node --check scripts/character-optimization/yeoul-reaction-first-v5.mjs
          node --check scripts/character-optimization/yeoul-v5-daily-live-v1.mjs
          node --check scripts/character-optimization/yeoul-everyday-reaction-v6.mjs
          node --check scripts/character-optimization/yeoul-v6-comparison-live-v1.mjs
          node --test scripts/character-optimization/yeoul-everyday-reaction-v6.test.mjs
          node scripts/character-optimization/yeoul-v6-comparison-live-v1.mjs --plan-only
      - name: Run selected owner-approved research comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YEOUL_PAID_APPROVAL: ${{ inputs.paid_approval && 'true' || 'false' }}
          YEOUL_COMPARISON: ${{ inputs.comparison }}
        run: |
          if [ "$YEOUL_COMPARISON" = v6 ]; then
            node scripts/character-optimization/yeoul-v6-comparison-live-v1.mjs
          elif [ "$YEOUL_COMPARISON" = v5 ]; then
            node scripts/character-optimization/yeoul-v5-daily-live-v1.mjs
          else
            exit 2
          fi
      - name: Upload real responses for human review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yeoul-${{ inputs.comparison }}-comparison-${{ github.run_id }}
          path: |
            yeoul-v5-daily-results.json
            yeoul-v5-daily-comparison.html
            yeoul-v6-comparison-results.json
            yeoul-v6-comparison.html
          retention-days: 7
          if-no-files-found: ignore
