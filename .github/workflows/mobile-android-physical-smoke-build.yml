name: Mobile Android Physical Smoke Build

run-name: "[WT:applizing] Mobile Android Physical Smoke Build"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_ANDROID_PHYSICAL_SMOKE_V1
        required: true
        type: string
      watchtower_track:
        description: Watchtower work track attribution
        required: true
        default: applizing
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/mobile-android-physical-smoke-build.trigger'

permissions:
  contents: read

concurrency:
  group: mobile-android-physical-smoke-build
  cancel-in-progress: false

jobs:
  build-android-physical-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify explicit physical-smoke authority
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WATCHTOWER_TRACK: ${{ inputs.watchtower_track }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$CONFIRMATION" = "BUILD_ANDROID_PHYSICAL_SMOKE_V1"
            test "$WATCHTOWER_TRACK" = "applizing"
          else
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(tr -d '\r\n' < .github/mobile-android-physical-smoke-build.trigger)" = "BUILD_ANDROID_PHYSICAL_SMOKE_V1"
          fi

          test -n "${EXPO_TOKEN:-}"

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release identity and Android physical-smoke contract
        run: |
          set -euo pipefail
          npm run verify:mobile-release-readiness
          npm run verify:mobile-android-physical-smoke-readiness

      - name: Inspect latest failed EAS physical-smoke build
        shell: bash
        run: |
          set -euo pipefail
          pushd apps/mobile >/dev/null

          npm exec --yes --package=eas-cli@24.10.0 -- \
            eas build:list \
              --platform android \
              --profile physical-smoke \
              --status errored \
              --limit 1 \
              --json \
              --non-interactive \
              > "$RUNNER_TEMP/myeongha-android-physical-smoke-failed-list.json"

          FAILED_LIST_JSON="$RUNNER_TEMP/myeongha-android-physical-smoke-failed-list.json" \
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/myeongha-latest-failed-build-id.txt"
          import { readFileSync } from 'node:fs';

          const parsed = JSON.parse(readFileSync(process.env.FAILED_LIST_JSON, 'utf8'));
          const build = Array.isArray(parsed) ? parsed[0] : null;
          if (build && typeof build.id === 'string') {
            process.stdout.write(build.id);
          }
          NODE

          failed_build_id="$(cat "$RUNNER_TEMP/myeongha-latest-failed-build-id.txt")"
          if [[ -n "$failed_build_id" ]]; then
            npm exec --yes --package=eas-cli@24.10.0 -- \
              eas build:view "$failed_build_id" --json \
              > "$RUNNER_TEMP/myeongha-latest-failed-build-view.json"

            BUILD_VIEW_JSON="$RUNNER_TEMP/myeongha-latest-failed-build-view.json" \
            node --input-type=module <<'NODE'
            import { readFileSync } from 'node:fs';

            const build = JSON.parse(readFileSync(process.env.BUILD_VIEW_JSON, 'utf8'));
            const diagnostic = {
              id: build?.id ?? null,
              status: build?.status ?? null,
              platform: build?.platform ?? null,
              buildProfile: build?.buildProfile ?? null,
              createdAt: build?.createdAt ?? null,
              updatedAt: build?.updatedAt ?? null,
              error: build?.error
                ? {
                    errorCode: build.error.errorCode ?? build.error.code ?? null,
                    message: build.error.message ?? null,
                    phase: build.error.phase ?? null,
                  }
                : null,
            };
            console.log('Latest failed EAS physical-smoke diagnostic:');
            console.log(JSON.stringify(diagnostic, null, 2));
            NODE
          else
            echo "No previous failed EAS physical-smoke build found."
          fi

          popd >/dev/null

      - name: Build Android debug APK without EAS signing credentials
        id: eas_build
        shell: bash
        run: |
          set -uo pipefail
          pushd apps/mobile >/dev/null

          build_stderr="$RUNNER_TEMP/myeongha-android-physical-smoke-build.stderr.log"
          set +e
          npm exec --yes --package=eas-cli@24.10.0 -- \
            eas build \
              --platform android \
              --profile physical-smoke \
              --non-interactive \
              --freeze-credentials \
              --verbose-logs \
              --build-logger-level debug \
              --wait \
              --json \
              > "$RUNNER_TEMP/myeongha-android-physical-smoke-build.json" \
              2> >(tee "$build_stderr" >&2)
          build_rc=$?
          set -e

          if [[ "$build_rc" -ne 0 ]]; then
            BUILD_STDERR="$build_stderr" node --input-type=module <<'NODE' > "$RUNNER_TEMP/myeongha-failed-build-id.txt"
            import { readFileSync } from 'node:fs';

            const text = readFileSync(process.env.BUILD_STDERR, 'utf8');
            const match = text.match(/\/builds\/([0-9a-f-]{36})/iu);
            if (match?.[1]) process.stdout.write(match[1]);
            NODE

            failed_build_id="$(cat "$RUNNER_TEMP/myeongha-failed-build-id.txt")"
            if [[ -n "$failed_build_id" ]]; then
              npm exec --yes --package=eas-cli@24.10.0 -- \
                eas build:view "$failed_build_id" --json \
                > "$RUNNER_TEMP/myeongha-failed-build-view.json" || true

              if [[ -s "$RUNNER_TEMP/myeongha-failed-build-view.json" ]]; then
                BUILD_VIEW_JSON="$RUNNER_TEMP/myeongha-failed-build-view.json" \
                node --input-type=module <<'NODE'
                import { readFileSync } from 'node:fs';

                const build = JSON.parse(readFileSync(process.env.BUILD_VIEW_JSON, 'utf8'));
                const diagnostic = {
                  id: build?.id ?? null,
                  status: build?.status ?? null,
                  platform: build?.platform ?? null,
                  buildProfile: build?.buildProfile ?? null,
                  createdAt: build?.createdAt ?? null,
                  updatedAt: build?.updatedAt ?? null,
                  error: build?.error
                    ? {
                        errorCode: build.error.errorCode ?? build.error.code ?? null,
                        message: build.error.message ?? null,
                        phase: build.error.phase ?? null,
                      }
                    : null,
                };
                console.error('Failed EAS physical-smoke diagnostic:');
                console.error(JSON.stringify(diagnostic, null, 2));
                NODE
              fi
            fi

            popd >/dev/null
            exit "$build_rc"
          fi

          popd >/dev/null

          BUILD_JSON="$RUNNER_TEMP/myeongha-android-physical-smoke-build.json" \
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';

          const parsed = JSON.parse(readFileSync(process.env.BUILD_JSON, 'utf8'));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          if (!build || typeof build.id !== 'string') {
            throw new Error('EAS build output did not contain a build id.');
          }

          const status = String(build.status ?? '').toUpperCase();
          if (status !== 'FINISHED') {
            throw new Error(`EAS Android physical-smoke build did not finish successfully: ${status || 'UNKNOWN'}`);
          }

          const artifactUrl =
            build?.artifacts?.buildUrl ??
            build?.artifacts?.applicationArchiveUrl ??
            null;
          if (typeof artifactUrl !== 'string' || !/^https:\/\//u.test(artifactUrl)) {
            throw new Error('EAS build output did not contain an Android application artifact URL.');
          }

          process.stdout.write(`build_id=${build.id}\n`);
          NODE

      - name: Record safe physical-smoke build evidence
        shell: bash
        env:
          EAS_BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
        run: |
          set -euo pipefail
          test -n "$EAS_BUILD_ID"
          {
            echo "android_physical_smoke_build=pass"
            echo "eas_build_id=$EAS_BUILD_ID"
            echo "eas_profile=physical-smoke"
            echo "android_gradle_command=:app:assembleDebug"
            echo "eas_credentials_mutation=false"
            echo "store_submission=false"
            echo "eas_build_page=https://expo.dev/accounts/johnny0109/projects/myeongha-mobile/builds/$EAS_BUILD_ID"
          } >> "$GITHUB_STEP_SUMMARY"
