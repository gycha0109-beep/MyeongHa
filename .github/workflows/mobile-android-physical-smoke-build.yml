name: Mobile Android Physical Smoke Build

run-name: "[WT:applizing] Mobile Android Physical Smoke Build"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_ANDROID_PHYSICAL_SMOKE_V1
        required: true
        type: string
      watchtower_track:
        description: Watchtower work track attribution
        required: true
        default: applizing
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/mobile-android-physical-smoke-build.trigger'

permissions:
  contents: read

concurrency:
  group: mobile-android-physical-smoke-build
  cancel-in-progress: false

jobs:
  build-android-physical-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify explicit physical-smoke authority
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WATCHTOWER_TRACK: ${{ inputs.watchtower_track }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$CONFIRMATION" = "BUILD_ANDROID_PHYSICAL_SMOKE_V1"
            test "$WATCHTOWER_TRACK" = "applizing"
          else
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(tr -d '\r\n' < .github/mobile-android-physical-smoke-build.trigger)" = "BUILD_ANDROID_PHYSICAL_SMOKE_V1"
          fi

          test -n "${EXPO_TOKEN:-}"

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release identity and Android physical-smoke contract
        run: |
          set -euo pipefail
          npm run verify:mobile-release-readiness
          npm run verify:mobile-android-physical-smoke-readiness

      - name: Inspect latest failed EAS physical-smoke build
        shell: bash
        run: |
          set -euo pipefail
          pushd apps/mobile >/dev/null

          failed_list="$RUNNER_TEMP/myeongha-android-physical-smoke-failed-list.json"
          failed_view="$RUNNER_TEMP/myeongha-latest-failed-build-view.json"

          npm exec --yes --package=eas-cli@24.10.0 -- \
            eas build:list \
              --platform android \
              --profile physical-smoke \
              --status errored \
              --limit 1 \
              --json \
              --non-interactive \
              > "$failed_list"

          failed_build_id="$(jq -r 'if type == "array" and length > 0 then (.[0].id // empty) else empty end' "$failed_list")"

          if [[ -n "$failed_build_id" ]]; then
            npm exec --yes --package=eas-cli@24.10.0 -- \
              eas build:view "$failed_build_id" --json \
              > "$failed_view"

            echo "최근 실패 빌드 진단:"
            jq '{
              id: (.id // null),
              status: (.status // null),
              platform: (.platform // null),
              buildProfile: (.buildProfile // null),
              createdAt: (.createdAt // null),
              updatedAt: (.updatedAt // null),
              error: (
                if .error then {
                  errorCode: (.error.errorCode // .error.code // null),
                  message: (.error.message // null),
                  phase: (.error.phase // null)
                } else null end
              )
            }' "$failed_view"
          else
            echo "이전 실패 빌드 없음"
          fi

          popd >/dev/null

      - name: Build Android debug APK without EAS signing credentials
        id: eas_build
        shell: bash
        run: |
          set -uo pipefail
          pushd apps/mobile >/dev/null

          build_json="$RUNNER_TEMP/myeongha-android-physical-smoke-build.json"
          build_stderr="$RUNNER_TEMP/myeongha-android-physical-smoke-build.stderr.log"

          set +e
          npm exec --yes --package=eas-cli@24.10.0 -- \
            eas build \
              --platform android \
              --profile physical-smoke \
              --non-interactive \
              --freeze-credentials \
              --wait \
              --json \
              > "$build_json" \
              2> >(tee "$build_stderr" >&2)
          build_rc=$?
          set -e

          if [[ "$build_rc" -ne 0 ]]; then
            failed_build_id="$(grep -Eo '/builds/[0-9a-f-]{36}' "$build_stderr" | tail -1 | cut -d/ -f3 || true)"
            if [[ -n "$failed_build_id" ]]; then
              failed_view="$RUNNER_TEMP/myeongha-failed-build-view.json"
              npm exec --yes --package=eas-cli@24.10.0 -- \
                eas build:view "$failed_build_id" --json \
                > "$failed_view" || true

              if [[ -s "$failed_view" ]]; then
                echo "실패 빌드 진단:" >&2
                jq '{
                  id: (.id // null),
                  status: (.status // null),
                  platform: (.platform // null),
                  buildProfile: (.buildProfile // null),
                  createdAt: (.createdAt // null),
                  updatedAt: (.updatedAt // null),
                  error: (
                    if .error then {
                      errorCode: (.error.errorCode // .error.code // null),
                      message: (.error.message // null),
                      phase: (.error.phase // null)
                    } else null end
                  )
                }' "$failed_view" >&2 || true
              fi
            fi

            popd >/dev/null
            exit "$build_rc"
          fi

          popd >/dev/null

          build_id="$(jq -r 'if type == "array" then (.[0].id // empty) else (.id // empty) end' "$build_json")"
          build_status="$(jq -r 'if type == "array" then (.[0].status // empty) else (.status // empty) end' "$build_json")"
          artifact_url="$(jq -r 'if type == "array" then (.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty) else (.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty) end' "$build_json")"

          test -n "$build_id"
          test "${build_status^^}" = "FINISHED"
          [[ "$artifact_url" =~ ^https:// ]]

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Record safe physical-smoke build evidence
        shell: bash
        env:
          EAS_BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
        run: |
          set -euo pipefail
          test -n "$EAS_BUILD_ID"
          {
            echo "android_physical_smoke_build=pass"
            echo "eas_build_id=$EAS_BUILD_ID"
            echo "eas_profile=physical-smoke"
            echo "android_gradle_command=:app:assembleDebug"
            echo "eas_credentials_mutation=false"
            echo "store_submission=false"
            echo "eas_build_page=https://expo.dev/accounts/johnny0109/projects/myeongha-mobile/builds/$EAS_BUILD_ID"
          } >> "$GITHUB_STEP_SUMMARY"
