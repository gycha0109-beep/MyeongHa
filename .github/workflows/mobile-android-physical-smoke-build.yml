name: Mobile Android Physical Smoke Build

run-name: "[WT:applizing] Mobile Android Physical Smoke Build"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_ANDROID_PHYSICAL_SMOKE_V1
        required: true
        type: string
      watchtower_track:
        description: Watchtower work track attribution
        required: true
        default: applizing
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/mobile-android-physical-smoke-build.trigger'

permissions:
  contents: read

concurrency:
  group: mobile-android-physical-smoke-build
  cancel-in-progress: false

jobs:
  build-android-physical-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify explicit physical-smoke authority
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WATCHTOWER_TRACK: ${{ inputs.watchtower_track }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$CONFIRMATION" = "BUILD_ANDROID_PHYSICAL_SMOKE_V1"
            test "$WATCHTOWER_TRACK" = "applizing"
          else
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(tr -d '\r\n' < .github/mobile-android-physical-smoke-build.trigger)" = "BUILD_ANDROID_PHYSICAL_SMOKE_V1"
          fi

          test -n "${EXPO_TOKEN:-}"

      - name: Reject historical workflow reruns before EAS build
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -n "$current_main_sha"
          test "$checked_out_sha" = "$GITHUB_SHA"
          if [[ "$checked_out_sha" != "$current_main_sha" ]]; then
            echo "::error::Stale Android smoke workflow commit. Use a fresh main workflow run instead of re-running an old job." >&2
            exit 1
          fi

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release identity and Android physical-smoke contract
        run: |
          set -euo pipefail
          npm run verify:mobile-release-readiness
          npm run verify:mobile-android-physical-smoke-readiness

      - name: Configure GitHub-hosted local Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "${JAVA_HOME_17_X64:-}"
          test -d "${ANDROID_HOME:-}"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "Local Android SDK and Java 17 selected; no production signing credentials."

      # The Expo hosted Free Android quota is exhausted. Use local EAS on
      # the GitHub-hosted runner; preserve the validated physical-smoke profile.
      - name: Build Android standalone APK locally (no EAS cloud quota)
        id: eas_build
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/myeongha-android-physical-smoke-local.apk"

          # eas-cli@24.10.0 invokes local-build-plugin@24.9.0 through npx.
          # On npm 11 the implicit npx executable resolution fails (exit 127).
          # Preinstall exactly that version and use EAS CLI's supported path
          # override; never pass the EAS job payload on the command line.
          local_plugin_root="$RUNNER_TEMP/myeongha-eas-local-plugin"
          mkdir -p "$local_plugin_root"
          npm install \
            --prefix "$local_plugin_root" \
            --no-save --no-package-lock --ignore-scripts \
            --no-audit --no-fund \
            eas-cli-local-build-plugin@24.9.0
          local_plugin_bin="$local_plugin_root/node_modules/.bin/eas-cli-local-build-plugin"
          test -x "$local_plugin_bin"
          test "$(node -p "require('$local_plugin_root/node_modules/eas-cli-local-build-plugin/package.json').version")" = "24.9.0"
          export EAS_LOCAL_BUILD_PLUGIN_PATH="$local_plugin_bin"

          pushd apps/mobile >/dev/null

          npm exec --yes --package=eas-cli@24.10.0 -- \
            eas build \
              --platform android \
              --profile physical-smoke \
              --local \
              --non-interactive \
              --freeze-credentials \
              --output "$apk"

          popd >/dev/null
          test -s "$apk"
          echo "build_id=local-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Verify standalone local physical-smoke APK
        id: verify_apk
        shell: bash
        env:
          LOCAL_APK_PATH: ${{ steps.eas_build.outputs.apk_path }}
          EAS_BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
        run: |
          set -euo pipefail

          apk="$RUNNER_TEMP/myeongha-android-physical-smoke.apk"
          evidence="$RUNNER_TEMP/myeongha-android-physical-smoke-evidence.txt"

          test -n "$EAS_BUILD_ID"
          test -s "$LOCAL_APK_PATH"
          cp "$LOCAL_APK_PATH" "$apk"
          test -s "$apk"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"

          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$apksigner"
          test -x "$aapt"

          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -F "CN=Android Debug" "$RUNNER_TEMP/apksigner.txt"

          "$aapt" dump badging "$apk" | tee "$RUNNER_TEMP/aapt-badging.txt"
          grep -F "package: name='com.myeongha.app'" "$RUNNER_TEMP/aapt-badging.txt"
          if grep -Eq '^application-debuggable($|[[:space:]])' "$RUNNER_TEMP/aapt-badging.txt"; then
            echo "::error::Refusing to publish a debuggable/Metro-dependent Android APK." >&2
            exit 1
          fi

          unzip -t "$apk" > "$RUNNER_TEMP/apk-zip-integrity.txt"
          unzip -l "$apk" | tee "$RUNNER_TEMP/apk-contents.txt"
          grep -F "assets/index.android.bundle" "$RUNNER_TEMP/apk-contents.txt"
          bundle_bytes="$(unzip -p "$apk" assets/index.android.bundle | wc -c | tr -d '[:space:]')"
          if ! [[ "$bundle_bytes" =~ ^[0-9]+$ ]] || (( bundle_bytes <= 1024 )); then
            echo "::error::Android standalone APK has no substantial embedded JS bundle." >&2
            exit 1
          fi

          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          {
            echo "eas_build_id=$EAS_BUILD_ID"
            echo "eas_build_mode=github_hosted_local"
            echo "android_package=com.myeongha.app"
            echo "source_commit=$GITHUB_SHA"
            echo "gradle_command=:app:assembleRelease"
            echo "android_debuggable=false"
            echo "embedded_js_bundle_bytes=$bundle_bytes"
            echo "certificate_boundary=android_debug"
            echo "embedded_js_bundle=true"
            echo "production_signing_used=false"
            echo "store_submission=false"
            echo "apk_sha256=$apk_sha256"
          } > "$evidence"

          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "evidence_path=$evidence" >> "$GITHUB_OUTPUT"

      - name: Upload verified physical-smoke APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: myeongha-android-physical-smoke-${{ steps.eas_build.outputs.build_id }}
          path: |
            ${{ steps.verify_apk.outputs.apk_path }}
            ${{ steps.verify_apk.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record safe physical-smoke build evidence
        shell: bash
        env:
          EAS_BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
        run: |
          set -euo pipefail
          test -n "$EAS_BUILD_ID"
          {
            echo "android_physical_smoke_build=pass"
            echo "source_commit=$GITHUB_SHA"
            echo "eas_build_id=$EAS_BUILD_ID"
            echo "eas_build_mode=github_hosted_local"
            echo "eas_profile=physical-smoke"
            echo "android_gradle_command=:app:assembleRelease"
            echo "eas_credentials_mutation=false"
            echo "certificate_boundary=android_debug"
            echo "embedded_js_bundle=true"
            echo "github_artifact=myeongha-android-physical-smoke-$EAS_BUILD_ID"
            echo "store_submission=false"
            echo "github_build_page=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
