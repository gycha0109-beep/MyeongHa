name: Face Reading Independent Face Source Asset Storage

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-frdata07b-independent-face-source-asset-storage.test.ts'
      - 'docs/FACE_READING_FRDATA07B_INDEPENDENT_FACE_SOURCE_ASSET_STORAGE_V0.1.md'
      - 'docs/FACE_READING_FRDATA07B_AUTHORITY_DECISION_V0.1.md'
      - 'scripts/face-reading/acquire-frdata224-batch-a.mjs'
      - 'research-evidence/face-reading/frdata224/batch-a/**'
      - '.github/workflows/face-reading-independent-face-source-asset-storage.yml'
      - '.github/workflows/face-reading-frdata224-batch-a-acquisition.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/**'
      - 'test/face-reading-frdata07b-independent-face-source-asset-storage.test.ts'
      - 'docs/FACE_READING_FRDATA07B_INDEPENDENT_FACE_SOURCE_ASSET_STORAGE_V0.1.md'
      - 'docs/FACE_READING_FRDATA07B_AUTHORITY_DECISION_V0.1.md'
      - 'scripts/face-reading/acquire-frdata224-batch-a.mjs'
      - 'research-evidence/face-reading/frdata224/batch-a/**'
      - '.github/workflows/face-reading-independent-face-source-asset-storage.yml'
      - '.github/workflows/face-reading-frdata224-batch-a-acquisition.yml'

permissions:
  contents: read

jobs:
  frdata07b-independent-face-source-asset-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts
      - name: Build MyeongHa runtime
        run: npm run build
      - name: Check governed acquisition script syntax
        run: node --check scripts/face-reading/acquire-frdata224-batch-a.mjs
      - name: Run FR-DATA-07B storage tests
        run: npx vitest run test/face-reading-frdata07b-independent-face-source-asset-storage.test.ts
      - name: Verify acquired batch A when present
        run: |
          if [ -f research-evidence/face-reading/frdata224/batch-a/manifest.json ]; then
            node scripts/face-reading/acquire-frdata224-batch-a.mjs verify-existing
          fi
      - name: Verify compiled FR-DATA-07B authority boundary and empirical fail-closed gate
        run: |
          node --input-type=module <<'NODE'
          import {
            INDEPENDENT_FACE_SOURCE_ASSET_STORAGE_AUTHORITY_FRDATA07B,
            assertIndependentFaceSourceAssetStorageReadyForEmpiricalAdmissionFRData07B,
            validateIndependentFaceSourceAssetStorageAuthorityFRData07B,
          } from './dist/packages/face-reading/src/index.js';

          const authority = validateIndependentFaceSourceAssetStorageAuthorityFRData07B();
          if (authority !== INDEPENDENT_FACE_SOURCE_ASSET_STORAGE_AUTHORITY_FRDATA07B) process.exit(1);
          if (!authority.protocol.exactFRData07ARecordVerificationRequired) process.exit(1);
          if (!authority.protocol.exactReceiptBindingToFRData07ARequired) process.exit(1);
          if (authority.protocol.receiptRetainsRawBytes) process.exit(1);
          if (!authority.protocol.retrievalVerificationRequiresProvidedBytes) process.exit(1);
          if (!authority.protocol.retrievalDigestMustMatchFRData07ACanonicalDigest) process.exit(1);
          if (!authority.protocol.retrievalByteLengthMustMatchFRData07A) process.exit(1);
          if (authority.protocol.productionRuntimeImageRetentionAuthorized) process.exit(1);
          if (authority.protocol.storageBackendTrustPolicy !== null) process.exit(1);
          if (authority.protocol.minimumRetentionDuration !== null) process.exit(1);
          if (authority.protocol.encryptionAtRestRequirement !== null) process.exit(1);
          if (authority.protocol.storageImmutabilityRequirement !== null) process.exit(1);
          if (authority.protocol.acceptedStorageBackend !== null) process.exit(1);
          if (authority.protocol.empiricalAdmissionCriterion !== null) process.exit(1);
          if (!Object.values(authority.authorityBoundary).every((value) => value === false)) process.exit(1);

          let blocked = false;
          try {
            assertIndependentFaceSourceAssetStorageReadyForEmpiricalAdmissionFRData07B();
          } catch {
            blocked = true;
          }
          if (!blocked) process.exit(1);
          NODE
