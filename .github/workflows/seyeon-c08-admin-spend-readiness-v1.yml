name: "[WT:character-memory] C08 evaluation project Admin GET cost readiness"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seyeon-c08-admin-readonly-spend-v1
  cancel-in-progress: false

jobs:
  inspect:
    # Only trusted main. No PR secrets, paid Provider POST, or Production DB.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    name: Read evaluation project, hard limit and current-month costs
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Read-only evaluation Admin preflight
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_EVAL_PROJECT_ID: ${{ vars.OPENAI_EVAL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_ADMIN_KEY:-}"
          test -n "${OPENAI_EVAL_PROJECT_ID:-}"
          node scripts/seyeon-c08-admin-spend-readiness-v1.mjs

# Does not consume evaluation/model API keys or trigger any paid inference.
