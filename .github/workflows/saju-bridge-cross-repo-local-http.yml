name: Saju Bridge Cross-Repo Loopback

on:
  pull_request:
    paths:
      - .github/workflows/saju-bridge-cross-repo-local-http.yml
      - scripts/local/verify-saju-bridge-http.mjs
      - test/saju-held-cross-repo-local-http.test.ts
      - test/saju-held-cross-repo-local-postgres-nonce.test.ts
      - test/saju-held-cross-repo-local-postgres-current-birth.test.ts
      - test/saju-held-cross-repo-local-auth-user.test.ts
      - test/saju-held-cross-repo-local-gotrue-auth.test.ts
      - test/saju-held-cross-repo-local-restricted-login.test.ts
      - test/db/fixtures/saju_local_restricted_logins.sql
      - apps/api/src/node-postgres-subject-pool.ts
      - apps/api/src/saju-held-authenticated-member-proof-v1.ts
      - test/db/fixtures/saju_local_subject_birth_proof_e2e.sql
      - apps/api/src/saju-held-source-proof-revision-binding-v1.ts
      - apps/api/src/current-subject-saju-calculation-http.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saju-bridge-loopback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-local-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: myeongha_saju_local_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_saju_local_verify"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=15
      gotrue-db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-auth
          POSTGRES_DB: myeongha_saju_gotrue_verify
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_saju_gotrue_verify"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: myeongha_saju_local_verify
      PGUSER: postgres
      PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      MYEONGHA_LOCAL_NONCE_PG_ENABLED: '1'
    steps:
      - name: Checkout MyeongHa candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: myeongha
          persist-credentials: false
      - name: Checkout pinned Saju source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gycha0109-beep/Saju
          ref: cd0acf9abd447826ccaefba56112d046e560ee04
          path: saju
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated toolchain
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix myeongha
          npm ci --ignore-scripts --no-audit --no-fund --prefix saju
      - name: Build actual Saju proof issuer
        working-directory: saju
        run: npm run build
      - name: Bootstrap complete disposable Subject, Birth, and nonce authority
        working-directory: myeongha
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -Atqc 'select current_database()')" = 'myeongha_saju_local_verify'
          psql -X -v ON_ERROR_STOP=1 -f test/db/bootstrap_supabase_auth_stub.sql
          for migration in supabase/migrations/*.sql; do
            echo "Applying $(basename "$migration") to disposable CI DB"
            psql -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          psql -X -v ON_ERROR_STOP=1 -f test/db/fixtures/saju_local_subject_birth_proof_e2e.sql
      - name: Create disposable non-superuser PostgreSQL Subject and Nonce logins
        working-directory: myeongha
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -Atqc 'select current_database()')" = 'myeongha_saju_local_verify'
          subject_password="$(openssl rand -hex 28)"
          nonce_password="$(openssl rand -hex 28)"
          echo "::add-mask::$subject_password"
          echo "::add-mask::$nonce_password"
          psql -X -q -v ON_ERROR_STOP=1 -v "subject_password=$subject_password" -v "nonce_password=$nonce_password" \
            -f test/db/fixtures/saju_local_restricted_logins.sql
          {
            echo "MYEONGHA_LOCAL_SUBJECT_DB_PASSWORD=$subject_password"
            echo "MYEONGHA_LOCAL_NONCE_DB_PASSWORD=$nonce_password"
          } >> "$GITHUB_ENV"
          # Confirm TCP network authentication as each role, NOT sudo/SET ROLE.
          PGUSER=myeongha_runtime PGPASSWORD="$subject_password" psql -X -Atqc "select session_user::text" | grep -Fx myeongha_runtime
          PGUSER=myeongha_saju_nonce_ci_login PGPASSWORD="$nonce_password" psql -X -Atqc "select session_user::text" | grep -Fx myeongha_saju_nonce_ci_login
      - name: Start disposable real Supabase GoTrue with independent Auth database
        shell: bash
        env:
          GOTRUE_AUTH_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-auth
        run: |
          set -euo pipefail
          test "$(PGHOST=127.0.0.1 PGPORT=5433 PGDATABASE=myeongha_saju_gotrue_verify PGPASSWORD="$GOTRUE_AUTH_DB_PASSWORD" PGUSER=postgres psql -X -Atqc 'select current_database()')" = 'myeongha_saju_gotrue_verify'
          PGHOST=127.0.0.1 PGPORT=5433 PGDATABASE=myeongha_saju_gotrue_verify PGPASSWORD="$GOTRUE_AUTH_DB_PASSWORD" PGUSER=postgres psql -X -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS auth'
          PGHOST=127.0.0.1 PGPORT=5433 PGDATABASE=myeongha_saju_gotrue_verify PGPASSWORD="$GOTRUE_AUTH_DB_PASSWORD" PGUSER=postgres psql -X -v ON_ERROR_STOP=1 -c 'ALTER ROLE postgres IN DATABASE myeongha_saju_gotrue_verify SET search_path TO auth, public'
          jwt_secret="$(openssl rand -hex 32)"
          docker run -d --name myeongha-saju-gotrue-local --network host \
            -e GOTRUE_API_HOST=127.0.0.1 \
            -e GOTRUE_API_PORT=9999 \
            -e API_EXTERNAL_URL=http://127.0.0.1:9999 \
            -e GOTRUE_SITE_URL=http://127.0.0.1:3000 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL="postgres://postgres:$GOTRUE_AUTH_DB_PASSWORD@127.0.0.1:5433/myeongha_saju_gotrue_verify?sslmode=disable" \
            -e GOTRUE_JWT_SECRET="$jwt_secret" \
            -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            -e GOTRUE_JWT_EXP=300 \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_MAILER_AUTOCONFIRM=true \
            -e GOTRUE_DISABLE_SIGNUP=false \
            -e GOTRUE_EXTERNAL_PHONE_ENABLED=false \
            supabase/gotrue:v2.196.0
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:9999/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Disposable GoTrue was not healthy; withholding integration admission"
            docker logs --tail 80 myeongha-saju-gotrue-local || true
            exit 1
          fi
      - name: Verify real GoTrue Auth, Birth, and Saju Proof in one local execution
        working-directory: myeongha
        env:
          MYEONGHA_LOCAL_GOTRUE_ENABLED: '1'
          MYEONGHA_LOCAL_RESTRICTED_LOGINS_ENABLED: '1'
        run: node scripts/local/verify-saju-bridge-http.mjs ../saju
      - name: Collect disposable GoTrue Auth failure diagnostics
        if: failure()
        run: docker logs --tail 80 myeongha-saju-gotrue-local || true
      - name: Tear down disposable local GoTrue
        if: always()
        run: docker rm -f myeongha-saju-gotrue-local >/dev/null 2>&1 || true
