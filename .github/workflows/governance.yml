name: Governance

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/*.trigger'
      - 'scripts/**'
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'test/db/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/*.trigger'
      - 'scripts/**'
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'test/db/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify governance contracts
        run: npm run check:governance
