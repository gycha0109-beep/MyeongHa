name: Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Governance Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Resolve governance scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/myeongha-governance-changed-files.txt"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > "$changed_files"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
              git show --pretty='' --name-only "$PUSH_HEAD_SHA" > "$changed_files"
            else
              git diff --name-only "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA" > "$changed_files"
            fi
          else
            echo "Unsupported Governance event: $EVENT_NAME" >&2
            exit 1
          fi

          echo "Changed files:"
          cat "$changed_files"

          node scripts/ci/verification-plan.mjs < "$changed_files" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.scope.outputs.contracts == 'true'
      - name: Verify governance contracts
        run: |
          node scripts/verify-github-actions-trust-boundary.mjs
          node scripts/verify-ci-responsibility-map.mjs
          node scripts/verify-dependency-supply-chain-governance.mjs
          node scripts/verify-production-environment-governance.mjs
          npm run check:governance
          node scripts/verify-upstream-json-response-resource-policy.mjs
        if: steps.scope.outputs.contracts == 'true'
        id: contracts
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
        id: dependency_review
        if: github.event_name == 'pull_request' && steps.scope.outputs.dependencies == 'true'
      - name: Require every selected governance check
        if: ${{ always() && !cancelled() }}
        env:
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          CONTRACTS_SELECTED: ${{ steps.scope.outputs.contracts }}
          CONTRACTS_RESULT: ${{ steps.contracts.outcome }}
          DEPENDENCIES_SELECTED: ${{ steps.scope.outputs.dependencies }}
          DEPENDENCY_RESULT: ${{ steps.dependency_review.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          if [[ "$CONTRACTS_SELECTED" == "true" ]]; then test "$CONTRACTS_RESULT" = "success"; fi
          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCIES_SELECTED" == "true" ]]; then test "$DEPENDENCY_RESULT" = "success"; fi
