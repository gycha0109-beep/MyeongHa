name: C09 OpenRouter model screening round 1

on:
  push:
    branches:
      - feat/character-memory/c08-local-one-call-shadow-v1
    paths:
      - .github/workflows/c09-openrouter-model-screening-round1.yml

permissions:
  contents: read

concurrency:
  group: c09-openrouter-20261026-paid-round1-once
  cancel-in-progress: false

jobs:
  screen-character-models:
    if: github.repository == 'gycha0109-beep/MyeongHa' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout pinned character-memory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Ensure GitHub repository secret is accessible
        shell: bash
        run: |
          if [[ -z "${OPENROUTER_API_KEY}" ]]; then
            echo "::error::OPENROUTER_API_KEY GitHub Actions secret missing. No paid requests were made."
            exit 2
          fi
          echo 'OPENROUTER_API_KEY secret is accessible (value redacted).'

      - name: Validate round-one runner
        shell: bash
        run: |
          node --check scripts/seyeon-c09-openrouter-round1-8x5-v1.mjs
          node scripts/seyeon-c09-openrouter-round1-8x5-v1.mjs --dry-run > /dev/null
          echo 'First-round dry run validated: 8 model IDs x 5 original prompts.'

      - name: Execute approved first-round candidate calls (max 40, USD 2 guard)
        shell: bash
        run: |
          node scripts/seyeon-c09-openrouter-round1-8x5-v1.mjs --execute --approved-first-round-40

      - name: Upload reproducible first-round records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c09-openrouter-round1-8x5-20261026
          path: |
            artifacts/seyeon-c09-openrouter-round1-8x5-20261026-v1.json
            artifacts/seyeon-c09-openrouter-round1-8x5-20261026-v1.md
          if-no-files-found: warn
          retention-days: 30
