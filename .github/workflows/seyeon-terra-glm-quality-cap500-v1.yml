name: '[WT:character-memory] one-shot N06 Luna1 Terra2 versus GLM3 owner cap below KRW500'
on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-terra-glm-quality-cap500-v1.trigger'
permissions:
  contents: read
  actions: read
concurrency:
  group: seyeon-terra-glm-quality-cap500-v1-owner-authorized-once
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout immutable main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify owner budget admission and existing bounded LLM guard
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx vitest run test/seyeon-terra-glm-quality-cap500-admission-v1.test.mjs test/seyeon-terra-glm-quality-trio-v1.test.mjs test/seyeon-live-dialogue-owner-key-first-pair-v1.test.mjs test/seyeon-openrouter-glm53flash-paid-preflight-v1.test.mjs test/openrouter-seyeon-evaluation-provider-v1.test.ts
          npm run build
          node --check scripts/run-seyeon-terra-glm-quality-cap500-v1.mjs
      - name: One N06 model pair, strict 450 KRW reservation and six request maximum
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$OPENAI_API_KEY"
          test -n "$OPENROUTER_API_KEY"
          node scripts/run-seyeon-terra-glm-quality-cap500-v1.mjs
      - name: Preserve numeric-only accounting, never intermediate prompts or drafts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: seyeon-n06-actual-model-cap500-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-terra-glm-quality-cap500/
          if-no-files-found: warn
          retention-days: 14
