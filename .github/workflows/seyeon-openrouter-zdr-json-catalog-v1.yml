name: '[WT:character-memory] OpenRouter ZDR plus JSON provider inventory GET only'
on:
  push:
    branches:
      - main
    paths:
      - '.github/seyeon-openrouter-zdr-json-inventory.trigger'
permissions:
  contents: read
  actions: read
concurrency:
  group: seyeon-openrouter-zdr-json-inventory-once
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Audit offline intersection contract
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx vitest run test/seyeon-openrouter-zdr-json-inventory-v1.test.mjs
      - name: Read metadata only, zero model inference
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$OPENROUTER_API_KEY"
          node scripts/seyeon-openrouter-zdr-json-inventory-v1.mjs
      - name: Retain public provider metadata and numeric-only billing flags
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seyeon-zdr-json-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seyeon-openrouter-zdr-json-inventory/
          if-no-files-found: warn
          retention-days: 14
