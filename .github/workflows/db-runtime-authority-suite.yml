name: DB Runtime Authority Suite

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/birth_profile_read_runtime_authority.sh'
      - 'test/db/guest_bootstrap_runtime_authority.sh'
      - 'test/db/guest_bootstrap_current_query.sh'
      - 'test/db/records_read_runtime_authority.sh'
      - 'test/db/runtime_function_api_role_acl.sh'
      - 'test/db/self_birth_profile_current_query.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - 'test/ops/supabase-production-migration-repair.sh'
      - '.github/workflows/supabase-production.yml'
      - '.github/workflows/db-runtime-authority-suite.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'test/db/birth_profile_read_runtime_authority.sh'
      - 'test/db/guest_bootstrap_runtime_authority.sh'
      - 'test/db/guest_bootstrap_current_query.sh'
      - 'test/db/records_read_runtime_authority.sh'
      - 'test/db/runtime_function_api_role_acl.sh'
      - 'test/db/self_birth_profile_current_query.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - 'test/ops/supabase-production-migration-repair.sh'
      - '.github/workflows/supabase-production.yml'
      - '.github/workflows/db-runtime-authority-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-case:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - birth-profile-production-read-authority
          - guest-bootstrap-runtime
          - records-production-read-authority
          - runtime-function-api-role-acl
          - self-birth-profile-current
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myeongha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myeongha_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: myeongha_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run DB regression case
        run: bash test/db/run_ci_case.sh "${{ matrix.case }}"
