name: DB Runtime Authority Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'test/db/bootstrap_supabase_auth_stub.sql'
      - 'test/db/run_ci_case.sh'
      - 'scripts/ci/db-suites.json'
      - 'scripts/ci/db-pr-router.mjs'
      - 'scripts/ci/run-db-track.mjs'
      - '.github/workflows/ci-db-track.yml'
      - 'test/db/birth_profile_read_runtime_authority.sh'
      - 'test/db/guest_bootstrap_runtime_authority.sh'
      - 'test/db/guest_bootstrap_current_query.sh'
      - 'test/db/records_read_runtime_authority.sh'
      - 'test/db/runtime_function_api_role_acl.sh'
      - 'test/db/self_birth_profile_current_query.sh'
      - 'test/db/catalog_snapshot.sh'
      - 'test/db/catalog.expected.sha256'
      - 'test/ops/supabase-production-migration-repair.sh'
      - '.github/workflows/supabase-production.yml'
      - '.github/workflows/db-runtime-authority-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-suite:
    name: DB suite · runtime
    uses: ./.github/workflows/ci-db-track.yml
    with:
      suite: runtime
      postgres: "15"
