name: Face Reading Independent Face Ground Truth

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/independent-face-ground-truth-frdata07.ts'
      - 'packages/face-reading/src/provider-face-candidate-observations-frdata06.ts'
      - 'packages/face-reading/src/index.ts'
      - 'test/face-reading-fr-data07-independent-face-ground-truth.test.ts'
      - 'docs/FACE_READING_FR_DATA07_INDEPENDENT_FACE_GROUND_TRUTH.md'
      - '.github/workflows/face-reading-independent-face-ground-truth.yml'
  workflow_dispatch:

jobs:
  fr-data07-independent-ground-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact workspace dependencies
        run: npm install --ignore-scripts

      - name: Build MyeongHa runtime
        run: npm run build

      - name: Run FR-DATA-07 contract tests
        run: npx vitest run test/face-reading-fr-data07-independent-face-ground-truth.test.ts

      - name: Verify compiled authority boundary
        run: |
          node --input-type=module <<'NODE'
          import {
            INDEPENDENT_FACE_GROUND_TRUTH_AUTHORITY_FRDATA07,
            assessIndependentFaceGroundTruthReadinessFRData07,
            assertIndependentFaceGroundTruthReadyForPromotionFRData07,
          } from './dist/packages/face-reading/src/index.js';

          const authority = INDEPENDENT_FACE_GROUND_TRUTH_AUTHORITY_FRDATA07;
          if (
            authority.schemaVersion !== 'fr-data07-v1' ||
            authority.authorityState !== 'protocol_defined_no_reviewed_validation_dataset' ||
            authority.protocol.providerObservationSchemaRef !== 'fr-data06-provider-face-candidate-observation-v1' ||
            authority.protocol.minimumCapturesPerPartition !== null ||
            authority.protocol.minimumCapturesPerEvaluationLabel !== null ||
            authority.protocol.minimumIndependentAnnotatorsPerCapture !== null ||
            authority.protocol.interAnnotatorAgreementThreshold !== null ||
            authority.protocol.providerCandidateDecisionThreshold !== null ||
            authority.protocol.acceptableFalsePositiveRate !== null ||
            authority.protocol.acceptableFalseNegativeRate !== null
          ) {
            throw new Error(`FR-DATA-07 authority/threshold drift: ${JSON.stringify(authority)}`);
          }

          if (Object.values(authority.authorityBoundary).some((value) => value !== false)) {
            throw new Error(`FR-DATA-07 authority boundary promoted unexpectedly: ${JSON.stringify(authority.authorityBoundary)}`);
          }

          const readiness = assessIndependentFaceGroundTruthReadinessFRData07(null);
          if (
            readiness.protocolDefined !== true ||
            readiness.validationDatasetPresent !== false ||
            readiness.providerDetectionConstructValidityValidated !== false ||
            readiness.providerFaceCandidateHumanIdentityValidated !== false ||
            readiness.singleHumanFaceVerified !== false ||
            readiness.facePresenceVerified !== false ||
            readiness.empiricalScoringPerformed !== false ||
            readiness.researchCandidateAdmitted !== false ||
            readiness.productionGeometryAuthorized !== false
          ) {
            throw new Error(`FR-DATA-07 no-dataset readiness promoted authority: ${JSON.stringify(readiness)}`);
          }

          let promotionBlocked = false;
          try {
            assertIndependentFaceGroundTruthReadyForPromotionFRData07();
          } catch {
            promotionBlocked = true;
          }
          if (!promotionBlocked) throw new Error('FR-DATA-07 promotion assertion unexpectedly succeeded.');

          console.log('FR_DATA07_INDEPENDENT_GROUND_TRUTH_CONTRACT_PASS');
          NODE
