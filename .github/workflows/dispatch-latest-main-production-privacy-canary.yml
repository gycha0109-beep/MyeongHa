name: Dispatch Latest Main Hosted Auth Canary

on:
  push:
    branches:
      - ops/dispatch-production-privacy-canary-main-20260922

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: dispatch-account-deletion-hosted-auth-canary
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch latest main hosted Auth canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          echo "Dispatching Account Deletion Hosted Auth Canary from main@$main_sha"
          gh workflow run account-deletion-hosted-auth-canary.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation=DELETE_SYNTHETIC_AUTH_USER_ONLY
