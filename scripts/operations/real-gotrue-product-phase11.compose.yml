# Phase 11 disposable actual GoTrue used only by the manual main-only PG18/Saju proof.
# Never bind this network to Cloudflare, Admin, Hosted Supabase, or Production.
name: myeongha-ops-phase11-real-auth
services:
  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MH_OPS_AUTH_DB_PASSWORD:?}
      POSTGRES_DB: myeongha_saju_gotrue_verify
    volumes:
      - auth-data:/var/lib/postgresql/data
      - ../local/saju-bridge-auth-init.sql:/docker-entrypoint-initdb.d/01-gotrue-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myeongha_saju_gotrue_verify"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [disposable]
  gotrue:
    image: supabase/gotrue:v2.196.0
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MH_OPS_GOTRUE_PORT:?}:9999"
    # The Docker bridge above is intentionally non-internal so the host-only
    # published port can be reached; this container holds synthetic credentials only.
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://gotrue:9999
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: ${MH_OPS_AUTH_DB_URL:?}
      GOTRUE_JWT_SECRET: ${MH_OPS_AUTH_JWT_SECRET:?}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "${MH_OPS_AUTH_JWT_EXP_SECONDS:-300}"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    networks: [disposable, host-loopback]
  saju:
    profiles: [sustained]
    image: node:24-bookworm-slim
    command: [node, /probe/saju-split-service-phase11.mjs]
    environment:
      MH_OPS_SAJU_BRIDGE: "1"
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - ../../_isolated_saju:/saju:ro
      - ./saju-split-service-phase11.mjs:/probe/saju-split-service-phase11.mjs:ro
    ports:
      - "127.0.0.1::43007"
      - "127.0.0.1::43008"
    networks: [saju-loopback]
networks:
  disposable:
    internal: true
  # Only GoTrue joins a second project-scoped bridge for the loopback-published port.
  # The auth database stays on the strictly internal bridge and has no published port.
  host-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'
  saju-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'
volumes:
  auth-data:
