# Local-only Saju bridge database verification. No production config or exposed ports.
# Each container uses a volatile database. Compose project name is generated by
# the launcher; do not start this file against another existing project.
services:
  db15:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-saju-bridge-only
      POSTGRES_DB: myeongha_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myeongha_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  db17:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-saju-bridge-only
      POSTGRES_DB: myeongha_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myeongha_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  check15:
    image: postgres:15
    depends_on:
      db15:
        condition: service_healthy
    environment:
      PGHOST: db15
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local-saju-bridge-only
      PGDATABASE: myeongha_test
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - "bash test/db/run_ci_case.sh saju-staging-operator-admission-v2"

  check17:
    image: postgres:17.6
    depends_on:
      db17:
        condition: service_healthy
    environment:
      PGHOST: db17
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local-saju-bridge-only
      PGDATABASE: myeongha_test
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - "bash test/db/run_ci_case.sh saju-staging-operator-admission-v2"

networks:
  default:
    internal: true
